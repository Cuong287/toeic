// ---------- MỤC 0: TỔNG HỢP TỪ VỰNG TOÀN DIỆN ----------
function renderTopic0(box) {
  let scope = store.get('t0_scope', '1');
  let mode = store.get('t0_mode', 'quiz'); // 'quiz' | 'flashcard' | 'write'

  function getPool() {
    if (scope === 'all') {
      return TOPICS.flatMap(t => t.vocab.filter(v => v.vi).map(v => ({
        ...v,
        topicId: t.id,
        topicTitle: splitTitle(t).main
      })));
    }
    const t = TOPICS.find(x => String(x.id) === String(scope)) || TOPICS[0];
    return t.vocab.filter(v => v.vi).map(v => ({
      ...v,
      topicId: t.id,
      topicTitle: splitTitle(t).main
    }));
  }

  function drawMain() {
    const allCount = TOPICS.reduce((acc, t) => acc + t.vocab.length, 0);
    const pool = getPool();
    const currentTopicObj = TOPICS.find(x => String(x.id) === String(scope));

    box.innerHTML = `
      <div class="t0-header">
        <div class="eyebrow">HỌC VÀ ÔN TẬP TOÀN DIỆN</div>
        <h1 style="font-size:28px;margin:4px 0 8px">00 · Tổng hợp từ vựng TOEIC 📚</h1>
        <div class="meta" style="color:var(--muted);font-size:14px">
          Học trọn gói từ vựng theo từng chương hoặc toàn bộ kho 45 chủ đề với 3 phương pháp ghi nhớ sâu.
        </div>
      </div>

      <div class="t0-nav-bar">
        <div class="t0-scope-wrap">
          <label for="t0-scope-sel">📖 Chọn chương học:</label>
          <select id="t0-scope-sel" class="t0-scope-select">
            <option value="all" ${scope === 'all' ? 'selected' : ''}>Tất cả 45 chương (${allCount} từ vựng)</option>
            ${TOPICS.map(t => `<option value="${t.id}" ${String(t.id) === String(scope) ? 'selected' : ''}>${String(t.id).padStart(2,'0')}. ${esc(splitTitle(t).main)} (${t.vocab.length} từ)</option>`).join('')}
          </select>
          <span class="hint" style="font-size:13px;font-weight:600">(${pool.length} từ vựng)</span>
        </div>

        <div class="seg" id="t0-mode-tabs">
          <button data-m="quiz" ${mode === 'quiz' ? 'aria-pressed="true"' : ''}>🎯 Trắc nghiệm</button>
          <button data-m="flashcard" ${mode === 'flashcard' ? 'aria-pressed="true"' : ''}>🃏 Lật hình (Flashcards)</button>
          <button data-m="write" ${mode === 'write' ? 'aria-pressed="true"' : ''}>✍️ Viết từ (Việt → Anh)</button>
        </div>
      </div>

      <div id="t0-content"></div>
    `;

    // Bắt sự kiện đổi Scope (Chương)
    const scopeSel = box.querySelector('#t0-scope-sel');
    if (scopeSel) {
      scopeSel.onchange = () => {
        scope = scopeSel.value;
        store.set('t0_scope', scope);
        drawMain();
      };
    }

    // Bắt sự kiện đổi Mode (Chế độ)
    box.querySelectorAll('#t0-mode-tabs button').forEach(btn => {
      btn.onclick = () => {
        mode = btn.dataset.m;
        store.set('t0_mode', mode);
        drawMain();
      };
    });

    const contentBox = box.querySelector('#t0-content');
    if (mode === 'flashcard') {
      renderT0Flashcards(contentBox, pool);
    } else if (mode === 'write') {
      renderT0WriteDrill(contentBox, pool);
    } else {
      renderT0Quiz(contentBox, pool);
    }
  }

  drawMain();
}

// 1. Chế độ Flashcard (Lật hình 3D)
function renderT0Flashcards(container, rawPool) {
  if (!rawPool.length) {
    container.innerHTML = '<div class="card" style="text-align:center;padding:32px">Chưa có từ vựng nào trong danh mục này.</div>';
    return;
  }

  let pool = [...rawPool];
  let curIdx = 0;
  let isFlipped = false;

  function drawCard() {
    const v = pool[curIdx];
    const topObj = TOPICS.find(t => t.id === v.topicId) || TOPICS[0];
    const e = enr(v.topicId);
    const x = e && e.vocab ? e.vocab[v.w] : null;
    const ipa = x ? x[0] : '';
    const exEn = x ? x[1] : '';
    const exVi = getWordDescVi(topObj, v);

    container.innerHTML = `
      <div class="fc-container">
        <div class="fc-scene">
          <div class="fc-card ${isFlipped ? 'flipped' : ''}" id="fc-main-card">
            <!-- Mặt trước (Front) -->
            <div class="fc-face front">
              <span class="fc-badge">${curIdx + 1} / ${pool.length} · ${esc(v.topicTitle)}${v.source ? ` · <b style="color:var(--accent)">${esc(v.source)}</b>` : ''}</span>
              <div style="margin-top:20px">
                <div class="fc-word">${esc(v.w)}</div>
                ${v.pos ? `<span class="pos" style="font-size:14px;padding:3px 8px;border-radius:6px">${esc(v.pos)}</span>` : ''}
                ${ipa ? `<div class="fc-ipa">${esc(ipa)}</div>` : ''}
              </div>
              <div style="margin-top:16px;display:flex;gap:8px;align-items:center">
                <button class="icon-btn" id="fc-speak" title="Nghe phát âm" style="width:38px;height:38px">${SPEAK}</button>
                <button class="icon-btn rec-btn" data-rec-text="${esc(cleanWord(v.w))}" data-rec-id="fc-${v.topicId}-${curIdx}" title="Luyện đọc từ này" style="width:38px;height:38px">${MIC_ICON}</button>
              </div>
              <div id="slot-fc-${v.topicId}-${curIdx}" class="rec-slot" style="display:none;width:100%;margin-top:12px;text-align:left"></div>
              <div class="fc-hint-flip">
                <span>🔄 Bấm vào thẻ để lật xem nghĩa (hoặc nhấn phím Space)</span>
              </div>
            </div>

            <!-- Mặt sau (Back) -->
            <div class="fc-face back">
              <span class="fc-badge">${curIdx + 1} / ${pool.length} · ${esc(v.topicTitle)}${v.source ? ` · <b style="color:var(--accent)">${esc(v.source)}</b>` : ''}</span>
              <div class="fc-vi">${esc(v.vi)}</div>
              ${exEn ? `<div class="fc-ex-box">
                <div style="font-weight:600;color:var(--accent);margin-bottom:4px">“${esc(exEn)}”</div>
                <div style="color:var(--ink)">💡 ${esc(exVi)}</div>
              </div>` : `<div class="fc-ex-box">💡 ${esc(exVi)}</div>`}
              <div class="fc-hint-flip">
                <span>🔄 Bấm vào thẻ để quay lại mặt trước</span>
              </div>
            </div>
          </div>
        </div>

        <div class="fc-controls">
          <button class="btn" id="fc-prev" ${curIdx === 0 ? 'disabled' : ''}>← Thẻ trước</button>
          <button class="btn primary" id="fc-flip">🔄 Lật thẻ (Space)</button>
          <button class="btn" id="fc-next" ${curIdx === pool.length - 1 ? 'disabled' : ''}>Thẻ tiếp →</button>
          <button class="btn ghost" id="fc-shuffle" title="Xáo trộn danh sách thẻ">🔀 Xáo bài</button>
        </div>
      </div>
    `;

    const cardEl = container.querySelector('#fc-main-card');
    const toggleFlip = () => {
      isFlipped = !isFlipped;
      cardEl.classList.toggle('flipped', isFlipped);
    };

    cardEl.onclick = (e) => {
      if (e.target.closest('button')) return;
      toggleFlip();
    };

    container.querySelector('#fc-flip').onclick = toggleFlip;

    container.querySelector('#fc-prev').onclick = () => {
      if (curIdx > 0) {
        curIdx--;
        isFlipped = false;
        drawCard();
      }
    };

    container.querySelector('#fc-next').onclick = () => {
      if (curIdx < pool.length - 1) {
        curIdx++;
        isFlipped = false;
        drawCard();
      }
    };

    container.querySelector('#fc-shuffle').onclick = () => {
      pool = shuffle(pool);
      curIdx = 0;
      isFlipped = false;
      drawCard();
    };

    const spkBtn = container.querySelector('#fc-speak');
    if (spkBtn) {
      spkBtn.onclick = (e) => {
        e.stopPropagation();
        speak(v.w);
      };
    }
  }

  drawCard();
}

// 2. Chế độ Viết từ (Việt sang Anh)
function renderT0WriteDrill(container, rawPool) {
  if (!rawPool.length) {
    container.innerHTML = '<div class="card" style="text-align:center;padding:32px">Chưa có từ vựng nào trong danh mục này.</div>';
    return;
  }

  const pool = shuffle([...rawPool]);
  let i = 0, score = 0, wrongList = [];

  function draw() {
    if (i >= pool.length) {
      container.innerHTML = `
        <div class="card" style="text-align:center;padding:36px">
          <div class="eyebrow">Hoàn thành luyện viết</div>
          <div class="big" style="margin:8px 0">${score} / ${pool.length}</div>
          <div class="hint">Độ chính xác: <b>${Math.round(score / pool.length * 100)}%</b></div>
          ${wrongList.length ? `
            <div style="text-align:left;margin-top:18px">
              <b>Các từ cần luyện lại (${wrongList.length}):</b>
              <ul class="wrong-list" style="margin-top:8px">
                ${wrongList.map(v => `<li><b>${esc(cleanWord(v.w))}</b>: ${esc(v.vi)} <small>(${esc(v.topicTitle)})</small></li>`).join('')}
              </ul>
            </div>
          ` : '<div class="fb ok" style="margin-top:14px">Xuất sắc! Bạn đã gõ đúng toàn bộ các từ.</div>'}
          <div style="margin-top:20px">
            <button class="btn primary" id="t0-write-again">Luyện viết lại lượt khác</button>
          </div>
        </div>
      `;
      container.querySelector('#t0-write-again').onclick = () => renderT0WriteDrill(container, rawPool);
      return;
    }

    const v = pool[i];
    const topObj = TOPICS.find(t => t.id === v.topicId) || TOPICS[0];
    const viDesc = getWordDescVi(topObj, v);
    const targetWord = cleanWord(v.w);

    container.innerHTML = `
      <div class="write-drill-box">
        <div class="row between" style="margin-bottom:8px">
          <span class="hint" style="font-weight:600">Câu ${i + 1} / ${pool.length} · ${esc(v.topicTitle)}</span>
          <span class="hint" style="color:var(--good);font-weight:700">Đúng: ${score}</span>
        </div>
        <div class="card">
          <div class="qprog"><i style="width:${(i / pool.length) * 100}%"></i></div>
          <div class="wd-prompt">
            <div style="font-size:13px;color:var(--muted);text-transform:uppercase;font-weight:700">Nghĩa tiếng Việt:</div>
            <div class="wd-vi">${esc(v.vi)} ${v.pos ? `<small style="font-size:14px;color:var(--muted)">(${esc(v.pos)})</small>` : ''}</div>
            <div class="qdesc-vi">💡 <i>${esc(viDesc)}</i></div>
          </div>

          <form id="t0-write-form" autocomplete="off">
            <div class="wd-input-row">
              <input class="wd-input" id="t0-w-inp" placeholder="Nhập từ tiếng Anh tương ứng…" autofocus spellcheck="false" autocapitalize="off">
              <button class="btn primary" type="submit" id="t0-w-btn">Kiểm tra</button>
              <button class="btn ghost" type="button" id="t0-w-hint" title="Gợi ý chữ cái đầu">Gợi ý</button>
            </div>
            <div id="t0-w-fb" style="margin-top:10px;font-size:14.5px;font-weight:600;min-height:22px"></div>
            <div id="t0-w-next-bar" style="margin-top:12px;display:none">
              <button class="btn primary" type="button" id="t0-w-next">Từ tiếp theo →</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const form = container.querySelector('#t0-write-form');
    const inp = container.querySelector('#t0-w-inp');
    const fb = container.querySelector('#t0-w-fb');
    const nextBar = container.querySelector('#t0-w-next-bar');
    const nextBtn = container.querySelector('#t0-w-next');
    const hintBtn = container.querySelector('#t0-w-hint');
    let answered = false;

    hintBtn.onclick = () => {
      inp.value = targetWord[0] + '... (' + targetWord.length + ' chữ cái)';
      inp.focus();
    };

    form.onsubmit = (e) => {
      e.preventDefault();
      if (answered) return;
      const userVal = norm(inp.value.trim());
      if (!userVal) return;

      const validAns = answers(v.w);
      const isCorrect = validAns.includes(userVal) || userVal === norm(targetWord);

      answered = true;
      inp.disabled = true;
      hintBtn.disabled = true;
      container.querySelector('#t0-w-btn').disabled = true;

      if (isCorrect) {
        score++;
        inp.classList.add('ok');
        fb.innerHTML = '<span style="color:var(--good)">✓ Chính xác tuyệt vời!</span>';
        speak(targetWord);
      } else {
        wrongList.push(v);
        store.addReviewWord(v, v.topicId, 'write');
        inp.classList.add('no');
        fb.innerHTML = `<span style="color:var(--bad)">Chưa chính xác. Đáp án đúng: <b>${esc(targetWord)}</b></span>`;
        speak(targetWord);
      }

      nextBar.style.display = 'block';
      nextBtn.focus();
    };

    nextBtn.onclick = () => {
      i++;
      draw();
    };
  }

  draw();
}

// 3. Chế độ Trắc nghiệm (Quiz tổng hợp)
function renderT0Quiz(container, rawPool) {
  if (rawPool.length < 2) {
    container.innerHTML = '<div class="card" style="text-align:center;padding:32px">Cần ít nhất 2 từ vựng để tạo bài trắc nghiệm.</div>';
    return;
  }

  let dir = store.get('t0_qdir', 'en');
  const allVocabPool = vocabPool();
  const sampleCount = Math.min(15, rawPool.length);
  const questions = shuffle([...rawPool]).slice(0, sampleCount).map(v => {
    const same = shuffle(rawPool.filter(x => x !== v && shortVi(x.vi) !== shortVi(v.vi)));
    const extra = shuffle(allVocabPool.filter(x => x.w !== v.w));
    const distractors = same.concat(extra).slice(0, 3);
    return {
      v,
      opts: shuffle([v, ...distractors])
    };
  });

  let i = 0, score = 0, wrongList = [];

  function draw() {
    if (i >= questions.length) {
      const pct = Math.round(score / questions.length * 100);
      const topId = (questions[0] && questions[0].v && questions[0].v.topicId) || S.t;
      const curBest = Number(store.get('best:' + topId, 0)) || 0;
      const newBest = Math.max(pct, curBest);
      store.set('best:' + topId, newBest);

      if (wrongList.length) {
        wrongList.forEach(w => store.addReviewWord(w, topId, 'quiz'));
      }

      if (currentUser && fbDb && firestoreModules && currentUid !== 'guest') {
        const isCompleted = newBest >= 80 || store.get('completedManual:' + topId, false);
        firestoreModules.setDoc(
          firestoreModules.doc(fbDb, 'users', currentUid, 'progress', String(topId)),
          {
            best: newBest,
            completed: isCompleted,
            updatedAt: firestoreModules.serverTimestamp()
          },
          { merge: true }
        ).then(() => {
          syncLeaderboardFromClient(currentUid);
        }).catch(err => {
          console.warn('Lỗi lưu điểm Tab 0 lên Firestore:', err);
        });
      }
      flushDirtyKeys();

      container.innerHTML = `
        <div class="card" style="text-align:center;padding:36px">
          <div class="eyebrow">Kết quả trắc nghiệm tổng hợp</div>
          <div class="big" style="margin:8px 0">${score} / ${questions.length}</div>
          <div class="hint">Điểm số: <b>${pct}%</b></div>
          ${pct >= 80 ? '<div class="fb ok" style="margin-top:12px">✓ Xuất sắc! Bạn nắm từ vựng rất vững.</div>' : '<div class="hint" style="margin-top:8px">Hãy luyện thêm để đạt từ 80% trở lên nhé!</div>'}
          ${wrongList.length ? `
            <div style="text-align:left;margin-top:18px">
              <b>Các từ cần ôn lại (${wrongList.length} từ đã tự động lưu vào Từ khó ⭐):</b>
              <ul class="wrong-list" style="margin-top:8px">
                ${wrongList.map(v => `<li><b>${esc(v.w)}</b>${v.pos ? ` (${esc(v.pos)})` : ''}: ${esc(v.vi)} <small>(${esc(v.topicTitle)})</small></li>`).join('')}
              </ul>
            </div>
          ` : ''}
          <div style="margin-top:20px">
            <button class="btn primary" id="t0-quiz-again">Làm lại bài khác</button>
          </div>
        </div>
      `;
      container.querySelector('#t0-quiz-again').onclick = () => renderT0Quiz(container, rawPool);
      return;
    }

    const q = questions[i];
    const topObj = TOPICS.find(t => t.id === q.v.topicId) || TOPICS[0];
    const viDesc = getWordDescVi(topObj, q.v);

    const promptHtml = dir === 'en'
      ? `<div style="display:flex;align-items:center;gap:10px">${esc(q.v.w)} <button class="icon-btn" id="t0-q-speak" title="Nghe phát âm" style="display:inline-flex">${SPEAK}</button></div><small>${q.v.pos ? esc(q.v.pos) + ' · ' : ''}chọn nghĩa tiếng Việt đúng</small>`
      : `<div>${esc(shortVi(q.v.vi))}</div><small>${q.v.pos ? esc(q.v.pos) + ' · ' : ''}chọn từ tiếng Anh đúng</small>`;

    container.innerHTML = `
      <div class="row between" style="margin-bottom:8px">
        <div class="seg" id="t0-dir">
          <button data-d="en" ${dir === 'en' ? 'aria-pressed="true"' : ''}>Anh → Việt</button>
          <button data-d="vi" ${dir === 'vi' ? 'aria-pressed="true"' : ''}>Việt → Anh</button>
        </div>
        <span class="hint" style="font-weight:600">Câu ${i + 1} / ${questions.length} · Đúng ${score}</span>
      </div>
      <div class="card">
        <div class="qprog"><i style="width:${(i / questions.length) * 100}%"></i></div>
        <div class="qprompt">
          ${promptHtml}
          ${viDesc ? `<div class="qdesc-vi">💡 <i>${esc(viDesc)}</i></div>` : ''}
        </div>
        <div class="opts" style="margin-top:16px">
          ${q.opts.map((o, k) => `
            <button class="opt" data-k="${k}">
              <span class="l">${'ABCD'[k]}</span>
              <span>${esc(dir === 'en' ? shortVi(o.vi) : cleanWord(o.w))}</span>
            </button>
          `).join('')}
        </div>
        <div class="row between" style="margin-top:14px">
          <span class="fb" id="t0-fb"></span>
          <button class="btn primary" id="t0-next" hidden>Câu tiếp theo →</button>
        </div>
      </div>
    `;

    const spkBtn = container.querySelector('#t0-q-speak');
    if (spkBtn) spkBtn.onclick = () => speak(q.v.w);

    container.querySelectorAll('#t0-dir button').forEach(btn => {
      btn.onclick = () => {
        dir = btn.dataset.d;
        store.set('t0_qdir', dir);
        draw();
      };
    });

    let answered = false;
    container.querySelectorAll('.opts .opt').forEach(btn => {
      btn.onclick = () => {
        if (answered) return;
        answered = true;
        const chosen = q.opts[+btn.dataset.k];
        const ok = chosen.w === q.v.w;
        btn.classList.add(ok ? 'ok' : 'no');

        if (ok) {
          score++;
          container.querySelector('#t0-fb').className = 'fb ok';
          container.querySelector('#t0-fb').textContent = '✓ Chính xác!';
          speak(q.v.w);
        } else {
          wrongList.push(q.v);
          store.addReviewWord(q.v, q.v.topicId, 'quiz');
          container.querySelector('#t0-fb').className = 'fb no';
          container.querySelector('#t0-fb').textContent = '✕ Chưa đúng. Đáp án: ' + (dir === 'en' ? q.v.vi : cleanWord(q.v.w));
          // Highlight nút đúng
          container.querySelectorAll('.opts .opt').forEach((b, k) => {
            if (q.opts[k].w === q.v.w) b.classList.add('ok');
          });
        }

        container.querySelectorAll('.opts .opt').forEach(b => b.disabled = true);
        const nextBtn = container.querySelector('#t0-next');
        nextBtn.hidden = false;
        nextBtn.focus();
        nextBtn.onclick = () => {
          i++;
          draw();
        };
      };
    });
  }

  draw();
}

function renderReview(box) {

  function draw() {

      return true;
    });

    box.innerHTML = `
      <div class="thead" style="margin-bottom:18px">
        <div class="eyebrow">Ôn tập cá nhân</div>
        <h1 style="font-size:28px">Từ khó cần ôn tập</h1>
        <div class="meta">
          <span>Tổng số: <b>${allHardWords.length}</b> từ</span>
          <span class="hint">Tự động thêm khi làm sai trắc nghiệm/viết từ, hoặc bấm ⭐ tại danh sách từ</span>

        <input class="search" id="rev-search" style="max-width:280px;margin-bottom:0" placeholder="Tìm kiếm từ khó…" value="${esc(searchQuery)}">
        <select class="field" id="rev-topic-sel" style="padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)">
          <option value="all">Tất cả chủ đề</option>
          ${TOPICS.map(t => `<option value="${t.id}" ${filterTopic===String(t.id)?'selected':''}>Chủ đề ${t.id}: ${esc(splitTitle(t).main)}</option>`).join('')}
        </select>
      </div>
      ${filtered.length === 0 ? `
        <div class="empty" style="padding:40px 16px;text-align:center">
          ${allHardWords.length === 0 ? 'Bạn chưa có từ khó nào cần ôn. Khi làm sai trắc nghiệm hoặc bấm ⭐ vào từ vựng, từ sẽ tự động xuất hiện ở đây!' : 'Không có từ nào khớp với bộ lọc tìm kiếm.'}
        </div>
      ` : `
        <div class="vgrid">
          ${filtered.map((item, idx) => {
            const topic = TOPICS.find(t => t.id === Number(item.topicId));
            const tTitle = topic ? splitTitle(topic).main : `Chủ đề ${item.topicId}`;
            return `
              <article class="vcard">
                <div class="vtop">
                  <span class="vnum">${idx + 1}</span>
                  <span class="vw">${esc(item.w)}</span>
                  ${item.pos ? `<span class="pos">${esc(item.pos)}</span>` : ''}
                  <button class="icon-btn" data-say="${esc(cleanWord(item.w))}" aria-label="Nghe">${SPEAK}</button>
                  <button class="btn ghost" data-unstar="${esc(item.w)}" style="color:var(--bad);font-size:12px;padding:4px 8px" title="Bỏ khỏi từ khó">Bỏ ôn</button>
                </div>
                <div class="vvi">${esc(item.vi) || 'Chưa có nghĩa'}</div>
                <div class="hint" style="font-size:12px;margin-top:6px">Thuộc: <a href="#t${item.topicId}-p1" style="color:var(--accent);text-decoration:none"><b>Chủ đề ${item.topicId}: ${esc(tTitle)}</b></a></div>

          }).join('')}

      `}

    cBox.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => speak(b.dataset.say)));
    cBox.querySelectorAll('[data-unstar]').forEach(b => b.addEventListener('click', () => {
      store.removeReviewWord(b.dataset.unstar);
      draw();
    }));

    const searchInp = cBox.querySelector('#rev-search');
    if (searchInp) {
      searchInp.oninput = (e) => {
        searchQuery = e.target.value;
        draw();
      };
    }
    const topicSel = cBox.querySelector('#rev-topic-sel');
    if (topicSel) {
      topicSel.onchange = (e) => {
        filterTopic = e.target.value;
        draw();
      };
    }
  }

  draw();
}

function runHardWordsQuiz(box, words) {
  const allPool = vocabPool();
  const pool = words.filter(v => v.vi);
  const qs = shuffle(pool).slice(0, Math.min(10, pool.length)).map(v => {
    const same = shuffle(pool.filter(x => x !== v && shortVi(x.vi) !== shortVi(v.vi)));
    const extra = shuffle(allPool.filter(x => cleanWord(x.w) !== cleanWord(v.w)));
    const ds = same.concat(extra).slice(0, 3);
    return { v, opts: shuffle([v, ...ds]) };
  });

  let i = 0, score = 0, wrong = [];

  function draw() {
    if (i >= qs.length) {
      box.innerHTML = `
        <div class="card">
          <div class="eyebrow">Kết quả ôn từ khó</div>
          <div class="big">${score}/${qs.length}</div>
          <div class="hint">Điểm: ${Math.round((score / qs.length) * 100)}%</div>
          ${wrong.length ? `
            <div>
              <b>Các từ vẫn còn sai:</b>
              <ul class="wrong-list">
                ${wrong.map(v => `<li><b>${esc(v.w)}</b>${v.pos ? ` (${esc(v.pos)})` : ''}: ${esc(v.vi)}</li>`).join('')}
              </ul>
            </div>
          ` : '<div class="fb ok">Tuyệt vời! Bạn đã trả lời đúng tất cả các từ khó trong đợt này.</div>'}
          <div class="row" style="margin-top:16px">
            <button class="btn primary" id="rev-again">Luyện thêm lượt khác</button>
          </div>
        </div>`;
      box.querySelector('#rev-again').onclick = () => runHardWordsQuiz(box, words);
      return;
    }

    const q = qs[i];
    const prompt = `${esc(q.v.w)}<small>${q.v.pos ? esc(q.v.pos) + ' · ' : ''}chọn nghĩa tiếng Việt đúng</small>`;

    box.innerHTML = `
      <div class="row between">
        <span class="hint">Luyện trắc nghiệm từ khó</span>
        <span class="hint">Câu ${i + 1}/${qs.length} · đúng ${score}</span>
      </div>
      <div class="card">
        <div class="qprog"><i style="width:${(i / qs.length) * 100}%"></i></div>
        <div class="qprompt">${prompt}</div>
        <div class="opts">
          ${q.opts.map((o, k) => `
            <button class="opt" data-k="${k}">
              <span class="l">${'ABCD'[k]}</span>
              <span>${esc(shortVi(o.vi))}</span>
            </button>
          `).join('')}
        </div>
        <div class="row between">
          <span class="fb" id="rfb"></span>
          <button class="btn primary" id="rnext" hidden>Câu tiếp</button>
        </div>
      </div>`;

    box.querySelectorAll('.opt').forEach(b => {
      b.onclick = () => {
        const pick = q.opts[+b.dataset.k];
        const ok = cleanWord(pick.w) === cleanWord(q.v.w);
        box.querySelectorAll('.opt').forEach(x => {
          x.disabled = true;
          if (cleanWord(q.opts[+x.dataset.k].w) === cleanWord(q.v.w)) x.classList.add('ok');
        });
        if (!ok) {
          b.classList.add('no');
          wrong.push(q.v);
        } else {
          score++;
        }
        const fb = box.querySelector('#rfb');
        fb.className = 'fb ' + (ok ? 'ok' : 'no');
        fb.textContent = ok ? 'Chính xác.' : `Chưa đúng: ${cleanWord(q.v.w)} = ${shortVi(q.v.vi)}`;
        speak(cleanWord(q.v.w));
        const n = box.querySelector('#rnext');
        n.hidden = false;
        n.focus();
        n.onclick = () => {
          i++;
          draw();
        };
      };
    });
  }

  draw();
}

function playCambridgeTrack(cdNum, trackName, label, btnEl, playerContainerId) {
  const trackKey = `cd${cdNum}_${trackName}`;
  const audioPath = `audio/pronun/cd${cdNum}/${trackName}`;
  const pContainer = playerContainerId ? document.getElementById(playerContainerId) : null;

  if (currentCambridgeAudio && currentCambridgeTrackKey === trackKey) {
    if (!currentCambridgeAudio.paused) {
      currentCambridgeAudio.pause();
      if (btnEl) btnEl.innerHTML = `▶️ Nghe Audio gốc (${label || trackName})`;
      return;
    } else {
      currentCambridgeAudio.play();
      if (btnEl) btnEl.innerHTML = `⏸️ Tạm dừng (${label || trackName})`;
      return;
    }
  }

  if (currentCambridgeAudio) {
    currentCambridgeAudio.pause();
    currentCambridgeAudio = null;
    document.querySelectorAll('.cambridge-play-btn').forEach(b => {
      if (b.dataset.origLabel) b.innerHTML = b.dataset.origLabel;
    });
  }

  const audio = new Audio(audioPath);
  currentCambridgeAudio = audio;
  currentCambridgeTrackKey = trackKey;

  if (btnEl) {
    if (!btnEl.dataset.origLabel) btnEl.dataset.origLabel = btnEl.innerHTML;
    btnEl.innerHTML = `⏳ Đang tải...`;
  }

  audio.play().then(() => {
    if (btnEl) btnEl.innerHTML = `⏸️ Tạm dừng (${label || trackName})`;
  }).catch(err => {
    console.error('Lỗi phát Cambridge audio:', err);
    if (btnEl) btnEl.innerHTML = btnEl.dataset.origLabel || `▶️ Nghe Audio gốc`;
    alert(`Chưa tìm thấy file âm thanh ${audioPath}. Hãy đảm bảo file đã được copy vào thư mục web/audio/pronun/cd${cdNum}/`);
  });

  audio.ontimeupdate = () => {
    if (pContainer) {
      const cur = audio.currentTime;
      const dur = audio.duration || 0;
      const timeEl = pContainer.querySelector('.cambridge-time-text');
      const seekEl = pContainer.querySelector('.cambridge-seek-bar');
      if (timeEl) {
        const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2, '0');
        timeEl.textContent = `${fmt(cur)} / ${fmt(dur)}`;
      }
      if (seekEl && dur > 0) {
        seekEl.value = (cur / dur) * 100;
      }
    }
  };

  audio.onended = () => {
    if (btnEl) btnEl.innerHTML = btnEl.dataset.origLabel || `▶️ Nghe Audio gốc`;
    currentCambridgeAudio = null;
    currentCambridgeTrackKey = null;
  };
}

function seekCambridgeTrack(percent) {
  if (currentCambridgeAudio && currentCambridgeAudio.duration) {
    currentCambridgeAudio.currentTime = (percent / 100) * currentCambridgeAudio.duration;
  }
}

function skipCambridgeTrack(seconds) {
  if (currentCambridgeAudio) {
    currentCambridgeAudio.currentTime = Math.max(0, Math.min(currentCambridgeAudio.duration || 999, currentCambridgeAudio.currentTime + seconds));
  }
}
window.playCambridgeTrack = playCambridgeTrack;
window.seekCambridgeTrack = seekCambridgeTrack;
window.skipCambridgeTrack = skipCambridgeTrack;

      box.querySelectorAll('#pronun-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      curPronunTab = btn.dataset.tab;
      renderPronunSubTab(box.querySelector('#pronun-content'));
    };
  });

  renderPronunSubTab(box.querySelector('#pronun-content'));
}

function renderPronunSubTab(container) {
  if (!container) return;
  if (curPronunTab === 'ipa') renderIpaTab(container);
  else if (curPronunTab === 'pairs') renderPairsTab(container);
  else if (curPronunTab === 'units') renderUnitsTab(container);
  else if (curPronunTab === 'rules') renderRulesTab(container);
}

window.playPairCompare = function(w1, w2) {
  speak(w1);
  setTimeout(() => speak(w2), 800);
};

function setupEarQuiz(quizBox, pair) {
  if (!quizBox) return;
  const randItem = pair.items[Math.floor(Math.random() * pair.items.length)];
  const isW1 = Math.random() > 0.5;
  const targetWord = isW1 ? randItem.w1 : randItem.w2;

  quizBox.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <button class="btn primary" id="btn-quiz-spk" style="padding:10px 16px;font-size:14px;font-weight:700">
        🔊 Bấm để nghe từ bí ẩn
      </button>
      <div style="display:flex;gap:10px">
        <button class="btn" id="btn-ans-1" style="font-size:15px;font-weight:700;padding:10px 18px">${esc(randItem.w1)}</button>
        <button class="btn" id="btn-ans-2" style="font-size:15px;font-weight:700;padding:10px 18px">${esc(randItem.w2)}</button>
      </div>
    </div>
    <div id="quiz-feedback" style="margin-top:10px;font-weight:600;min-height:24px"></div>
  `;

  quizBox.querySelector('#btn-quiz-spk').onclick = () => speak(targetWord);
  // Auto speak on first load
  setTimeout(() => speak(targetWord), 300);

  function checkAns(selected) {
    const fb = quizBox.querySelector('#quiz-feedback');
    if (selected === targetWord) {
      fb.className = 'fb ok';
      fb.innerHTML = `✓ Chính xác! Từ bạn vừa nghe là <b>${esc(targetWord)}</b> (${isW1 ? esc(randItem.ipa1) : esc(randItem.ipa2)} - ${isW1 ? esc(randItem.vi1) : esc(randItem.vi2)}).`;
    } else {
      fb.className = 'fb no';
      fb.innerHTML = `✕ Chưa chính xác! Từ máy phát là <b>${esc(targetWord)}</b>. Hãy bấm nghe lại để phân biệt nhé.`;
    }
  }

  quizBox.querySelector('#btn-ans-1').onclick = () => checkAns(randItem.w1);
  quizBox.querySelector('#btn-ans-2').onclick = () => checkAns(randItem.w2);
}

                <div class="cambridge-audio-ctrls">
                  <button class="btn primary cambridge-play-btn"

            ${sec.targetSound ? `<div id="slot-sec-${u.id}-${sec.letter}" class="rec-slot" style="margin-bottom:12px"></div>` : ''}

            <!-- How to make sound: 2-column layout (Guide text + Diagram) -->
            ${sec.diagram ? `
              <div class="unit-mouth-grid" style="margin-bottom:16px">
                <div style="font-size:14px;line-height:1.6">
                  <div style="color:var(--ink);font-weight:600;margin-bottom:8px">${esc(sec.guideEn)}</div>
                  <div style="background:var(--sunk);border-left:3px solid #E11D48;padding:10px 12px;border-radius:6px;font-size:13.5px;color:var(--muted)">

                  <img src="${esc(sec.diagram)}" alt="Khẩu hình ${esc(sec.targetSound)}" />

                </div>
              </div>
            ` : (sec.guideEn ? `
              <div style="background:var(--sunk);padding:12px 14px;border-radius:8px;font-size:14px;line-height:1.6;margin-bottom:14px">
                <div style="font-weight:600;color:var(--ink);margin-bottom:4px">${esc(sec.guideEn)}</div>
                ${sec.guideVi ? `<div style="font-size:13px;color:var(--muted)">💡 ${esc(sec.guideVi)}</div>` : ''}
              </div>
            ` : '')}

            <!-- Word Groups (if any) -->
            ${sec.groups && sec.groups.length > 0 ? `
              <div style="margin-top:14px">
                <div style="font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Từ vựng theo chữ viết:</div>
                <div style="display:flex;flex-direction:column;gap:10px">
                  ${sec.groups.map((grp, gIdx) => `
                    <div style="background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px">
                      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
                        <span style="font-weight:800;font-size:13.5px;color:var(--ink)">Nhóm: ${esc(grp.pattern)}</span>
                        ${grp.badge ? `<span style="font-size:11px;font-weight:700;color:#E11D48;background:rgba(225,29,72,0.1);padding:2px 8px;border-radius:12px">${esc(grp.badge)}</span>` : ''}
                      </div>
                      <div style="display:flex;flex-wrap:wrap;gap:8px">
                        ${grp.words.map((w, wIdx) => `
                          <div style="display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px">
                            <span style="font-weight:800;font-size:14px">${esc(w.w)}</span>
                            <span style="font-size:12px;color:var(--muted)">${esc(w.ipa)}</span>
                            <button class="icon-btn" onclick="speak('${esc(w.w)}')" title="Nghe ${esc(w.w)}" style="width:26px;height:26px">
                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                            </button>
                            <button class="icon-btn rec-btn" data-rec-text="${esc(w.w)}" data-rec-id="u-w-${u.id}-${sec.letter}-${gIdx}-${wIdx}" title="Luyện đọc" style="width:26px;height:26px">

                        `).join('')}
                      </div>
                    </div>
                  `).join('')}

            <!-- Sentences or Phrases (with Book Illustration if available) -->
            ${sec.sentences && sec.sentences.length > 0 ? `
              <div style="margin-top:16px">
                <div style="font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:8px">Câu / Cụm từ luyện nói:</div>
                <div class="${sec.illustration ? 'unit-ex-with-img-grid' : ''}">
                  <div style="display:flex;flex-direction:column;gap:8px">
                    ${sec.sentences.map((sent, sIdx) => {
                      const enText = typeof sent === 'string' ? sent : sent.en;
                      const viText = typeof sent === 'object' ? sent.vi : '';
                      return `
                        <div class="sentence-drill-item">
                          <div class="sentence-top-bar">
                            <div style="flex:1;min-width:200px">
                              <div style="font-size:15px;font-weight:700;color:var(--ink)">${sIdx + 1}. "${esc(enText)}"</div>
                              ${viText ? `<div style="font-size:12.5px;color:var(--muted);margin-top:2px">${esc(viText)}</div>` : ''}
                            </div>
                            <div style="display:flex;gap:6px">
                              <button class="btn" onclick="speak('${esc(enText)}')" style="display:inline-flex;align-items:center;gap:4px;padding:5px 10px;font-size:12px">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>

                              </button>
                              <button class="btn rec-btn" data-rec-text="${esc(enText)}" data-rec-id="u-s-${u.id}-${sec.letter}-${sIdx}" style="padding:5px 10px;font-size:12px">

                                <span>Luyện nói</span>
                              </button>
                            </div>
                          </div>
                          <div id="slot-u-s-${u.id}-${sec.letter}-${sIdx}" class="rec-slot"></div>

                    }).join('')}
                  </div>
                  ${sec.illustration ? `
                    <div class="unit-ex-illustration-box">
                      <img src="${esc(sec.illustration)}" alt="${esc(sec.illustrationCaption || '')}" />
                      <div class="unit-ex-illustration-caption">${esc(sec.illustrationCaption || 'Hình minh họa trong sách')}</div>
                    </div>
                  ` : ''}
                </div>
              </div>
            ` : ''}

            <!-- Notes (if any) -->
            ${sec.notes && sec.notes.length > 0 ? `
              <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">
                ${sec.notes.map(n => `
                  <div class="unit-note-box">
                    <div style="font-weight:800;color:#d97706;margin-bottom:2px">⚠️ ${esc(n.tag)}:</div>
                    <div style="color:var(--ink)">${esc(n.content)}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `).join('')}

        <!-- Bottom CTA to Exercises -->
        <div style="background:linear-gradient(135deg, rgba(225,29,72,0.06), rgba(99,102,241,0.06));border:1.5px dashed var(--accent);border-radius:12px;padding:20px;text-align:center">
          <div style="font-size:16px;font-weight:800;margin-bottom:6px">Bạn đã nắm vững lý thuyết Unit ${u.id}?</div>
          <div style="font-size:13.5px;color:var(--muted);margin-bottom:12px">Hãy chuyển sang phần Bài tập thực hành để làm trọn bộ bài tập như trong sách giáo trình!</div>
          <button class="btn primary" id="btn-jump-exercises" style="padding:10px 24px;font-size:14.5px;font-weight:700">
            ✏️ Bắt đầu Làm bài tập Unit ${u.id} ngay →
          </button>
        </div>
      </div>
    `;

    const jumpBtn = box.querySelector('#btn-jump-exercises');
    if (jumpBtn) {
      jumpBtn.onclick = () => {
        curUnitViewMode = 'exercises';
        renderUnitsTab(container);
      };
    }
  } else {
    // Fallback for units without sections
    box.innerHTML = `
      <div style="background:var(--sunk);padding:14px;border-radius:8px;font-size:14px;line-height:1.6;margin-bottom:16px">
        💡 <strong>Quy tắc phát âm:</strong> ${esc(u.rule)}
      </div>
      <div style="margin-top:14px">
        <div style="font-size:14px;font-weight:800;margin-bottom:8px">Từ vựng trọng tâm:</div>
        <div class="pronun-word-grid">
          ${u.words.map((w, idx) => `
            <div class="pronun-word-card">
              <div>
                <div style="font-size:15px;font-weight:800">${esc(w.w)}</div>
                <div style="font-size:12px;color:var(--muted)">${esc(w.ipa)} · ${esc(w.vi)}</div>
              </div>
              <div style="display:flex;align-items:center;gap:4px">
                <button class="icon-btn" onclick="speak('${esc(w.w)}')" title="Nghe phát âm" style="width:34px;height:34px">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                </button>
                <button class="icon-btn rec-btn" data-rec-text="${esc(w.w)}" data-rec-id="u-w-${u.id}-${idx}" title="Luyện đọc" style="width:34px;height:34px">
                  ${MIC_ICON}
                </button>
              </div>
            </div>
            <div id="slot-u-w-${u.id}-${idx}" class="rec-slot" style="grid-column:1/-1"></div>
          `).join('')}
        </div>
      </div>
      <div style="margin-top:20px">
        <div style="font-size:14px;font-weight:800;margin-bottom:8px">Câu luyện nói:</div>
        <div>
          ${u.sentences.map((sent, idx) => `
            <div class="sentence-drill-item">
              <div class="sentence-top-bar">
                <div style="font-size:15px;font-weight:700;color:var(--ink);flex:1">${idx + 1}. "${esc(sent)}"</div>
                <div style="display:flex;gap:6px">
                  <button class="btn" onclick="speak('${esc(sent)}')" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;font-size:12.5px">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    <span>Nghe</span>
                  </button>
                  <button class="btn rec-btn" data-rec-text="${esc(sent)}" data-rec-id="u-s-${u.id}-${idx}" style="padding:6px 12px;font-size:12.5px">
                    ${MIC_ICON}
                    <span>Luyện nói</span>
                  </button>
                </div>
              </div>
              <div id="slot-u-s-${u.id}-${idx}" class="rec-slot"></div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
}

// --------------------------------------------------------------------------
// 3.2. RENDER UNIT EXERCISES (BÀI TẬP THỰC HÀNH TƯƠNG TÁC TỪ SÁCH)
// --------------------------------------------------------------------------
function renderUnitExercises(u, box, container) {
  if (!unitExState[u.id]) {
    unitExState[u.id] = {};
  }
  const uState = unitExState[u.id];

  const exList = u.exercises || [];
  if (exList.length === 0) {
    box.innerHTML = `
      <div style="background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center">
        <div style="font-size:32px;margin-bottom:8px">📝</div>
        <div style="font-size:16px;font-weight:800;color:var(--ink)">Bài tập thực hành Unit ${u.id}</div>
        <div style="font-size:13.5px;color:var(--muted);margin:8px auto 16px;max-width:460px">
          Hãy luyện tập phản xạ phân biệt âm và luyện nói các từ vựng và mẫu câu của bài học này!
        </div>
        <div style="display:flex;justify-content:center;gap:10px">
          <button class="btn primary" onclick="speak('${esc(u.words[0] ? u.words[0].w : 'hello')}')">🔊 Nghe từ vựng bài học</button>
          <button class="btn" onclick="curUnitViewMode='sections';renderUnitsTab(document.querySelector('#pronun-container')||document.body)">📖 Xem lại lý thuyết</button>
        </div>
      </div>
    `;
    return;
  }

  const completedCount = exList.filter(ex => uState[ex.id] && uState[ex.id].checked).length;
  const pct = Math.round((completedCount / exList.length) * 100);

  box.innerHTML = `
    <!-- Exercise Progress Bar -->
    <div style="background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div style="flex:1;min-width:200px">
        <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:6px">
          <span>Tiến độ làm bài tập Unit ${u.id}:</span>
          <span style="color:var(--accent)">${completedCount}/${exList.length} bài (${pct}%)</span>
        </div>
        <div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg, #E11D48, #6366F1);border-radius:4px;transition:width 0.3s"></div>
        </div>
      </div>
      <div>
        <button class="btn ghost" id="btn-reset-exercises" style="font-size:12.5px;padding:6px 12px">
          🔄 Làm lại từ đầu
        </button>
      </div>
    </div>

    <!-- Render Each Exercise Card -->
    <div style="display:flex;flex-direction:column;gap:22px">
      ${exList.map((ex, exIdx) => renderSingleExercise(u, ex, exIdx, uState)).join('')}
    </div>
  `;

  box.querySelector('#btn-reset-exercises').onclick = () => {
    if (confirm('Bạn có chắc muốn làm lại tất cả bài tập của Unit này?')) {
      delete unitExState[u.id];
      renderUnitsTab(container);
    }
  };

  bindAllExerciseEvents(u, box, container);
}

// --------------------------------------------------------------------------
// Helper: Render Single Exercise Card
// --------------------------------------------------------------------------
function renderSingleExercise(u, ex, exIdx, uState) {
  const st = uState[ex.id] || { answers: {}, checked: false };

  const exAudioBar = ex.audio ? `
    <div class="cambridge-player-bar" id="cambridge-player-ex-${ex.id}" style="margin-top:10px;margin-bottom:12px">
      <div class="cambridge-tag">
        <span class="cambridge-tag-badge">🎧 ${esc(ex.audio.code)}</span>
        <span style="font-size:13px">${esc(ex.audio.label || `CD${ex.audio.cd} ${ex.audio.track}`)}</span>
      </div>
      <div class="cambridge-audio-ctrls">
        <button class="btn primary cambridge-play-btn"
          onclick="playCambridgeTrack(${ex.audio.cd}, '${esc(ex.audio.track)}', '${esc(ex.audio.code)}', this, 'cambridge-player-ex-${ex.id}')"
          style="font-size:12px;padding:4px 10px;font-weight:700">
          ▶️ Nghe Audio gốc (${esc(ex.audio.code)})
        </button>
        <button class="btn ghost" onclick="skipCambridgeTrack(-5)" title="Tua lùi 5s" style="padding:4px 6px;font-size:11.5px">⏪ 5s</button>
        <button class="btn ghost" onclick="skipCambridgeTrack(5)" title="Tua tới 5s" style="padding:4px 6px;font-size:11.5px">⏩ 5s</button>
        <span class="cambridge-time-text">0:00 / 0:00</span>
        <input type="range" class="cambridge-seek-bar" min="0" max="100" value="0" oninput="seekCambridgeTrack(this.value)" />
      </div>
    </div>
  ` : '';

  if (ex.type === 'fill_dialogue') {
    return `
      <div class="unit-ex-card" id="ex-card-${ex.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--ink)">${esc(ex.title)}</div>
            <div style="font-size:13.5px;color:var(--muted);margin-top:2px">${esc(ex.instruction)}</div>
          </div>
          ${st.checked ? `<span class="badge" style="background:#10b981;color:#fff;padding:4px 10px;font-weight:700">Đã hoàn thành</span>` : ''}
        </div>

        ${exAudioBar}

        <!-- Word Bank Chips -->
        <div style="font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px">Ngân hàng từ vựng (Bấm vào từ để điền nhanh vào ô trống):</div>
        <div class="unit-word-bank">
          ${ex.wordBank.map(w => `<button type="button" class="unit-word-chip" data-word="${esc(w)}">${esc(w)}</button>`).join('')}
        </div>

        <!-- Dialogues List with Book Illustration -->
        <div class="${ex.image ? 'unit-ex-with-img-grid' : ''}">
          <div style="display:flex;flex-direction:column;gap:12px">
            ${ex.dialogues.map((diag, dIdx) => `
              <div style="background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px">
                <div style="font-weight:800;font-size:13px;color:var(--muted);margin-bottom:6px">Đoạn ${dIdx + 1}:</div>
                ${diag.lines.map((line, lIdx) => `
                  <div style="font-size:14.5px;line-height:2;margin-bottom:4px">
                    <strong style="color:var(--accent)">${esc(line.speaker)}:</strong>
                    ${line.parts.map((p, pIdx) => {
                      if (typeof p === 'string') return esc(p);
                      const blankKey = `d_${diag.id}_l_${lIdx}_b_${pIdx}`;
                      const val = st.answers[blankKey] || '';
                      const isRight = st.checked && (val.trim().toLowerCase() === p.blank.toLowerCase());
                      const isWrong = st.checked && !isRight;
                      return `
                        <input type="text" class="unit-blank-input ${isRight ? 'correct' : (isWrong ? 'wrong' : '')}"
                          data-blank-key="${blankKey}"
                          data-expected="${esc(p.blank)}"
                          value="${esc(val)}"
                          placeholder="..."
                          autocomplete="off"
                          autocapitalize="none"
                          style="width:${Math.max(90, p.blank.length * 12)}px" />
                        ${isWrong ? `<span style="font-size:12px;font-weight:700;color:#dc2626">(${esc(p.blank)})</span>` : ''}
                      `;
                    }).join('')}
                  </div>
                `).join('')}
              </div>
            `).join('')}
          </div>
          ${ex.image ? `
            <div class="unit-ex-illustration-box">
              <img src="${esc(ex.image)}" alt="${esc(ex.imageAlt || '')}" />
              <div class="unit-ex-illustration-caption">Hình vẽ minh họa Exercise 2.1</div>
            </div>
          ` : ''}
        </div>

        <!-- Check Button & Speech Tools -->
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <button class="btn primary btn-check-ex" data-ex-id="${ex.id}" style="padding:8px 18px;font-weight:700">
            ${st.checked ? 'Kiểm tra lại' : 'Kiểm tra đáp án'}
          </button>
          <div style="display:flex;gap:6px">
            <button class="btn ghost" onclick="speak('What shall we do this evening? Let\\'s stay at home and watch TV.')" style="font-size:12.5px">
              🔊 Nghe đoạn 1
            </button>
            <button class="btn ghost" onclick="speak('Let me read that email! No, it is a secret!')" style="font-size:12.5px">
              🔊 Nghe đoạn 2
            </button>
            <button class="btn ghost" onclick="speak('You know my friend Steve? Yes. Well, he has got a new job. He has joined the police!')" style="font-size:12.5px">
              🔊 Nghe đoạn 3
            </button>
          </div>
        </div>
      </div>
    `;
  }

  if (ex.type === 'clues') {
    return `
      <div class="unit-ex-card" id="ex-card-${ex.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--ink)">${esc(ex.title)}</div>
            <div style="font-size:13.5px;color:var(--muted);margin-top:2px">${esc(ex.instruction)}</div>
          </div>
          ${st.checked ? `<span class="badge" style="background:#10b981;color:#fff;padding:4px 10px;font-weight:700">Đã kiểm tra</span>` : ''}
        </div>

        ${exAudioBar}

        <!-- Clues List with Book Illustration Collage -->
        <div class="${ex.image ? 'unit-ex-with-img-grid' : ''}">
          <div style="display:flex;flex-direction:column;gap:10px">
            ${ex.items.map((it, idx) => {
              const val = st.answers[`clue_${it.id}`] || '';
              const isRight = st.checked && (val.trim().toLowerCase() === it.answer.toLowerCase());
              const isWrong = st.checked && !isRight;
              return `
                <div style="background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
                  <div style="flex:1;min-width:260px;font-size:14.5px">
                    <span style="font-weight:800;color:var(--accent)">${it.id}.</span> ${esc(it.clue)}
                    <div id="hint-box-${ex.id}-${it.id}" style="font-size:12px;color:var(--muted);margin-top:2px;display:none">
                      💡 Gợi ý: <strong>${esc(it.hint)}</strong>
                    </div>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px">
                    <button type="button" class="btn ghost btn-show-hint" data-hint-id="hint-box-${ex.id}-${it.id}" style="padding:4px 8px;font-size:12px" title="Xem gợi ý">
                      💡
                    </button>
                    <input type="text" class="unit-blank-input ${isRight ? 'correct' : (isWrong ? 'wrong' : '')}"
                      data-clue-id="${it.id}"
                      data-expected="${esc(it.answer)}"
                      value="${esc(val)}"
                      placeholder="Điền từ..."
                      style="width:110px" />
                    <button class="icon-btn" onclick="speak('${esc(it.answer)}')" title="Nghe phát âm từ này" style="width:30px;height:30px">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    </button>
                    ${isWrong ? `<span style="font-size:12px;font-weight:700;color:#dc2626">(${esc(it.answer)})</span>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          ${ex.image ? `
            <div class="unit-ex-illustration-box">
              <img src="${esc(ex.image)}" alt="${esc(ex.imageAlt || '')}" />
              <div class="unit-ex-illustration-caption">Gợi ý hình vẽ trong sách Cambridge</div>
            </div>
          ` : ''}
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between">
          <button class="btn primary btn-check-clues" data-ex-id="${ex.id}" style="padding:8px 18px;font-weight:700">
            ${st.checked ? 'Kiểm tra lại' : 'Kiểm tra đáp án'}
          </button>
        </div>
      </div>
    `;
  }

  if (ex.type === 'sort_sounds') {
    const words = ex.words;
    return `
      <div class="unit-ex-card" id="ex-card-${ex.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--ink)">${esc(ex.title)}</div>
            <div style="font-size:13.5px;color:var(--muted);margin-top:2px">${esc(ex.instruction)}</div>
          </div>
          ${st.checked ? `<span class="badge" style="background:#10b981;color:#fff;padding:4px 10px;font-weight:700">Đã kiểm tra</span>` : ''}
        </div>

        ${exAudioBar}

        <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));gap:8px;margin-bottom:16px">
          ${words.map((w, idx) => {
            const userChoice = st.answers[w.w] || '';
            const isChecked = st.checked;
            let statusClass = '';
            if (isChecked) {
              if (w.target === 'both') {
                statusClass = (userChoice === 'i_long' || userChoice === 'i_short') ? 'correct' : 'wrong';
              } else {
                statusClass = (userChoice === w.target) ? 'correct' : 'wrong';
              }
            }
            return `
              <div style="background:var(--sunk);border:1px solid ${statusClass === 'correct' ? '#10b981' : (statusClass === 'wrong' ? '#ef4444' : 'var(--line)')};border-radius:8px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between">
                <div>
                  <span style="font-weight:800;font-size:14px">${esc(w.w)}</span>
                  <span style="font-size:11.5px;color:var(--muted);margin-left:4px">${esc(w.ipa)}</span>
                  <button class="icon-btn" onclick="speak('${esc(w.w)}')" style="width:22px;height:22px;display:inline-flex;vertical-align:middle;margin-left:2px" title="Nghe">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                  </button>
                </div>
                <div style="display:flex;gap:4px">
                  <button type="button" class="btn ${userChoice === 'i_long' ? 'primary' : 'ghost'} btn-sort-choice"
                    data-word="${esc(w.w)}" data-choice="i_long" style="padding:3px 7px;font-size:11.5px;font-weight:700">
                    /iː/
                  </button>
                  <button type="button" class="btn ${userChoice === 'i_short' ? 'primary' : 'ghost'} btn-sort-choice"
                    data-word="${esc(w.w)}" data-choice="i_short" style="padding:3px 7px;font-size:11.5px;font-weight:700">
                    /ɪ/
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        ${st.checked ? `
          <div class="unit-note-box" style="margin-bottom:14px">
            💡 <strong>Giải thích chi tiết từ sách Cambridge:</strong><br/>
            - <strong>Âm /iː/ (8 từ):</strong> green, meet, people, pizza, please, repeat (âm 2), tea, three.<br/>
            - <strong>Âm /ɪ/ (9 từ):</strong> big, busy, dinner, give, in, listen, office, repeat (âm 1), six.<br/>
            ⭐ <em>Đặc biệt: từ <strong>repeat /rɪˈpiːt/</strong> chứa cả 2 âm (/ɪ/ ở đầu và /iː/ ở đuôi)!</em>
          </div>
        ` : ''}

        <div>
          <button class="btn primary btn-check-sort" data-ex-id="${ex.id}" style="padding:8px 18px;font-weight:700">
            ${st.checked ? 'Kiểm tra lại' : 'Kiểm tra phân loại'}
          </button>
        </div>
      </div>
    `;
  }

  if (ex.type === 'match_sentences') {
    const pairs = ex.pairs;
    return `
      <div class="unit-ex-card" id="ex-card-${ex.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--ink)">${esc(ex.title)}</div>
            <div style="font-size:13.5px;color:var(--muted);margin-top:2px">${esc(ex.instruction)}</div>
          </div>
          ${st.checked ? `<span class="badge" style="background:#10b981;color:#fff;padding:4px 10px;font-weight:700">Đã kiểm tra</span>` : ''}
        </div>

        ${exAudioBar}

        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
          ${pairs.map((p, idx) => {
            const userChoice = st.answers[`match_${p.id}`] || '';
            const isRight = st.checked && (userChoice === p.end);
            const isWrong = st.checked && !isRight;
            return `
              <div style="background:var(--sunk);border:1px solid ${isRight ? '#10b981' : (isWrong ? '#ef4444' : 'var(--line)')};border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
                <div style="font-size:14.5px;font-weight:700;color:var(--ink);flex:1;min-width:200px">
                  ${idx + 1}. ${esc(p.start)} ...
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  <select class="match-select" data-pair-id="${p.id}" style="padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13.5px;font-weight:600">
                    <option value="">-- Chọn vế sau --</option>
                    ${pairs.map(opt => `
                      <option value="${esc(opt.end)}" ${userChoice === opt.end ? 'selected' : ''}>${esc(opt.end)}</option>
                    `).join('')}
                  </select>
                  ${isRight ? `
                    <button class="btn" onclick="speak('${esc(p.full)}')" style="display:inline-flex;align-items:center;gap:4px;padding:5px 8px;font-size:12px" title="Nghe câu hoàn chỉnh">
                      🔊 Nghe
                    </button>
                    <button class="btn rec-btn" data-rec-text="${esc(p.full)}" data-rec-id="match-${p.id}" style="padding:5px 8px;font-size:12px" title="Luyện đọc câu này">
                      ${MIC_ICON}
                    </button>
                  ` : ''}
                  ${isWrong ? `<span style="font-size:12px;font-weight:700;color:#dc2626">Đúng: "${esc(p.end)}"</span>` : ''}
                </div>
                ${isRight ? `<div id="slot-match-${p.id}" class="rec-slot" style="width:100%"></div>` : ''}
              </div>
            `;
          }).join('')}
        </div>

        <div>
          <button class="btn primary btn-check-match" data-ex-id="${ex.id}" style="padding:8px 18px;font-weight:700">
            ${st.checked ? 'Kiểm tra lại' : 'Kiểm tra nối câu'}
          </button>
        </div>
      </div>
    `;
  }

  if (ex.type === 'listen_pairs') {
    const drills = ex.drills;
    return `
      <div class="unit-ex-card" id="ex-card-${ex.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--ink)">${esc(ex.title)}</div>
            <div style="font-size:13.5px;color:var(--muted);margin-top:2px">${esc(ex.instruction)}</div>
          </div>
          ${st.checked ? `<span class="badge" style="background:#10b981;color:#fff;padding:4px 10px;font-weight:700">Đã hoàn thành</span>` : ''}
        </div>

        ${exAudioBar}

        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
          ${drills.map((drill, idx) => {
            const playedWord = listenPairsPlayed[`${u.id}_${ex.id}_${drill.id}`] || drill.correct;
            const userChoice = st.answers[`drill_${drill.id}`] || '';
            const isRight = st.checked && (userChoice === playedWord);
            const isWrong = st.checked && !isRight;
            return `
              <div style="background:var(--sunk);border:1px solid ${isRight ? '#10b981' : (isWrong ? '#ef4444' : 'var(--line)')};border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
                <div style="display:flex;align-items:center;gap:10px">
                  <span style="font-weight:800;font-size:14px;color:var(--accent)">Câu ${idx + 1}:</span>
                  <button type="button" class="btn primary btn-play-pair"
                    data-drill-key="${u.id}_${ex.id}_${drill.id}"
                    data-word-a="${esc(drill.pair[0])}"
                    data-word-b="${esc(drill.pair[1])}"
                    style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:13px;font-weight:700">
                    🔊 Bấm nghe từ
                  </button>
                  <span style="font-size:12px;color:var(--muted)">(${esc(drill.pairName)})</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  ${drill.pair.map(word => `
                    <button type="button" class="btn ${userChoice === word ? 'primary' : 'ghost'} btn-choose-pair-word"
                      data-drill-id="${drill.id}"
                      data-word="${esc(word)}"
                      style="font-size:14px;font-weight:800;padding:6px 14px;min-width:70px">
                      ${esc(word)}
                    </button>
                  `).join('')}
                  ${isRight ? `<span style="color:#059669;font-weight:800;font-size:13px">✓ Đúng</span>` : ''}
                  ${isWrong ? `<span style="color:#dc2626;font-weight:700;font-size:12.5px">✗ Máy đọc: "${esc(playedWord)}"</span>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div>
          <button class="btn primary btn-check-pairs" data-ex-id="${ex.id}" style="padding:8px 18px;font-weight:700">
            ${st.checked ? 'Kiểm tra lại' : 'Kiểm tra đáp án'}
          </button>
        </div>
      </div>
    `;
  }

  return `
    <div class="unit-ex-card">
      <div style="font-size:16px;font-weight:800;margin-bottom:4px">${esc(ex.title)}</div>
      <div style="font-size:13.5px;color:var(--muted);margin-bottom:12px">${esc(ex.instruction)}</div>
      ${exAudioBar}
      <div style="background:var(--sunk);padding:12px;border-radius:8px;font-size:13.5px">
        Bài tập thực hành tương tác đang được đồng bộ cho dạng ${esc(ex.type)}.
      </div>
    </div>
  `;
}

// Helper: Bind Event Listeners for All Exercises

function bindAllExerciseEvents(u, box, container) {
  const uState = unitExState[u.id];

  // 1. Fill Dialogue Events (Ex 2.1)
  box.querySelectorAll('.unit-word-chip').forEach(chip => {
    chip.onclick = () => {
      const w = chip.dataset.word;
      const inputs = box.querySelectorAll('.unit-blank-input');
      let targetInput = Array.from(inputs).find(inp => document.activeElement === inp);
      if (!targetInput) {
        targetInput = Array.from(inputs).find(inp => !inp.value);
      }
      if (targetInput) {
        targetInput.value = w;
        const key = targetInput.dataset.blankKey;
        if (key) {
          const exCard = targetInput.closest('.unit-ex-card');
          const exId = exCard.id.replace('ex-card-', '');
          if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
          uState[exId].answers[key] = w;
        }
        speak(w);
      }
    };
  });

  box.querySelectorAll('.unit-blank-input').forEach(inp => {
    inp.oninput = () => {
      const key = inp.dataset.blankKey || (inp.dataset.clueId ? `clue_${inp.dataset.clueId}` : null);
      if (key) {
        const exCard = inp.closest('.unit-ex-card');
        const exId = exCard.id.replace('ex-card-', '');
        if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
        uState[exId].answers[key] = inp.value;
      }
    };
  });

  box.querySelectorAll('.btn-check-ex').forEach(b => {
    b.onclick = () => {
      const exId = b.dataset.exId;
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].checked = true;
      renderUnitsTab(container);
    };
  });

  // 2. Clues Events (Ex 2.2)
  box.querySelectorAll('.btn-show-hint').forEach(b => {
    b.onclick = () => {
      const hintBox = box.querySelector('#' + b.dataset.hintId);
      if (hintBox) {
        hintBox.style.display = hintBox.style.display === 'none' ? 'block' : 'none';
      }
    };
  });

  box.querySelectorAll('.btn-check-clues').forEach(b => {
    b.onclick = () => {
      const exId = b.dataset.exId;
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].checked = true;
      renderUnitsTab(container);
    };
  });

  // 3. Sort Sounds Events (Ex 2.3)
  box.querySelectorAll('.btn-sort-choice').forEach(b => {
    b.onclick = () => {
      const word = b.dataset.word;
      const choice = b.dataset.choice;
      const exCard = b.closest('.unit-ex-card');
      const exId = exCard.id.replace('ex-card-', '');
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].answers[word] = choice;
      speak(word);
      renderUnitsTab(container);
    };
  });

  box.querySelectorAll('.btn-check-sort').forEach(b => {
    b.onclick = () => {
      const exId = b.dataset.exId;
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].checked = true;
      renderUnitsTab(container);
    };
  });

  // 4. Match Sentences Events (Ex 2.4)
  box.querySelectorAll('.match-select').forEach(sel => {
    sel.onchange = () => {
      const pairId = sel.dataset.pairId;
      const exCard = sel.closest('.unit-ex-card');
      const exId = exCard.id.replace('ex-card-', '');
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].answers[`match_${pairId}`] = sel.value;
    };
  });

  box.querySelectorAll('.btn-check-match').forEach(b => {
    b.onclick = () => {
      const exId = b.dataset.exId;
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].checked = true;
      renderUnitsTab(container);
    };
  });

  // 5. Listen Pairs Events (Ex 2.5)
  box.querySelectorAll('.btn-play-pair').forEach(b => {
    b.onclick = () => {
      const key = b.dataset.drillKey;
      const wordA = b.dataset.wordA;
      const wordB = b.dataset.wordB;
      const chosenWord = Math.random() < 0.5 ? wordA : wordB;
      listenPairsPlayed[key] = chosenWord;
      speak(chosenWord);
    };
  });

  box.querySelectorAll('.btn-choose-pair-word').forEach(b => {
    b.onclick = () => {
      const drillId = b.dataset.drillId;
      const word = b.dataset.word;
      const exCard = b.closest('.unit-ex-card');
      const exId = exCard.id.replace('ex-card-', '');
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].answers[`drill_${drillId}`] = word;
      renderUnitsTab(container);
    };
  });

  box.querySelectorAll('.btn-check-pairs').forEach(b => {
    b.onclick = () => {
      const exId = b.dataset.exId;
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].checked = true;
      renderUnitsTab(container);
    };
  });
}

function renderUnitAiSpeaking(u, box) {
  const allSentences = [];
  if (u.sections) {
    u.sections.forEach(sec => {
      if (sec.sentences) {
        sec.sentences.forEach(s => allSentences.push(s));
      }
    });
  }
  if (allSentences.length === 0 && u.sentences) {
    u.sentences.forEach(s => allSentences.push(s));
  }

  box.innerHTML = `
    <div style="background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px">
      <div style="font-size:15px;font-weight:800;color:var(--ink);margin-bottom:4px">🎙️ Phòng luyện nói thông minh AI - Unit ${u.id}</div>
      <div style="font-size:13.5px;color:var(--muted)">
        Hệ thống nhận diện giọng nói đa phương án (Live Visualizer) sẽ phân tích độ chính xác phát âm từng từ của bạn theo thời gian thực!
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      ${allSentences.map((sent, idx) => {
        const en = typeof sent === 'string' ? sent : sent.en;
        const vi = typeof sent === 'object' ? sent.vi : '';
        return `
          <div class="sentence-drill-item" style="padding:14px 16px">
            <div class="sentence-top-bar">
              <div style="flex:1;min-width:220px">
                <div style="font-size:16px;font-weight:800;color:var(--ink)">${idx + 1}. "${esc(en)}"</div>
                ${vi ? `<div style="font-size:13px;color:var(--muted);margin-top:2px">${esc(vi)}</div>` : ''}
              </div>
              <div style="display:flex;gap:6px">
                <button class="btn" onclick="speak('${esc(en)}')" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;font-size:13px">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                  <span>Nghe giọng mẫu</span>
                </button>
                <button class="btn rec-btn primary" data-rec-text="${esc(en)}" data-rec-id="ai-spk-${u.id}-${idx}" style="padding:6px 14px;font-size:13px;font-weight:700">
                  ${MIC_ICON}
                  <span>Bấm thu âm & Chấm điểm</span>
                </button>
              </div>
            </div>
            <div id="slot-ai-spk-${u.id}-${idx}" class="rec-slot" style="margin-top:8px"></div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderRulesTab(container) {

    { w: "boxes", ipa: "/ˈbɒksɪz/", group: "iz", note: "sau x (/ks/) -> /ɪz/" },

    { w: "finishes", ipa: "/ˈfɪnɪʃɪz/", group: "iz", note: "sau sh (/ʃ/) -> /ɪz/" },

  const edWords = [

// ---------- NEW PAGE: LEADERBOARD ----------
async function renderLeaderboard(box) {
  box.innerHTML = `
    <div class="thead" style="margin-bottom:18px">
      <div class="eyebrow">Xếp hạng học tập</div>
      <h1 style="font-size:28px">Bảng xếp hạng 🏆</h1>
      <div class="meta">
        <span>Top 50 học viên có điểm số cao nhất</span>
        <span class="hint">Điểm số được máy chủ xác thực qua trắc nghiệm trực tuyến</span>
      </div>
    </div>
    <div id="lb-content">
      <div class="card" style="text-align:center;padding:32px">
        <div class="hint">Đang tải bảng xếp hạng...</div>
      </div>
    </div>`;

  const cBox = box.querySelector('#lb-content');
  if (!isConfigured || !fbDb || !firestoreModules) {
    cBox.innerHTML = `
      <div class="card" style="text-align:center;padding:32px">
        <div style="font-weight:600;margin-bottom:6px">Chưa kích hoạt Bảng xếp hạng</div>
        <p class="hint">Bảng xếp hạng cần cấu hình Firebase để hoạt động. Vui lòng xem hướng dẫn trong file FIREBASE_SETUP.md.</p>
      </div>`;
    return;
  }

  try {
    const lbRef = firestoreModules.collection(fbDb, 'leaderboard');
    // Truy vấn trực tiếp leaderboard, không cần Firestore Index
    const snap = await firestoreModules.getDocs(lbRef);

    if (snap.empty) {
      cBox.innerHTML = `
        <div class="card" style="text-align:center;padding:32px">
          <div style="font-size:24px;margin-bottom:8px">🌟</div>
          <div style="font-weight:600;margin-bottom:6px">Chưa có người học trên Bảng xếp hạng</div>
          <p class="hint">Hãy đăng nhập và hoàn thành các bài trắc nghiệm để trở thành người đầu tiên ghi danh!</p>
        </div>`;
      return;
    }

    const items = snap.docs.map(doc => doc.data());
    items.sort((a, b) => (b.totalBest - a.totalBest) || ((b.completedCount || 0) - (a.completedCount || 0)));

    const rows = [];
    let rank = 1;
    items.forEach(d => {
      const isMe = currentUser && currentUser.uid === d.uid;
      let rankHtml = String(rank);
      if (rank === 1) rankHtml = '<span class="lb-rank lb-gold">🥇</span>';
      else if (rank === 2) rankHtml = '<span class="lb-rank lb-silver">🥈</span>';
      else if (rank === 3) rankHtml = '<span class="lb-rank lb-bronze">🥉</span>';
      else rankHtml = `<span class="lb-rank">${rank}</span>`;

      const avatar = d.photoURL
        ? `<img class="lb-avatar" src="${esc(d.photoURL)}" alt="Avatar">`
        : `<div class="lb-avatar">${esc((d.displayName || 'U')[0].toUpperCase())}</div>`;

      rows.push(`
        <tr class="lb-row ${isMe ? 'me' : ''}">
          <td style="width:48px;text-align:center">${rankHtml}</td>
          <td>
            <div class="lb-user-cell">
              ${avatar}
              <div>
                <div style="font-weight:700">${esc(d.displayName || 'Người học')}${isMe ? ' <span style="font-size:11px;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:6px">Bạn</span>' : ''}</div>
                <div style="font-size:12px;color:var(--muted)">Hoàn thành ${d.completedCount || 0}/45 chủ đề</div>
              </div>
            </div>
          </td>
          <td style="text-align:right">
            <div class="lb-score">${d.totalBest || 0}</div>
            <div style="font-size:11px;color:var(--muted)">tổng điểm</div>
          </td>
        </tr>
      `);
      rank++;
    });

    cBox.innerHTML = `
      <table class="lb-table">
        <thead>
          <tr>
            <th style="text-align:center;width:48px">Hạng</th>
            <th>Học viên</th>
            <th style="text-align:right">Điểm xác thực</th>
          </tr>
        </thead>
        <tbody>
          ${rows.join('')}
        </tbody>
      </table>`;
  } catch (err) {
    console.error('Lỗi tải leaderboard:', err);
    cBox.innerHTML = `<div class="card"><div class="fb no">Không thể tải bảng xếp hạng: ${esc(err.message)}</div></div>`;
  }
}
