time I have a much better idea of who I want to attract."},{"k":"p","text":"Perfect. Now ... since you're hoping to use this plan to apply for ……………, I suggest revisiting your projected budget. In particular, you should allocate more of the …………………. to staffing. About ………… percent is standard in the restaurant industry."},{"k":"audio","label":"Audio 2","src":"83-85 ETS2020.6"},{"k":"p","text":"And now for our local business news. On Thursday, Broadchurch Fashions announced that its flagship ………….. will move from Cummings Street to a larger location on River Street. The relocation has become necessary because of the store's increasing ……………… since Sharon Rockford took over as ………………... Under Ms. Rockford's business leadership, Broadchurch Fashions, which is known for its simple designs and basic colors for men, will be launching a ……………… line of ……………………….. next spring. And the new, larger store will have plenty of space for the expanded ………………!"}]}]},{"id":29,"title":"QUẢN LÝ - MANAGEMENT","vocab":[{"w":"Flexible working hours","pos":"","vi":"giờ làm việc linh hoạt"},{"w":"Merger and Acquisition","pos":"n","vi":"sự sáp nhập và mua lại"},{"w":"Morale","pos":"n","vi":"sự tự tin, tinh thần"},{"w":"Motivate","pos":"v","vi":"thúc đẩy, động viên"},{"w":"Obstacle","pos":"n","vi":"trở ngại"},{"w":"Pioneer","pos":"n","vi":"người tiên phong"},{"w":"Primary","pos":"adj","vi":"chính, chủ yếu"},{"w":"Prosperous","pos":"adj","vi":"thịnh vượng"},{"w":"Rapport","pos":"n","vi":"mối quan hệ (liên quan đến communication)"},{"w":"Reward","pos":"n","vi":"phần thưởng, tiền thưởng"},{"w":"Step down","pos":"","vi":"từ bỏ (a job/position)"},{"w":"Strategy","pos":"n","vi":"chiến lược"},{"w":"Workforce","pos":"n","vi":"lực lượng lao động"}],"notes":["Morale = Confidence","Primary = Main = Core","Workforce = Labor"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"This is not something that we have done before, but this year we have compiled a chart of all the health problems for which we have treated workers over the past 12 months. We have decided that by sharing this information, we might be able to motivate some of you to take more care in the workplace. A lot of these problems could be avoided with just a little bit of common sense. While we are glad not to have to treat most of you for anything serious, and although we do enjoy the pleasure of your company, we would rather not have to treat any of you for accidents and incidents which are entirely avoidable by following safety regulations; wearing reinforced boots to protect your toes, wearing safety goggles, keeping ear plugs with you at all times so you have them when you need them, and above all, we urge you to wash your hands before eating. Take a look at the chart and you’ll see what we mean. We’ve also divided the data by sex, so men – don’t let the ladies beat you next year! We are plaining on compiling a table next year, too, to let’s see if we can really cut down those numbers."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"59-61 ETS2020.7"},{"k":"p","text":"Jackie, have you seen the newspaper? The article about our new ……………………… for city residents is on the front page!"},{"k":"p","text":"That's great! You know, Alex, working on this project has been the most …………………….. thing I've done since I started working for the city …………………….."},{"k":"p","text":"I agree. And the article explains the program well-it says that the bicycles are ………… for residents to use as long as they are returned within two hours. There's even a map of pickup and drop-off ………………."},{"k":"p","text":"I'm so proud of our team. We should celebrate after the city council meeting later today. I’ll ……………… during my lunch break."},{"k":"audio","label":"Audio 2","src":"77-79 ETS2020.1"},{"k":"p","text":"OK everyone, before you head out to the …………………. this morning to start your shifts, I have a brief announcement. As most of you know, the new conveyor belt is now installed and up and running. This new conveyer belt is very similar to the …………………, except it's twice as fast as the old one. This means that our factory can now move ……………. the number of units per hour. Clearly, this is a big improvement in production speed. However, it could also be a challenge for us to watch out for …………………. errors. So, you're all required to watch a short ………………….. this morning before starting work."}]}]},{"id":30,"title":"COMMUNITY – CỘNG ĐỒNG","vocab":[{"w":"Authority","pos":"n","vi":"chính quyền, nhà chức trách"},{"w":"Ballot","pos":"v,n","vi":"bỏ phiếu kín"},{"w":"City hall","pos":"n","vi":"hội trường thành phố"},{"w":"City official","pos":"n","vi":"viên chức thành phố"},{"w":"Debate","pos":"v,n","vi":"tranh luận, cuộc tranh luận"},{"w":"Environment-friendly","pos":"","vi":"thân thiện với môi trường"},{"w":"Gathering","pos":"n","vi":"cuộc gặp mặt"},{"w":"Improvement","pos":"n","vi":"sự cải thiện"},{"w":"Measure","pos":"n","vi":"phương pháp, cách thức"},{"w":"Recycle","pos":"v","vi":"tái chế"},{"w":"Region","pos":"n","vi":"khu vực"},{"w":"The majority of","pos":"","vi":"phần lớn"}],"notes":["Debate = Discuss, Discussion","Measure = Method = Approach = Way = Technique","Region = Area","The majority of = Most of"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"The Greenville Transportation Commission (GTC) will hold a public meeting at City Hall on Thursday, May 15, at 7 p.m, to discuss its proposal to extend light rail service to Greenville Industrial Park. The rail line will run through a residential area. Residents of the neighborhood have complained that the extension will generate too much noise during peak commuting hours. In response, the GTC has been studying the feasibility of installing noise barriers along the tracks. At the meeting, Leora Kelman, CEO of Acoustic Engineering, will explain how much noise reduction the GTC can expect to achieve with the barriers. A presentation by Mayor Joe Rowan will follow"}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"62-64 ETS2020.10"},{"k":"p","text":"Hi, Elise. Good news-the last of the parts for the wind turbine have arrived."},{"k":"p","text":"Great! Now we can start ………………………. them to the designated site in"},{"k":"p","text":"Bloomington on Tuesday."},{"k":"p","text":"Well, I'm meeting tomorrow with ………………………. to discuss temporarily closing down part of the road while we transport everything."},{"k":"p","text":"OK. The foundation is already installed at the site, right? So let's send the …………………………. next."},{"k":"p","text":"Exactly. That way we'll only need the road closed for ……………. I'll let you know when we get approval so you can schedule the drivers."},{"k":"audio","label":"Audio 2","src":"86-88 ETS2020.7"},{"k":"p","text":"Thanks for joining us at the City of Belmont ……………………………… dinner. Tonight, community members have ………………. here to honor a group of artists who were asked to beautify the sheets of Belmont. Back in June, after a long selection process, ………… talented artists were chosen to paint the walls of several buildings around the city. We hoped that this project would draw attention to one of the …………………….. in the city. Well, the murals were completed a month ago and tourism in the area has ……………….. Please welcome our talented artists."}]}]},{"id":31,"title":"KINH TẾ - ECONOMICS","vocab":[{"w":"Account for","pos":"","vi":"chiếm, giải thích cho"},{"w":"Audit","pos":"v,n","vi":"kiểm toán"},{"w":"Fine","pos":"v,n","vi":"phạt, tiền phạt"},{"w":"Lack","pos":"v,n","vi":"thiếu"},{"w":"Noticeable","pos":"adj","vi":"đáng chú ý"},{"w":"Quarter","pos":"n","vi":"quý"},{"w":"Revenue","pos":"n","vi":"doanh thu"},{"w":"Risk","pos":"n","vi":"rủi ro"},{"w":"Sluggish","pos":"adj","vi":"chậm chạp"},{"w":"Soar","pos":"v","vi":"tăng vọt"},{"w":"Spokesperson","pos":"n","vi":"phát ngôn viên"},{"w":"Stable","pos":"adj","vi":"ổn định"},{"w":"Struggle","pos":"v","vi":"xoay xở"}],"notes":["Lack + of + N (you lack knowledge – you fail because of a lack of knowledge)","Noticeable = Remarkable = Outstanding","Sluggish = Slow","Soar >< Plummet"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"B-B Chang International (BBCI) announced Wednesday that it would buy Sieng Technology in a deal valued at $450 million."},{"k":"p","text":"A spokesperson for BBCI said the company expects to double its profits by the end of next year. It will accomplish this by making full use of Sieng’s recently updated production facilities. All four are operating at maximum capacity."},{"k":"p","text":"Financial experts believe the Sieng acquisition will make BBCI the world’s leading producer of circuits. “They will be well ahead of their competitors”, said top analyst Rhoda Sutton."},{"k":"p","text":"B-B Chang plans to maintain Sieng’s current workforce, with each of Sieng’s factories continuing normal operations for the next five years. After that time, BBCI will evaluate whether additional staff are needed."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"65-67 ETS2020.2"},{"k":"p","text":"Michelle, thanks for agreeing to lead this afternoon's meeting with me. One topic I think we should discuss with the staff is …………………………... We haven't met our quotas for lightbulbs for a ……………………."},{"k":"p","text":"I know. Productivity hasn't been ………………. recently. We had a month of strong production, but the next month was the ……………….. we've had in a year!"},{"k":"p","text":"Right... So at today's meeting, let's focus on the month when productivity was very low."},{"k":"p","text":"I know that our bulb manufacturing machines ……………………… several times that month. We should probably have all of them inspected."},{"k":"p","text":"I agree. What else should we discuss at the ………………………..?"},{"k":"audio","label":"Audio 2","src":"83-85 ETS2020.10"},{"k":"p","text":"Thank you for attending today's ……………………... Our guest speaker today is Min-Ah Choi. Min-Ah is the company president of Choi Incorporated. Her company specializes in ………………………….. It offers a wide range of financial services to both small businesses and individuals. So ... this is a great opportunity to learn from a leader in the industry. We'll be getting started in just a few minutes. As you get settled into your seats, please make sure you've signed in for the ………………. To do so, you'll need to find your …………………………………. on your mobile phone or laptop and click the \"sign in\" button there. That way, you'll all get …………….. for attending this seminar."}]}]},{"id":32,"title":"GIAO THÔNG - TRAFFIC","vocab":[{"w":"Alternative","pos":"adj,n","vi":"thay thế"},{"w":"Divert","pos":"v","vi":"chuyển hướng"},{"w":"Infrastructure","pos":"n","vi":"cơ sở hạ tầng"},{"w":"Lane","pos":"n","vi":"làn đường"},{"w":"Parking garage","pos":"","vi":"bãi đỗ xe"},{"w":"Permit","pos":"v,n","vi":"cho phép, giấy phép"},{"w":"Public transportation","pos":"","vi":"giao thông công cộng"},{"w":"Ramp","pos":"n","vi":"đoạn đường dốc"},{"w":"Route","pos":"n","vi":"tuyến đường"},{"w":"Suburban","pos":"adj","vi":"ngoại thành"},{"w":"Toll","pos":"n","vi":"phí cầu đường"},{"w":"Traffic congestion","pos":"","vi":"tắc đường"},{"w":"Undergo","pos":"v","vi":"trải qua"}],"notes":["Alternative ~ Substitute ~ Instead","Infrastructure ~ Facility","Permit = License","Traffic congestion = Traffic jam","Parking garage ~ Parking area ~ Parking lot"],"sections":[{"title":"Translate and answer the question","type":"reading","blocks":[{"k":"p","text":"Tri-County Real Estate\nMemo\nTo: Sales staff\nFrom: Russell Miller\nRe: Parking of personal vehicles\nAs you know, construction of the new office extension is scheduled to begin this spring, Unfortunately, during the period of construction, we will not be able to use our west parking lot. As an alternative, we have arranged to lease parking space for company vehicles from the Rio Grande Company. However, we are unable to provide parking spaces for private cars. Beginning March 15^(th), those of you who drive to work will have to make other arrangements for parking your own vehicles. There is on-street parking available on Garfield Street and you may park at the warehouse lot at Tri-County Builders. We have arranged for a company discounts, so you will be able to park at a reduced daily rate, equal to what you currently pay for parking. Please be assured that there will be adequate parking for all employees. I’d like to convince you that the four-block walk would be healthy, but for those of you determined to be lazy, and because I know there are bound to be plenty of rainy days, we will arrange a convenient morning and evening shuttle from offices to the warehouse lot. A list of shuttle bus times will be posted on the bulletin board in each office as soon as it is finalized."},{"k":"p","text":"I am sorry for the inconvenience. Remember that it is all for a good cause. We really need the new office space and when construction is completed, we’ll have a nicely landscaped parking lot with bright lighting and a personal parking space for each of you."},{"k":"q","text":"1. Who are the recipients of this memo?","opts":["Construction workers","Real estate agents","Bus driver","Janitors"]},{"k":"q","text":"2. What did the company focus on in making these arrangements?","opts":["Convenience and expense","Employee health concerns","Local weather and traffic","Lighting and landscaping"]},{"k":"q","text":"3. How long will the parking changes be in effect?","opts":["Until spring","Through the summer","Until construction is complete","Until everyone is willing to walk four blocks"]},{"k":"q","text":"4. Where should workers look to find the shuttle bus schedule?","opts":["At the bus stop","On an attached sheet of paper","On the company website","On the office notice boards"]}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"89-91 ETS2020.2"},{"k":"p","text":"Hello, this is Tom Pollard from Human Resources calling for Wilma. We're so happy you'll be joining our team at Moorestown …………………. Could you come in next Monday morning for your …………………….? After, you'll be able to meet some coworkers and have a tour of the facility. Just to warn you, getting to our office is a little tricky right now. The street we're on is closed to traffic because of …………………... I recommend parking a couple of blocks away and walking. Also, I'd like to invite you to join me for lunch the day you come. That way, you can ……………………….. you might have. Anyway, ……………………. back to confirm."},{"k":"audio","label":"Audio 2","src":"77-79ETS2020.3"},{"k":"p","text":"And now for the hourly …………………….. Highway 95 is currently experiencing heavy traffic because of the ………………… that’s taking place at the convention center this evening. To find alternate routes, we recommend taking a look at the interactive ………… on our Website. Also remember that construction will begin in the downtown area early next week, and sections of Market Sheet will likely be closed. We'll be sure to let you know as soon as the ………………………. is complete. Thanks for listening, and enjoy your drive."}]}]},{"id":33,"title":"VĂN HỌC - LITERATURE","vocab":[{"w":"Author","pos":"n","vi":"tác giả"},{"w":"Award-winning","pos":"adj","vi":"đạt giải"},{"w":"Composer","pos":"n","vi":"nhà soạn nhạc, người sáng tác"},{"w":"Contemporary","pos":"adj","vi":"đương đại, đương thời"},{"w":"Contributing writer","pos":"","vi":"nhà văn cộng tác"},{"w":"Depict","pos":"v","vi":"mô tả, trình bày"},{"w":"Draft","pos":"n","vi":"bản thảo"},{"w":"Honored","pos":"adj","vi":"được vinh danh"},{"w":"Innovative","pos":"adj","vi":"cải tiến, sáng tạo"},{"w":"Literature","pos":"n","vi":"văn học"},{"w":"Manuscript","pos":"n","vi":"bản thảo"},{"w":"Fiction","pos":"n","vi":"tiểu thuyết viễn tưởng"},{"w":"Play","pos":"n","vi":"vở kịch"},{"w":"Poetry","pos":"n","vi":"thơ ca"},{"w":"Sculpture","pos":"n","vi":"tác phẩm điêu khắc"}],"notes":["Author ~ Writer","Written draft = Manuscript"],"sections":[{"title":"Translate and answer the questions","type":"reading","blocks":[{"k":"p","text":"MATT ALCHERI’S ADVENTUROUS LEAP\nBy Erika Quake, Badger Dispatch\nMILWAUKEE (12 January) – Matt Alcheri has created music for dozens of films, including Seeking Eleanor, which earned him the Cinearts Award for Best Original Music. Recently, he has lent his considerable composing skills to Final Chance, a video game produced by Silhouette Gaming Systems (SGS), which has been creating interactive entertainment for 10 years now."},{"k":"p","text":"Mr. Achieri was introduced to the managing director of SGS, Harry Jansson, at a social event hosted by Ms. Chandra Bixby, who, on occasion, has collaborated with Mr. Acheri in composing film scores. Mr. Jansson proceeded to invite Mr. Acheri to write the music for Final Chance."},{"k":"p","text":"In a phone interview, Mr. Alcheri said that he was “quite impressed” with the graphics and animation of Final Chance. “It left me with the sense that I was watching a movie, and so I did not hesitate to collaborate on the project”, said the renowned composer. He further remarked that writing the score for the video game was virtually identical to composing the music for a movie."},{"k":"p","text":"“All I had to do was write music that matches the atmosphere of the various scenes depicted in the game,”, he added."},{"k":"p","text":"As for Mr. Jansson, he said I the same interview that with pre-orders for Final Chance standing currently at 200,000 copies, he has no doubt that the latest SGS product, scheduled to be released on March 20, will be a success."},{"k":"q","text":"1. Who is Ms. Bixby?","opts":["A film company executive","A video game developer","A movie director","A music composer"]},{"k":"q","text":"2. What most likely is true about Mr. Jansson?","opts":["He became SGS’s managing director ten years ago","He helped plan Ms. Bixby’s social event","He has worked with Mr. Alcheri before","He spoke to Ms. Quade recently"]},{"k":"q","text":"3. What is indicated about Final Chance?","opts":["It took a year to develop","It will be available in March","It will be limited to 200,000 copies","It is based on the film Seeking Eleanor."]}]}]},{"id":34,"title":"KINH DOANH - BUSINESS","vocab":[{"w":"Aid","pos":"n","vi":"sự giúp đỡ, gói hỗ trợ"},{"w":"Associate","pos":"v","vi":"kết hợp"},{"w":"Commission","pos":"n","vi":"hội đồng, tiền hoa hồng"},{"w":"Competitor","pos":"n","vi":"đối thủ"},{"w":"Core","pos":"n,adj","vi":"cốt lõi"},{"w":"Corporation","pos":"n","vi":"tập đoàn"},{"w":"Domestic","pos":"adj","vi":"trong nước"},{"w":"Enormous","pos":"adj","vi":"to lớn"},{"w":"Entrepreneur","pos":"n","vi":"doanh nhân"},{"w":"Executive","pos":"n","vi":"người điều hành"},{"w":"Initiative","pos":"n","vi":"sáng kiến"},{"w":"Output","pos":"n","vi":"sản lượng"},{"w":"Bring about","pos":"","vi":"gây ra"}],"notes":["Associate = Collaborate","Competitor = Rival","Bring about = Cause"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"TRUBRIDGE CONTRACTING\nTo: All Trubridge Contracting Employees\nFrom: Trubridge Contracting Acquisitions Commission\nRe: Trubridge Estefen\nDate: October 12\nAs you know, Trubridge Contracting will officially merge with Estefen Builders on November 21. We feel that this merger will benefit both companies. Like us, Estefen specializes in commercial construction, and this merger will solidify our position at the forefront of the ever-growing Lexington City building trade. In addition, the creation of Trubridge Estefen will enable us to take on more complex development projects such as the Faust Center and the Hull Street Mall expansion."},{"k":"p","text":"Members of each department will meet during the week of October 20 to discuss some of the logistical details of the merger, as well as the planned expansion and renovation of the Trubridge offices so they can effectively accommodate Estefen‘s 113 employees. If you have questions you would like to see addressed during the meetings, please feel free to e-mail the meeting chairperson in advance."},{"k":"p","text":"Note that both Stan Trubridge and Zach Estefen will attend each meeting,"},{"k":"p","text":"Trubridge Contracting Acquisitions Commission."}]},{"title":", Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"41-43 ETS2020.4"},{"k":"p","text":"Hello, I'm interested in the ………………… your firm offers. I own some cafés, and one of my ………………… just put his coffee shop up for sale. I'm planning to buy it, but I want to avoid any …………….. in the contract."},{"k":"p","text":"Of course. We have several qualified contract attorneys on staff. Let me set up a time for you to come into the office this week to talk with one of our ………………..."},{"k":"p","text":"Great. But would it be possible to have the ……………..? I'll be away in San Diego the next few days for a relative's ……………."},{"k":"audio","label":"Audio 2","src":"89-91 ETS2020.5"},{"k":"p","text":"OK, everyone. Thank you for coming to today's …………….. It's eight o'clock and we have a lot of material to cover today. I'm Sanjay, the ………………………… of Human Resources, and today we'll be talking about selecting job applicants. As managers, it can be quite overwhelming for US to go through a large number of job applications to figure out who to interview. So to start off, I'd like you to turn to the person sitting ………………….. and take about five minutes to ……… both positive and negative aspects of a resume and cover letter-what stands out to you as a …………………………. to contact."}]}]},{"id":35,"title":"SỰ XÂY DỰNG - CONSTRUCTION","vocab":[{"w":"Adjacent","pos":"adj","vi":"liền kề"},{"w":"Archeologist","pos":"n","vi":"nhà khảo cổ học"},{"w":"Architect","pos":"n","vi":"kiến trúc sư"},{"w":"Be torn down","pos":"","vi":"bị phá hủy"},{"w":"Capacity","pos":"n","vi":"sức chứa"},{"w":"Extensive","pos":"adj","vi":"quy mô lớn"},{"w":"Insulation","pos":"n","vi":"sự cách nhiệt"},{"w":"In the vicinity of","pos":"","vi":"lân cận"},{"w":"Plant","pos":"n","vi":"nhà máy"},{"w":"Proximity","pos":"n","vi":"sự gần, liền kề"},{"w":"Refurbish","pos":"v","vi":"tân trang lại"},{"w":"Restoration","pos":"n","vi":"sự khôi phục"},{"w":"Transform","pos":"v","vi":"biến đổi"},{"w":"Underway","pos":"adj","vi":"đang diễn ra"}],"notes":[],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"CORDOVA (May 6) – Cordova city officials have begun preliminary discussion about what to do with Lowell Street Bridge, a historic city landmark that is in dire need of an upgrade. While costly restoration options are being considered, several factors make demolition a more likely outcome."},{"k":"p","text":"“It’s a tough decision and one we don’t intend to make hastily,” said city planner Colin Barnwell. “So far, it seems that replacing the bridge makes the most financial sense.”"},{"k":"p","text":"Price isn’t the only consideration, however. According to structural engineer Steve Pachenco, traffic flow is another important factor. “Highway 49 will soon be broadened from two lanes to four. Then, Lowell Street Bridge will no longer be able to accommodate the increase in vehicles”, he said. “The way I see it, a wider, more modern bridge is inevitable.”"},{"k":"p","text":"For residents who want to share their opinions and ideas, the city council will be holding a public input session at Helman Square next Thursday at 11 A.M."},{"k":"q","text":"1. What is this article about?","opts":["A plan for a construction","A new technology","A broaden road","A city conference"]},{"k":"q","text":"2. What is the most possible result when the city officials consider the factors?","opts":["A bridge will be destroyed","They will spend money","A upgraded bridge","A renewed road"]},{"k":"q","text":"3. How inhabitants can express the thoughts?","opts":["By attending a gathering","By calling the main office","By sending an e-mail","By voting on a website"]}]}]},{"id":36,"title":"VĂN HÓA se","pos":"n","vi":"chuyên môn"},{"w":"Facilitator","pos":"n","vi":"người cố vấn"},{"w":"Field","pos":"n","vi":"lĩnh vực"},{"w":"Guideline","pos":"n","vi":"hướng dẫn"},{"w":"Membership","pos":"n","vi":"hội viên"},{"w":"Organization","pos":"n","vi":"tổ chức"},{"w":"Post","pos":"v,n","vi":"thông báo"},{"w":"Subject","pos":"n","vi":"chủ đề"},{"w":"Third-party","pos":"","vi":"bên thứ ba"}],"notes":[],"sections":[{"title":"Translate and answer the questions","type":"reading","blocks":[{"k":"p","text":"Dubai Ecological Construction Expo\nExhibit Hall Rules\nBADGE CONTROL\nAdmission to the exhibit hall is restricted to exhibitors from qualified companies, exposition attendees, and logistics personnel."},{"k":"p","text":"Badges are required on the floor at all times, including during move-in and move-out days."},{"k":"p","text":"-Exhibitor badges will be given to the company’s primary contact for distribution to that exhibitor’s personnel."},{"k":"p","text":"-The number of badges assigned to each exhibitor will be based on the size of booth space the company has rented."},{"k":"p","text":"-Anyone on the floor who is not officially registered will be evicted from the show."},{"k":"p","text":"-False certification of any individual as a company’s exhibition representative, or misuse of exhibitor badges, will be just cause for removing the exhibit from the floor."},{"k":"q","text":"1. What is the purpose of the policy statement?","opts":["To outline the registration process","To provide details about setting up exhibits","To specify who is permitted in the exhibit hall","To describe facilities that are available to participants"]},{"k":"q","text":"2. How will individual team members obtain a badge?","opts":["They will receive badges from a expo official when they check in","They will print out badges directly from the expo registration Web page.","Personalized badges will be sent to them in the mail","A company representative will pass out the badges to them"]},{"k":"q","text":"3. What must a company do to increase the number of employees working at its exhibit?","opts":["Rent a larger space for it exhibit","Request extra exhibitor badges online","Apply for a exemption to the staff limit","Speak directly to an expo representative"]}]}]},{"id":40,"title":"LỊCH TRÌNH, THỜI GIAN BIỂU - SCHEDULE","vocab":[{"w":"Accompany","pos":"v","vi":"đi cùng, đi kèm"},{"w":"Adjourn","pos":"v","vi":"tạm ngưng, giải tán (tạm thời)"},{"w":"Attendance","pos":"n","vi":"sự tham dự, số người tham dự"},{"w":"Auditorium","pos":"n","vi":"thính phòng"},{"w":"Excursion","pos":"n","vi":"chuyến tham quan"},{"w":"Immediately","pos":"adv","vi":"ngay lập tức"},{"w":"Institute","pos":"n","vi":"chuyến tham quan (work)"},{"w":"Last-minute","pos":"","vi":"phút cuối"},{"w":"Moderate","pos":"adj","vi":"vừa phải (size, number, strength)"},{"w":"Opening remarks","pos":"","vi":"lễ khai mạc"},{"w":"Preliminary","pos":"adj,n","vi":"mở đầu, sơ bộ"},{"w":"Presentation","pos":"n","vi":"bài thuyết trình"},{"w":"Press","pos":"n","vi":"báo chí"},{"w":"Rear entrance","pos":"","vi":"cửa sau"}],"notes":[],"sections":[{"title":"Translate and answer the questions","type":"reading","blocks":[{"k":"p","text":"To: Mercedes Salinas <msalinas@fitheathplanning.bm>\nFrom: Leonard Cowden <lcowden@srhealthcenter.bm>\nSubject: Bermuda Healthy Living Conference\nDate: 16 April\nDear Ms. Salinas,\nI’m excited that you have agreed to be one of the speakers at our annual Bermuda Healthy Living Conference on 12 May. I realize the invitation was last minute, and I truly appreciate your willingness to step in for Cara Branston. ---(1)---. Your expertise as a dietitian will be greatly valued by our participants. The strong attendance at Ms. Branston’s session last year on vegetarian meal preparation reflected that. ---(2)---. This year there is sure to be great interest in your unique approach to healthy eating."},{"k":"p","text":"If you would like to sell copies of your book, please ship them in advance to allow time for us to set up a display. ---(3)---. Also, be sure to let me know if you’ll need access to projector will a remote for your presentation. ---(4)---. Lastly, could you send me a short biographical profile as soon as possible for inclusion in our conference program? Thanks again."},{"k":"p","text":"Regards,\nLeonard Cowden"},{"k":"q","text":"1. Why did Mr. Cowden most likely send the email?","opts":["To invite Ms. Salinas to an event","To acknowledge Ms. Salinas acceptance of an offer","To ask Ms. Salinas for a recommendation","To propose that a session be rescheduled"]},{"k":"q","text":"2. What is suggested about Ms. Branston?","opts":["She spoke at the conference last year","She wrote a popular book about nutrition","She is a colleague of Ms. Salinas","She is studying to be a dietitian"]},{"k":"p","text":"In which of the positions marked (1), (2), (3) and (4) does the following sentence best belong?"},{"k":"q","text":"“It is no trouble at all to have visual equipment available.”","opts":["(1)","(2)","(3)","(4)"]}]}]},{"id":41,"title":"BẢNG ĐÁNH GIÁ - EVALUATION","vocab":[{"w":"Category","pos":"n","vi":"loại, hạng"},{"w":"Cleanness","pos":"n","vi":"sự sạch sẽ"},{"w":"Comfortable","pos":"adj","vi":"thoải mái"},{"w":"Disappointed","pos":"adj","vi":"thất vọng"},{"w":"Indicate","pos":"v","vi":"chỉ ra, biểu thị"},{"w":"Measure","pos":"n,v","vi":"đo đạc, phương pháp"},{"w":"Minor","pos":"adj","vi":"thiểu số, nhỏ"},{"w":"Overall","pos":"adj,adv","vi":"tổng thể"},{"w":"Rate","pos":"n","vi":"giá, tỉ lệ"},{"w":"Recommend","pos":"v","vi":"đề xuất"},{"w":"Responsive","pos":"adj","vi":"phản hồi"},{"w":"Satisfied","pos":"adj","vi":"hài lòng"},{"w":"Scale","pos":"n","vi":"quy mô, cơ cấu"},{"w":"Suggestion","pos":"n","vi":"gợi ý, đề xuất"}],"notes":[],"sections":[{"title":"Translate and answer the questions","type":"reading","blocks":[{"k":"p","text":"Nimblearn\nFind the Information Your Company Needs\nNimblearn is a robust, next-generation tool designed to make creating surveys easy, effective, and affordable. Our intuitive Web-based software allows you to design and administer surveys and automatically track and analyze results."},{"k":"p","text":"You asked for it, we created it. We designed Nimblearn to include all the features you requested:"},{"k":"p","text":"-A simple process for designing surveys that guides you every step of the way."},{"k":"p","text":"-A huge list of question types, from true/false to open text, with advice on how and when to use each one."},{"k":"p","text":"-A library of proven sample questions designed to gather essential feedback on quality"},{"k":"p","text":"-Loads of quick and easy ways to distribute your surveys (email, social media, etc.)"},{"k":"p","text":"-Summary and advanced reports that can be viewed in real time."},{"k":"p","text":"Go to www.nimblearn.com to learn more."},{"k":"q","text":"1. How would a company most likely use Nimblearn?","opts":["To perform market research","To create software programs","To design colorful advertisements","To produce end-of-year financial reports"]},{"k":"q","text":"2. What is suggested about the company that developed Nimblearn?","opts":["It was founded by a computer engineer","It posts customer reviews on its Web site","It has a reputation for producing high-quality goods","It used customer feedback in developing the product"]},{"k":"q","text":"3. What is NOT mentioned as a feature of Nimblearn?","opts":["Step-by-step instructions","Sample survey questions","Easy-to-read charts and graphs","Suggestions for simple distribution"]}]}]},{"id":42,"title":"HÓA ĐƠN - INVOICE","vocab":[{"w":"ATTN","pos":"","vi":"attention (chú ý chú ý)"},{"w":"Details","pos":"n","vi":"chi tiết"},{"w":"Gratuity","pos":"n","vi":"tiền tip"},{"w":"Order form","pos":"","vi":"mẫu đơn đặt hàng"},{"w":"Method","pos":"n","vi":"phương pháp"},{"w":"Quantity","pos":"n","vi":"số lượng"},{"w":"Ship to","pos":"","vi":"chuyển đến"},{"w":"Standard","pos":"n","vi":"tiêu chuẩn"},{"w":"Subtotal","pos":" itions marked (1), (2), (3) and (4) does the following sentence best belong?"},{"k":"q","text":"“Our quality control manager will visit the factory and observe those processes to ensure that nothing is being overlooked.”","opts":["(1)","(2)","(3)","(4)"]}]}]},{"id":43,"title":"THÔNG BÁO – ANNOUNCEMENT","vocab":[{"w":"Alert","pos":"adj","vi":"cảnh giác"},{"w":"Boulevard","pos":"n","vi":"đại lộ = avenue"},{"w":"Brief","pos":"adj","vi":"ngắn gọn, vắn tắt"},{"w":"Connecting flight","pos":"","vi":"chuyến bay chuyển tải"},{"w":"Contract renewal","pos":"","vi":"làm mới hợp đồng"},{"w":"Curator","pos":"n","vi":"quản lý (art stuff)"},{"w":"Fare","pos":"n","vi":"tiền vé"},{"w":"Inclusive","pos":"adj","vi":"tổng thể (bao gồm tất cả)"},{"w":"Followed by","pos":"","vi":"theo sau bởi"},{"w":"Rate","pos":"n","vi":"tỉ lệ"},{"w":"Scholar","pos":"n","vi":"nhà học giả, nghiên cứu"},{"w":"Seating","pos":"n","vi":"chỗ ngồi"},{"w":"Zip code","pos":"n","vi":"mã bưu điện = postcode"}],"notes":[],"sections":[]},{"id":44,"title":"ĐƠN ĐẶT HÀNG – ORDER FORM","vocab":[{"w":"Applicable","pos":"adj","vi":"áp dụng được, tương thích"},{"w":"Beverage","pos":"n","vi":"đồ uống"},{"w":"Dimension","pos":"n","vi":"kích cỡ"},{"w":"Double check","pos":"","vi":"kiếm tra 2 lần (carefully)"},{"w":"Ingredient","pos":"n","vi":"thành phần"},{"w":"Measurement","pos":"n","vi":"sự đo lường"},{"w":"Per","pos":"adj","vi":"mỗi"},{"w":"Refreshment","pos":"n","vi":"đồ ăn thức uống"},{"w":"Remainder","pos":"n","vi":"phần còn lại"},{"w":"Summary","pos":"n","vi":"tóm tắt, tóm gọn"},{"w":"Surcharge","pos":"n","vi":"phụ phí"},{"w":"Transaction","pos":"n","vi":"giao dịch"},{"w":"Vegetarian","pos":"n","vi":"người ăn chay"},{"w":"Due","pos":"","vi":"đến hạn"}],"notes":[],"sections":[]},{"id":45,"title":"SỰ XÁC NHẬN – CONFIRMATION","vocab":[{"w":"Badge","pos":"n","vi":"thẻ, huy hiệu"},{"w":"Duration","pos":"n","vi":"khoảng thời gian = period"},{"w":"Employer","pos":"n","vi":"ông chủ, người thuê nhân công"},{"w":"ID (identification)","pos":"","vi":"căn cước, chứng minh thư"},{"w":"Lecture","pos":"n","vi":"bài giảng"},{"w":"Option","pos":"n","vi":"tùy chọn"},{"w":"Penalty","pos":"n","vi":"phạt"},{"w":"Previous","pos":"adj","vi":"trước = former"},{"w":"Related","pos":"to","vi":"liên quan đến"},{"w":"Request","pos":"n","vi":"yêu cầu"},{"w":"Session","pos":"n","vi":"phần, buổi, phiên"},{"w":"Signature","pos":"n","vi":"chữ kí"},{"w":"Individual","pos":"n,adj","vi":"cá nhân"}],"notes":[],"sections":[]}],"enrich":{"1":{"vocab":{"Account":["/əˈkaʊnt/","Please log in to your account to check the status of your order.","Vui lòng đăng nhập vào tài khoản để kiểm tra tình trạng đơn hàng của bạn."],"Bill":["/bɪl/","The restaurant added a service charge to our bill.","Nhà hàng đã cộng phí phục vụ vào hóa đơn của chúng tôi."],"Cancel":["/ˈkæn.səl/","If you cancel your order before it ships, you will not be charged.","Nếu bạn hủy đơn trước khi hàng được gửi đi, bạn sẽ không bị tính phí."],"Charge":["/tʃɑːrdʒ/","The hotel will charge your credit card when you check in.","Khách sạn sẽ trừ tiền vào thẻ tín dụng của bạn khi bạn nhận phòng."],"Confirm":["/kənˈfɝːm/","Please call the hotel to confirm your booking.","Vui lòng gọi cho khách sạn để xác nhận việc đặt phòng."],"Fee":["/fiː/","A late fee of $10 will be added to your next bill.","Một khoản phí trễ hạn 10 đô la sẽ được cộng vào hóa đơn tiếp theo của bạn."],"No later than + time":["/noʊ ˈleɪ.t̬ɚ ðæn/","All forms must be submitted no later than Friday, May 5.","Tất cả biểu mẫu phải được nộp chậm nhất là thứ Sáu, ngày 5 tháng 5."],"Place an order":["/pleɪs ən ˈɔːr.dɚ/","I'd like to place an order for 200 business cards.","Tôi muốn đặt in 200 tấm danh thiếp."],"Purchase":["/ˈpɝː.tʃəs/","Customers who purchase two items get a third one free.","Khách hàng mua hai sản phẩm sẽ được tặng thêm sản phẩm thứ ba."],"Refund":["n. /ˈriː.fʌnd/ · v. /rɪˈfʌnd/","You can request a full refund within 30 days of purchase.","Bạn có thể yêu cầu hoàn toàn bộ tiền trong vòng 30 ngày kể từ ngày mua."],"Reserve":["/rɪˈzɝːv/","I'd like to reserve a table for four at 7 p.m.","Tôi muốn đặt trước một bàn cho bốn người lúc 7 giờ tối."],"Return":["/rɪˈtɝːn/","Damaged items can be returned to any of our stores.","Hàng bị hư hỏng có thể được trả lại tại bất kỳ cửa hàng nào của chúng tôi."],"Ship":["/ʃɪp/","Your order will be shipped within two business days.","Đơn hàng của bạn sẽ được gửi đi trong vòng hai ngày làm việc."],"Submit":["/səbˈmɪt/","Please submit your expense report by the end of the month.","Vui lòng nộp báo cáo chi phí trước cuối tháng."],"Verify":["/ˈver.ə.faɪ/","We need to verify your identity before processing the payment.","Chúng tôi cần xác minh danh tính của bạn trước khi xử lý khoản thanh toán."]},"usage":[["Bill / invoice / check / receipt","Tài liệu ghi bốn từ bằng nhau, nhưng chúng khác nhau khi dùng. Bill và invoice là giấy báo số tiền cần trả (invoice hay dùng giữa các công ty). Check (Mỹ) là hóa đơn ở nhà hàng: “Could we have the check, please?”, ngoài ra còn nghĩa là tấm séc. Receipt là biên lai, có sau khi đã trả tiền."],["Confirmative","Rất hiếm gặp. Tính từ hay dùng là confirmed: a confirmed reservation (đặt chỗ đã được xác nhận)."],["Verify và confirm","Verify là kiểm tra để chắc chắn thông tin đúng: verify your identity. Confirm là xác nhận một việc đã định: confirm a booking. TOEIC hay dùng verification cho thủ tục kiểm tra danh tính, thông tin."],["Refund","Danh từ nhấn âm đầu /ˈriː.fʌnd/. Cụm hay gặp: request a refund, give/issue a refund, a full refund, refund policy."],["No later than = by","Chỉ hạn chót, tính cả mốc đó: no later than May 5 nghĩa là ngày 5 vẫn được."]],"forms":[["Please keep your ____ number for future reference.","confirm",["confirmation"]],["There is a $25 ____ fee if you cancel less than 24 hours in advance.","cancel",["cancellation"]],["We have a ____ for two under the name Kim.","reserve",["reservation"]],["The table by the window is already ____.","reserve",["reserved"]],["The ____ of off c giới thiệu."]},"usage":[["Cooperate","Tài liệu ghi “công tác”. Nghĩa đúng là hợp tác. Danh từ: cooperation; tính từ: cooperative."],["Considerate","Tài liệu ghi “cẩn thận, thận trọng”. Nghĩa đúng là chu đáo, biết nghĩ cho người khác. “Cẩn thận” là careful. Đừng nhầm với considerable (đáng kể)."],["Demonstrate","Tài liệu ghi (v) nhưng nghĩa lại là danh từ. Động từ demonstrate: làm mẫu, chứng minh, thể hiện. Danh từ: demonstration."],["Attentive","Ngoài “chăm chú”, trong ngữ cảnh dịch vụ thường hiểu là chu đáo, ân cần: attentive staff."],["Qualification","Trong tuyển dụng thường là bằng cấp, trình độ, điều kiện cần có, không hẳn là “tố chất”: relevant qualifications."],["Reference và referral","Reference là thư hoặc người giới thiệu xác nhận năng lực khi xin việc. Referral là việc giới thiệu khách, bệnh nhân, ứng viên đến một nơi khác."]],"tr":{"0":{"0":["High Tech đang tìm một ứng viên phù hợp cho vị trí Thực tập sinh Marketing. Bất kỳ ai có nền tảng liên quan và bằng cấp phù hợp đều có thể ứng tuyển vào vị trí còn trống này, và chúng tôi sẽ cho bạn cơ hội thể hiện những thế mạnh tiềm năng của mình. Đây là chương trình thực tập kéo dài bốn tháng, trong thời gian đó bạn sẽ được người giám sát giao nhiệm vụ. Chúng tôi tìm một ứng viên nỗ lực làm việc trong môi trường cường độ cao, đòi hỏi sự chú tâm, chu đáo và tinh thần hợp tác. Sau chương trình, mỗi thực tập sinh sẽ nhận giấy chứng nhận và được xem xét mời làm chính thức dựa trên thái độ tốt và thành tích gương mẫu. Nếu bạn quan tâm đến vị trí đầy hứa hẹn này, hãy tham gia cùng chúng tôi. Gửi CV, đơn ứng tuyển và tất cả thư giới thiệu đến Hightech.org.net.",[["candidate","n","ứng viên"],["intern","n","thực tập sinh"],["relevant","adj","liên quan, phù hợp"],["vacancy","n","vị trí còn trống (bài viết dùng sai thành “vacant”)"],["supervisor","n","người giám sát"],["intense","adj","cường độ cao"],["application form","n","đơn ứng tuyển"]]]}},"gap":{"1":{"1":[["Marketing","qualifications / experience","office / branch"],"Chào Charlie. Tôi là Cora từ công ty Thomasville Marketing. Chúng tôi rất ấn tượng với trình độ của anh và muốn mời anh nhận vị trí ở văn phòng Chicago."],"2":[[],"Cảm ơn chị. Tin thật thú vị. Nhưng chuyển đến Chicago là một quyết định lớn với tôi, nên tôi cần suy nghĩ thêm."],"3":[["position"],"Chúng tôi rất muốn tuyển được người cho vị trí này trong tuần này."],"4":[["understand"],"Vâng, tôi hiểu."],"5":[["team","travel / fare"],"Nếu anh nhận lời, chúng tôi muốn anh sớm đến Chicago để gặp nhóm mà anh sẽ làm việc cùng. Và tất nhiên, Thomasville Marketing luôn chi trả vé máy bay và tiền taxi cho các chuyến công tác."],"7":[["selected / chosen","presentations / seminars","products","company","questions","materials","last year","their","products"],"Như các bạn đã biết, Hội nghị Ngành Hóa chất sẽ diễn ra vào tháng Năm, và bốn bạn đã được chọn đi dự. Các bạn sẽ tham gia các buổi thuyết trình và hội thảo nhằm quảng bá nhiều sản phẩm hóa chất của công ty. Tôi biết đây là lần đầu các bạn đại diện cho công ty, và có lẽ các bạn sẽ có nhiều câu hỏi trong lúc chuẩn bị. Nhưng hãy nhớ, chúng tôi có sẵn đầy đủ tài liệu hội nghị cho các bạn, và tôi đã dự hội nghị này năm ngoái. Ngoài ra, khi đi về, chúng tôi sẽ nhờ các bạn thuyết trình cho đồng nghiệp về những gì đã tìm hiểu được về đối thủ cạnh tranh và sản phẩm của họ."]}}},"4":{"vocab":{"Apologize":["/əˈpɑː.lə.dʒaɪz/","We apologize for the delay in processing your order.","Chúng tôi xin lỗi vì sự chậm trễ trong việc xử lý đơn hàng của quý khách."],"As a token of appreciation":["/ˈtoʊ.kən əv əˌpriː.ʃiˈeɪ.ʃən/","As a token of appreciation, we are sending you a 10 percent discount coupon.","Để thể hiện lòng cảm kích, chúng tôi gửi quý khách một phiếu giảm giá 10%."],"Be delighted=happy = glad to":["/dɪˈlaɪ.t̬ɪd/","We are delighted to announce the opening of our new branch.","Chúng tôi vui mừng thông báo khai trương chi nhánh mới."],"Damaged":["/ˈdæm.ɪdʒd/","The package arrived damaged, so I asked for a replacement.","Kiện hàng đế chuyển, rất tiếc đã có một số sự cố kỹ thuật trong quá trình sản xuất dẫn đến một số sản phẩm bị hư hỏng. Chúng tôi biết ông là một trong những đối tác lớn nhất của chúng tôi tại Hàn Quốc, và chúng tôi sẽ giảm 15% giá trị đơn hàng này để ghi nhận sự rộng lượng của ông. Chúng tôi cũng vui mừng thông báo rằng chúng tôi đã hợp tác với công ty ông được 10 năm; chúng tôi xin gửi ông một phiếu quà tặng để nhận miễn phí một sản phẩm bất kỳ tại các cửa hàng trong chuỗi của chúng tôi, như một món quà thể hiện lòng cảm kích. Sự tin tưởng của ông vào sản phẩm của chúng tôi là vô giá, và chúng tôi biết ơn sự hợp tác của ông trong suốt thập kỷ qua. Sau sự bất tiện này, nếu có bất kỳ sản phẩm lỗi nào, chúng tôi sẽ thay thế và không tính chúng vào hóa đơn. Ông có thể in mẫu đơn đính kèm, điền thông tin và mang đến bất kỳ cửa hàng Samsung nào để nhận sản phẩm miễn phí.",[["shipment","n","lô hàng, việc giao hàng"],["manufacturing process","n","quy trình sản xuất"],["partner","n","đối tác"],["generosity","n","sự rộng lượng"],["inconvenience","n","sự bất tiện"],["replace","v","thay thế"]]],"1":["Trân trọng,\nJacob Dean",[["regards","n","lời chào cuối thư (trân trọng)"]]]}},"gap":{"1":{"1":[["return","receipt"],"Tôi muốn trả lại sợi cáp sạc điện thoại này, nhưng tôi không tìm thấy biên lai."],"2":[[],"Cho tôi hỏi vì sao anh trả lại nó ạ?"],"3":[["phone"],"Nó không dùng được, không sạc được điện thoại của tôi."],"4":[["refund","manager / supervisor"],"Tôi là nhân viên bán hàng mới và chưa được học cách hoàn tiền cho món hàng không có biên lai... À, quản lý của tôi đến rồi, chị ấy sẽ xử lý được."],"5":[[],"Chào Tina, em cần giúp gì à?"],"6":[["defective"],"Vâng, vị khách này muốn trả lại một sản phẩm bị lỗi nhưng không có biên lai."],"7":[["process","credit card"],"Được rồi, tôi có thể xử lý việc trả hàng, thưa anh. Tôi chỉ cần xem chiếc thẻ tín dụng anh đã dùng để mua món hàng này."],"8":[[],"Cảm ơn. Đây ạ."],"10":[["office / offices","apologize","inconvenience","e-mail / email","appropriate / qualified"],"Xin chào, cảm ơn quý khách đã gọi đến văn phòng Pineville Legal Associates. Văn phòng chúng tôi hiện đang đóng cửa để sửa chữa từ ngày 12 đến ngày 19 tháng Sáu. Chúng tôi xin lỗi về mọi bất tiện mà việc đóng cửa này có thể gây ra. Nếu quý khách cần hỗ trợ pháp lý, vui lòng gửi email cho quản trị viên văn phòng, Jordan Smith, theo địa chỉ jsmith@pmevillelegal.com. Anh ấy sẽ chuyển yêu cầu của quý khách đến luật sư phù hợp nhất trong nhóm. Chúc quý khách một ngày tốt lành."]}}},"5":{"vocab":{"Limited":["/ˈlɪm.ɪ.t̬ɪd/","This offer is available for a limited time only.","Ưu đãi này chỉ áp dụng trong thời gian có hạn."],"Markdown":["/ˈmɑːrk.daʊn/","Shoppers can find markdowns of up to 40 percent on summer clothing.","Người mua có thể tìm thấy quần áo mùa hè giảm giá đến 40%."],"Office supplies":["/ˈɑː.fɪs səˌplaɪz/","Please order office supplies through the online system.","Vui lòng đặt văn phòng phẩm qua hệ thống trực tuyến."],"Promotional":["/prəˈmoʊ.ʃən.əl/","Enter the promotional code at checkout to get 15 percent off.","Nhập mã khuyến mãi khi thanh toán để được giảm 15%."],"Redeem":["/rɪˈdiːm/","Coupons can be redeemed at any of our locations.","Phiếu giảm giá có thể được sử dụng tại bất kỳ chi nhánh nào của chúng tôi."],"Reduce rate":["/rɪˈduːst reɪt/","Students can join the gym at a reduced rate.","Sinh viên có thể đăng ký phòng tập với mức giá ưu đãi."],"Renew":["/rɪˈnuː/","Remember to renew your membership before it expires.","Nhớ gia hạn thẻ thành viên trước khi hết hạn."],"Retailer":["/ˈriː.teɪ.lɚ/","The product is sold through online retailers.","Sản phẩm được bán qua các nhà bán lẻ trực tuyến."],"Souvenir":["/ˌsuː.vəˈnɪr/","The museum shop sells postcards and other souvenirs.","Cửa hàng của bảo tàng bán bưu thiếp và các món quà lưu niệm khác."],"Special offer":["/ˈspeʃ.əl ˈɑː.fɚ/","This week's special offer: buy one pizza, get one free.","Ưu đãi đặc biệt tuần này: mua một bánh pizza, tặng một bánh."],"Store credit":["/stɔːr ˈkred.ɪt/","I  của chúng tôi."]}}},"6":{"vocab":{"Approval":["/əˈpruː.vəl/","The project needs approval from the board of directors.","Dự án cần được hội đồng quản trị phê duyệt."],"Bid":["/bɪd/","Three companies submitted bids for the construction contract.","Ba công ty đã nộp hồ sơ dự thầu cho hợp đồng xây dựng."],"Boost":["/buːst/","The new advertising campaign boosted sales by 20 percent.","Chiến dịch quảng cáo mới đã đẩy doanh số tăng 20%."],"Distribution":["/ˌdɪs.trɪˈbjuː.ʃən/","The company opened a new distribution center in Texas.","Công ty đã mở một trung tâm phân phối mới ở Texas."],"Endorsement":["/ɪnˈdɔːrs.mənt/","The product received an endorsement from a famous athlete.","Sản phẩm được một vận động viên nổi tiếng đứng ra bảo chứng."],"Expansion":["/ɪkˈspæn.ʃən/","The expansion of the factory will create 200 new jobs.","Việc mở rộng nhà máy sẽ tạo ra 200 việc làm mới."],"Expense":["/ɪkˈspens/","Travel expenses will be reimbursed by the company.","Chi phí đi lại sẽ được công ty hoàn trả."],"Facilitate":["/fəˈsɪl.ə.teɪt/","The new software will facilitate communication between departments.","Phần mềm mới sẽ giúp việc liên lạc giữa các phòng ban thuận tiện hơn."],"Feasible":["/ˈfiː.zə.bəl/","The engineers say the plan is technically feasible.","Các kỹ sư nói kế hoạch này khả thi về mặt kỹ thuật."],"Figure":["/ˈfɪɡ.jɚ/","The sales figures for March are higher than expected.","Số liệu bán hàng tháng Ba cao hơn dự kiến."],"License":["/ˈlaɪ.səns/","You need a license to sell food on the street.","Bạn cần có giấy phép để bán đồ ăn trên đường phố."],"Market share":["/ˈmɑːr.kɪt ʃer/","The company aims to increase its market share in Asia.","Công ty đặt mục tiêu tăng thị phần tại châu Á."],"Profitable":["/ˈprɑː.fɪ.t̬ə.bəl/","The new branch became profitable in its first year.","Chi nhánh mới đã có lãi ngay trong năm đầu tiên."],"Release":["/rɪˈliːs/","The company will release its new smartphone in October.","Công ty sẽ ra mắt điện thoại thông minh mới vào tháng Mười."]},"usage"   },
  getAllReviewItems() {
    const rev = this.get('review', { items: [] });
    return (rev && Array.isArray(rev.items)) ? rev.items : [];
  },
  isStarred(w) {
    const target = norm(cleanWord(w));
    const list = this.getReviewList();
    return list.some(x => norm(cleanWord(x.w)) === target);
  },
  addReviewWord(v, topicId, source = 'manual') {
    const rev = this.get('review', { items: [] });
    const items = rev.items || [];
    const target = norm(cleanWord(v.w));
    const existing = items.find(x => norm(cleanWord(x.w)) === target);
    if (existing) {
      existing.deleted = false;
      existing.updatedAt = Date.now();
      if (!existing.vi && v.vi) existing.vi = v.vi;
      if (!existing.pos && v.pos) existing.pos = v.pos;
      if (topicId) existing.topicId = topicId;
    } else {
      items.push({
        w: v.w,
        pos: v.pos || '',
        vi: v.vi || '',
        topicId: topicId || S.t,
        addedAt: Date.now(),
        updatedAt: Date.now(),
        source,
        deleted: false
      });
    }
    this.set('review', { items, updatedAt: Date.now() });
    updateReviewBadge();
  },
  removeReviewWord(w) {
    const rev = this.get('review', { items: [] });
    const items = rev.items || [];
    const target = norm(cleanWord(w));
    const existing = items.find(x => norm(cleanWord(x.w)) === target);
    if (existing) {
      existing.deleted = true;
      existing.updatedAt = Date.now();
      this.set('review', { items, updatedAt: Date.now() });
      updateReviewBadge();
    }
  },
  toggleReviewWord(v, topicId) {
    if (this.isStarred(v.w)) {
      this.removeReviewWord(v.w);
    } else {
      this.addReviewWord(v, topicId, 'star');
    }
  }
};

function splitTitle(t){
  if (t && TOPIC_TITLES_EN[t.id]) return TOPIC_TITLES_EN[t.id];
  const parts = String(t && t.title || '').split(/\s*[-–]\s+|\s+[-–]\s*|(?<=\S)-\s/).map(s=>s.trim()).filter(Boolean);
  const cap = s => { const l = s.toLowerCase(); return l.charAt(0).toUpperCase() + l.slice(1); };
  const capVi = s => { const l = s.toLocaleLowerCase('vi'); return l.charAt(0).toLocaleUpperCase('vi') + l.slice(1); };
  const vn = parts.filter(p => VN.test(p)), en = parts.filter(p => !VN.test(p));
  const enTitle = en.length ? en.map(cap).join(' – ') : cap(parts[0] || 'Topic');
  const vnTitle = vn.length ? vn.map(capVi).join(' – ') : '';
  return { main: enTitle, sub: vnTitle };
}

  if (!words.length) return s => esc(s);
  const parts = words.map(w => {
    const ws = w.toLowerCase().split(' ');
    if (ws.length > 1) return ws.map(x => x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+');
    const stem = ws[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/e$/,'');
    return stem + '(?:e|es|s|ed|d|ing|ion|ation|ations|ions|ment|ments|led|ling|lation|ies|ied|y)?';
  });
  const re = new RegExp('\\b(' + parts.join('|') + ')\\b', 'gi');
  return s => esc(s).replace(re, m => '<mark>' + m + '</mark>');
}

    if (!ttsAudioPlayer) {
      ttsAudioPlayer = new Audio();
    }
    ttsAudioPlayer.pause();
    ttsAudioPlayer.src = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(clean) + '&type=2';

    ttsAudioPlayer.onended = () => { if (onDone) onDone(); };
    ttsAudioPlayer.onerror = (e) => {
      console.warn('Audio MP3 error, fallback to SpeechSynthesis:', e);
      fallbackBrowserSpeech(clean, onDone);
    };

    const p = ttsAudioPlayer.play();
    if (p !== undefined) {
      p.catch(() => {
        fallbackBrowserSpeech(clean, onDone);
      });
      return;
    }
  } catch(e) {
    fallbackBrowserSpeech(clean, onDone);
  }
}

function fallbackBrowserSpeech(clean, onDone) {
  try {
    const s = window.speechSynthesis;
    if (!s) { if (onDone) onDone(); return; }
    s.cancel();
    if (s.paused) s.resume();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'en-US';
    u.rate = 0.95;
    window._curUtterance = u;
    u.onend = () => { window._curUtterance = null; if (onDone) onDone(); };
    u.onerror = () => { window._curUtterance = null; if (onDone) onDone(); };
    s.speak(u);
  } catch(err) {
    if (onDone) onDone();
  }
}

// ---------- State & Routing ----------
const PARTS = [
  { k:0, name:'Smart Study', short:'Study' },
  { k:1, name:'Vocabulary', short:'Vocab' },
  { k:2, name:'Collocations & Notes', short:'Notes' },
  { k:3, name:'Translation', short:'Translate' },
  { k:4, name:'Fill in Blanks', short:'Listening' }
];
let S = { t:1, p:1, sub:'list' };
let currentRoute = 'topic'; // 'topic' | 'review' | 'leaderboard' | 'profile' | 'admin'

function readHash(){
  const h = location.hash || '';
  if (h === '#topic-0' || h === '#t0' || h === '#t0-p1' || h === '#hub') { currentRoute = 'topic0'; return true; }
  if (h === '#pronun' || h === '#pronunciation' || h === '#phat-am' || h === '#speaking') { currentRoute = 'pronun'; return true; }
  if (h === '#practice' || h.startsWith('#practice-')) { currentRoute = 'practice'; return true; }
  if (h === '#grammar' || h.startsWith('#grammar-')) { currentRoute = 'grammar'; return true; }
  if (h === '#review') { currentRoute = 'review'; return true; }
  if (h === '#leaderboard') { currentRoute = 'leaderboard'; return true; }
  if (h === '#profile') { currentRoute = 'profile'; return true; }
  if (h === '#admin') { currentRoute = 'admin'; return true; }
  const m = h.match(/^#t(\d+)-p([0-4])$/);
  if (m && TOPICS[+m[1]-1]) {
    currentRoute = 'topic';
    S.t = +m[1]; S.p = +m[2];
    return true;
  }
  return false;
}

function go(t, p){
  currentRoute = 'topic';
  const moved = t !== S.t || p !== S.p;
  S.t = t; S.p = p; if (p === 1) S.sub = 'list';
  const h = `#t${t}-p${p}`;
  if (location.hash !== h) { try { history.replaceState(null,'',h); } catch(e){ location.hash = h; } }
  render();
  if (moved) { try { window.scrollTo({ top: 0 }); } catch(e){ window.scrollTo(0,0); } }
}

function goTo(route){
  currentRoute = route;
  const h = '#' + route;
  if (location.hash !== h) { try { history.replaceState(null,'',h); } catch(e){ location.hash = h; } }
  render();
  try { window.scrollTo({ top: 0 }); } catch(e){ window.scrollTo(0,0); }
}

function savePendingDirtyQueue() {
  if (!currentUid || currentUid === 'guest') return;
  try {
    if (dirtyKeys.size > 0) {
      localStorage.setItem(`toeic45:${currentUid}:_pending_dirty`, JSON.stringify(Array.from(dirtyKeys)));
    } else {
      localStorage.removeItem(`toeic45:${currentUid}:_pending_dirty`);
    }
  } catch (e) {}
}

function loadPendingDirtyQueue() {
  dirtyKeys.clear();
  if (!currentUid || currentUid === 'guest') return;
  try {
    const raw = localStorage.getItem(`toeic45:${currentUid}:_pending_dirty`);
    if (raw) {
      const arr = JSON.parse(raw);
      if (Array.isArray(arr)) arr.forEach(k => { if (typeof k === 'string') dirtyKeys.add(k); });
    }
  } catch (e) {}
}

function computeLocalUserSummary() {
  let totalBest = 0;
  let completedCount = 0;
  let topicsAttempted = 0;
  TOPICS.forEach(t => {
    const best = store.get('best:' + t.id, null);
    const completedManual = store.get('completedManual:' + t.id, false);
    if (best != null && typeof best === 'number') {
      totalBest += best;
      topicsAttempted++;
    } else if (completedManual) {
      topicsAttempted++;
    }
    if (completedManual || (best != null && best >= 80)) completedCount++;
  });

  let pronunUnitsDone = 0;
  let pronunExChecked = 0;
  let pronunExFilled = 0;
  try {
    const prefix = `toeic45:${currentUid}:pronun_ex:`;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(prefix)) {
        const uObj = JSON.parse(localStorage.getItem(k) || '{}');
        const exVals = Object.values(uObj || {});
        let unitHasAny = false;
        exVals.forEach(ex => {
          if (!ex || typeof ex !== 'object') return;
          const ansCount = Object.values(ex.answers || {}).filter(v => String(v || '').trim() !== '').length;
          if (ansCount > 0) { pronunExFilled++; unitHasAny = true; }
          if (ex.checked) { pronunExChecked++; unitHasAny = true; }
        });
        if (unitHasAny) pronunUnitsDone++;
      }
    }
  } catch (e) {}

  return {
    totalBest,
    completedCount,
    topicsAttempted,
    pronunUnitsDone,
    pronunExChecked,
    pronunExFilled
  };
}

function markDirty(k) {
  if (LOCAL_ONLY_KEYS.test(k)) return;
  if (!currentUser || currentUid === 'guest') return;
  dirtyKeys.add(k);
  savePendingDirtyQueue();
  setSyncStatusUI(navigator.onLine ? 'Saved locally · Syncing…' : 'Saved locally (Offline)', '');
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(flushDirtyKeys, 2500);
}

async function flushDirtyKeys() {
  if (!currentUser || currentUid === 'guest' || !fbDb || dirtyKeys.size === 0 || isFlushingDirty) return;
  if (!navigator.onLine) {
    setSyncStatusUI('Saved locally (Offline)', '');
    return;
  }
  isFlushingDirty = true;
  const keys = Array.from(dirtyKeys);
  dirtyKeys.clear();
  try {
    const answerUpdates = {};
    const progressUpdates = {};
    const pronunUpdates = {};
    const practiceUpdates = {};
    const grammarUpdates = {};
    let reviewUpdate = null;

    for (const k of keys) {
      const val = store.get(k);
      if (k.startsWith('tr:') || k.startsWith('g-') || k.startsWith('gt-')) {
        const parts = k.startsWith('tr:') ? k.split(':') : k.split('-');
        const tId = parts[1];
        if (tId) {
          answerUpdates[tId] = answerUpdates[tId] || {};
          answerUpdates[tId][k] = val;
        }
      } else if (k.startsWith('pronun_ex:')) {
        const uId = k.slice('pronun_ex:'.length);
        if (uId) pronunUpdates[uId] = val || {};
      } else if (k.startsWith('practice_ex:')) {
        const exId = k.slice('practice_ex:'.length);
        if (exId) practiceUpdates[exId] = val || {};
      } else if (k.startsWith('grammar_ex:')) {
        const topId = k.slice('grammar_ex:'.length);
        if (topId) grammarUpdates[topId] = val || {};
      } else if (k.startsWith('completedManual:')) {
        const tId = k.split(':')[1];
        if (tId) {
          progressUpdates[tId] = progressUpdates[tId] || {};
          progressUpdates[tId].completedManual = Boolean(val);
        }
      } else if (k.startsWith('best:')) {
        const tId = k.split(':')[1];
        if (tId) {
          progressUpdates[tId] = progressUpdates[tId] || {};
          progressUpdates[tId].best = Number(val) || 0;
          progressUpdates[tId].completed = (Number(val) || 0) >= 80;
        }
      } else if (k.startsWith('p0_best:')) {
        const tId = k.split(':')[1];
        if (tId) {
          progressUpdates[tId] = progressUpdates[tId] || {};
          const curBest = Number(progressUpdates[tId].best) || Number(store.get('best:' + tId, 0)) || 0;
          progressUpdates[tId].best = Math.max(Number(val) || 0, curBest);
          progressUpdates[tId].completed = progressUpdates[tId].best >= 80;
        }
      } else if (k.startsWith('wf-')) {
        const parts = k.split('-');
        const tId = parts[1];
        if (tId) {
          answerUpdates[tId] = answerUpdates[tId] || {};
          answerUpdates[tId][k] = val;
        }
      } else if (k === 'review') {
        reviewUpdate = val;
      }
    }

    const batch = firestoreModules.writeBatch(fbDb);
    let count = 0;

    for (const [tId, data] of Object.entries(answerUpdates)) {
      const ref = firestoreModules.doc(fbDb, 'users', currentUid, 'answers', tId);
      batch.set(ref, { data, updatedAt: firestoreModules.serverTimestamp() }, { merge: true });
      count++;
    }

    for (const [uId, exMap] of Object.entries(pronunUpdates)) {
      const ref = firestoreModules.doc(fbDb, 'users', currentUid, 'answers', 'pronun_' + uId);
      batch.set(ref, { unitId: Number(uId), exercises: exMap, updatedAt: firestoreModules.serverTimestamp() }, { merge: true });
      count++;
    }

    for (const [exId, pState] of Object.entries(practiceUpdates)) {
      const ref = firestoreModules.doc(fbDb, 'users', currentUid, 'answers', 'practice_' + exId);
      batch.set(ref, { exId, data: pState, updatedAt: firestoreModules.serverTimestamp() }, { merge: true });
      count++;
    }

    for (const [topId, gState] of Object.entries(grammarUpdates)) {
      const ref = firestoreModules.doc(fbDb, 'users', currentUid, 'answers', 'grammar_' + topId);
      batch.set(ref, { topicId: topId, data: gState, updatedAt: firestoreModules.serverTimestamp() }, { merge: true });
      count++;
    }

    for (const [tId, prog] of Object.entries(progressUpdates)) {
      const ref = firestoreModules.doc(fbDb, 'users', currentUid, 'progress', tId);
      batch.set(ref, { ...prog, updatedAt: firestoreModules.serverTimestamp() }, { merge: true });
      count++;
    }

    if (reviewUpdate) {
      const ref = firestoreModules.doc(fbDb, 'users', currentUid, 'meta', 'review');
      batch.set(ref, { items: reviewUpdate.items || [], updatedAt: firestoreModules.serverTimestamp() }, { merge: true });
      count++;
    }

    if (count > 0) {
      // Lưu luôn bản tóm tắt tiến độ (1 document duy nhất) để trang Giáo viên đọc siêu nhanh & tiết kiệm quota
      const summary = computeLocalUserSummary();
      const summaryRef = firestoreModules.doc(fbDb, 'users', currentUid, 'meta', 'summary');
      batch.set(summaryRef, { ...summary, updatedAt: firestoreModules.serverTimestamp() }, { merge: true });

      await batch.commit();
      savePendingDirtyQueue();
      const nowStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      setSyncStatusUI('Synced ' + nowStr, '');
      if (Object.keys(progressUpdates).length > 0) {
        syncLeaderboardFromClient(currentUid);
      }
    } else {
      savePendingDirtyQueue();
    }
  } catch (err) {
    console.error('Lỗi khi đồng bộ dữ liệu lên Firestore:', err);
    keys.forEach(k => dirtyKeys.add(k));
    savePendingDirtyQueue();
    setSyncStatusUI('Saved locally · Waiting for network…', '');
  } finally {
    isFlushingDirty = false;
    if (dirtyKeys.size > 0 && navigator.onLine) {
      if (debounceTimer) clearTimeout(debounceTimer);
      debounceTimer = setTimeout(flushDirtyKeys, 4000);
    }
  }
}

async function syncLeaderboardFromClient(uid) {
  if (!fbDb || !uid || !currentUser || currentUser.uid !== uid || !firestoreModules) return;
  try {
    const userDoc = await firestoreModules.getDoc(firestoreModules.doc(fbDb, 'users', uid));
    const userData = userDoc.data() || {};
    if (userData.hidden === true) {
      await firestoreModules.deleteDoc(firestoreModules.doc(fbDb, 'leaderboard', uid));
      return;
    }
    let totalBest = 0;
    let completedCount = 0;
    TOPICS.forEach(t => {
      const best = store.get('best:' + t.id, null);
      const completedManual = store.get('completedManual:' + t.id, false);
      if (best != null && typeof best === 'number') totalBest += best;
      if (completedManual || (best != null && best >= 80)) completedCount++;
    });

    await firestoreModules.setDoc(firestoreModules.doc(fbDb, 'leaderboard', uid), {
      uid,
      displayName: userData.displayName || currentUser.displayName || 'Learner',
      photoURL: userData.photoURL || currentUser.photoURL || '',
      totalBest,
      completedCount,
      updatedAt: firestoreModules.serverTimestamp()
    });
  } catch(e) {
    console.warn('Lỗi đồng bộ leaderboard:', e);
  }
}

async function initFirebase() {
  if (!isConfigured) return;
  try {
    const [appMod, authMod, fsMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js')
    ]);

    authModules = authMod;
    firestoreModules = fsMod;

    fbApp = appMod.initializeApp(firebaseConfig);
    fbAuth = authMod.getAuth(fbApp);
    fbDb = fsMod.getFirestore(fbApp);

    const authBox = $('#auth-box');
    if (authBox) authBox.hidden = false;

    try {
      await authMod.getRedirectResult(fbAuth);
    } catch (e) {}

    authMod.onAuthStateChanged(fbAuth, async (user) => {
      currentUser = user;
      if (user) {
        store.setUid(user.uid);
        await ensureUserProfile(user);
        await checkAdminStatus(user.uid);
        renderAuthBox();
        // Auto-merge any local guest data into user account so work is never lost
        if (hasLocalGuestData()) {
          await executeMerge('merge', user.uid);
        } else {
          await downloadCloudData(user.uid);
        }
        if (dirtyKeys.size > 0) {
          await flushDirtyKeys();
        }
      } else {
        store.setUid('guest');
        isAdminUser = false;
        isTeacherUser = false;
        renderAuthBox();
        const sAdmin = $('#snav-admin');
        if (sAdmin) sAdmin.hidden = true;
      }
      renderSide();
      if (currentRoute === 'topic' && !isUserActivelyTyping()) render();
      if (currentRoute === 'pronun' && !isUserActivelyTyping()) renderPronunciation($('#panel'));
      if (currentRoute === 'leaderboard') renderLeaderboard($('#panel'));
      if (currentRoute === 'profile') renderProfile($('#panel'));
      if (currentRoute === 'admin') renderAdmin($('#panel'));
    });
  } catch (err) {
    console.warn('Không thể khởi tạo Firebase (có thể do offline hoặc lỗi mạng):', err);
  }
}

async function ensureUserProfile(user) {
  if (!fbDb || !user) return;
  try {
    const userRef = firestoreModules.doc(fbDb, 'users', user.uid);
    const snap = await firestoreModules.getDoc(userRef);
    if (!snap.exists()) {
      await firestoreModules.setDoc(userRef, {
        displayName: user.displayName || 'Learner',
        email: user.email || '',
        photoURL: user.photoURL || '',
        hidden: false,
        createdAt: firestoreModules.serverTimestamp(),
        updatedAt: firestoreModules.serverTimestamp()
      });
    } else {
      const d = snap.data();
      const updates = {};
      if (user.displayName && d.displayName !== user.displayName) updates.displayName = user.displayName;
      if (user.photoURL && d.photoURL !== user.photoURL) updates.photoURL = user.photoURL;
      if (user.email && d.email !== user.email) updates.email = user.email;
      if (Object.keys(updates).length > 0) {
        updates.updatedAt = firestoreModules.serverTimestamp();
        await firestoreModules.setDoc(userRef, updates, { merge: true });
      }
    }
  } catch (e) {}
}

async function checkAdminStatus(uid) {
  if (!fbDb || !uid) { isAdminUser = false; isTeacherUser = false; return; }
  try {
    const [adminDoc, teacherDoc] = await Promise.all([
      firestoreModules.getDoc(firestoreModules.doc(fbDb, 'admins', uid)).catch(() => null),
      firestoreModules.getDoc(firestoreModules.doc(fbDb, 'teachers', uid)).catch(() => null)
    ]);
    isAdminUser = Boolean(adminDoc && adminDoc.exists());
    isTeacherUser = isAdminUser || Boolean(teacherDoc && teacherDoc.exists());
    const sAdmin = $('#snav-admin');
    if (sAdmin) sAdmin.hidden = !isTeacherUser;
  } catch (e) {
    isAdminUser = false;
    isTeacherUser = false;
  }
}

function hasLocalGuestData() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('toeic45:guest:')) {
        const sub = k.slice(14);
        if (!LOCAL_ONLY_KEYS.test(sub)) return true;
      }
    }
  } catch (e) {}
  return false;
}

function mergePronunUnitEx(localUnit, cloudUnit) {
  const out = {};
  const allExIds = new Set([
    ...Object.keys(cloudUnit || {}),
    ...Object.keys(localUnit || {})
  ]);
  allExIds.forEach(exId => {
    const loc = (localUnit && localUnit[exId]) || null;
    const cld = (cloudUnit && cloudUnit[exId]) || null;
    if (!loc) { out[exId] = cld; return; }
    if (!cld) { out[exId] = loc; return; }
    const locTs = Number(loc.updatedAt) || 0;
    const cldTs = Number(cld.updatedAt) || 0;
    const mergedAnswers = {};
    const ansKeys = new Set([
      ...Object.keys(cld.answers || {}),
      ...Object.keys(loc.answers || {})
    ]);
    ansKeys.forEach(ak => {
      const lv = (loc.answers || {})[ak];
      const cv = (cld.answers || {})[ak];
      const lEmpty = lv == null || String(lv).trim() === '';
      const cEmpty = cv == null || String(cv).trim() === '';
      if (!lEmpty && cEmpty) mergedAnswers[ak] = lv;
      else if (lEmpty && !cEmpty) mergedAnswers[ak] = cv;
      else if (!lEmpty && !cEmpty) mergedAnswers[ak] = locTs >= cldTs ? lv : cv;
    });
    out[exId] = {
      answers: mergedAnswers,
      checked: Boolean(loc.checked || cld.checked),
      updatedAt: Math.max(locTs, cldTs) || Date.now()
    };
  });
  return out;
}

async function downloadCloudData(uid) {
  if (!fbDb || !uid || !firestoreModules) return;
  try {
    lastCloudPullAt = Date.now();
    // 1. Đồng bộ điểm trắc nghiệm & trạng thái hoàn thành
    const progSnap = await firestoreModules.getDocs(firestoreModules.collection(fbDb, 'users', uid, 'progress'));
    progSnap.forEach(d => {
      const data = d.data();
      const tId = d.id;
      if (typeof data.best === 'number') {
        const localBest = Number(store.get('best:' + tId, 0)) || 0;
        const higherBest = Math.max(data.best, localBest);
        localStorage.setItem(`toeic45:${uid}:best:${tId}`, JSON.stringify(higherBest));
      }
      if (data.completed || data.completedManual) {
        localStorage.setItem(`toeic45:${uid}:completedManual:${tId}`, JSON.stringify(true));
      }
    });

    // 2. Đồng bộ các bài làm (TOEIC dịch câu, điền từ, dạng từ + Bài tập Phát âm Cambridge)
    const ansSnap = await firestoreModules.getDocs(firestoreModules.collection(fbDb, 'users', uid, 'answers'));
    ansSnap.forEach(d => {
      const docData = d.data() || {};
      // 2a. Bài tập Phát âm Cambridge (pronun_{unitId})
      if (d.id.startsWith('pronun_')) {
        const uId = d.id.slice('pronun_'.length);
        const storeKey = 'pronun_ex:' + uId;
        if (dirtyKeys.has(storeKey)) return; // Không bao giờ ghi đè dữ liệu cục bộ chưa đẩy xong
        const cloudEx = docData.exercises || {};
        const localEx = store.get(storeKey, {});
        const merged = mergePronunUnitEx(localEx, cloudEx);
        localStorage.setItem(`toeic45:${uid}:${storeKey}`, JSON.stringify(merged));
        if (typeof unitExState === 'object' && unitExState !== null) {
          unitExState[uId] = merged;
        }
        return;
      }

      // 2b. Bài tập Luyện dịch Practice (practice_{exId})
      if (d.id.startsWith('practice_')) {
        const exId = d.id.slice('practice_'.length);
        const storeKey = 'practice_ex:' + exId;
        if (dirtyKeys.has(storeKey)) return;
        const cloudData = docData.data || {};
        const localData = store.get(storeKey, {});
        const mergedAnswers = { ...(cloudData.answers || {}) };
        Object.entries(localData.answers || {}).forEach(([k, v]) => {
          if (v && String(v).trim() !== '') mergedAnswers[k] = v;
        });
        const merged = {
          answers: mergedAnswers,
          checked: { ...(cloudData.checked || {}), ...(localData.checked || {}) },
          eval: { ...(cloudData.eval || {}), ...(localData.eval || {}) },
          updatedAt: Math.max(Number(localData.updatedAt)||0, Number(cloudData.updatedAt)||0) || Date.now()
        };
        localStorage.setItem(`toeic45:${uid}:${storeKey}`, JSON.stringify(merged));
        if (typeof resetPracticeExState === 'function') resetPracticeExState();
        return;
      }

      // 2c. Bài tập Ngữ pháp Grammar (grammar_{topicId})
      if (d.id.startsWith('grammar_')) {
        const topId = d.id.slice('grammar_'.length);
        const storeKey = 'grammar_ex:' + topId;
        if (dirtyKeys.has(storeKey)) return;
        const cloudData = docData.data || {};
        const localData = store.get(storeKey, {});
        const mergedAnswers = { ...(cloudData.answers || {}) };
        Object.entries(localData.answers || {}).forEach(([k, v]) => {
          if (v && String(v).trim() !== '') mergedAnswers[k] = v;
        });
        const merged = {
          answers: mergedAnswers,
          notes: { ...(cloudData.notes || {}), ...(localData.notes || {}) },
          updatedAt: Math.max(Number(localData.updatedAt)||0, Number(cloudData.updatedAt)||0) || Date.now()
        };
        localStorage.setItem(`toeic45:${uid}:${storeKey}`, JSON.stringify(merged));
        if (typeof resetGrammarTopicState === 'function') resetGrammarTopicState();
        return;
      }

      // 2d. Bài tập TOEIC theo chủ đề
      const answers = docData.data || {};
      Object.entries(answers).forEach(([k, val]) => {
        if (dirtyKeys.has(k)) return; // Bảo vệ câu trả lời người dùng vừa gõ chưa kịp đẩy
        const localVal = store.get(k, null);
        const localEmpty = localVal == null || (typeof localVal === 'string' && localVal.trim() === '');
        const cloudEmpty = val == null || (typeof val === 'string' && val.trim() === '');
        if (localEmpty && !cloudEmpty) {
          localStorage.setItem(`toeic45:${uid}:${k}`, JSON.stringify(val));
        } else if (val && typeof val === 'object' && localVal && typeof localVal === 'object') {
          localStorage.setItem(`toeic45:${uid}:${k}`, JSON.stringify({ ...val, ...localVal }));
        }
        // Nếu cả local và cloud đều có chữ, ưu tiên giữ local (không ghi đè làm mất bài đang điền)
      });
    });

    // 3. Đồng bộ danh sách từ khó (gộp chung cả 2 thiết bị)
    const revDoc = await firestoreModules.getDoc(firestoreModules.doc(fbDb, 'users', uid, 'meta', 'review'));
    if (revDoc.exists() && revDoc.data().items && !dirtyKeys.has('review')) {
      const cloudItems = revDoc.data().items || [];
      const localRev = store.get('review', { items: [] });
      const localItems = (localRev && Array.isArray(localRev.items)) ? localRev.items : [];
      const itemMap = new Map();
      localItems.forEach(it => { if (it && it.w) itemMap.set(norm(cleanWord(it.w)), it); });
      cloudItems.forEach(it => {
        if (it && it.w) {
          const key = norm(cleanWord(it.w));
          if (!itemMap.has(key)) {
            itemMap.set(key, it);
          } else {
            const existing = itemMap.get(key);
            if (existing.deleted && !it.deleted) itemMap.set(key, it);
          }
        }
      });
      localStorage.setItem(`toeic45:${uid}:review`, JSON.stringify({ items: Array.from(itemMap.values()) }));
      updateReviewBadge();
    }

    // Làm mới giao diện an toàn (KHÔNG render lại nếu người dùng đang gõ trong ô input/textarea)
    renderSide();
    if (!isUserActivelyTyping()) {
      if (currentRoute === 'topic') {
        render();
      } else if (currentRoute === 'topic0') {
        const p = $('#panel');
        if (p) renderTopic0(p);
      } else if (currentRoute === 'pronun') {
        const p = $('#panel');
        if (p) renderPronunciation(p);
      } else if (currentRoute === 'practice') {
        const p = $('#panel');
        if (p) renderPractice(p);
      } else if (currentRoute === 'grammar') {
        const p = $('#panel');
        if (p) renderGrammar(p);
      }
    }
  } catch (e) {
    console.error('Lỗi downloadCloudData:', e);
  }
}

let lastAutoSyncTime = 0;
async function autoSyncCloud(force = false) {
  if (!currentUser || currentUid === 'guest' || !fbDb) return;
  if (!force && isUserActivelyTyping()) return;
  const now = Date.now();
  if (!force && now - lastAutoSyncTime < CLOUD_PULL_COOLDOWN_MS) {
    // Nếu có dữ liệu cục bộ chưa đẩy thì chỉ đẩy lên, không tải lại toàn bộ cloud
    if (dirtyKeys.size > 0) await flushDirtyKeys();
    return;
  }
  lastAutoSyncTime = now;

  try {
    setSyncStatusUI('Syncing…', '');
    await flushDirtyKeys();
    await downloadCloudData(currentUser.uid);
    const nowStr = new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
    setSyncStatusUI('Synced ' + nowStr, '');
  } catch (e) {
    console.warn('Lỗi autoSyncCloud:', e);
  }
}

async function executeMerge(mode, uid) {
  const guestData = {};
  const guestPrefix = 'toeic45:guest:';
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(guestPrefix)) {
        const sub = k.slice(guestPrefix.length);
        guestData[sub] = JSON.parse(localStorage.getItem(k));
      }
    }
  } catch (e) {}

  if (mode === 'cloud') {
    await downloadCloudData(uid);
  } else if (mode === 'local') {
    Object.entries(guestData).forEach(([k, val]) => {
      store.set(k, val);
    });
    await flushDirtyKeys();
  } else if (mode === 'merge') {
    await downloadCloudData(uid);
    Object.entries(guestData).forEach(([k, val]) => {
      if (k.startsWith('best:')) {
        const currentBest = store.get(k, 0);
        store.set(k, Math.max(Number(val) || 0, currentBest));
      } else if (k.startsWith('completedManual:')) {
        if (val) store.set(k, true);
      } else if (k.startsWith('pronun_ex:')) {
        const currentPronun = store.get(k, {});
        store.set(k, mergePronunUnitEx(val || {}, currentPronun || {}));
      } else if (k.startsWith('practice_ex:')) {
        const currentData = store.get(k, {});
        const mergedAnswers = { ...((currentData && currentData.answers) || {}) };
        Object.entries((val && val.answers) || {}).forEach(([ak, av]) => {
          if (av && String(av).trim() !== '') mergedAnswers[ak] = av;
        });
        store.set(k, {
          answers: mergedAnswers,
          checked: { ...((val && val.checked) || {}), ...((currentData && currentData.checked) || {}) },
          eval: { ...((val && val.eval) || {}), ...((currentData && currentData.eval) || {}) },
          updatedAt: Date.now()
        });
      } else if (k.startsWith('grammar_ex:')) {
        const currentData = store.get(k, {});
        const mergedAnswers = { ...((currentData && currentData.answers) || {}) };
        Object.entries((val && val.answers) || {}).forEach(([ak, av]) => {
          if (av && String(av).trim() !== '') mergedAnswers[ak] = av;
        });
        store.set(k, {
          answers: mergedAnswers,
          notes: { ...((val && val.notes) || {}), ...((currentData && currentData.notes) || {}) },
          updatedAt: Date.now()
        });
      } else if (k === 'review') {
        const currentRev = store.get('review', { items: [] });
        const guestItems = (val && val.items) || [];
        const mergedMap = new Map();
        (currentRev.items || []).forEach(it => mergedMap.set(norm(cleanWord(it.w)), it));
        guestItems.forEach(it => {
          const key = norm(cleanWord(it.w));
          if (!mergedMap.has(key)) {
            mergedMap.set(key, it);
          } else {
            const cur = mergedMap.get(key);
            if ((it.updatedAt || 0) > (cur.updatedAt || 0)) {
              mergedMap.set(key, it);
            }
          }
        });
        store.set('review', { items: Array.from(mergedMap.values()), updatedAt: Date.now() });
      } else {
        const cur = store.get(k, null);
        if (cur == null || (typeof val === 'string' && val.trim().length > (cur ? String(cur).trim().length : 0))) {
          store.set(k, val);
        }
      }
    });
    await flushDirtyKeys();
  }

  try {
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(guestPrefix)) toRemove.push(k);
    }
    toRemove.forEach(k => localStorage.removeItem(k));
  } catch (e) {}

  store.set('synced_choice', true);
  render();
}
