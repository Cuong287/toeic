function openAuthModal(defaultTab = 'login') {
  if (!authModules || !fbAuth) {
    alert('Sign-in is currently disabled because Firebase is not configured.');
    return;
  }
  let tab = defaultTab;
  function getHtml() {
    return `
      <div class="modal-backdrop">
        <div class="modal-box">
          <button class="modal-close" aria-label="Close">✕</button>
          <div class="modal-tabs">
            <button class="modal-tab ${tab === 'login' ? 'active' : ''}" id="tab-login">Sign In</button>
            <button class="modal-tab ${tab === 'signup' ? 'active' : ''}" id="tab-signup">Register</button>
          </div>
          ${tab === 'login' ? `
            <form id="f-auth" autocomplete="on">
              <div class="form-grp">
                <label for="au-email">Email</label>
                <input class="form-input" id="au-email" type="email" required placeholder="name@example.com">
              </div>
              <div class="form-grp">
                <label for="au-pass">Password</label>
                <input class="form-input" id="au-pass" type="password" required placeholder="••••••••">
              </div>
              <div class="row between" style="margin-bottom:14px">
                <button class="btn primary" type="submit" style="flex:1">Sign In</button>
              </div>
              <div class="row" style="margin-bottom:14px;justify-content:center">
                <button type="button" class="btn ghost" id="au-forgot">Forgot password?</button>
              </div>
              <div class="side-sep"></div>
              <button type="button" class="btn" id="au-google" style="width:100%;display:flex;align-items:center;justify-content:center;gap:8px">
                <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                Sign in with Google
              </button>
            </form>
          ` : `
            <form id="f-auth" autocomplete="on">
              <div class="form-grp">
                <label for="au-name">Display Name</label>
                <input class="form-input" id="au-name" type="text" placeholder="John Doe">
              </div>
              <div class="form-grp">
                <label for="au-email">Email</label>
                <input class="form-input" id="au-email" type="email" required placeholder="name@example.com">
              </div>
              <div class="form-grp">
                <label for="au-pass">Password</label>
                <input class="form-input" id="au-pass" type="password" required minlength="6" placeholder="At least 6 characters">
              </div>
              <div class="form-grp">
                <label for="au-pass2">Confirm Password</label>
                <input class="form-input" id="au-pass2" type="password" required minlength="6" placeholder="••••••••">
              </div>
              <button class="btn primary" type="submit" style="width:100%;margin-top:6px">Create Account</button>
            </form>
          `}
          <div class="hint" style="margin-top:14px;font-size:12px;line-height:1.4">
            Note: Course instructors can review test results and exercise translations for academic support.
          </div>
        </div>
      </div>`;
  }

  function bindEvents() {
    const mc = $('#modal-container');
    mc.querySelector('#tab-login').onclick = () => { tab = 'login'; renderTab(); };
    mc.querySelector('#tab-signup').onclick = () => { tab = 'signup'; renderTab(); };

    const f = mc.querySelector('#f-auth');
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      const email = mc.querySelector('#au-email').value.trim();
      const pass = mc.querySelector('#au-pass').value;
      if (tab === 'login') {
        try {
          await authModules.signInWithEmailAndPassword(fbAuth, email, pass);
          closeModal();
        } catch (err) {
          alert('Sign-in error: ' + (err.code === 'auth/invalid-credential' ? 'Invalid email or password.' : err.message));
        }
      } else {
        const pass2 = mc.querySelector('#au-pass2').value;
        const name = mc.querySelector('#au-name').value.trim();
        if (pass !== pass2) {
          alert('Passwords do not match.');
          return;
        }
        try {
          const res = await authModules.createUserWithEmailAndPassword(fbAuth, email, pass);
          if (name) {
            await authModules.updateProfile(res.user, { displayName: name });
          }
          await authModules.sendEmailVerification(res.user);
          alert('Account created successfully! Please check your email to verify.');
          closeModal();
        } catch (err) {
          alert('Registration error: ' + err.message);
        }
      }
    };

    const gBtn = mc.querySelector('#au-google');
    if (gBtn) {
      gBtn.onclick = async () => {
        const provider = new authModules.GoogleAuthProvider();
        try {
          await authModules.signInWithPopup(fbAuth, provider);
          closeModal();
        } catch (err) {
          if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
            await authModules.signInWithRedirect(fbAuth, provider);
          } else if (err.code === 'auth/account-exists-with-different-credential') {
            alert('This email is already associated with another sign-in method. Please sign in using Email/Password.');
          } else {
            alert('Google Auth error: ' + err.message);
          }
        }
      };
    }

    const forgBtn = mc.querySelector('#au-forgot');
    if (forgBtn) {
      forgBtn.onclick = async () => {
        const email = prompt('Enter your email address to receive a password reset link:');
        if (email) {
          try {
            await authModules.sendPasswordResetEmail(fbAuth, email.trim());
            alert('Password reset link sent. Please check your inbox!');
          } catch (err) {
            alert('Error: ' + err.message);
          }
        }
      };
    }
  }

  function renderTab() {
    openModal(getHtml());
    bindEvents();
  }

  renderTab();
}

// ---------- Sidebar ----------
function renderSide(){
  const q = norm($('#search').value || '');
  const list = $('#tlist'); list.innerHTML = '';

  

  TOPICS.forEach(t => {
    const st = splitTitle(t);
    let hits = 0;
    if (q){
      const inTitle = norm(t.title).includes(q) || st.main.toLowerCase().includes(q) || (st.sub && st.sub.toLowerCase().includes(q));
      hits = t.vocab.filter(v => norm(v.w).includes(q) || v.vi.toLowerCase().includes(q)).length;
      if (!inTitle && !hits) return;
    }
    const best = store.get('best:' + t.id, null);
    const completedManual = store.get('completedManual:' + t.id, false);
    const isCompleted = completedManual || (best != null && best >= 80);
    const isCurrent = currentRoute === 'topic' && t.id === S.t;

    const li = document.createElement('li');
    li.innerHTML = `<a href="#t${t.id}-p1" ${isCurrent ? 'aria-current="true"' : ''} class="${isCompleted ? 'is-done' : ''}" title="${esc(st.main)}${st.sub ? ' · ' + esc(st.sub) : ''}"><span class="n">${String(t.id).padStart(2,'0')}</span><span class="nm">${isCompleted ? '<span class="done-check" title="Completed">✓</span> ' : ''}${esc(st.main)}</span>${hits ? `<span class="hit">${hits} words</span>` : (best != null ? `<span class="sc" title="Highest quiz score">${best}%</span>` : '<span></span>')}</a>`;
    li.querySelector('a').addEventListener('click', e => { e.preventDefault(); go(t.id, 1); window.scrollTo({top:0}); });
    list.appendChild(li);
  });
  const sel = $('#tselect');
  if (!sel.options.length) TOPICS.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = String(t.id).padStart(2,'0') + '. ' + splitTitle(t).main; sel.appendChild(o); });
  sel.value = S.t;

  const rItem = $('#snav-review');
  const prItem = $('#snav-pronun');
  if (prItem) prItem.setAttribute('aria-current', String(currentRoute === 'pronun'));
  const pracItem = $('#snav-practice');
  if (pracItem) pracItem.setAttribute('aria-current', String(currentRoute === 'practice'));
  const gramItem = $('#snav-grammar');
  if (gramItem) gramItem.setAttribute('aria-current', String(currentRoute === 'grammar'));
  if (rItem) rItem.setAttribute('aria-current', String(currentRoute === 'review'));
  const lItem = $('#snav-lb');
  if (lItem) lItem.setAttribute('aria-current', String(currentRoute === 'leaderboard'));
  const aItem = $('#snav-admin');
  if (aItem) aItem.setAttribute('aria-current', String(currentRoute === 'admin'));

  updateReviewBadge();
}

$('#search').addEventListener('input', renderSide);
$('#tselect').addEventListener('change', e => go(+e.target.value, 1));
$('#tprev').addEventListener('click', () => { if (S.t > 1) go(S.t - 1, S.p); });
$('#tnext').addEventListener('click', () => { if (S.t < TOPICS.length) go(S.t + 1, S.p); });

// ---------- Header & Tabs ----------
function renderHead(t){
  const st = splitTitle(t), e = enr(t.id);
  const nTr = t.sections.filter(s=>s.type!=='gaps').reduce((a,s)=>a+s.blocks.filter(b=>b.k!=='audio').length,0);
  const nAu = t.sections.filter(s=>s.type==='gaps').reduce((a,s)=>a+s.blocks.filter(b=>b.k==='audio').length,0);
  const best = store.get('best:' + t.id, null);
  const completedManual = store.get('completedManual:' + t.id, false);
  const isCompleted = completedManual || (best != null && best >= 80);

  $('#thead').innerHTML = `
    <div class="row between">
      <div class="eyebrow">Topic ${String(t.id).padStart(2,'0')} / ${TOPICS.length}</div>
      <button class="btn ${isCompleted ? 'completed-btn' : ''}" id="btn-toggle-comp" title="Click to toggle completed">
        ${isCompleted ? '✓ Completed' : 'Mark Completed'}
      </button>
    </div>
    <h1>${esc(st.main)}${st.sub?` <span class="en">${esc(st.sub)}</span>`:''}</h1>
    <div class="meta">
      <span>${t.vocab.length} words</span>
      <span>${t.notes.length} word family notes</span>
      ${nTr?`<span>${nTr} translation passages</span>`:''}
      ${nAu?`<span>${nAu} listening tracks</span>`:''}
      ${best != null ? `<span style="color:var(--good);font-weight:700">Highest Score: ${best}%</span>` : ''}
      ${e?'<span class="tag">Example sentences & reference translations</span>':''}
    </div>`;

  $('#btn-toggle-comp').onclick = () => {
    const nextVal = !completedManual;
    store.set('completedManual:' + t.id, nextVal);
    flushDirtyKeys();
    renderHead(t);
    renderSide();
  };

  const tabs = $('#tabs'); tabs.innerHTML = '';
  PARTS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'tab'; b.setAttribute('role','tab'); b.setAttribute('aria-selected', String(p.k===S.p));
    b.innerHTML = `<span class="k">${p.k}</span><span class="full">${p.name}</span><span class="short">${p.short}</span>`;
    b.addEventListener('click', () => go(S.t, p.k));
    tabs.appendChild(b);
  });
}

function getChapterAllWords(t) {
  const e = enr(t.id);
  const wordMap = new Map();

  // 1. Phần 1: Từ vựng chính
  (t.vocab || []).forEach(v => {
    if (!v.w || !v.vi) return;
    const clean = cleanWord(v.w);
    if (!clean) return;
    const k = clean.toLowerCase();
    wordMap.set(k, {
      ...v,
      w: clean,
      topicId: t.id,
      topicTitle: splitTitle(t).main,
      source: 'Part 1',
      sourceFull: 'Part 1: Core Vocabulary',
      part: 1
    });
  });

  // 2. Phần 2: Ghi chú họ từ, đồng nghĩa
  (t.notes || []).forEach(line => {
    let lineVi = '';
    const colonIdx = line.indexOf(':');
    if (colonIdx !== -1) {
      lineVi = line.slice(colonIdx + 1).trim();
    }
    const leftPart = line.split(/[:;]/)[0];
    const toks = leftPart.split(/\s*(?:->|→|=|~|><|,)\s*/);
    toks.forEach(tk => {
      let raw = cleanWord(tk);
      raw = raw.replace(/^\d+[\.\)]\s*/, '').trim();
      if (!raw || raw.length < 2 || raw.split(/\s+/).length > 4) return;
      const k = raw.toLowerCase();
      if (wordMap.has(k)) return;

      let pos = 'họ từ', vi = lineVi;
      if (CHAPTER_VOCAB_DICT[k]) {
        pos = CHAPTER_VOCAB_DICT[k].pos || pos;
        vi = CHAPTER_VOCAB_DICT[k].vi || vi;
      } else {
        const hit = vocabPool().find(x => norm(cleanWord(x.w)) === norm(k));
        if (hit) {
          pos = hit.pos || pos;
          vi = hit.vi || vi;
        }
      }
      if (vi) {
        wordMap.set(k, {
          w: raw,
          pos,
          vi,
          topicId: t.id,
          topicTitle: splitTitle(t).main,
          source: 'Part 2',
          sourceFull: 'Part 2: Word Families & Synonyms',
          part: 2
        });
      }
    });
  });

  // 2b. Phần 2: Dạng đúng của từ (forms)
  if (e && e.forms) {
    e.forms.forEach(f => {
      const base = f[1];
      (f[2] || []).forEach(ans => {
        ans.split(/\s*\/\s*/).forEach(p => {
          const raw = cleanWord(p);
          const k = raw.toLowerCase();
          if (raw && !wordMap.has(k)) {
            let vi = '';
            if (CHAPTER_VOCAB_DICT[k]) vi = CHAPTER_VOCAB_DICT[k].vi;
            else {
              const hit = vocabPool().find(x => norm(cleanWord(x.w)) === norm(k));
              if (hit) vi = hit.vi;
              else if (wordMap.has(base.toLowerCase())) vi = wordMap.get(base.toLowerCase()).vi;
            }
            if (vi) {
              wordMap.set(k, {
                w: raw,
                pos: 'dạng từ',
                vi,
                topicId: t.id,
                topicTitle: splitTitle(t).main,
                source: 'Part 2',
                sourceFull: 'Part 2: Word Forms',
                part: 2
              });
            }
          }
        });
      });
    });
  }

  // 3. Phần 3: Từ vựng đề xuất trong bài đọc & dịch
  if (e && e.tr) {
    Object.values(e.tr).forEach(sec => {
      Object.values(sec).forEach(it => {
        (it[1] || []).forEach(w => {
          const raw = cleanWord(w[0]);
          const k = raw.toLowerCase();
          if (raw && !wordMap.has(k) && w[2]) {
            wordMap.set(k, {
              w: w[0],
              pos: w[1] || '',
              vi: w[2],
              topicId: t.id,
              topicTitle: splitTitle(t).main,
              source: 'Part 3',
              sourceFull: 'Part 3: Reading & Translation',
              part: 3
            });
          }
        });
      });
    });
  }

  // 4. Phần 4: Từ khóa trong bài nghe điền từ
  if (e && e.gap) {
    Object.values(e.gap).forEach(sec => {
      Object.values(sec).forEach(it => {
        (it[0] || []).forEach(ans => {
          ans.split(/\s*\/\s*/).forEach(a => {
            const raw = cleanWord(a);
            const k = raw.toLowerCase();
            if (raw && raw.length > 2 && raw.split(/\s+/).length <= 3 && !wordMap.has(k)) {
              let vi = '';
              if (CHAPTER_VOCAB_DICT[k]) vi = CHAPTER_VOCAB_DICT[k].vi;
              else {
                const hit = vocabPool().find(x => norm(cleanWord(x.w)) === norm(k));
                if (hit) vi = hit.vi;
              }
              if (vi) {
                wordMap.set(k, {
                  w: raw,
                  pos: 'bài nghe',
                  vi,
                  topicId: t.id,
                  topicTitle: splitTitle(t).main,
                  source: 'Part 4',
                  sourceFull: 'Part 4: Listening & Gap-fill',
                  part: 4
                });
              }
            }
          });
        });
      });
    });
  }

  return [...wordMap.values()];
}

function highlightOne(s, w){
  const stem = cleanWord(w).toLowerCase().split(' ')[0].replace(/e$/,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const multi = cleanWord(w).split(' ').length > 1;
  const re = multi ? new RegExp('(' + cleanWord(w).split(' ').map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+') + ')','i')
                   : new RegExp('\\b(' + stem + '\\w*)','i');
  return esc(s).replace(re, '<mark>$1</mark>');
}

function getWordDescVi(t, v) {
  if (!t || !v) return '';
  const e = enr(t.id);
  if (e && e.vocab && e.vocab[v.w] && e.vocab[v.w][2]) {
    return e.vocab[v.w][2];
  }
  return 'Topic "' + splitTitle(t).main + '" vocabulary - defined as: ' + v.vi + '.';
}

function quiz(t, box){
  const pool = t.vocab.filter(v => v.vi);
  if (pool.length < 2) { box.innerHTML = '<div class="empty">Not enough vocabulary defined in this topic to generate a quiz.</div>'; return; }
  let dir = store.get('qdir','en');
  const all = vocabPool();
  const qs = shuffle(pool).slice(0, Math.min(10, pool.length)).map(v => {
    const same = shuffle(pool.filter(x => x !== v && shortVi(x.vi) !== shortVi(v.vi)));
    const extra = shuffle(all.filter(x => !pool.includes(x)));
    const ds = same.concat(extra).slice(0,3);
    return { v, opts: shuffle([v, ...ds]) };
  });
  let i = 0, score = 0, wrong = [];
  function draw(){
    if (i >= qs.length){
      const pct = Math.round(score / qs.length * 100);
      const best = store.get('best:' + t.id, 0);
      const newBest = Math.max(pct, best);
      store.set('best:' + t.id, newBest);

      if (wrong.length) {
        wrong.forEach(w => store.addReviewWord(w, t.id, 'quiz'));
      }

      // Tự động lưu tiến độ lên Firebase nếu đã đăng nhập
      if (currentUser && fbDb && firestoreModules && currentUid !== 'guest') {
        const isCompleted = newBest >= 80 || store.get('completedManual:' + t.id, false);
        const progRef = firestoreModules.doc(fbDb, 'users', currentUid, 'progress', String(t.id));
        firestoreModules.setDoc(progRef, {
          best: newBest,
          completed: newBest >= 80,
          updatedAt: firestoreModules.serverTimestamp()
        }, { merge: true }).then(() => {
          syncLeaderboardFromClient(currentUid);
        }).catch(err => console.warn('Lỗi lưu tiến độ:', err));
      }

      box.innerHTML = `<div class="card"><div class="eyebrow">Quiz Results</div><div class="big">${score}/${qs.length}</div>
        <div class="hint">This Quiz Score: <b>${pct}%</b> · Topic Highest Score: <b>${newBest}%</b></div>
        ${newBest >= 80 ? '<div class="fb ok" style="margin-top:10px">✓ Outstanding! Topic completed (≥ 80%).</div>' : '<div class="hint" style="margin-top:8px">Score 80% or higher to master this topic.</div>'}
        ${currentUser && currentUid !== 'guest' ? '<div class="hint" style="margin-top:4px;font-size:12.5px;color:var(--good)">✓ Progress auto-saved to cloud & Leaderboard.</div>' : '<div class="hint" style="margin-top:4px;font-size:12px;color:var(--muted)">Sign in to save progress and join the Leaderboard.</div>'}
        ${wrong.length?`<div style="margin-top:12px"><b>Words needing review (${wrong.length} words saved to Saved Vocabulary):</b><ul class="wrong-list">${wrong.map(v=>`<li><b>${esc(v.w)}</b>${v.pos?` (${esc(v.pos)})`:''}: ${esc(v.vi)}</li>`).join('')}</ul></div>`:'<div class="fb ok" style="margin-top:10px">Perfect score! All answers correct.</div>'}
        <div class="row" style="margin-top:14px"><button class="btn primary" id="again">Take Another Quiz</button></div></div>`;
      box.querySelector('#again').onclick = () => quiz(t, box);
      renderSide(); return;
    }
    const q = qs[i];
    const viDesc = getWordDescVi(t, q.v);
    const prompt = dir === 'en' ? `${esc(q.v.w)}<small>${q.v.pos?esc(q.v.pos)+' · ':''}Select correct Vietnamese meaning</small>` : `${esc(shortVi(q.v.vi))}<small>${q.v.pos?esc(q.v.pos)+' · ':''}Select correct English word</small>`;
    box.innerHTML = `<div class="row between"><div class="seg" id="dir"><button data-d="en">EN → VI</button><button data-d="vi">VI → EN</button></div><span class="hint">Question ${i+1}/${qs.length} · Correct ${score}</span></div>

      <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${'ABCD'[k]}</span><span>${esc(dir==='en'?shortVi(o.vi):cleanWord(o.w))}</span></button>`).join('')}</div>
      <div class="row between"><span class="fb" id="fb"></span><button class="btn primary" id="next" hidden>Next Question →</button></div></div>`;
    box.querySelectorAll('#dir button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.d===dir)); b.onclick = () => { if (b.dataset.d!==dir){ store.set('qdir', b.dataset.d); quiz(t, box);} }; });
    let answered = false;
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (answered) return;
      answered = true;
      const pick = q.opts[+b.dataset.k], ok = pick === q.v;
      box.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (q.opts[+x.dataset.k] === q.v) x.classList.add('ok'); });
      if (!ok) {
        b.classList.add('no');
        wrong.push(q.v);
        store.addReviewWord(q.v, t.id, 'quiz');
      } else score++;
      const fb = box.querySelector('#fb'); fb.className = 'fb ' + (ok?'ok':'no');
      fb.textContent = ok ? 'Correct.' : `Incorrect. ${cleanWord(q.v.w)} = ${shortVi(q.v.vi)}`;
      if (dir==='en' || ok) speak(cleanWord(q.v.w));
      const n = box.querySelector('#next'); n.hidden = false; n.focus();
      n.onclick = () => { i++; draw(); };
    });
  }
  draw();
}

function writeDrill(t, box){
  const e = enr(t.id), ev = e ? e.vocab : {};
  const pool = shuffle(t.vocab.filter(v => v.vi));
  if (!pool.length) { box.innerHTML = '<div class="empty">No words available for writing practice in this topic.</div>'; return; }
  let i = 0, score = 0, wrong = [];
  function draw(){
    if (i >= pool.length){
      box.innerHTML = `<div class="card"><div class="eyebrow">Drill Completed</div><div class="big">${score}/${pool.length}</div>
        ${wrong.length?`<div><b>Words missed (saved to Saved Vocabulary):</b><ul class="wrong-list">${wrong.map(v=>`<li><b>${esc(cleanWord(v.w))}</b>: ${esc(v.vi)}</li>`).join('')}</ul></div>`:''}
        <div class="row"><button class="btn primary" id="again">Try Again</button></div></div>`;
      box.querySelector('#again').onclick = () => writeDrill(t, box); return;
    }
    const v = pool[i], ans = answers(v.w), x = ev[v.w];
    let hintLvl = 0, done = false;
    const gap = x ? esc(x[1]).replace(new RegExp('\\b' + cleanWord(v.w).toLowerCase().split(' ')[0].replace(/e$/,'') + '[a-z]*(?:\\s+[a-z]+){' + (cleanWord(v.w).split(' ').length-1) + '}','i'), '_____') : '';
    box.innerHTML = `<div class="card"><div class="qprog"><i style="width:${i/pool.length*100}%"></i></div>
      <div class="row between"><span class="eyebrow">Word ${i+1}/${pool.length} · Correct ${score}</span>${v.pos?`<span class="pos">${esc(v.pos)}</span>`:''}</div>
      <div class="qprompt">${esc(v.vi)}</div>
      ${x?`<div class="ex">${gap}<span class="vi">${esc(x[2])}</span></div>`:''}
      <form id="wf" class="row" autocomplete="off"><input class="field" id="win" style="flex:1 1 220px" placeholder="Type the English word…" autocapitalize="off" spellcheck="false"><button class="btn primary" type="submit" id="wchk">Check</button></form>
      <div class="row between"><div class="row"><button class="btn ghost" id="whint" type="button">Letter Hint</button><button class="btn ghost" id="wskip" type="button">Reveal Answer</button></div><span class="fb" id="wfb"></span></div></div>`;
    const inp = box.querySelector('#win'); inp.focus();
    const fb = box.querySelector('#wfb');
    const finish = (ok) => {
      done = true; inp.classList.add(ok?'ok':'no'); fb.className = 'fb ' + (ok?'ok':'no');
      fb.textContent = ok ? 'Correct.' : 'Answer: ' + cleanWord(v.w);
      if (ok) score++; else {
        wrong.push(v);
        store.addReviewWord(v, t.id, 'write');
      }
      speak(cleanWord(v.w));
      const b = box.querySelector('#wchk'); b.textContent = 'Next Word →'; b.focus();
      box.querySelector('#whint').disabled = true; box.querySelector('#wskip').disabled = true;
    };
    box.querySelector('#wf').onsubmit = ev2 => {
      ev2.preventDefault();
      if (done) { i++; draw(); return; }
      const val = norm(inp.value); if (!val) return;
      if (ans.includes(val)) finish(true);
      else { inp.classList.add('no'); fb.className = 'fb no'; fb.textContent = 'Incorrect, try again or use hint.'; setTimeout(()=>inp.classList.remove('no'), 700); }
    };
    box.querySelector('#whint').onclick = () => {
      const w = cleanWord(v.w); hintLvl = Math.min(hintLvl+1, Math.max(1, w.length-1));
      fb.className = 'fb'; fb.textContent = w.split('').map((c,k)=> c===' ' ? '  ' : (k<hintLvl ? c : '_')).join(' ');
    };
    box.querySelector('#wskip').onclick = () => finish(false);
  }
  draw();
}

// ---------- PART 2 ----------
const OPS = { '=':['eq','='], '->':['to','→'], '→':['to','→'], '~':['sim','≈'], '><':['vs','≠'] };
function relLine(line, lIdx = 0){
  const toks = line.split(/\s*(=|->|→|~|><)\s*/).filter(s => s !== '');
  let wIdx = 0;
  return '<div class="rel">' + toks.map(tk => {
    if (OPS[tk]) return `<span class="op ${OPS[tk][0]}">${OPS[tk][1]}</span>`;
    const clean = cleanWord(tk);
    const rid = `p2-${lIdx}-${wIdx++}`;
    return `<span class="chip-item">
      <span class="chip" data-say="${esc(clean)}" title="Click to listen to pronunciation">${esc(tk)}</span>
      <button class="mini-rec-btn rec-btn" data-rec-text="${esc(clean)}" data-rec-id="${rid}" title="Record voice for '${esc(clean)}'">${MIC_ICON}</button>
    </span>`;
  }).join('') + `<div class="rec-slot-row" id="slot-p2-row-${lIdx}"></div></div>`;
}
function synPairs(t){
  const pairs = [], seen = new Set();
  t.notes.forEach(line => {
    line.split(/\s*(?:->|→|><)\s*/).forEach(seg => {
      const terms = seg.split(/\s*[=~]\s*/).map(x => x.replace(/\(.*?\)/g,'').replace(/\+.*$/,'').trim()).filter(x => x && x.length < 32 && !VN.test(x));
      if (terms.length >= 2 && norm(terms[0]) !== norm(terms[1])) {
        const k = norm(terms[0]); if (!seen.has(k)) { seen.add(k); pairs.push([terms[0], terms[1]]); }
      }
    });
  });
  return pairs;
}
function part2(t, el){
  const e = enr(t.id);
  let h = '';
  if (t.notes.length){
    h += `<h2 class="sec">Topic Notes & Word Families</h2>
      <div class="legend"><span class="op eq">=</span>synonym <span class="op sim">≈</span>near synonym <span class="op to">→</span>derivative / collocation <span class="op vs">≠</span>easy to confuse</div>
      <div class="panel" style="gap:8px">${t.notes.map((l, li) => relLine(l, li)).join('')}</div>`;
  } else h += '<div class="empty">No word family or collocation notes available for this topic.</div>';
  const pairs = synPairs(t);
  if (pairs.length >= 2) h += `<h2 class="sec">Synonym Matching</h2><p class="hint" style="margin:0">Select a word on the left, then click its corresponding synonym on the right.</p><div class="card" id="mg"></div>`;
  if (e && e.usage.length) h += `<h2 class="sec">Usage Notes</h2><div class="usage">${e.usage.map(u=>`<div><b>${esc(u[0])}</b>${esc(u[1])}</div>`).join('')}</div>`;
  if (e && e.forms.length){

      <div class="forms">${e.forms.map((f,k)=>{

        return `<form class="fitem" data-k="${k}" autocomplete="off"><div><div>${esc(f[0]).replace('____','<b>_____</b>')}</div><div class="base">(${esc(f[1])})</div></div><div class="row" style="flex-wrap:nowrap"><input class="field ${savedVal ? (ok ? 'ok' : 'no') : ''}" id="${wfKey}" data-key="${wfKey}" value="${esc(savedVal)}" style="padding:7px 10px;font-size:15px" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Check</button></div><div class="ans" ${savedVal ? '' : 'hidden'} style="color:${ok ? 'var(--good)' : 'var(--bad)'}">${savedVal ? (ok ? 'Correct.' : 'Answer: ' + f[2].join(' / ')) : ''}</div></form>`;
      }).join('')}</div>`;
  }
  el.innerHTML = h;
  if (pairs.length >= 2) matchGame(shuffle(pairs).slice(0,6), el.querySelector('#mg'));
  if (e && e.forms.length) el.querySelectorAll('.fitem').forEach(f => {
    const k = +f.dataset.k;
    const wfKey = `wf-${t.id}-${k}`;
    const inp = f.querySelector('input');
    const a = f.querySelector('.ans');
    const it = e.forms[k];
    inp.addEventListener('input', () => {
      store.set(wfKey, inp.value);
      inp.classList.remove('ok','no');
    });
    inp.addEventListener('blur', () => {
      store.set(wfKey, inp.value);
    });
    inp.addEventListener('change', () => {
      store.set(wfKey, inp.value);
    });
    f.onsubmit = ev => {
      ev.preventDefault();
      store.set(wfKey, inp.value);
      const ok = it[2].map(norm).includes(norm(inp.value));
      inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no');
      a.hidden = false; a.style.color = ok ? 'var(--good)' : 'var(--bad)';
      a.textContent = ok ? 'Correct.' : 'Answer: ' + it[2].join(' / ');
    };
  });
}
function matchGame(pairs, box){
  const L = pairs.map((p,i)=>({i, s:p[0]})), R = shuffle(pairs.map((p,i)=>({i, s:p[1]})));
  let sel = null, done = 0;
  box.innerHTML = `<div class="match"><div class="col" id="ml">${L.map(x=>`<button class="mbtn" data-i="${x.i}">${esc(x.s)}</button>`).join('')}</div><div class="col" id="mr">${R.map(x=>`<button class="mbtn" data-i="${x.i}">${esc(x.s)}</button>`).join('')}</div></div><div class="row between"><span class="hint" id="mst">0/${pairs.length} pairs</span><button class="btn ghost" id="mre">Shuffle</button></div>`;
  box.querySelectorAll('#ml .mbtn').forEach(b => b.onclick = () => { if (b.classList.contains('done')) return; box.querySelectorAll('#ml .mbtn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel = b; });
  box.querySelectorAll('#mr .mbtn').forEach(b => b.onclick = () => {
    if (!sel || b.classList.contains('done')) return;
    if (sel.dataset.i === b.dataset.i){ sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done'); sel.disabled = b.disabled = true; sel = null; done++; box.querySelector('#mst').textContent = `${done}/${pairs.length} pairs` + (done===pairs.length?' · completed':''); }
    else { b.classList.add('err'); sel.classList.add('err'); const s2 = sel; setTimeout(()=>{ b.classList.remove('err'); s2.classList.remove('err'); }, 500); }
  });
  box.querySelector('#mre').onclick = () => matchGame(shuffle(pairs), box);
}

    a.addEventListener('loadedmetadata', () => { a.playbackRate = store.get('rate', 1); });
  });
  el.querySelectorAll('[data-speed]').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => {
    const r = +b.dataset.r; store.set('rate', r);
    el.querySelectorAll('audio').forEach(a => a.playbackRate = r);
    el.querySelectorAll('[data-speed] button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.r === r)));
  }));
  el.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { const a = el.querySelector('#' + b.dataset.back); if (a){ a.currentTime = Math.max(0, a.currentTime - 3); a.play().catch(()=>{}); } });
  const grow = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; };
  el.querySelectorAll('.gtr').forEach(ta => { grow(ta); ta.addEventListener('input', () => { store.set(ta.dataset.key, ta.value); grow(ta); }); });
  el.querySelectorAll('[data-trt]').forEach(b => b.onclick = () => {
    const k = 'trhide:' + t.id + '-' + b.dataset.trt, hide = !store.get(k, false); store.set(k, hide);
    el.querySelectorAll(`[data-trgrp="${b.dataset.trt}"]`).forEach(w => { w.hidden = hide; if (!hide) w.querySelectorAll('.gtr').forEach(grow); });
    b.textContent = hide ? 'Show Translation Field' : 'Hide Translation Field';
  });
  el.querySelectorAll('.gin').forEach(inp => {
    const saveGin = () => store.set(inp.dataset.key, inp.value);
    inp.addEventListener('input', () => { saveGin(); inp.classList.remove('ok','diff'); });
    inp.addEventListener('blur', saveGin);
    inp.addEventListener('change', saveGin);
  });
  el.querySelectorAll('[data-vi]').forEach(b => b.onclick = () => {
    const vs = el.querySelectorAll(`[data-vigrp="${b.dataset.vi}"]`); const show = vs[0] && vs[0].hidden;
    vs.forEach(v => v.hidden = !show); b.textContent = show ? 'Hide Translation' : 'Show Translation';
  });
  el.querySelectorAll('[data-chk]').forEach(b => b.onclick = () => {
    const [si] = b.dataset.chk.split('-');
    const inputs = el.querySelectorAll(`.gin[data-grp="${b.dataset.chk}"]`);
    const sugs = {};
    inputs.forEach(inp => {
      const ref = e.gap[si] && e.gap[si][inp.dataset.bi]; if (!ref) return;
      const sug = ref[0][+inp.dataset.gi] || '';
      const okList = sug.split('/').map(norm);
      const ok = inp.value.trim() && okList.includes(norm(inp.value));
      inp.classList.remove('ok','diff'); inp.classList.add(ok ? 'ok' : 'diff');
      (sugs[inp.dataset.bi] = sugs[inp.dataset.bi] || []).push(`(${+inp.dataset.gi+1}) ${sug}`);
    });
    Object.entries(sugs).forEach(([bi, arr]) => { const s = el.querySelector(`[data-sug="${si}-${bi}"]`); if (s){ s.hidden = false; s.textContent = 'Hint: ' + arr.join(' · '); } });
  });
  el.querySelectorAll('[data-clr]').forEach(b => b.onclick = () => {
    el.querySelectorAll(`.gin[data-grp="${b.dataset.clr}"]`).forEach(inp => { inp.value=''; store.set(inp.dataset.key,''); inp.classList.remove('ok','diff'); });
    el.querySelectorAll(`.gline[data-grp="${b.dataset.clr}"] .sug`).forEach(s => s.hidden = true);
  });
}

// ---------- MỤC 0: TỔNG HỢP TỪ VỰNG TOÀN DIỆN ----------
function renderTopic0(box) {
  let scope = store.get('t0_scope', '1');
  let mode = store.get('t0_mode', 'quiz'); // 'quiz' | 'flashcard' | 'write'

  function getPool() {
    if (scope === 'all') {
      return TOPICS.flatMap(t => t.vocab.filter(v => v.vi).map(v => ({
        ...v,
        topicId: t.id,
        topicTitle: splitTitle(t).main
      })));
    }
    const t = TOPICS.find(x => String(x.id) === String(scope)) || TOPICS[0];
    return t.vocab.filter(v => v.vi).map(v => ({
      ...v,
      topicId: t.id,
      topicTitle: splitTitle(t).main
    }));
  }

  function drawMain() {
    const allCount = TOPICS.reduce((acc, t) => acc + t.vocab.length, 0);
    const pool = getPool();
    const currentTopicObj = TOPICS.find(x => String(x.id) === String(scope));

    box.innerHTML = `
      <div class="t0-header">
        <div class="eyebrow">COMPREHENSIVE VOCABULARY DRILL</div>
        <h1 style="font-size:26px;font-weight:800;margin:4px 0 8px">00 · Core TOEIC Vocabulary Mastery</h1>
        <div class="meta" style="color:var(--muted);font-size:14px">
          Master vocabulary topic-by-topic or across all 45 topics using flashcards, writing drills, and active-recall quizzes.
        </div>
      </div>

      <div class="t0-nav-bar">
        <div class="t0-scope-wrap">
          <label for="t0-scope-sel">Select Topic Scope:</label>
          <select id="t0-scope-sel" class="t0-scope-select">
            <option value="all" ${scope === 'all' ? 'selected' : ''}>All 45 Topics (${allCount} words)</option>
            ${TOPICS.map(t => `<option value="${t.id}" ${String(t.id) === String(scope) ? 'selected' : ''}>${String(t.id).padStart(2,'0')}. ${esc(splitTitle(t).main)} (${t.vocab.length} words)</option>`).join('')}
          </select>
          <span class="hint" style="font-size:13px;font-weight:600">(${pool.length} words)</span>
        </div>

        <div class="seg" id="t0-mode-tabs">
          <button data-m="quiz" ${mode === 'quiz' ? 'aria-pressed="true"' : ''}>Quiz</button>
          <button data-m="flashcard" ${mode === 'flashcard' ? 'aria-pressed="true"' : ''}>Flashcards</button>
          <button data-m="write" ${mode === 'write' ? 'aria-pressed="true"' : ''}>Writing Drill</button>
        </div>
      </div>

      <div id="t0-content"></div>
    `;

    // Bắt sự kiện đổi Scope (Chương)
    const scopeSel = box.querySelector('#t0-scope-sel');
    if (scopeSel) {
      scopeSel.onchange = () => {
        scope = scopeSel.value;
        store.set('t0_scope', scope);
        drawMain();
      };
    }

    // Bắt sự kiện đổi Mode (Chế độ)
    box.querySelectorAll('#t0-mode-tabs button').forEach(btn => {
      btn.onclick = () => {
        mode = btn.dataset.m;
        store.set('t0_mode', mode);
        drawMain();
      };
    });

    const contentBox = box.querySelector('#t0-content');
    if (mode === 'flashcard') {
      renderT0Flashcards(contentBox, pool);
    } else if (mode === 'write') {
      renderT0WriteDrill(contentBox, pool);
    } else {
      renderT0Quiz(contentBox, pool);
    }
  }

  drawMain();
}

// 1. Chế độ Flashcard (Lật hình 3D)
function renderT0Flashcards(container, rawPool) {
  if (!rawPool.length) {
    container.innerHTML = '<div class="card" style="text-align:center;padding:32px">No vocabulary available in this selection.</div>';
    return;
  }

  let pool = [...rawPool];
  let curIdx = 0;
  let isFlipped = false;

  function drawCard() {
    const v = pool[curIdx];
    const topObj = TOPICS.find(t => t.id === v.topicId) || TOPICS[0];
    const e = enr(v.topicId);
    const x = e && e.vocab ? e.vocab[v.w] : null;
    const ipa = x ? x[0] : '';
    const exEn = x ? x[1] : '';
    const exVi = getWordDescVi(topObj, v);

    container.innerHTML = `
      <div class="fc-container">
        <div class="fc-scene">
          <div class="fc-card ${isFlipped ? 'flipped' : ''}" id="fc-main-card">
            <!-- Mặt trước (Front) -->
            <div class="fc-face front">
              <span class="fc-badge">${curIdx + 1} / ${pool.length} · ${esc(v.topicTitle)}${v.source ? ` · <b style="color:var(--accent)">${esc(v.source)}</b>` : ''}</span>
              <div style="margin-top:20px">
                <div class="fc-word">${esc(v.w)}</div>
                ${v.pos ? `<span class="pos" style="font-size:14px;padding:3px 8px;border-radius:6px">${esc(v.pos)}</span>` : ''}
                ${ipa ? `<div class="fc-ipa">${esc(ipa)}</div>` : ''}
              </div>
              <div style="margin-top:16px;display:flex;gap:8px;align-items:center">
                <button class="icon-btn" id="fc-speak" title="Listen to pronunciation" style="width:38px;height:38px">${SPEAK}</button>
                <button class="icon-btn rec-btn" data-rec-text="${esc(cleanWord(v.w))}" data-rec-id="fc-${v.topicId}-${curIdx}" title="Practice pronunciation" style="width:38px;height:38px">${MIC_ICON}</button>
              </div>
              <div id="slot-fc-${v.topicId}-${curIdx}" class="rec-slot" style="display:none;width:100%;margin-top:12px;text-align:left"></div>
              <div class="fc-hint-flip">
                <span>Click card or press Space to flip</span>
              </div>
            </div>

            <!-- Mặt sau (Back) -->
            <div class="fc-face back">
              <span class="fc-badge">${curIdx + 1} / ${pool.length} · ${esc(v.topicTitle)}${v.source ? ` · <b style="color:var(--accent)">${esc(v.source)}</b>` : ''}</span>
              <div class="fc-vi">${esc(v.vi)}</div>
              ${exEn ? `<div class="fc-ex-box">
                <div style="font-weight:600;color:var(--accent);margin-bottom:4px">“${esc(exEn)}”</div>
                <div style="color:var(--ink)">💡 ${esc(exVi)}</div>
              </div>` : `<div class="fc-ex-box">💡 ${esc(exVi)}</div>`}
              <div class="fc-hint-flip">
                <span>Click card to flip back</span>
              </div>
            </div>
          </div>
        </div>

        <div class="fc-controls">
          <button class="btn" id="fc-prev" ${curIdx === 0 ? 'disabled' : ''}>← Previous</button>
          <button class="btn primary" id="fc-flip">Flip Card (Space)</button>
          <button class="btn" id="fc-next" ${curIdx === pool.length - 1 ? 'disabled' : ''}>Next →</button>
          <button class="btn ghost" id="fc-shuffle" title="Shuffle flashcards">Shuffle</button>
        </div>
      </div>
    `;

    const cardEl = container.querySelector('#fc-main-card');
    const toggleFlip = () => {
      isFlipped = !isFlipped;
      cardEl.classList.toggle('flipped', isFlipped);
    };

    cardEl.onclick = (e) => {
      if (e.target.closest('button')) return;
      toggleFlip();
    };

    container.querySelector('#fc-flip').onclick = toggleFlip;

    container.querySelector('#fc-prev').onclick = () => {
      if (curIdx > 0) {
        curIdx--;
        isFlipped = false;
        drawCard();
      }
    };

    container.querySelector('#fc-next').onclick = () => {
      if (curIdx < pool.length - 1) {
        curIdx++;
        isFlipped = false;
        drawCard();
      }
    };

    container.querySelector('#fc-shuffle').onclick = () => {
      pool = shuffle(pool);
      curIdx = 0;
      isFlipped = false;
      drawCard();
    };

    const spkBtn = container.querySelector('#fc-speak');
    if (spkBtn) {
      spkBtn.onclick = (e) => {
        e.stopPropagation();
        speak(v.w);
      };
    }
  }

  drawCard();
}

// 2. Chế độ Viết từ (Việt sang Anh)
function renderT0WriteDrill(container, rawPool) {
  if (!rawPool.length) {
    container.innerHTML = '<div class="card" style="text-align:center;padding:32px">No vocabulary available in this selection.</div>';
    return;
  }

  const pool = shuffle([...rawPool]);
  let i = 0, score = 0, wrongList = [];

  function draw() {
    if (i >= pool.length) {
      container.innerHTML = `
        <div class="card" style="text-align:center;padding:36px">
          <div class="eyebrow">Writing Drill Completed</div>
          <div class="big" style="margin:8px 0">${score} / ${pool.length}</div>
          <div class="hint">Accuracy: <b>${Math.round(score / pool.length * 100)}%</b></div>
          ${wrongList.length ? `
            <div style="text-align:left;margin-top:18px">
              <b>Words needing review (${wrongList.length}):</b>
              <ul class="wrong-list" style="margin-top:8px">
                ${wrongList.map(v => `<li><b>${esc(cleanWord(v.w))}</b>: ${esc(v.vi)} <small>(${esc(v.topicTitle)})</small></li>`).join('')}
              </ul>
            </div>
          ` : '<div class="fb ok" style="margin-top:14px">Excellent! All words typed correctly.</div>'}
          <div style="margin-top:20px">
            <button class="btn primary" id="t0-write-again">Try Again</button>
          </div>
        </div>
      `;
      container.querySelector('#t0-write-again').onclick = () => renderT0WriteDrill(container, rawPool);
      return;
    }

    const v = pool[i];
    const topObj = TOPICS.find(t => t.id === v.topicId) || TOPICS[0];
    const viDesc = getWordDescVi(topObj, v);
    const targetWord = cleanWord(v.w);

    container.innerHTML = `
      <div class="write-drill-box">
        <div class="row between" style="margin-bottom:8px">
          <span class="hint" style="font-weight:600">Question ${i + 1} / ${pool.length} · ${esc(v.topicTitle)}</span>
          <span class="hint" style="color:var(--good);font-weight:700">Correct: ${score}</span>
        </div>
        <div class="card">
          <div class="qprog"><i style="width:${(i / pool.length) * 100}%"></i></div>
          <div class="wd-prompt">
            <div style="font-size:13px;color:var(--muted);text-transform:uppercase;font-weight:700">Vietnamese Meaning:</div>
            <div class="wd-vi">${esc(v.vi)} ${v.pos ? `<small style="font-size:14px;color:var(--muted)">(${esc(v.pos)})</small>` : ''}</div>
            <div class="qdesc-vi">💡 <i>${esc(viDesc)}</i></div>
          </div>

          <form id="t0-write-form" autocomplete="off">
            <div class="wd-input-row">
              <input class="wd-input" id="t0-w-inp" placeholder="Type the English word…" autofocus spellcheck="false" autocapitalize="off">
              <button class="btn primary" type="submit" id="t0-w-btn">Check</button>
              <button class="btn ghost" type="button" id="t0-w-hint" title="First letter hint">Hint</button>
            </div>
            <div id="t0-w-fb" style="margin-top:10px;font-size:14.5px;font-weight:600;min-height:22px"></div>
            <div id="t0-w-next-bar" style="margin-top:12px;display:none">
              <button class="btn primary" type="button" id="t0-w-next">Next Word →</button>
            </div>
          </form>
        </div>
      </div>
    `;

    const form = container.querySelector('#t0-write-form');
    const inp = container.querySelector('#t0-w-inp');
    const fb = container.querySelector('#t0-w-fb');
    const nextBar = container.querySelector('#t0-w-next-bar');
    const nextBtn = container.querySelector('#t0-w-next');
    const hintBtn = container.querySelector('#t0-w-hint');
    let answered = false;

    hintBtn.onclick = () => {
      inp.value = targetWord[0] + '... (' + targetWord.length + ' letters)';
      inp.focus();
    };

    form.onsubmit = (e) => {
      e.preventDefault();
      if (answered) return;
      const userVal = norm(inp.value.trim());
      if (!userVal) return;

      const validAns = answers(v.w);
      const isCorrect = validAns.includes(userVal) || userVal === norm(targetWord);

      answered = true;
      inp.disabled = true;
      hintBtn.disabled = true;
      container.querySelector('#t0-w-btn').disabled = true;

      if (isCorrect) {
        score++;
        inp.classList.add('ok');
        fb.innerHTML = '<span style="color:var(--good)">✓ Correct!</span>';
        speak(targetWord);
      } else {
        wrongList.push(v);
        store.addReviewWord(v, v.topicId, 'write');
        inp.classList.add('no');
        fb.innerHTML = `<span style="color:var(--bad)">Incorrect. Correct answer: <b>${esc(targetWord)}</b></span>`;
        speak(targetWord);
      }

      nextBar.style.display = 'block';
      nextBtn.focus();
    };

    nextBtn.onclick = () => {
      i++;
      draw();
    };
  }

  draw();
}

// 3. Chế độ Trắc nghiệm (Quiz tổng hợp)
function renderT0Quiz(container, rawPool) {
  if (rawPool.length < 2) {
    container.innerHTML = '<div class="card" style="text-align:center;padding:32px">At least 2 words required to generate a quiz.</div>';
    return;
  }

  let dir = store.get('t0_qdir', 'en');
  const allVocabPool = vocabPool();
  const sampleCount = Math.min(15, rawPool.length);
  const questions = shuffle([...rawPool]).slice(0, sampleCount).map(v => {
    const same = shuffle(rawPool.filter(x => x !== v && shortVi(x.vi) !== shortVi(v.vi)));
    const extra = shuffle(allVocabPool.filter(x => x.w !== v.w));
    const distractors = same.concat(extra).slice(0, 3);
    return {
      v,
      opts: shuffle([v, ...distractors])
    };
  });

  let i = 0, score = 0, wrongList = [];

  function draw() {
    if (i >= questions.length) {
      const pct = Math.round(score / questions.length * 100);
      const topId = (questions[0] && questions[0].v && questions[0].v.topicId) || S.t;
      const curBest = Number(store.get('best:' + topId, 0)) || 0;
      const newBest = Math.max(pct, curBest);
      store.set('best:' + topId, newBest);

      if (wrongList.length) {
        wrongList.forEach(w => store.addReviewWord(w, topId, 'quiz'));
      }

      if (currentUser && fbDb && firestoreModules && currentUid !== 'guest') {
        const isCompleted = newBest >= 80 || store.get('completedManual:' + topId, false);
        firestoreModules.setDoc(
          firestoreModules.doc(fbDb, 'users', currentUid, 'progress', String(topId)),
          {
            best: newBest,
            completed: isCompleted,
            updatedAt: firestoreModules.serverTimestamp()
          },
          { merge: true }
        ).then(() => {
          syncLeaderboardFromClient(currentUid);
        }).catch(err => {
          console.warn('Lỗi lưu điểm Tab 0 lên Firestore:', err);
        });
      }
      flushDirtyKeys();

      container.innerHTML = `
        <div class="card" style="text-align:center;padding:36px">
          <div class="eyebrow">Quiz Results</div>
          <div class="big" style="margin:8px 0">${score} / ${questions.length}</div>
          <div class="hint">Score: <b>${pct}%</b></div>
          ${pct >= 80 ? '<div class="fb ok" style="margin-top:12px">✓ Outstanding! Excellent vocabulary mastery.</div>' : '<div class="hint" style="margin-top:8px">Practice more to achieve 80% or higher!</div>'}
          ${wrongList.length ? `
            <div style="text-align:left;margin-top:18px">
              <b>Words needing review (${wrongList.length} words saved to Saved Vocabulary):</b>
              <ul class="wrong-list" style="margin-top:8px">
                ${wrongList.map(v => `<li><b>${esc(v.w)}</b>${v.pos ? ` (${esc(v.pos)})` : ''}: ${esc(v.vi)} <small>(${esc(v.topicTitle)})</small></li>`).join('')}
              </ul>
            </div>
          ` : ''}
          <div style="margin-top:20px">
            <button class="btn primary" id="t0-quiz-again">Take Another Quiz</button>
          </div>
        </div>
      `;
      container.querySelector('#t0-quiz-again').onclick = () => renderT0Quiz(container, rawPool);
      return;
    }

    const q = questions[i];
    const topObj = TOPICS.find(t => t.id === q.v.topicId) || TOPICS[0];
    const viDesc = getWordDescVi(topObj, q.v);

    const promptHtml = dir === 'en'
      ? `<div style="display:flex;align-items:center;gap:10px">${esc(q.v.w)} <button class="icon-btn" id="t0-q-speak" title="Listen to pronunciation" style="display:inline-flex">${SPEAK}</button></div><small>${q.v.pos ? esc(q.v.pos) + ' · ' : ''}Select correct Vietnamese meaning</small>`
      : `<div>${esc(shortVi(q.v.vi))}</div><small>${q.v.pos ? esc(q.v.pos) + ' · ' : ''}Select correct English word</small>`;

    container.innerHTML = `
      <div class="row between" style="margin-bottom:8px">
        <div class="seg" id="t0-dir">
          <button data-d="en" ${dir === 'en' ? 'aria-pressed="true"' : ''}>EN → VI</button>
          <button data-d="vi" ${dir === 'vi' ? 'aria-pressed="true"' : ''}>VI → EN</button>
        </div>
        <span class="hint" style="font-weight:600">Question ${i + 1} / ${questions.length} · Correct ${score}</span>
      </div>
      <div class="card">
        <div class="qprog"><i style="width:${(i / questions.length) * 100}%"></i></div>
        <div class="qprompt">
          ${promptHtml}
          ${viDesc ? `<div class="qdesc-vi">💡 <i>${esc(viDesc)}</i></div>` : ''}
        </div>
        <div class="opts" style="margin-top:16px">
          ${q.opts.map((o, k) => `
            <button class="opt" data-k="${k}">
              <span class="l">${'ABCD'[k]}</span>
              <span>${esc(dir === 'en' ? shortVi(o.vi) : cleanWord(o.w))}</span>
            </button>
          `).join('')}
        </div>
        <div class="row between" style="margin-top:14px">
          <span class="fb" id="t0-fb"></span>
          <button class="btn primary" id="t0-next" hidden>Next Question →</button>
        </div>
      </div>
    `;

    const spkBtn = container.querySelector('#t0-q-speak');
    if (spkBtn) spkBtn.onclick = () => speak(q.v.w);

    container.querySelectorAll('#t0-dir button').forEach(btn => {
      btn.onclick = () => {
        dir = btn.dataset.d;
        store.set('t0_qdir', dir);
        draw();
      };
    });

    let answered = false;
    container.querySelectorAll('.opts .opt').forEach(btn => {
      btn.onclick = () => {
        if (answered) return;
        answered = true;
        const chosen = q.opts[+btn.dataset.k];
        const ok = chosen.w === q.v.w;
        btn.classList.add(ok ? 'ok' : 'no');

        if (ok) {
          score++;
          container.querySelector('#t0-fb').className = 'fb ok';
          container.querySelector('#t0-fb').textContent = '✓ Correct!';
          speak(q.v.w);
        } else {
          wrongList.push(q.v);
          store.addReviewWord(q.v, q.v.topicId, 'quiz');
          container.querySelector('#t0-fb').className = 'fb no';
          container.querySelector('#t0-fb').textContent = '✕ Incorrect. Correct answer: ' + (dir === 'en' ? q.v.vi : cleanWord(q.v.w));
          // Highlight nút đúng
          container.querySelectorAll('.opts .opt').forEach((b, k) => {
            if (q.opts[k].w === q.v.w) b.classList.add('ok');
          });
        }

        container.querySelectorAll('.opts .opt').forEach(b => b.disabled = true);
        const nextBtn = container.querySelector('#t0-next');
        nextBtn.hidden = false;
        nextBtn.focus();
        nextBtn.onclick = () => {
          i++;
          draw();
        };
      };
    });
  }

  draw();
}

function renderReview(box) {
  let activeTab = 'list';
  let filterTopic = 'all';
  let searchQuery = '';

  function draw() {

function runHardWordsQuiz(box, words) {
  const allPool = vocabPool();
  const pool = words.filter(v => v.vi);
  const qs = shuffle(pool).slice(0, Math.min(10, pool.length)).map(v => {
    const same = shuffle(pool.filter(x => x !== v && shortVi(x.vi) !== shortVi(v.vi)));
    const extra = shuffle(allPool.filter(x => cleanWord(x.w) !== cleanWord(v.w)));
    const ds = same.concat(extra).slice(0, 3);
    return { v, opts: shuffle([v, ...ds]) };
  });

  let i = 0, score = 0, wrong = [];

  function draw() {
    if (i >= qs.length) {
      box.innerHTML = `
        <div class="card">
          <div class="eyebrow">Review Quiz Results</div>
          <div class="big">${score}/${qs.length}</div>
          <div class="hint">Score: ${Math.round((score / qs.length) * 100)}%</div>
          ${wrong.length ? `
            <div>
              <b>Words still missed:</b>
              <ul class="wrong-list">
                ${wrong.map(v => `<li><b>${esc(v.w)}</b>${v.pos ? ` (${esc(v.pos)})` : ''}: ${esc(v.vi)}</li>`).join('')}
              </ul>
            </div>
          ` : '<div class="fb ok">Great job! All saved words answered correctly.</div>'}
          <div class="row" style="margin-top:16px">
            <button class="btn primary" id="rev-again">Take Another Quiz</button>
          </div>
        </div>`;
      box.querySelector('#rev-again').onclick = () => runHardWordsQuiz(box, words);
      return;
    }

    const q = qs[i];
    const prompt = `${esc(q.v.w)}<small>${q.v.pos ? esc(q.v.pos) + ' · ' : ''}Select correct Vietnamese meaning</small>`;

    box.innerHTML = `
      <div class="row between">
        <span class="hint">Saved Words Quiz</span>
        <span class="hint">Question ${i + 1}/${qs.length} · Correct ${score}</span>
      </div>
      <div class="card">
        <div class="qprog"><i style="width:${(i / qs.length) * 100}%"></i></div>
        <div class="qprompt">${prompt}</div>
        <div class="opts">
          ${q.opts.map((o, k) => `
            <button class="opt" data-k="${k}">
              <span class="l">${'ABCD'[k]}</span>
              <span>${esc(shortVi(o.vi))}</span>
            </button>
          `).join('')}
        </div>
        <div class="row between">
          <span class="fb" id="rfb"></span>
          <button class="btn primary" id="rnext" hidden>Next Question →</button>
        </div>
      </div>`;

    box.querySelectorAll('.opt').forEach(b => {
      b.onclick = () => {
        const pick = q.opts[+b.dataset.k];
        const ok = cleanWord(pick.w) === cleanWord(q.v.w);
        box.querySelectorAll('.opt').forEach(x => {
          x.disabled = true;
          if (cleanWord(q.opts[+x.dataset.k].w) === cleanWord(q.v.w)) x.classList.add('ok');
        });
        if (!ok) {
          b.classList.add('no');
          wrong.push(q.v);
        } else {
          score++;
        }
        const fb = box.querySelector('#rfb');
        fb.className = 'fb ' + (ok ? 'ok' : 'no');
        fb.textContent = ok ? 'Correct.' : `Incorrect: ${cleanWord(q.v.w)} = ${shortVi(q.v.vi)}`;
        speak(cleanWord(q.v.w));
        const n = box.querySelector('#rnext');
        n.hidden = false;
        n.focus();
        n.onclick = () => {
          i++;
          draw();
        };
      };
    });
  }

  draw();
}

function playCambridgeTrack(cdNum, trackName, label, btnEl, playerContainerId) {
  const trackKey = `cd${cdNum}_${trackName}`;
  const audioPath = `audio/pronun/cd${cdNum}/${trackName}`;
  const pContainer = playerContainerId ? document.getElementById(playerContainerId) : null;

  if (currentCambridgeAudio && currentCambridgeTrackKey === trackKey) {
    if (!currentCambridgeAudio.paused) {
      currentCambridgeAudio.pause();
      if (btnEl) btnEl.innerHTML = `Original Audio (${label || trackName})`;
      return;
    } else {
      currentCambridgeAudio.play();
      if (btnEl) btnEl.innerHTML = `Pause (${label || trackName})`;
      return;
    }
  }

  if (currentCambridgeAudio) {
    currentCambridgeAudio.pause();
    currentCambridgeAudio = null;
    document.querySelectorAll('.cambridge-play-btn').forEach(b => {
      if (b.dataset.origLabel) b.innerHTML = b.dataset.origLabel;
    });
  }

  const audio = new Audio(audioPath);
  currentCambridgeAudio = audio;
  currentCambridgeTrackKey = trackKey;

  if (btnEl) {
    if (!btnEl.dataset.origLabel) btnEl.dataset.origLabel = btnEl.innerHTML;
    btnEl.innerHTML = `Loading audio...`;
  }

  audio.play().then(() => {
    if (btnEl) btnEl.innerHTML = `Pause (${label || trackName})`;
  }).catch(err => {
    console.error('Lỗi phát Cambridge audio:', err);
    if (btnEl) btnEl.innerHTML = btnEl.dataset.origLabel || `Original Audio`;
    alert(`Audio file ${audioPath} not found. Please ensure it is located in web/audio/pronun/cd${cdNum}/`);
  });

  audio.ontimeupdate = () => {
    if (pContainer) {
      const cur = audio.currentTime;
      const dur = audio.duration || 0;
      const timeEl = pContainer.querySelector('.cambridge-time-text');
      const seekEl = pContainer.querySelector('.cambridge-seek-bar');
      if (timeEl) {
        const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2, '0');
        timeEl.textContent = `${fmt(cur)} / ${fmt(dur)}`;
      }
      if (seekEl && dur > 0) {
        seekEl.value = (cur / dur) * 100;
      }
    }
  };

  audio.onseeked = () => {
    if (audio.ontimeupdate) audio.ontimeupdate();
  };

  audio.onended = () => {
    if (btnEl) btnEl.innerHTML = btnEl.dataset.origLabel || `Original Audio (${label || trackName})`;
    if (pContainer) {
      const timeEl = pContainer.querySelector('.cambridge-time-text');
      const seekEl = pContainer.querySelector('.cambridge-seek-bar');
      const dur = audio.duration || 0;
      const fmt = s => Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2, '0');
      if (timeEl) timeEl.textContent = `0:00 / ${fmt(dur)}`;
      if (seekEl) seekEl.value = 0;
    }
    audio.currentTime = 0;
  };
}

function seekCambridgeTrack(percent) {
  if (currentCambridgeAudio && currentCambridgeAudio.duration) {
    currentCambridgeAudio.currentTime = (Number(percent) / 100) * currentCambridgeAudio.duration;
    if (currentCambridgeAudio.ontimeupdate) currentCambridgeAudio.ontimeupdate();
  }
}

function skipCambridgeTrack(seconds) {
  if (currentCambridgeAudio) {
    currentCambridgeAudio.currentTime = Math.max(0, Math.min(currentCambridgeAudio.duration || 999, currentCambridgeAudio.currentTime + Number(seconds)));
    if (currentCambridgeAudio.ontimeupdate) currentCambridgeAudio.ontimeupdate();
  }
}
let currentCambridgeSegmentCode = null;

function playCambridgeSegment(cdNum, trackName, startSec, endSec, code, btnEl) {
  const audioPath = `audio/pronun/cd${cdNum}/${trackName}`;

  if (currentCambridgeAudio && currentCambridgeSegmentCode === code) {
    if (!currentCambridgeAudio.paused) {
      currentCambridgeAudio.pause();
      if (btnEl) btnEl.classList.remove('playing');
      return;
    } else {
      currentCambridgeAudio.play();
      if (btnEl) btnEl.classList.add('playing');
      return;
    }
  }

  if (currentCambridgeAudio) {
    currentCambridgeAudio.pause();
    document.querySelectorAll('.cambridge-segment-btn').forEach(b => b.classList.remove('playing'));
    document.querySelectorAll('.cambridge-play-btn').forEach(b => {
      if (b.dataset.origLabel) b.innerHTML = b.dataset.origLabel;
    });
  }

  const audio = new Audio(audioPath);
  currentCambridgeAudio = audio;
  currentCambridgeSegmentCode = code;

  audio.currentTime = startSec;
  audio.play().then(() => {
    if (btnEl) btnEl.classList.add('playing');
  }).catch(err => {
    console.error('Audio play error:', err);
    alert(`Unable to play audio segment ${code} from ${audioPath}`);
  });

  audio.ontimeupdate = () => {
    if (audio.currentTime >= endSec) {
      audio.pause();
      if (btnEl) btnEl.classList.remove('playing');
      currentCambridgeAudio = null;
      currentCambridgeSegmentCode = null;
    }
  };

  audio.onended = () => {
    if (btnEl) btnEl.classList.remove('playing');
    currentCambridgeAudio = null;
    currentCambridgeSegmentCode = null;
  };
}
window.playCambridgeSegment = playCambridgeSegment;

window.playCambridgeTrack = playCambridgeTrack;
window.seekCambridgeTrack = seekCambridgeTrack;
window.skipCambridgeTrack = skipCambridgeTrack;

function getUnitExState(unitId) {

    const saved = store.get('pronun_ex:' + key, null);
    unitExState[key] = (saved && typeof saved === 'object') ? saved : {};

  return unitExState[key];
}

  const key = String(unitId);
  const uState = getUnitExState(key);
  if (exId && uState[exId]) {

  store.set('pronun_ex:' + key, uState);

window.playPairCompare = function(w1, w2) {
  speak(w1);
  setTimeout(() => speak(w2), 800);

function setupEarQuiz(quizBox, pair) {
  if (!quizBox) return;
  const randItem = pair.items[Math.floor(Math.random() * pair.items.length)];
  const isW1 = Math.random() > 0.5;
  const targetWord = isW1 ? randItem.w1 : randItem.w2;

  quizBox.innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <button class="btn primary" id="btn-quiz-spk" style="padding:10px 16px;font-size:14px;font-weight:700">
        Listen to Mystery Word
      </button>
      <div style="display:flex;gap:10px">
        <button class="btn" id="btn-ans-1" style="font-size:15px;font-weight:700;padding:10px 18px">${esc(randItem.w1)}</button>
        <button class="btn" id="btn-ans-2" style="font-size:15px;font-weight:700;padding:10px 18px">${esc(randItem.w2)}</button>
      </div>
    </div>
    <div id="quiz-feedback" style="margin-top:10px;font-weight:600;min-height:24px"></div>
  `;

  quizBox.querySelector('#btn-quiz-spk').onclick = () => speak(targetWord);
  // Auto speak on first load
  setTimeout(() => speak(targetWord), 300);

  function checkAns(selected) {
    const fb = quizBox.querySelector('#quiz-feedback');
    if (selected === targetWord) {
      fb.className = 'fb ok';
      fb.innerHTML = `✓ Correct! The spoken word was <b>${esc(targetWord)}</b> (${isW1 ? esc(randItem.ipa1) : esc(randItem.ipa2)} - ${isW1 ? esc(randItem.vi1) : esc(randItem.vi2)}).`;
    } else {
      fb.className = 'fb no';
      fb.innerHTML = `✕ Incorrect. The audio said <b>${esc(targetWord)}</b>. Click to listen again to compare.`;
    }
  }

  quizBox.querySelector('#btn-ans-1').onclick = () => checkAns(randItem.w1);
  quizBox.querySelector('#btn-ans-2').onclick = () => checkAns(randItem.w2);
}

            <!-- Sentences or Phrases with Segment Button & Book Illustration -->

              <div style="margin-top:16px">

                    <button type="button" class="cambridge-segment-btn"

                            <div style="flex:1;min-width:200px">
                              <div style="font-size:15px;font-weight:700;color:var(--ink)">${sIdx + 1}. "${esc(enText)}"</div>

                            <div style="display:flex;gap:6px">
                              <button class="btn" onclick="speak('${esc(enText)}')" style="display:inline-flex;align-items:center;gap:4px;padding:5px 10px;font-size:12px">

                              <button class="btn rec-btn" data-rec-text="${esc(enText)}" data-rec-id="u-s-${u.id}-${sec.letter}-${sIdx}" style="padding:5px 10px;font-size:12px">

                              </button>
                            </div>

                          <div id="slot-u-s-${u.id}-${sec.letter}-${sIdx}" class="rec-slot"></div>

                      `;
                    }).join('')}
                  </div>
                  ${sec.illustration ? `
                    <div class="unit-ex-illustration-box">
                      <img src="${esc(sec.illustration)}" alt="${esc(sec.illustrationCaption || '')}" />

                    </div>

            <!-- Notes with Segment Buttons (A10e, A10f, A10g) -->
            ${sec.notes && sec.notes.length > 0 ? `
              <div style="margin-top:14px;display:flex;flex-direction:column;gap:8px">
                ${sec.notes.map(n => `
                  <div class="unit-note-box">
                    <div style="font-weight:800;color:#d97706;margin-bottom:4px;display:flex;align-items:center;gap:6px">
                      ${n.audioSegment ? `
                        <button type="button" class="cambridge-segment-btn"
                          onclick="playCambridgeSegment(${n.audioSegment.cd}, '${esc(n.audioSegment.track)}', ${n.audioSegment.start}, ${n.audioSegment.end}, '${esc(n.audioSegment.code)}', this)"
                          title="Listen to ${esc(n.audioSegment.code)} (Audio note)">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;vertical-align:-1.5px;margin-right:3px"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>${esc(n.audioSegment.code)}
                        </button>
                      ` : ''}
                      <span>Note: ${esc(n.tag)}:</span>
                    </div>
                    <div style="color:var(--ink)">${esc(n.content)}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `).join('')}

        <!-- Bottom CTA to Exercises -->
        <div style="background:linear-gradient(135deg, rgba(225,29,72,0.06), rgba(99,102,241,0.06));border:1.5px dashed var(--accent);border-radius:12px;padding:20px;text-align:center">
          <div style="font-size:16px;font-weight:800;margin-bottom:6px">Unit ${u.id} Lessons Completed?</div>
          <div style="font-size:13.5px;color:var(--muted);margin-bottom:12px">Proceed to exercises to complete all practice tasks from the textbook!</div>
          <button class="btn primary" id="btn-jump-exercises" style="padding:10px 24px;font-size:14.5px;font-weight:700">
            Start Unit ${u.id} Exercises →
          </button>
        </div>
      </div>
    `;

    const jumpBtn = box.querySelector('#btn-jump-exercises');
    if (jumpBtn) {
      jumpBtn.onclick = () => {
        curUnitViewMode = 'exercises';
        renderUnitsTab(container);
      };
    }
  } else {
    box.innerHTML = `
      <div style="background:var(--sunk);padding:14px;border-radius:8px;font-size:14px;line-height:1.6;margin-bottom:16px">
        <strong>Pronunciation Rule:</strong> ${esc(u.rule)}
      </div>
      <div style="margin-top:14px">
        <div style="font-size:14px;font-weight:800;margin-bottom:8px">Target Vocabulary:</div>
        <div class="pronun-word-grid">
          ${u.words.map((w, idx) => `
            <div class="pronun-word-card">
              <div>
                <div style="font-size:15px;font-weight:800">${esc(w.w)}</div>
                <div style="font-size:12px;color:var(--muted)">${esc(w.ipa)} · ${esc(w.vi)}</div>
              </div>
              <div style="display:flex;align-items:center;gap:4px">
                <button class="icon-btn" onclick="speak('${esc(w.w)}')" title="Listen to pronunciation" style="width:34px;height:34px">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                </button>
                <button class="icon-btn rec-btn" data-rec-text="${esc(w.w)}" data-rec-id="u-w-${u.id}-${idx}" title="Practice speaking" style="width:34px;height:34px">
                  ${MIC_ICON}
                </button>
              </div>
            </div>
            <div id="slot-u-w-${u.id}-${idx}" class="rec-slot" style="grid-column:1/-1"></div>
          `).join('')}
        </div>
      </div>
      <div style="margin-top:20px">
        <div style="font-size:14px;font-weight:800;margin-bottom:8px">Practice Sentences:</div>
        <div>
          ${u.sentences.map((sent, idx) => `
            <div class="sentence-drill-item">
              <div class="sentence-top-bar">
                <div style="font-size:15px;font-weight:700;color:var(--ink);flex:1">${idx + 1}. "${esc(sent)}"</div>
                <div style="display:flex;gap:6px">
                  <button class="btn" onclick="speak('${esc(sent)}')" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;font-size:12.5px">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    <span>Listen</span>
                  </button>
                  <button class="btn rec-btn" data-rec-text="${esc(sent)}" data-rec-id="u-s-${u.id}-${idx}" style="padding:6px 12px;font-size:12.5px">
                    ${MIC_ICON}
                    <span>Speak</span>
                  </button>
                </div>
              </div>
              <div id="slot-u-s-${u.id}-${idx}" class="rec-slot"></div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
}

function renderUnitExercises(u, box, container) {
  const uState = getUnitExState(u.id);

  const exList = u.exercises || [];
  if (exList.length === 0) {
    box.innerHTML = `
      <div style="background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center">
        <div style="font-size:18px;font-weight:700;color:var(--accent);margin-bottom:8px">Unit Completed</div>
        <div style="font-size:16px;font-weight:800;color:var(--ink)">Unit ${u.id} Practice Exercises</div>
        <div style="font-size:13.5px;color:var(--muted);margin:8px auto 16px;max-width:460px">
          Train ear distinction and practice speaking target vocabulary and sentence patterns from this unit.
        </div>
        <div style="display:flex;justify-content:center;gap:10px">
          <button class="btn primary" onclick="speak('${esc(u.words[0] ? u.words[0].w : 'hello')}')">Listen to Unit Vocabulary</button>
          <button class="btn" onclick="curUnitViewMode='sections';renderUnitsTab(document.querySelector('#pronun-container')||document.body)">Review Lesson</button>
        </div>
      </div>
    `;
    return;
  }

  const completedCount = exList.filter(ex => uState[ex.id] && uState[ex.id].checked).length;
  const pct = Math.round((completedCount / exList.length) * 100);

  box.innerHTML = `
    <!-- Exercise Progress Bar -->
    <div style="background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div style="flex:1;min-width:200px">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:700;margin-bottom:6px">
          <span>Unit ${u.id} Exercises Progress:</span>
          <span style="display:inline-flex;align-items:center;gap:10px">
            <span id="pronun-autosave-badge" style="font-size:11.5px;font-weight:600;color:var(--good)">✓ Auto-saved</span>
            <span style="color:var(--accent)">${completedCount}/${exList.length} completed (${pct}%)</span>
          </span>
        </div>
        <div style="height:8px;background:var(--line);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg, #E11D48, #6366F1);border-radius:4px;transition:width 0.3s"></div>
        </div>
      </div>
      <div>
        <button class="btn ghost" id="btn-reset-exercises" style="font-size:12.5px;padding:6px 12px">
          Reset Exercises
        </button>
      </div>
    </div>

    <!-- Render Each Exercise Card -->
    <div style="display:flex;flex-direction:column;gap:22px">
      ${exList.map((ex, exIdx) => renderSingleExercise(u, ex, exIdx, uState)).join('')}
    </div>
  `;

  box.querySelector('#btn-reset-exercises').onclick = () => {
    if (confirm('Are you sure you want to reset all exercise answers for this unit?')) {
      unitExState[String(u.id)] = {};
      store.set('pronun_ex:' + u.id, {});
      renderUnitsTab(container);
    }
  };

  bindAllExerciseEvents(u, box, container);
}
