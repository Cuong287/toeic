function highlightOne(s, w){
  const stem = cleanWord(w).toLowerCase().split(' ')[0].replace(/e$/,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const multi = cleanWord(w).split(' ').length > 1;
  const re = multi ? new RegExp('(' + cleanWord(w).split(' ').map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+') + ')','i')
                   : new RegExp('\\b(' + stem + '\\w*)','i');
  return esc(s).replace(re, '<mark>$1</mark>');
}
function quiz(t, box){
  const pool = t.vocab.filter(v => v.vi);
  if (pool.length < 2) { box.innerHTML = '<div class="empty">Chủ đề này chưa đủ từ có nghĩa để làm trắc nghiệm.</div>'; return; }
  let dir = store.get('qdir','en');
  const all = vocabPool();
  const qs = shuffle(pool).slice(0, Math.min(10, pool.length)).map(v => {
    const same = shuffle(pool.filter(x => x !== v && shortVi(x.vi) !== shortVi(v.vi)));
    const extra = shuffle(all.filter(x => !pool.includes(x)));
    const ds = same.concat(extra).slice(0,3);
    return { v, opts: shuffle([v, ...ds]) };
  });
  let i = 0, score = 0, wrong = [];
  function draw(){
    if (i >= qs.length){
      const pct = Math.round(score / qs.length * 100);
      const best = store.get('best:' + t.id, 0); if (pct > best) store.set('best:' + t.id, pct);
      box.innerHTML = `<div class="card"><div class="eyebrow">Kết quả</div><div class="big">${score}/${qs.length}</div>
        <div class="hint">Điểm cao nhất của chủ đề này: ${Math.max(pct,best)}%</div>
        ${wrong.length?`<div><b>Cần ôn lại</b><ul class="wrong-list">${wrong.map(v=>`<li><b>${esc(v.w)}</b>${v.pos?` (${esc(v.pos)})`:''}: ${esc(v.vi)}</li>`).join('')}</ul></div>`:'<div class="fb ok">Đúng hết. Thử chiều ngược lại hoặc phần viết từ.</div>'}
        <div class="row"><button class="btn primary" id="again">Làm lại với câu mới</button></div></div>`;
      box.querySelector('#again').onclick = () => quiz(t, box);
      renderSide(); return;
    }
    const q = qs[i];
    const prompt = dir === 'en' ? `${esc(q.v.w)}<small>${q.v.pos?esc(q.v.pos)+' · ':''}chọn nghĩa tiếng Việt đúng</small>` : `${esc(shortVi(q.v.vi))}<small>${q.v.pos?esc(q.v.pos)+' · ':''}chọn từ tiếng Anh đúng</small>`;
    box.innerHTML = `<div class="row between"><div class="seg" id="dir"><button data-d="en">Anh → Việt</button><button data-d="vi">Việt → Anh</button></div><span class="hint">Câu ${i+1}/${qs.length} · đúng ${score}</span></div>
      <div class="card"><div class="qprog"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="qprompt">${prompt}</div>
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${'ABCD'[k]}</span><span>${esc(dir==='en'?shortVi(o.vi):cleanWord(o.w))}</span></button>`).join('')}</div>
      <div class="row between"><span class="fb" id="fb"></span><button class="btn primary" id="next" hidden>Câu tiếp</button></div></div>`;
    box.querySelectorAll('#dir button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.d===dir)); b.onclick = () => { if (b.dataset.d!==dir){ store.set('qdir', b.dataset.d); quiz(t, box);} }; });
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      const pick = q.opts[+b.dataset.k], ok = pick === q.v;
      box.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (q.opts[+x.dataset.k] === q.v) x.classList.add('ok'); });
      if (!ok) { b.classList.add('no'); wrong.push(q.v); } else score++;
      const fb = box.querySelector('#fb'); fb.className = 'fb ' + (ok?'ok':'no');
      fb.textContent = ok ? 'Chính xác.' : `Chưa đúng. ${cleanWord(q.v.w)} = ${shortVi(q.v.vi)}`;
      if (dir==='en' || ok) speak(cleanWord(q.v.w));
      const n = box.querySelector('#next'); n.hidden = false; n.focus();
      n.onclick = () => { i++; draw(); };
    });
  }
  draw();
}
function writeDrill(t, box){
  const e = enr(t.id), ev = e ? e.vocab : {};
  const pool = shuffle(t.vocab.filter(v => v.vi));
  if (!pool.length) { box.innerHTML = '<div class="empty">Chủ đề này chưa có từ để luyện viết.</div>'; return; }
  let i = 0, score = 0, wrong = [];
  function draw(){
    if (i >= pool.length){
      box.innerHTML = `<div class="card"><div class="eyebrow">Hoàn thành</div><div class="big">${score}/${pool.length}</div>
        ${wrong.length?`<div><b>Viết sai hoặc bỏ qua</b><ul class="wrong-list">${wrong.map(v=>`<li><b>${esc(cleanWord(v.w))}</b>: ${esc(v.vi)}</li>`).join('')}</ul></div>`:''}
        <div class="row"><button class="btn primary" id="again">Luyện lại</button></div></div>`;
      box.querySelector('#again').onclick = () => writeDrill(t, box); return;
    }
    const v = pool[i], ans = answers(v.w), x = ev[v.w];
    let hintLvl = 0, done = false;
    const gap = x ? esc(x[1]).replace(new RegExp('\\b' + cleanWord(v.w).toLowerCase().split(' ')[0].replace(/e$/,'') + '[a-z]*(?:\\s+[a-z]+){' + (cleanWord(v.w).split(' ').length-1) + '}','i'), '_____') : '';
    box.innerHTML = `<div class="card"><div class="qprog"><i style="width:${i/pool.length*100}%"></i></div>
      <div class="row between"><span class="eyebrow">Từ ${i+1}/${pool.length} · đúng ${score}</span>${v.pos?`<span class="pos">${esc(v.pos)}</span>`:''}</div>
      <div class="qprompt">${esc(v.vi)}</div>
      ${x?`<div class="ex">${gap}<span class="vi">${esc(x[2])}</span></div>`:''}
      <form id="wf" class="row" autocomplete="off"><input class="field" id="win" style="flex:1 1 220px" placeholder="Gõ từ tiếng Anh" autocapitalize="off" spellcheck="false"><button class="btn primary" type="submit" id="wchk">Kiểm tra</button></form>
      <div class="row between"><div class="row"><button class="btn ghost" id="whint" type="button">Gợi ý chữ cái</button><button class="btn ghost" id="wskip" type="button">Xem đáp án</button></div><span class="fb" id="wfb"></span></div></div>`;
    const inp = box.querySelector('#win'); inp.focus();
    const fb = box.querySelector('#wfb');
    const finish = (ok) => {
      done = true; inp.classList.add(ok?'ok':'no'); fb.className = 'fb ' + (ok?'ok':'no');
      fb.textContent = ok ? 'Chính xác.' : 'Đáp án: ' + cleanWord(v.w);
      if (ok) score++; else wrong.push(v);
      speak(cleanWord(v.w));
      const b = box.querySelector('#wchk'); b.textContent = 'Từ tiếp'; b.focus();
      box.querySelector('#whint').disabled = true; box.querySelector('#wskip').disabled = true;
    };
    box.querySelector('#wf').onsubmit = ev2 => {
      ev2.preventDefault();
      if (done) { i++; draw(); return; }
      const val = norm(inp.value); if (!val) return;
      if (ans.includes(val)) finish(true);
      else { inp.classList.add('no'); fb.className = 'fb no'; fb.textContent = 'Chưa đúng, thử lại hoặc xem gợi ý.'; setTimeout(()=>inp.classList.remove('no'), 700); }
    };
    box.querySelector('#whint').onclick = () => {
      const w = cleanWord(v.w); hintLvl = Math.min(hintLvl+1, Math.max(1, w.length-1));
      fb.className = 'fb'; fb.textContent = w.split('').map((c,k)=> c===' ' ? '  ' : (k<hintLvl ? c : '_')).join(' ');
    };
    box.querySelector('#wskip').onclick = () => finish(false);
  }
  draw();
}

// ---------- PART 2 ----------
const OPS = { '=':['eq','='], '->':['to','→'], '→':['to','→'], '~':['sim','≈'], '><':['vs','≠'] };
function relLine(line){
  const toks = line.split(/\s*(=|->|→|~|><)\s*/).filter(s => s !== '');
  return '<div class="rel">' + toks.map(tk => OPS[tk] ? `<span class="op ${OPS[tk][0]}">${OPS[tk][1]}</span>` : `<span class="chip">${esc(tk)}</span>`).join('') + '</div>';
}
function synPairs(t){
  const pairs = [], seen = new Set();
  t.notes.forEach(line => {
    line.split(/\s*(?:->|→|><)\s*/).forEach(seg => {
      const terms = seg.split(/\s*[=~]\s*/).map(x => x.replace(/\(.*?\)/g,'').replace(/\+.*$/,'').trim()).filter(x => x && x.length < 32 && !VN.test(x));
      if (terms.length >= 2 && norm(terms[0]) !== norm(terms[1])) {
        const k = norm(terms[0]); if (!seen.has(k)) { seen.add(k); pairs.push([terms[0], terms[1]]); }
      }
    });
  });
  return pairs;
}
function part2(t, el){
  const e = enr(t.id);
  let h = '';
  if (t.notes.length){
    h += `<h2 class="sec">Ghi chú trong tài liệu</h2>
      <div class="legend"><span class="op eq">=</span>đồng nghĩa <span class="op sim">≈</span>gần nghĩa <span class="op to">→</span>chuyển loại từ, cụm hay dùng <span class="op vs">≠</span>dễ nhầm</div>
      <div class="panel" style="gap:8px">${t.notes.map(relLine).join('')}</div>`;
  } else h += '<div class="empty">Tài liệu không có ghi chú họ từ, đồng nghĩa cho chủ đề này.</div>';
  const pairs = synPairs(t);
  if (pairs.length >= 2) h += `<h2 class="sec">Ghép cặp đồng nghĩa</h2><p class="hint" style="margin:0">Chọn một từ bên trái rồi chọn từ cùng nghĩa bên phải.</p><div class="card" id="mg"></div>`;
  if (e && e.usage.length) h += `<h2 class="sec">Lưu ý khi dùng</h2><div class="usage">${e.usage.map(u=>`<div><b>${esc(u[0])}</b>${esc(u[1])}</div>`).join('')}</div>`;
  if (e && e.forms.length){
    h += `<h2 class="sec">Chia đúng dạng từ</h2><p class="hint" style="margin:0">Điền dạng đúng của từ trong ngoặc. Bấm Enter hoặc nút Kiểm tra.</p>
      <div class="forms">${e.forms.map((f,k)=>`<form class="fitem" data-k="${k}" autocomplete="off"><div><div>${esc(f[0]).replace('____','<b>_____</b>')}</div><div class="base">(${esc(f[1])})</div></div><div class="row" style="flex-wrap:nowrap"><input class="field" id="wf-${t.id}-${k}" style="padding:7px 10px;font-size:15px" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Kiểm tra</button></div><div class="ans" hidden></div></form>`).join('')}</div>`;
  }
  el.innerHTML = h;
  if (pairs.length >= 2) matchGame(shuffle(pairs).slice(0,6), el.querySelector('#mg'));
  if (e && e.forms.length) el.querySelectorAll('.fitem').forEach(f => f.onsubmit = ev => {
    ev.preventDefault();
    const it = e.forms[+f.dataset.k], inp = f.querySelector('input'), a = f.querySelector('.ans');
    const ok = it[2].map(norm).includes(norm(inp.value));
    inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no');
    a.hidden = false; a.style.color = ok ? 'var(--good)' : 'var(--bad)';
    a.textContent = ok ? 'Đúng.' : 'Đáp án: ' + it[2].join(' / ');
  });
}
function matchGame(pairs, box){
  const L = pairs.map((p,i)=>({i, s:p[0]})), R = shuffle(pairs.map((p,i)=>({i, s:p[1]})));
  let sel = null, done = 0;
  box.innerHTML = `<div class="match"><div class="col" id="ml">${L.map(x=>`<button class="mbtn" data-i="${x.i}">${esc(x.s)}</button>`).join('')}</div><div class="col" id="mr">${R.map(x=>`<button class="mbtn" data-i="${x.i}">${esc(x.s)}</button>`).join('')}</div></div><div class="row between"><span class="hint" id="mst">0/${pairs.length} cặp</span><button class="btn ghost" id="mre">Xáo lại</button></div>`;
  box.querySelectorAll('#ml .mbtn').forEach(b => b.onclick = () => { if (b.classList.contains('done')) return; box.querySelectorAll('#ml .mbtn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel = b; });
  box.querySelectorAll('#mr .mbtn').forEach(b => b.onclick = () => {
    if (!sel || b.classList.contains('done')) return;
    if (sel.dataset.i === b.dataset.i){ sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done'); sel.disabled = b.disabled = true; sel = null; done++; box.querySelector('#mst').textContent = `${done}/${pairs.length} cặp` + (done===pairs.length?' · xong':''); }
    else { b.classList.add('err'); sel.classList.add('err'); const s2 = sel; setTimeout(()=>{ b.classList.remove('err'); s2.classList.remove('err'); }, 500); }
  });
  box.querySelector('#mre').onclick = () => matchGame(shuffle(pairs), box);
}

const BLANK = /[…\.]*…{2,}[…\.]*/g;
function part4(t, el){
  const e = enr(t.id), secs = t.sections.map((s,si)=>({s,si})).filter(x => x.s.type === 'gaps');
  if (!secs.length){ el.innerHTML = '<div class="empty">Tài liệu không có bài nghe điền từ cho chủ đề này.</div>'; return; }
  const hasAud = !!AUD[t.id];
  let h = `<div class="note"><b>Cách làm:</b> ${hasAud?'bấm phát audio ở mỗi bài, nghe rồi điền vào chỗ trống. Có thể giảm tốc độ hoặc tua lại 3 giây.':'nghe audio ETS theo mã câu ghi ở mỗi bài rồi điền.'} Tài liệu không kèm đáp án. ${e?'Gợi ý đáp án ở chủ đề này do AI suy ra từ ngữ cảnh, chưa đối chiếu với audio, nên hãy tin vào điều bạn nghe được.':'Ô bạn điền được tự lưu trên trình duyệt này.'}</div>`;
  secs.forEach(({s,si}) => {
    const groups = []; let cur = null;
    s.blocks.forEach((b,bi) => {
      if (b.k === 'audio' || !cur){ cur = { head: b.k==='audio' ? b : null, lines: [] }; groups.push(cur); if (b.k==='audio') return; }
      cur.lines.push({ b, bi });
    });
    groups.forEach((g,gi) => {
      const has = e && e.gap && e.gap[si] && g.lines.some(l => e.gap[si][l.bi]);
      h += `<div class="audio-h"><h3>${g.head?esc(g.head.label):'Bài nghe'} <span>${g.head?srcLabel(g.head.src):''}</span></h3>
        <div class="row">${has?`<button class="btn" data-chk="${si}-${gi}">Đối chiếu gợi ý</button><button class="btn" data-vi="${si}-${gi}">Hiện bản dịch</button>`:''}<button class="btn" data-trt="${si}-${gi}">${store.get('trhide:'+t.id+'-'+si+'-'+gi,false)?'Hiện ô tự dịch':'Ẩn ô tự dịch'}</button><button class="btn ghost" data-clr="${si}-${gi}">Xóa bài điền</button></div></div>`;
      const an = g.head ? (g.head.label.match(/\d+/)||[])[0] : null, file = an && AUD[t.id] && AUD[t.id][an];
      if (file){ const aid = `au-${t.id}-${si}-${gi}`, rate = store.get('rate', 1);
        h += `<div class="player"><audio id="${aid}" src="${file}" preload="metadata" controls></audio><div class="row between"><div class="seg" data-speed="${aid}">${[0.75,0.9,1,1.25].map(r=>`<button data-r="${r}" aria-pressed="${r===rate}">${r}×</button>`).join('')}</div><button class="btn" data-back="${aid}">Tua lại 3 giây</button></div></div>`; }
      g.lines.forEach(({b,bi}) => {
        let gIdx = 0;
        const html = esc(b.text).replace(BLANK, () => { const id = `g-${t.id}-${si}-${bi}-${gIdx++}`; return `<input class="gin" id="${id}" data-key="${id}" data-grp="${si}-${gi}" data-bi="${bi}" data-gi="${gIdx-1}" value="${esc(store.get(id,''))}" aria-label="Chỗ trống ${gIdx}" autocapitalize="off" spellcheck="false">`; });
        const ref = e && e.gap && e.gap[si] && e.gap[si][bi];
        const tk = `gt-${t.id}-${si}-${bi}`;
        h += `<div class="gline" data-grp="${si}-${gi}"><div>${html}</div><div class="sug" data-sug="${si}-${bi}" hidden></div>
          <div class="gtr-wrap" data-trgrp="${si}-${gi}"${store.get('trhide:'+t.id+'-'+si+'-'+gi,false)?' hidden':''}><textarea class="gtr" id="${tk}" data-key="${tk}" rows="1" placeholder="Bạn tự dịch câu này…">${esc(store.get(tk,''))}</textarea></div>
          ${ref?`<div class="gvi" data-vigrp="${si}-${gi}" hidden><small>Bản dịch mẫu</small>${esc(ref[1])}</div>`:''}</div>`;
      });
    });
  });
  el.innerHTML = h;
  el.querySelectorAll('audio').forEach(a => {
    a.playbackRate = store.get('rate', 1);
    a.addEventListener('play', () => el.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); }));
    a.addEventListener('loadedmetadata', () => { a.playbackRate = store.get('rate', 1); });
  });
  el.querySelectorAll('[data-speed]').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => {
    const r = +b.dataset.r; store.set('rate', r);
    el.querySelectorAll('audio').forEach(a => a.playbackRate = r);
    el.querySelectorAll('[data-speed] button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.r === r)));
  }));
  el.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { const a = el.querySelector('#' + b.dataset.back); if (a){ a.currentTime = Math.max(0, a.currentTime - 3); a.play().catch(()=>{}); } });
  const grow = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; };
  el.querySelectorAll('.gtr').forEach(ta => { grow(ta); ta.addEventListener('input', () => { store.set(ta.dataset.key, ta.value); grow(ta); }); });
  el.querySelectorAll('[data-trt]').forEach(b => b.onclick = () => {
    const k = 'trhide:' + t.id + '-' + b.dataset.trt, hide = !store.get(k, false); store.set(k, hide);
    el.querySelectorAll(`[data-trgrp="${b.dataset.trt}"]`).forEach(w => { w.hidden = hide; if (!hide) w.querySelectorAll('.gtr').forEach(grow); });
    b.textContent = hide ? 'Hiện ô tự dịch' : 'Ẩn ô tự dịch';
  });
  el.querySelectorAll('.gin').forEach(inp => inp.addEventListener('input', () => { store.set(inp.dataset.key, inp.value); inp.classList.remove('ok','diff'); }));
  el.querySelectorAll('[data-vi]').forEach(b => b.onclick = () => {
    const vs = el.querySelectorAll(`[data-vigrp="${b.dataset.vi}"]`); const show = vs[0] && vs[0].hidden;
    vs.forEach(v => v.hidden = !show); b.textContent = show ? 'Ẩn bản dịch' : 'Hiện bản dịch';
  });
  el.querySelectorAll('[data-chk]').forEach(b => b.onclick = () => {
    const [si] = b.dataset.chk.split('-');
    const inputs = el.querySelectorAll(`.gin[data-grp="${b.dataset.chk}"]`);
    const sugs = {};
    inputs.forEach(inp => {
      const ref = e.gap[si] && e.gap[si][inp.dataset.bi]; if (!ref) return;
      const sug = ref[0][+inp.dataset.gi] || '';
      const okList = sug.split('/').map(norm);
      const ok = inp.value.trim() && okList.includes(norm(inp.value));
      inp.classList.remove('ok','diff'); inp.classList.add(ok ? 'ok' : 'diff');
      (sugs[inp.dataset.bi] = sugs[inp.dataset.bi] || []).push(`(${+inp.dataset.gi+1}) ${sug}`);
    });
    Object.entries(sugs).forEach(([bi, arr]) => { const s = el.querySelector(`[data-sug="${si}-${bi}"]`); if (s){ s.hidden = false; s.textContent = 'Gợi ý: ' + arr.join(' · '); } });
  });
  el.querySelectorAll('[data-clr]').forEach(b => b.onclick = () => {
    el.querySelectorAll(`.gin[data-grp="${b.dataset.clr}"]`).forEach(inp => { inp.value=''; store.set(inp.dataset.key,''); inp.classList.remove('ok','diff'); });
    el.querySelectorAll(`.gline[data-grp="${b.dataset.clr}"] .sug`).forEach(s => s.hidden = true);
  });
}

// ---------- render ----------
function render(){
  const t = TOPICS[S.t-1];
  renderSide(); renderHead(t);
  const el = $('#panel');
  [null, part1, part2, part3, part4][S.p](t, el);
}
if (!readHash()) { const last = store.get('last', null); if (last && TOPICS[last.t-1]) { S.t = last.t; S.p = last.p; } }
const _render = render;
render = function(){ _render(); store.set('last', { t:S.t, p:S.p }); };
try { window.speechSynthesis && window.speechSynthesis.getVoices(); } catch(e){}
render();
</script>
