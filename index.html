<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563EB">
<style>body{margin:0}[hidden]{display:none!important}


.rec-download-btn {
  background: var(--sunk);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.15s;
}
.rec-download-btn:hover {
  background: #1D5BBF;
  color: #FFFFFF;
  border-color: #1D5BBF;
}
.rec-download-btn svg { width: 13px; height: 13px; }
.rec-history-card {
  margin-top: 20px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.rec-history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: 6px;
  background: var(--sunk);
  margin-bottom: 6px;
  gap: 10px;
  flex-wrap: wrap;
}
.rec-history-item .rec-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* Voice Recording & Speaking Practice Styles */
.mini-rec-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--muted);
  padding: 3px 5px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  vertical-align: middle;
}
.mini-rec-btn svg { width: 14px; height: 14px; }
.mini-rec-btn:hover {
  color: #DC2626 !important;
  background: var(--surface);
}
.chip-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--sunk);
  border-radius: 6px;
  padding: 3px 7px;
  font-weight: 600;
  font-size: 14.5px;
}
.chip-item .chip {
  background: none !important;
  padding: 0 !important;
  cursor: pointer;
}
.chip-item .chip:hover {
  color: var(--accent);
  text-decoration: underline;
}
.icon-btn.rec-btn {
  color: var(--muted);
}
.icon-btn.rec-btn:hover {
  color: #DC2626;
  border-color: #DC2626;
}
.btn.rec-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  transition: all 0.15s;
}
.btn.rec-btn svg { width: 15px; height: 15px; }
.btn.rec-btn:hover {
  border-color: #DC2626;
  color: #DC2626;
}
.rec-btn.recording {
  background: #FEE2E2 !important;
  color: #DC2626 !important;
  border-color: #DC2626 !important;
  transform: scale(var(--rec-scale, 1.05)) !important;
  box-shadow: 0 0 0 calc((var(--rec-scale, 1) - 1) * 25px + 4px) rgba(220, 38, 38, 0.4) !important;
  transition: transform 0.06s ease, box-shadow 0.06s ease !important;
}
.sel-btn.btn-rec {
  background: #D97706 !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 8px rgba(217, 119, 6, 0.45) !important;
}
.sel-btn.btn-rec:hover {
  background: #B45309 !important;
  transform: translateY(-1px) !important;
}
.sel-btn.btn-rec.recording {
  background: #DC2626 !important;
  animation: recPulse 1.2s infinite ease-in-out !important;
}
@keyframes recPulse {
  0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.5); }
  70% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
  100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
}

/* Các nút điều khiển riêng của phần Luyện dịch phản xạ (tránh co cụm & tràn viền) */
.practice-rec-btn {
  width: auto !important;
  height: 32px !important;
  min-width: 82px !important;
  padding: 4px 10px !important;
  font-size: 12.5px !important;
  font-weight: 600 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 5px !important;
  border-radius: 6px !important;
  white-space: nowrap !important;
  box-sizing: border-box !important;
  background: rgba(245, 158, 11, 0.12) !important;
  color: #D97706 !important;
  border: 1px solid rgba(245, 158, 11, 0.35) !important;
  cursor: pointer !important;
  flex-shrink: 0 !important;
  transition: all 0.15s ease !important;
}
.practice-rec-btn:hover {
  background: rgba(245, 158, 11, 0.22) !important;
  border-color: #D97706 !important;
}
.practice-rec-btn.recording {
  background: #FEE2E2 !important;
  color: #DC2626 !important;
  border-color: #DC2626 !important;
}
.practice-check-btn {
  width: auto !important;
  height: 32px !important;
  padding: 4px 11px !important;
  font-size: 12.5px !important;
  font-weight: 600 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 5px !important;
  border-radius: 6px !important;
  white-space: nowrap !important;
  box-sizing: border-box !important;
  color: #2563EB !important;
  background: rgba(37, 99, 235, 0.08) !important;
  border: 1px solid rgba(37, 99, 235, 0.35) !important;
  cursor: pointer !important;
  flex-shrink: 0 !important;
  transition: all 0.15s ease !important;
}
.practice-check-btn:hover {
  background: rgba(37, 99, 235, 0.18) !important;
  border-color: #2563EB !important;
}
.practice-speak-btn {
  width: auto !important;
  height: 32px !important;
  padding: 4px 9px !important;
  font-size: 12.5px !important;
  font-weight: 600 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px !important;
  border-radius: 6px !important;
  white-space: nowrap !important;
  box-sizing: border-box !important;
  border: 1px solid var(--line) !important;
  background: var(--surface) !important;
  color: var(--ink) !important;
  cursor: pointer !important;
  flex-shrink: 0 !important;
}
.rec-slot, .rec-slot-row {
  margin-top: 8px;
  width: 100%;
}
.rec-result-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid #2563EB;
  border-radius: 8px;
  padding: 9px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.rec-player-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.rec-play-btn {
  background: #2563EB;
  color: #FFFFFF;
  border: none;
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.rec-play-btn:hover { background: #1D4ED8; }
.rec-play-btn.playing { background: #059669; }
.rec-retry-btn {
  background: var(--sunk);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.rec-retry-btn:hover { background: var(--surface); color: var(--accent); }
.rec-sample-btn {
  background: var(--sunk);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: all 0.15s;
}
.rec-sample-btn:hover {
  background: #0284C7;
  color: #FFFFFF;
  border-color: #0284C7;
}
.rec-sample-btn svg { width: 13px; height: 13px; }

/* Chi tiết đánh giá chấm điểm phát âm */
.rec-assessment-box {
  margin-top: 4px;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--sunk);
  border: 1.5px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 13px;
}
.rec-assessment-box.excellent { border-color: #22C55E; background: rgba(34, 197, 94, 0.08); }
.rec-assessment-box.good { border-color: #38BDF8; background: rgba(56, 189, 248, 0.08); }
.rec-assessment-box.fair { border-color: #F59E0B; background: rgba(245, 158, 11, 0.08); }
.rec-assessment-box.needs_work { border-color: #EF4444; background: rgba(239, 68, 68, 0.08); }

.rec-assess-header {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.rec-score-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 800;
  font-size: 13px;
}
.rec-score-pill.excellent { background: #DCFCE7; color: #15803D; }
.rec-score-pill.good { background: #E0F2FE; color: #0369A1; }
.rec-score-pill.fair { background: #FEF3C7; color: #B45309; }
.rec-score-pill.needs_work { background: #FEE2E2; color: #B91C1C; }

.rec-assess-msg {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}
.rec-words-breakdown {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12.5px;
  padding-top: 4px;
  border-top: 1px dashed var(--line);
}
.rec-words-label {
  color: var(--muted);
  font-weight: 600;
}
.rec-words-list {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.rec-word-tag {
  font-size: 12px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.rec-word-tag.correct { background: rgba(34, 197, 94, 0.2); color: #16A34A; border: 1px solid rgba(34, 197, 94, 0.4); }
.rec-word-tag.partial { background: rgba(245, 158, 11, 0.2); color: #D97706; border: 1px solid rgba(245, 158, 11, 0.4); }
.rec-word-tag.wrong { background: rgba(239, 68, 68, 0.2); color: #DC2626; border: 1px solid rgba(239, 68, 68, 0.4); text-decoration: line-through; }

.rec-spoken-text {
  font-size: 12.5px;
  color: var(--muted);
}
.rec-spoken-text .user-spoken {
  color: var(--ink);
  font-style: italic;
}
.agroup-rec-bar {
  margin-top: 14px;
  padding: 12px 14px;
  background: var(--sunk);
  border: 1px dashed var(--line);
  border-radius: var(--r);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.agroup-rec-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* Quick selection popover for Speak, Translate & Save Review Word - Thiết kế tách biệt, tránh đè lên menu Edge */
.sel-popover {
  position: absolute;
  z-index: 999999;
  background: #1E293B !important;
  color: #F8FAFC !important;
  border: 1.5px solid #38BDF8 !important;
  border-radius: 12px !important;
  padding: 8px 10px !important;
  box-shadow: 0 14px 35px rgba(0, 0, 0, 0.55), 0 3px 10px rgba(0, 0, 0, 0.3) !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 8px !important;
  font-family: var(--f-ui), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  font-size: 13.5px !important;
  line-height: 1.4 !important;
  max-width: 440px !important;
  min-width: 250px !important;
  pointer-events: auto !important;
}
.sel-popover:not(.below) {
  animation: popIn 0.15s cubic-bezier(0.16, 1, 0.3, 1) !important;
  transform: translate(-50%, -100%) !important;
  margin-top: -10px !important;
}
.sel-popover:not(.below)::after {
  content: '';
  position: absolute;
  bottom: -7px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 7px 7px 0;
  border-style: solid;
  border-color: #38BDF8 transparent transparent;
  display: block;
  width: 0;
}
.sel-popover.below {
  animation: popInBelow 0.15s cubic-bezier(0.16, 1, 0.3, 1) !important;
  transform: translate(-50%, 0) !important;
  margin-top: 8px !important;
}
.sel-popover.below::after {
  content: '';
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 0 7px 7px;
  border-style: solid;
  border-color: transparent transparent #38BDF8;
  display: block;
  width: 0;
}
@keyframes popInBelow {
  from { opacity: 0; transform: translate(-50%, -8px) scale(0.92); }
  to { opacity: 1; transform: translate(-50%, 0) scale(1); }
}
.sel-btn-bar {
  display: flex !important;
  align-items: center !important;
  gap: 6px !important;
  flex-wrap: wrap !important;
}
.sel-btn {
  border: none !important;
  border-radius: 8px !important;
  padding: 6px 12px !important;
  cursor: pointer !important;
  display: inline-flex !important;
  align-items: center !important;
  gap: 6px !important;
  font-size: 13px !important;
  font-weight: 700 !important;
  transition: all 0.15s !important;
  white-space: nowrap !important;
}
.sel-btn.btn-speak {
  background: #2563EB !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.45) !important;
}
.sel-btn.btn-speak:hover {
  background: #1D4ED8 !important;
  transform: translateY(-1px) !important;
}
.sel-btn.btn-trans {
  background: #16A34A !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 8px rgba(22, 163, 74, 0.45) !important;
}
.sel-btn.btn-trans:hover {
  background: #15803D !important;
  transform: translateY(-1px) !important;
}
.sel-btn.btn-star {
  background: #D97706 !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 8px rgba(217, 119, 6, 0.45) !important;
}
.sel-btn.btn-star:hover {
  background: #B45309 !important;
  transform: translateY(-1px) !important;
}
.sel-btn.btn-star.is-saved {
  background: #059669 !important;
  box-shadow: 0 2px 8px rgba(5, 150, 105, 0.45) !important;
}
.sel-btn.btn-close {
  background: rgba(255, 255, 255, 0.14) !important;
  color: #CBD5E1 !important;
  width: 26px !important;
  height: 26px !important;
  padding: 0 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  font-size: 13px !important;
  font-weight: 800 !important;
  border-radius: 50% !important;
  margin-left: auto !important;
}
.sel-btn.btn-close:hover {
  background: rgba(239, 68, 68, 0.35) !important;
  color: #F87171 !important;
}
.sel-btn:active {
  transform: scale(0.96) !important;
}
.sel-btn svg {
  width: 14px !important;
  height: 14px !important;
  flex-shrink: 0 !important;
}
.sel-result {
  margin-top: 2px !important;
  padding: 8px 12px !important;
  background: #0F172A !important;
  border-radius: 8px !important;
  border: 1px solid #334155 !important;
  font-size: 13.5px !important;
  color: #F1F5F9 !important;
  word-break: break-word !important;
  max-height: 160px !important;
  overflow-y: auto !important;
  line-height: 1.5 !important;
}
@keyframes popIn {
  from { opacity: 0; transform: translate(-50%, -90%) scale(0.92); }
  to { opacity: 1; transform: translate(-50%, -100%) scale(1); }
}

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.syncing svg { animation: spin 0.8s linear infinite !important; color: #38BDF8 !important; }
.btn-sync-icon {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}
.btn-sync-icon:hover {
  background: var(--surface);
  color: var(--accent);
  border-color: var(--accent);
}

<body>
<title>TOEIC Prep Hub - 45 Core Vocabulary Topics & Skills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@1,400;1,500&display=swap">
<style>
/* Layout: sổ tay học từ — cột mục lục 45 chủ đề bên trái, trang học bên phải chia 4 phần theo bài */

:root[data-theme="light"] {
  --bg:#F8FAFC !important;
  --surface:#FFFFFF !important;
  --sunk:#F1F5F9 !important;
  --ink:#0F172A !important;
  --muted:#64748B !important;
  --line:#E2E8F0 !important;
  --accent:#2563EB !important;
  --accent-ink:#FFFFFF !important;
  --accent-soft:#EFF6FF !important;
  --mark:#FEF08A !important;
  --mark-ink:#713F12 !important;
  --margin:#EF4444 !important;
  --good:#10B981 !important;
  --good-soft:#ECFDF5 !important;
  --bad:#EF4444 !important;
  --bad-soft:#FEF2F2 !important;
  --warn:#F59E0B !important;
  --warn-soft:#FFFBEB !important;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
  --r: 8px;
  --r-sm: 6px;
  color-scheme: light !important;
}

.theme-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--sunk);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 11px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.theme-btn:hover {
  background: var(--surface);
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}
.theme-btn svg {
  flex-shrink: 0;
}


/* ---------- MỤC 0: TỔNG HỢP TỪ VỰNG ---------- */
.t0-header {
  margin-bottom: 20px;
}
.t0-nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 16px;
  margin-bottom: 18px;
}
.t0-scope-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.t0-scope-wrap label {
  font-weight: 700;
  font-size: 13.5px;
  color: var(--ink);
}
.t0-scope-select {
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  max-width: 320px;
}
.t0-scope-select:focus {
  outline: 2px solid var(--accent);
}

/* Flashcard 3D Flip */
.fc-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  max-width: 600px;
  margin: 0 auto;
}
.fc-scene {
  perspective: 1200px;
  width: 100%;
  min-height: 320px;
}
.fc-card {
  width: 100%;
  min-height: 320px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
}
.fc-card.flipped {
  transform: rotateY(180deg);
}
.fc-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 16px;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  border: 2px solid var(--line);
  background: var(--surface);
  box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  user-select: none;
}
.fc-face.front {
  border-color: var(--line);
}
.fc-face.back {
  transform: rotateY(180deg);
  border-color: var(--accent);
  background: var(--surface);
}
.fc-badge {
  position: absolute;
  top: 14px;
  left: 16px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  background: var(--sunk);
  padding: 3px 8px;
  border-radius: 6px;
}
.fc-hint-flip {
  position: absolute;
  bottom: 12px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.fc-word {
  font-size: 32px;
  font-weight: 800;
  color: var(--accent);
  margin: 10px 0 6px;
  line-height: 1.2;
}
.fc-ipa {
  font-family: var(--f-ipa);
  font-size: 16px;
  color: var(--muted);
  margin-bottom: 12px;
}
.fc-vi {
  font-size: 24px;
  font-weight: 800;
  color: var(--good);
  margin: 10px 0;
}
.fc-ex-box {
  margin-top: 12px;
  padding: 10px 14px;
  background: var(--sunk);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  text-align: left;
  width: 100%;
  font-size: 14px;
  line-height: 1.5;
}
.fc-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  width: 100%;
}

/* Write Drill (Việt sang Anh) */
.write-drill-box {
  max-width: 640px;
  margin: 0 auto;
}
.wd-prompt {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.wd-vi {
  font-size: 22px;
  font-weight: 800;
  color: var(--good);
}
.wd-input-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.wd-input {
  flex: 1;
  padding: 11px 14px;
  font-size: 16px;
  font-weight: 600;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
}
.wd-input:focus {
  outline: none;
  border-color: var(--accent);
}
.wd-input.ok {
  border-color: var(--good);
  background: var(--good-soft);
}
.wd-input.no {
  border-color: var(--bad);
  background: var(--bad-soft);
}

:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --sunk:#F1F5F9; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0;
  --accent:#2563EB; --accent-ink:#FFFFFF; --accent-soft:#EFF6FF;
  --mark:#FEF08A; --mark-ink:#713F12; --margin:#EF4444;
  --good:#10B981; --good-soft:#ECFDF5; --bad:#EF4444; --bad-soft:#FEF2F2; --warn:#F59E0B; --warn-soft:#FFFBEB;
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.06), 0 1px 2px -1px rgba(0, 0, 0, 0.06);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -2px rgba(0, 0, 0, 0.06);
  --f-ui:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-ex:"Lora",Georgia,"Times New Roman",serif;
  --f-ipa:"Inter","Segoe UI","Noto Sans",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F19; --surface:#1E293B; --sunk:#151F32; --ink:#F8FAFC; --muted:#94A3B8; --line:#334155;
  --accent:#3B82F6; --accent-ink:#FFFFFF; --accent-soft:rgba(59, 130, 246, 0.15);
  --mark:#854D0E; --mark-ink:#FEF08A; --margin:#EF4444;
  --good:#34D399; --good-soft:rgba(52, 211, 153, 0.15); --bad:#F87171; --bad-soft:rgba(248, 113, 113, 0.15); --warn:#FBBF24; --warn-soft:rgba(251, 191, 36, 0.15);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
  --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F19; --surface:#1E293B; --sunk:#151F32; --ink:#F8FAFC; --muted:#94A3B8; --line:#334155;
  --accent:#3B82F6; --accent-ink:#FFFFFF; --accent-soft:rgba(59, 130, 246, 0.15);
  --mark:#854D0E; --mark-ink:#FEF08A; --margin:#EF4444;
  --good:#34D399; --good-soft:rgba(52, 211, 153, 0.15); --bad:#F87171; --bad-soft:rgba(248, 113, 113, 0.15); --warn:#FBBF24; --warn-soft:rgba(251, 191, 36, 0.15);
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
  --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.4);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
/* Mobile drawer & user bar elements */
.side-mobile-header{display:none}
.side-backdrop{display:none}
.mobile-user-slot{display:inline-flex;align-items:center;justify-content:center}
.mobile-user-btn{position:relative}
.mobile-user-btn.logged-in{border-color:var(--good)!important}

/* sidebar */
.side{border-right:1px solid var(--line);background:var(--surface);padding:20px 14px 24px max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px 14px}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:10px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.tlist a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13.5px}
.tlist a:hover{background:var(--sunk)}
.tlist a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tlist .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.tlist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist .sc{font-size:11px;color:var(--good);font-variant-numeric:tabular-nums}
.tlist .hit{font-size:11px;color:var(--muted)}
.mobile-pick{display:none}
/* main */
.main{padding-block:28px 64px;padding-left:max(16px,min(5vw,48px));padding-right:max(16px,env(safe-area-inset-right,0px),min(5vw,48px));min-width:0}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.thead{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.thead h1{margin:0;font-size:clamp(26px,4vw,36px);line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.thead .en{font-size:16px;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta .tag{color:var(--good);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px 11px;border-bottom:2.5px solid transparent;margin-bottom:-1px;color:var(--muted);font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab .k{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sunk);font-size:11.5px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .k{background:var(--accent);color:var(--accent-ink)}
.panel{display:flex;flex-direction:column;gap:18px}
.seg-sm button{padding:4px 10px!important;font-size:12.5px!important}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.hint{font-size:13px;color:var(--muted)}
.note{border-radius:var(--r);background:var(--warn-soft);color:var(--ink);padding:11px 14px;font-size:13.5px}
.note b{color:var(--warn)}
h2.sec{margin:6px 0 0;font-size:17px;font-weight:700;letter-spacing:-.005em}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn[disabled]{opacity:.45;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:var(--accent);flex:none}
.icon-btn svg{width:16px;height:16px}
/* vocab cards — index card with red margin rule */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 22px;position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.vcard::before{content:"";position:absolute;left:11px;top:12px;bottom:12px;width:1.5px;background:var(--margin);opacity:.55}
.vtop{display:flex;gap:10px;align-items:center}
.vnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:20px}
.vw{font-size:18px;font-weight:700;letter-spacing:-.01em}
.pos{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:5px}
.ipa{font-family:var(--f-ipa);color:var(--muted);font-size:13.5px}
.vtop .icon-btn{margin-left:auto}
.vvi{font-size:15px}
.ex{font-family:var(--f-ex);font-style:italic;font-size:15px;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.ex .vi{display:block;font-family:var(--f-ui);font-style:normal;font-size:13.5px;color:var(--muted);margin-top:2px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
/* quiz */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qprog{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .25s}

.qdesc-vi {
  margin-top: 10px;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.5;
  padding: 8px 12px;
  background: var(--sunk);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  display: block;
}
.qdesc-vi i {
  font-style: italic;
}

.qprompt{font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.qprompt small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 14px;font-size:15px;display:flex;gap:10px;align-items:baseline}
.opt .l{font-weight:700;color:var(--muted);font-size:13px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{font-size:14px;font-weight:600}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.field{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
.field.ok{border-color:var(--good);background:var(--good-soft)} .field.no{border-color:var(--bad);background:var(--bad-soft)}
.wrong-list{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
/* notes / relations */
.rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.chip{background:var(--sunk);border-radius:6px;padding:3px 9px;font-weight:600;font-size:14.5px}
.op{font-size:12px;font-weight:700;padding:2px 7px;border-radius:5px}
.op.eq{color:var(--good);background:var(--good-soft)}
.op.to{color:var(--accent);background:var(--accent-soft)}
.op.sim{color:var(--warn);background:var(--warn-soft)}
.op.vs{color:var(--bad);background:var(--bad-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;text-align:left;font-weight:600;min-height:44px}
.mbtn.sel{border-color:var(--accent);background:var(--accent-soft)}
.mbtn.done{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.mbtn.err{border-color:var(--bad);background:var(--bad-soft)}
.usage{display:flex;flex-direction:column;gap:10px}
.usage div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.usage b{display:block;margin-bottom:2px}
.forms{display:flex;flex-direction:column;gap:10px}
.fitem{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fitem .base{font-size:12.5px;color:var(--muted)}
.fitem .ans{font-size:12.5px;color:var(--good);grid-column:1/-1}
/* translate */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tcard .en{font-size:16px;line-height:1.6;display:flex;gap:10px}
.tcard .en>span:last-child{white-space:pre-line;min-width:0}
.tcard .en .no{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding-top:3px;flex:none;width:20px}
.tcard textarea{width:100%;min-height:62px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px;line-height:1.5}
.ref{white-space:pre-line;border-left:3px solid var(--good);background:var(--good-soft);padding:9px 13px;border-radius:0 8px 8px 0;font-size:15px}
.ref small{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--good);font-weight:700;margin-bottom:2px}
.nw{display:flex;flex-wrap:wrap;gap:6px}
.nw span{font-size:13px;background:var(--accent-soft);border-radius:6px;padding:3px 9px}
.nw span b{font-weight:700}
.qcard .opts{grid-template-columns:1fr}
.qcard .opt{padding:8px 12px;font-size:14.5px}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.nwtable{width:100%;border-collapse:collapse;font-size:14px}
.nwtable td,.nwtable th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.nwtable th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* gaps */
.audio-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-top:6px}
.audio-h h3{margin:0;font-size:16px;display:flex;gap:10px;align-items:baseline}
.audio-h h3 span{font-size:12.5px;font-weight:500;color:var(--muted)}
.gline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;font-size:16px;line-height:2.1;display:flex;flex-direction:column;gap:2px;min-width:0}
.gin{display:inline-block;width:9.5em;max-width:100%;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:4px 4px 0 0;padding:0 6px;font-size:15px;line-height:1.7}
.gin.ok{border-bottom-color:var(--good);background:var(--good-soft)}
.gin.diff{border-bottom-color:var(--warn);background:var(--warn-soft)}
.sug{font-size:13px;color:var(--warn);line-height:1.5}
.gtr{width:100%;resize:none;overflow:hidden;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14.5px;line-height:1.5;display:block;margin-top:6px}
.gtr:focus{border-color:var(--accent)}
.gvi{font-size:14px;line-height:1.5;border-left:3px solid var(--good);background:var(--good-soft);padding:6px 11px;border-radius:0 8px 8px 0;margin-top:6px}
.gvi small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--good);font-weight:700}
.player .seg{display:inline-flex;width:auto}
.player .seg button{padding:5px 11px;font-size:13px}
.player{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.player audio{width:100%;height:40px;display:block}
.player .seg button{padding:5px 11px;font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab .short,.seg .short{display:none}
.agroup{display:flex;flex-direction:column;gap:12px}
.agroup .player{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;box-shadow:0 6px 16px -10px rgb(0 0 0 / .35)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}
.mobile-top-bar{display:none}

  .app{grid-template-columns:minmax(0,1fr)}

    border-bottom: 1px solid var(--line);
    padding: calc(6px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 6px max(12px, env(safe-area-inset-left, 0px));

  }

xt":"Please charge the order to the credit card you have on file for our account."},{"k":"p","text":"I'll have to cancel one of the other activities in order to fit it in. Maybe the visit to the art museum?"},{"k":"p","text":"Lastly, we are reminding all patients that we've recently updated our cancellation policy."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"62-64 ETS 2020.1"},{"k":"p","text":"Hi David, our clients are coming from overseas …………………, and we need to order the ……………… for the welcome dinner. Which of these dishes do you think we should get?"},{"k":"p","text":"Well, the last time we had clients here, we ordered the ………………… pasta. Everyone really liked it."},{"k":"p","text":"Yeah, I remember. But this time we have a larger budget, so I wanted to order something ………………."},{"k":"p","text":"Why don’t we order the baked salmon?"},{"k":"p","text":"I was thinking that, too. Also, we still have to call and ……………………. booking for our clients. I'm going to ……………now."},{"k":"audio","label":"Audio 2","src":"50-52 ETS 2020.5"},{"k":"p","text":"Hi Ms. Lee. My crew just finished installing the ………………. on your house. If things go according to plan, we might complete construction …………….. the deadline in the …………………."},{"k":"p","text":"Thanks for letting me know, John. I'm very impressed with your team's work. By the way, has the …………………. of wood for the flooring arrived yet?"},{"k":"p","text":"Yes, the wood arrived ……………………..- it's stacked over there."},{"k":"p","text":"Great! Well, it’s supposed to rain later today. You have the ………… to the storage unit, right."}]}]},{"id":2,"title":"MUA HÀNG / GIẢM GIÁ – PURCHASING / MARKDOWN","vocab":[{"w":"A variety of","pos":"","vi":"nhiều, 1 loạt"},{"w":"Additional","pos":"a","vi":"bổ sung"},{"w":"Affordable","pos":"a","vi":"phải chăng, thích hợp, có thể chi trả được"},{"w":"Available","pos":"a","vi":"có sẵn, độc thân"},{"w":"Clearance sale","pos":"","vi":"bán xả hàng"},{"w":"Complimenta e'll ask you to give a presentation to your colleagues on what you learned about our competitors and ……………… …………………..."}]}]},{"id":4,"title":"SỰ CẢM ƠN- XIN LỖI","vocab":[{"w":"Apologize","pos":"v","vi":"xin lỗi"},{"w":"As a token of appreciation","pos":"","vi":"như 1 món quà thể hiện sự cảm kích"},{"w":"Be delighted=happy = glad to","pos":"","vi":"vui mừng để …"},{"w":"Damaged","pos":"adj","vi":"hư hỏng"},{"w":"Defective","pos":"a","vi":"có lỗi. bị lỗi"},{"w":"Delay","pos":"n,v","vi":"hoãn lại"},{"w":"Enclosed","pos":"a","vi":"được đính kèm"},{"w":"Grateful","pos":"a","vi":"biết ơn (+for)"},{"w":"In recognition of","pos":"","vi":"như thể hiện sự công nhận"},{"w":"In/valuable","pos":"a","vi":"vô giá (rất đắt)"},{"w":"On behalf of","pos":"","vi":"thay mặt cho"},{"w":"Patron","pos":"n","vi":"bạn hàng, khách hàng thân thiết"},{"w":"Regretfully","pos":"adv","vi":"đáng tiếc"},{"w":"Voucher","pos":"n","vi":"phiếu quà tặng"}],"notes":["Enclosed = Attached","Invaluable = Priceless >< Worthless (vô giá trị, bỏ đi)","Regretfully = Unfortunately","Delighted = Happy","Delay = Postpone"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"Dear Mr. Josh,\nOn behalf of Samsung Vietnam, I am writing this email to apologize for the lateness in delivery the order K2908. To explain about the delay in shipment, there were regretfully some technical issues during the manufacturing process that led to some damaged products. We know that you are one of our biggest partners in Korea, and we will reduce 15 percent value of this order in recognition of your generosity. We are also delighted to tell you that we have been working with your company for 10 years; we would like to give you a voucher to buy any product for free in any stores under our chain as a token of appreciation. Your trust in our products is invaluable, and we are grateful for your cooperation during the past decade. After this inconvenience, if there are any defective products, we will replace them and will not include them in the bill. You can print the enclosed form, fill it and bring it to any Samsung Store to get your free product."},{"k":"p","text":"Regards,\nJacob Dean"}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"53-55 ETS 2020.3"},{"k":"p","text":"I’d like to ………….. this phone charging cable, but I can’t find my ………….."},{"k":"p","text":"May I ask why you're returning it?"},{"k":"p","text":"It doesn’t work—it won't charge my ………………..."},{"k":"p","text":"I'm a new salesperson, and I haven't learned yet how to ……………. an item without a receipt... Oh, but here comes my ………………— she'll be able to do it."},{"k":"p","text":"Hi, Tina, Is there something you need help with?"},{"k":"p","text":"Yes, this customer wants to return a ……………….. product, but he doesn't have his receipt."},{"k":"p","text":"OK, I can ……………… the return, sir. I just need to see the original ……………….. you used to purchase the item."},{"k":"p","text":"Thanks. Here it is"},{"k":"audio","label":"Audio 2","src":"80-82 ETS 2020.6"},{"k":"p","text":"Hello, and thank you for calling the ………… of Pineville Legal Associates. Our office is currently closed. We are undergoing renovations from June twelfth to June nineteenth. We ……………… for any possible ……………………. this closure may cause. If you require legal assistance, please send an …………… to our office administrator, Jordan Smith, at jsmith@pmevillelegal.com. He will redirect your inquiry to the most ………………... lawyer on our team. Have a nice day."}]}]},{"id":5,"title":"MUA HÀNG – GIẢM GIÁ","vocab":[{"w":"Limited","pos":"adj","vi":"có giới hạn"},{"w":"Markdown","pos":"n","vi":"giảm giá"},{"w":"Office supplies","pos":"","vi":"văn phòng phẩm"},{"w":"Promotional","pos":"a","vi":"khuyến mãi"},{"w":"Redeem","pos":"v","vi":"mua lại, chuộc lại (đổi lại hàng lấy tiền)"},{"w":"Reduce rate","pos":"","vi":"tỉ lệ giảm giá"},{"w":"Renew","pos":"v","vi":"gia hạn, làm mới"},{"w":"Retailer","pos":"n","vi":"người bán lẻ"},{"w":"Souvenir","pos":"n","vi":"quà lưu niệm"},{"w":"Special offer","pos":"","vi":"chương trình giảm giá đặc biệt"},{"w":"Store credit","pos":"","vi":"phiếu đổi hàng"},{"w":"Take advantage of","pos":"","vi":"tận dụng"},{"w":"Vendor","pos":"n","vi":"nhà cung cấp, người bán hàng rong"},{"w":"Warranty","pos":"","vi":"bảo hành"}],"notes":["Office supplies = Stationery","Redeem = Return + Refund","Vendor = Supplier = Provider"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"Announcement\nJosh Company- one of the biggest vendors for office supplies in Derry Valley, is offering a special offer for all customers from 7 to 19 this month."},{"k":"p","text":"-Customers who buy any product in limited version will get a reduced rate of 30 percent in total price."},{"k":"p","text":"-Customers who renew contract in bulk purchase will get a warranty policy in 6 months. During this, if any product is damaged during delivery, it will be redeemed as soon as possible."},{"k":"p","text":"-Any store credit can be exchanged for cash."},{"k":"p","text":"-By taking advantage of new technical system, we start selling souvenirs for tourism places. The promotional program is coming soon."},{"k":"p","text":"-Any retailer who starts to cooperate with Josh Company will get an amazing markdown, the detail will be discussed when making contracts."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"44-46 ETS2020.2"},{"k":"p","text":"Hi, I saw an advertisement for the Piceasy …………….. in today's newspaper, but the price shown on the display here in your store is ………………… than what was listed in the ad."},{"k":"p","text":"Oh ... OK. My……………… here can help you. Mr. Jensen?"},{"k":"p","text":"Sure. Sorry about the confusion. That camera just went on sale ……………., and we haven't changed the ………… on our display yet."},{"k":"p","text":"Oh, that's good to hear. I'd like to ……….. it then."},{"k":"p","text":"Great. And that camera comes with a two-year …………………, but for another 25 dollars, you can extend it to ……….. years. Would you like to do that?"},{"k":"audio","label":"Audio 2","src":"98-100 ETS2020.10"},{"k":"p","text":"Would you like to add something ……………… to your company's celebration or business function? Then Eco-Events may be just right for you. We offer a large variety of environmentally friendly rental ……………. for any occasion. Our most popular rentals are our tables and chairs, all made from sustainable materials. They're ………………. and functional! Our tables come in four sizes, allowing you to arrange a gathering any way you'd like. And for a ……………… time, our most popular table, which seats eight to twelve people, can be rented for just ten dollars per ……….! To take ……………….. of this limited offer, just enter the promotional code TENDISCOUNT when you go to our …………………..."}]}]},{"id":6,"title":"KINH DOANH – BUSINESS","vocab":[{"w":"Approval","pos":"n","vi":"sự chấp thuận"},{"w":"Bid","pos":"v,n","vi":"đấu thầu"},{"w":"Boost","pos":"v","vi":"thúc đẩy"},{"w":"Distribution","pos":"n","vi":"sự phân phối"},{"w":"Endorsement","pos":"n","vi":"Sự tán thành"},{"w":"Expansion","pos":"n","vi":"sự mở rộng"},{"w":"Expense","pos":"n","vi":"chi Phí"},{"w":"Facilitate","pos":"v","vi":"làm cho thuận tiện hơn"},{"w":"Feasible","pos":"a","vi":"khả thi"},{"w":"Figure","pos":"n","vi":"số liệu"},{"w":"License","pos":"n","vi":"giấy phép"},{"w":"Market share","pos":"","vi":"thị phần"},{"w":"Profitable","pos":"a","vi":"có lợi nhuận"},{"w":"Release","pos":"v,n","vi":"phát hành, ấn phẩm"}],"notes":["Approval ~ Agreement ~ Acceptance ~ Endorsement","Boost = Stimulate = Encourage","Distribution = Dispersal","Expansion = Extension","Figure = Number = Data","Profitable = Lucrative"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"In the latest news released yesterday, Bompard Corporation announced that they were ready for its expansion to South-East area. The leaders strongly showed their ambition to become the biggest market shareholder in Alabama Finance Community. Bombard made a bid of 1.5 million dollars for a warehouse in Vanesa and after the approval of the local authorities, they intended to turn it into a huge motorbikes storage to make the distribution process feasible among the area. To achieve this target, they will have many steps to do:"},{"k":"p","text":"Estimate the expenses, incomes, and profits in 3 years by analyzing the figures in the previous decade."},{"k":"p","text":"Gain a license from the local committee to allow Bompard's construction and production."},{"k":"p","text":"Gain the endorsement of local users, it is not easy to get them accustomed to new brands."},{"k":"p","text":"Boost productivity by applying new techniques."},{"k":"p","text":"Facilitate the supply chain, make sure that products are distributed to end-users at the lowest cost and fastest time."},{"k":"p","text":"Mr. Kennett, chairman of Bombard, claimed that this expansion was potentially profitable but risky. Nevertheless, he assured that they had a perfect preparation for the biggest campaign of Bompard."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"59-61 ETS2020.9"},{"k":"p","text":"Do you know Bob, the new hire? Well, he ………………. his first quarterly sales report yesterday. I just finished analyzing it, and it looks like the ……………. items, especially laptops, are under performing in our Region 1 stores."},{"k":"p","text":"That doesn’t sound good."},{"k":"p","text":"No, but the report concluded that the ……………. should still focus on selling electronics, because the …………… margin on these items is a lot higher."},{"k":"p","text":"That makes sense. I think Bob should do a presentation for the sales …………………….. about his report."},{"k":"p","text":"He‘s never done that before. Uh... I could present the report."},{"k":"p","text":"No, it’s a good ………………. for a new employee. I'll organize a ………………. with the sales department next week."},{"k":"audio","label":"Audio 2","src":"74-76 ETS2020.9"},{"k":"p","text":"Good morning, Marco. This is Soo- Lin, from the warehouse. I'm calling to get your …………………. to ………………. five computer tablets for the inventory managers. Right now they’re writing down ………………. orders by hand and then inputting them into the computers in their offices. If we give them tablets, they'll be able to finish the …………….. much more quickly. I‘d like to buy the tablets next week it'd really help improve our efficiency in the warehouse. The budget …………….. is on Monday, right? Please let me know what you decide, thanks!"}]}]},{"id":7,"title":"CEREMONY","vocab":[{"w":"Catering","pos":"","vi":"dịch vụ ăn uống"},{"w":"Celebrate","pos":"","vi":"(v) kỷ niệm"},{"w":"Commemorate","pos":"v","vi":"kỷ niệm, tưởng niệm"},{"w":"In honor of","pos":"","vi":"để vinh danh cho , trong sự vinh danh cho"},{"w":"On-site","pos":"","vi":"tại chỗ"},{"w":"Organize","pos":"v","vi":"tổ chức"},{"w":"Participant","pos":"n","vi":"người tham dự"},{"w":"Present","pos":"v","vi":"có mặt, hiện diện"},{"w":"Proceedings","pos":"","vi":"chuỗi sự kiện"},{"w":"Reception","pos":"","vi":"tiệc chiêu đãi"},{"w":"Register","pos":"v","vi":"đăng kí"},{"w":"Select","pos":"v","vi":"chọn = Choose = Pick= Opt"},{"w":"Take place","pos":"","vi":"diễn ra"},{"w":"Venue","pos":"n","vi":"mặt bằng, địa điểm"}],"notes":["Proceed(v) : tiếp tục >< Proceeds(n) : tiền thu được >< Proceedings (n): chuỗi sự kiện >< Proceeding (v-ing)","Reception = Formal party = Banquet ~ Luncheon","Register = Sign up for","Take place = Occur","Venue = Location = Place","Avenue(đại lộ) >< Venue (địa điểm) ><Revenue(profit, lợi nhuận)"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"A statue has been built to commemorate the 100th anniversary of the poet's birthday."},{"k":"p","text":"You're supposed to be presenting the new fabrics our company is making this year."},{"k":"p","text":"Now, there's one last thing that we have yet to confirm- the refreshments we'll be serving. Are there any suggestions for which catering company to use?"},{"k":"p","text":"We organize new-hire training for all the accountants, so we'll be working with you closely over the next week."},{"k":"p","text":"If you'd like to speak with Dr. Ray directly, he'll be joining us for a small reception in the conference room immediately following his speech."},{"k":"p","text":"I forgot that the tiles you selected for your kitchen flooring are discounted this month."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"62-64 ETS2020.2"},{"k":"p","text":"Thanks for calling the Forester ………. How can I help you?"},{"k":"p","text":"Hi, I'm arranging the annual awards banquet for my ……………... I checked your Web site ... Can I ……………… the Rose Hall for May fifteenth?"},{"k":"p","text":"Let me check the schedule .. I'm afraid the Rose Hall's unavailable that day. The Sunflower Hall is ……………………... It's 50 dollars more expensive than the Rose Hall, but it's larger."},{"k":"p","text":"Hmm, that's OK. The Sunflower Hall should be fine. I also had a question about food for the ………………... Can you recommend a good caterer?"},{"k":"p","text":"Oh, I'd recommend Sammy's …………………. It's popular because of the variety of ……………………. options they offer."},{"k":"audio","label":"Audio 2","src":"80-82 ETS2020.2"},{"k":"p","text":"Recently we conducted a market ……………….. about our new phone application called Minimarket. Well, we found that people of all ages like the idea of using then mobile phones to order groceries. However, there has been one consistent ……………………. about the app. According to users, the process for ordering groceries with this app is too …………………... So, we invited Lupe Gonzalez here to ………………… some ideas. She's a …………………….. consultant who has designed similar apps before."}]}]},{"id":8,"title":"SERVICE – DỊCH VỤ","vocab":[{"w":"Appointment","pos":"n","vi":"cuộc hẹn"},{"w":"Access","pos":"n,v","vi":"truy cập, quyền truy cập"},{"w":"Accommodation","pos":"n","vi":"chỗ ở -> accommodate (v) : ở, cư trú"},{"w":"Sign up for","pos":"","vi":"đăng ký"},{"w":"Assistance","pos":"n","vi":"sự hỗ trợ -> assist (v) , assistant (n) : thư ký"},{"w":"Amenity","pos":"n","vi":"tiện nghi"},{"w":"Dealership","pos":"n","vi":"đại lý"},{"w":"Authorize","pos":"v","vi":"ủy quyền -> authority : chính quyền"},{"w":"Expire","pos":"v","vi":"hết hạn"},{"w":"Extend","pos":"v","vi":"mở rộng, kéo dài"},{"w":"Maintenance","pos":"n","vi":"bảo trì, bảo hành -> maintain (v) : bảo trì"},{"w":"Reliable","pos":"a","vi":"đáng tin cậy, có thể dựa vào đc -> rely (on) : dựa vào"},{"w":"Termination","pos":"n","vi":"phá hủy, chấm dứt"}],"notes":["Sign up for = Register","Amenity = Convenience","Extend ~ Expand , Lengthen","Reliable = Dependable, Trustful","Terminate a building = Destroy a building","Terminate a contract = Cancel a contract"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"From : LA Real Estate Representative – Josh Lucas\nTo: All residents in LAS building\nDear all residents,\nOn behalf of LAS building’s owners, I am writing this email to announce an upcoming maintenance project on the left hall. To extend the space in that area, we hired a reliable company to make some changes in design. We will have individual appointment with any residents who want to know more about the process. To sign up for an appointment, please access to LAS building website and fill the application form attached on the first page. I, Josh Lucas, am authorized answer any question related to your accommodation status via email or Facebook. For some people, there will be a little inconvenience because the building crew will terminate some walls to make some changes but we are guarantee that there will be much more amenity when the process finishes. The building dealership made sure that it would not be longer than 3 days, so if you want any assistance, do not hesitate to contact us by this email. Please fill the forms before August 1 because after the first day of August expires, your application will not be valid."},{"k":"p","text":"Thank you."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"44-46 ETS2020.4"},{"k":"p","text":"Mariko, Kenichi-welcome to your first day of work at Willow …………….. We're glad to have experienced nursing ………………… like you join our staff. Today we'll go over hospital ………………. and procedures. Any questions before we start?"},{"k":"p","text":"I have one. After today, will we need identification badges to get into the building?"},{"k":"p","text":"Yes. We'll be heading to the ……………………. center later today to get them."},{"k":"p","text":"And is there a designated …………………………. for staff?"},{"k":"p","text":"Yes. Employees should use the West Parking Area ……….."},{"k":"p","text":"OK, thanks."},{"k":"audio","label":"Audio 2","src":"83-85 ETS2020.9"},{"k":"p","text":"Hi, Pierre. It’s Emiko. I wanted to follow up with you about your upcoming ………………. to Lakewood for the trade show. I'm having trouble finding you ………………………….—there are other events in Lakewood that ……………….., and every hotel is completely booked. There's usually a place to stay in Springfield. You'd just have to drive a bit farther the day of the show. Please ……………. when you can. Also, don’t forget that your …………….. needs to approve your …………………….. before you leave. Thanks."}]}]},{"id":9,"title":"FUND/CAPITAL – QUỸ/VỐN","vocab":[{"w":"Approximately","pos":"adv","vi":"xấp xỉ, khoảng, tương đương"},{"w":"Asset","pos":"n","vi":"tài sản"},{"w":"Budget","pos":"n","vi":"ngân sách"},{"w":"Contribution","pos":"n","vi":"sự đóng góp"},{"w":"Financial","pos":"adj","vi":"thuộc về tài chính"},{"w":"Fundraising","pos":"n","vi":"sự gây quỹ"},{"w":"Immensely","pos":"adv","vi":"vô cùng, hết sức"},{"w":"Monetary donation","pos":"","vi":"quyên góp tiền"},{"w":"Possess","pos":"v","vi":"sở hữu"},{"w":"Proceeds","pos":"n","vi":"tiền thu được (từ 1 dự án, sự kiện,…)"},{"w":"Project","pos":"n","vi":"dự án"},{"w":"Property","pos":"n","vi":"tài sản"},{"w":"Reimburse","pos":"v","vi":"hoàn tiền"},{"w":"Capital","pos":"n","vi":"vốn"}],"notes":["Approximately = About","Asset = Property = Possession","Financial (a) -> Finance (v,n) : tài chính, hỗ trợ tài chính","Immensely = Extremely = Very","Proceeds (n) >< Proceedings (n) >< Proceed (v)","Reimburse = Refund"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"Anita, congratulations on publishing your book about fund-raising for nonprofit organizations!"},{"k":"p","text":"I have to finalize the sale of that commercial property on Pine Street in ten minutes."},{"k":"p","text":"I don’t think we've budgeted enough for the construction project."},{"k":"p","text":"I’ll need to look over our budget to make sure there's enough money for such a significant expense."},{"k":"p","text":"Our guest speaker today is Dr. Eugene Ray, who will be talking about financial risk management."},{"k":"p","text":"We offered a discount to car dealers that bought more than 1,000 tires. It was extremely effective."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"56-58 ETS2020.7"},{"k":"p","text":"Hi, Jessica. I'm really looking forward to the annual attorneys' seminar next weekend."},{"k":"p","text":"Me too. It looks like there will be a lot of well-known attorneys …………………... By the way, how are you getting there?"},{"k":"p","text":"I'm taking the …………., and actually, I have a question. I'd like to get ……………………. for my train ride to the seminar, How does the travel reimbursement ………………. work?"},{"k":"p","text":"There's a short ……………… on the Human Resources Web site that you should watch. It gives step-by-step instructions on how to ………………. a reimbursement request."},{"k":"audio","label":"Audio 2","src":"95-97 ETS2020.3"},{"k":"p","text":"Hi, Carol? It’s Susan. I was just told I'll be leading the team that’s ………………. our newest microwave oven. I'm preparing a draft budget for the development of the new model and have bean looking over the expenses from previous ……………….. Since you worked on a similar project two years ago, would you have time to come by ……………….? I have a couple of ………………. that I'd like to ask you. If you can, stop by whenever you have time …………... Oh, and don’t forget! I moved to the office directly across from the ……………. See you soon."}]}]},{"id":10,"title":"BẤT ĐỘNG SẢN – REAL ESTATE","vocab":[{"w":"Appraisal","pos":"n","vi":"sự đánh giá, sự thẩm định"},{"w":"Floor plan","pos":"","vi":"sơ đồ tầng"},{"w":"(be) Furnished","pos":"","vi":"được trang bị đồ đạc"},{"w":"Landlord","pos":"n","vi":"chủ nhà"},{"w":"Lease","pos":"v,n","vi":"thuê, hợp đồng cho thuê"},{"w":"On the premises","pos":"","vi":"trong khuôn viên nhà, trong tòa nhà"},{"w":"Real estate agency","pos":"","vi":"đại lý bất động sản"},{"w":"Rent = Lease","pos":"","vi":""},{"w":"Resident","pos":"n","vi":"cư dân"},{"w":"Short-term","pos":"","vi":"trong thời gian ngắn"},{"w":"Site inspection","pos":"","vi":"Sự giám định tòa nhà"},{"w":"Story","pos":"n","vi":"tầng"},{"w":"Tenant","pos":"n","vi":"người thuê nhà,"},{"w":"Utility","pos":"n","vi":"thứ có ích, tiện ích trong nhà"},{"w":"Within walking distance","pos":"","vi":"gần, có thể đi bộ được"}],"notes":["Appraisal = Inspection = Assessment = Review","Landlord = Owner","Resident = Inhabitant = Citizen","Agency = Dealership","Short-term = Temporary","Utility bills : hóa đơn điện nước ga","Within walking distance = Near, Close"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"From : Kolama real estate agency\nTo: All residents living at Praxma Building under a short-term lease\nOn behalf of the Praxma Building’s landlord, we send you this email to announce an upcoming maintenance on the premises. Before the project will begin on August 8^(th), there will be a site inspection on the first, second and third stories to assure that all spaces are clear. If any r receive a free padded carrying case for your laptop. But hurry—the promotion expires ……………….!"}]}]},{"id":25,"title":"GIAO HÀNG/ XỬ LÍ ĐƠN HÀNG","vocab":[{"w":"Track","pos":"v","vi":"theo dõi (n) con đường đất, đường ray"},{"w":"Shipment","pos":"n","vi":"lô hàng"},{"w":"A large volume of","pos":"","vi":"1 lượng lớn"},{"w":"Overnight delivery","pos":"","vi":"vận chuyển xuyên đêm"},{"w":"Express","pos":"adj","vi":"tốc hành"},{"w":"Expedite","pos":"v","vi":"thúc đẩy"},{"w":"Back order","pos":"","vi":"đã hết hàng (sẽ có tiếp)"},{"w":"Courier","pos":"n","vi":"người chuyển phát, công ty chuyển phát nhanh"},{"w":"Process","pos":"v","vi":"xử lí"},{"w":"Stock","pos":"n","vi":"hàng tồn kho, cổ phiếu"},{"w":"Take long","pos":"","vi":"lâu"},{"w":"Custom order","pos":"","vi":"đặt hàng theo yêu cầu"},{"w":"Customer inquiry","pos":"","vi":"yêu cầu khách hàng"},{"w":"Business day","pos":"","vi":"ngày làm việc"},{"w":"Distance","pos":"n","vi":"khoảng cách"}],"notes":[],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"From: Sunrise Deliver\nTo: Hannah Oliver\nWe received your inquiry about delivery options and we recommend you to use our fastest choice, Sunrise Express. Because your shipment is light and the distance you will receive the product is not very far, the process will not take long. Besides, we are in a peak season with a large volume of orders so this option will take advantage of the overnight delivery that can be completed within one or two business days. You can download our app, Sunrise Tracking, to easily track your order. We appreciate that after using it, you can give us your feedbacks."},{"k":"p","text":"Thank you again for choosing us,\nSarah Lane,\nCustomer Service Manager\nSunrise Deliver"}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"41-43 ETS2020.8"},{"k":"p","text":"Thanks for calling Ewing Books, How may I help you?"},{"k":"p","text":"Hello Do you have organization for Allin stock? It’s a ………. by James Dobbey."},{"k":"p","text":"Let me see... Hmm—it looks like that particular item is currently ……………... But we’re scheduled to get another …………. early next week."},{"k":"p","text":"Oh, in that case, would you mind holding a copy for me when the books arrive?"},{"k":"p","text":"I'm awfully sorry, but we can’t hold copies for customers. But If you give me …………………….., I’ll make a note to call you as soon as the shipment is here."},{"k":"audio","label":"Audio 2","src":"95-97 ETS2020.9"},{"k":"p","text":"I have some important announcements before we ………………………..tonight. First, the shipment we were expecting from our seafood distributor won't arrive until next week, so that means no mixed …………………... Instead we'll make a double batch of ………………..’s soup and serve that on Friday as well. Please make sure to let our regular customers know. Next, I'd like to introduce our newest server, Deena Sanchez. Deena will do some ……………….. this week and start serving customers next week. I posted her training ……………….. in the staff lounge."},{"k":"p","text":"Please …………………. at it while you’re on break today, and let me know if you can help out with any of the trainings."}]}]},{"id":26,"title":"SỰ XUẤT BẢN - PUBLICATION","vocab":[{"w":"Autograph","pos":"v,n","vi":"ký tên, chữ ký"},{"w":"Biography","pos":"n","vi":"tiểu sử"},{"w":"Circulation","pos":"n","vi":"số lượng bán ra"},{"w":"Edit","pos":"v","vi":"chỉnh sửa"},{"w":"Edition","pos":"n","vi":"ấn phẩm"},{"w":"Format","pos":"v,n","vi":"định dạng"},{"w":"Freelancer","pos":"n","vi":"người làm nghề tự do"},{"w":"Hardcover","pos":"n","vi":"bìa cứng"},{"w":"Informative","pos":"adj","vi":"hữu ích (về thông tin)"},{"w":"Issue","pos":"n","vi":"số phát hành, ấn phẩm"},{"w":"Periodical","pos":"adj","vi":"định kỳ (n) ấn phẩm định kỳ"},{"w":"Publication","pos":"n","vi":"sự xuất bản"},{"w":"Submission","pos":"n","vi":"nộp"},{"w":"Subscription","pos":"n","vi":"sự đăng ký, sự mua báo"},{"w":"Volume","pos":"n","vi":"quyển, tập, số (báo)"}],"notes":["Edition = Release = Issue","Periodically = Regularly","Hardcover >< Softcover","Submission (n) -> Submit (v)","Subscription (n) -> Subscribe (v)"],"sections":[{"title":"Translate and answer the questions","type":"reading","blocks":[{"k":"p","text":"From: Jameson’s TV and Appliances\nTo: Subscriptions Department\nContemporary Electronics Design\nDear Subscription Editor,\nI would like to sign up for a one-year corporate subscription to CED in the name of Jameson’s TV and Appliances. I would like this subscription to begin with the March Annual Product Review Issue. We are particularly eager that our subscription begin with the March issue because of the product review in that issue of the Zenon 1001 circuit board. I am enclosing a check for $27, made payable to CED Subscriptions. Thank you for your assistance."},{"k":"p","text":"Sincerely,\nDelia Walters\nSupplies Manager\nQuestion 1. Which of the following is CED most likely to be?"},{"k":"p","text":"(A). A technical periodical of the electronics trade\n(B). A catalog of electronics equipment and supplies\n(C). A series of pamphlets about circuit boards\n(D). A television magazine\nQuestion 2. How long would Delia Walters like to receive CED?"},{"k":"p","text":"(A) $27\n(B) 12 months\n(C) Just during March\n(D) Indefinitely"}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"44-46 ETS2020.9"},{"k":"p","text":"Mr. Stem, I have an idea for our newspaper's ………………………. A lot of farmers markets in this region open during the ………………………, so I'd like to write a short piece about them."},{"k":"p","text":"That would work well. Are you planning to interview the …………….. who are selling produce? We've received a lot of …………………………. from our readers when we print stories about local business owners."},{"k":"p","text":"That's a good idea, but I need to find a ………………..…. to accompany me this weekend."},{"k":"p","text":"I don’t think Elena has any assignments."},{"k":"p","text":"Great! ased during this summer. Many critics had a chance to preview the soon-to-release film and gave a lot of praises. The debut event is about to witness the gathering of all the stars who will appear in astronaut costumes - the formal outfit in the movie. The show will last about 2 hours and include two intermissions. During the break, audiences can enjoy refreshments while they can not get out of the theater. Guests are also refrained from bringing other foods and drinks. The chief director announced that the conclusion of this series would release next year."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"38-40 ETS2020.3"},{"k":"p","text":"Hi, I’m calling from Brookshire …………. for Ms. Ito."},{"k":"p","text":"This is she."},{"k":"p","text":"I understand you have tickets to tonight's ……………………………. I’m sorry, but we've had to cancel tonight’s show."},{"k":"p","text":"That's too bad. Tonight was the only night I could make it."},{"k":"p","text":"I'm sorry about that. I can offer you a …………… for the ticket."},{"k":"p","text":"Oh, I'll take the refund, Thanks."},{"k":"p","text":"Sure. And I'll also e-mail you a ……………………………… that’ll give you a discount on your next ticket purchase."},{"k":"audio","label":"Audio 2","src":"89-91 ETS2020.10"},{"k":"p","text":"For all of you turning into our radio station today, the annual Springfield ……………………….. is just around the comer! From June twelfth to fourteenth, the Springfield Park will host a variety of live performances, from drumming circles to alternative rock bands... all free and open to the public. And don't forget about WKBC's annual raffle. This year, you can enter to win a brand new, one-of-a-kind ……………………….. Raffle tickets are only available at our ticket booth. And last year, all the tickets were gone in …………………... Look for us by the water fountain on June twelfth. Hope to see you there!"}]}]},{"id":28,"title":"KINH TẾ - ECONOMICS","vocab":[{"w":"Analysis","pos":"n","vi":"sự phân t
