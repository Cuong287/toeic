ow time for us to set up a display. ---(3)---. Also, be sure to let me know if you’ll need access to projector will a remote for your presentation. ---(4)---. Lastly, could you send me a short biographical profile as soon as possible for inclusion in our conference program? Thanks again."},{"k":"p","text":"Regards,\nLeonard Cowden"},{"k":"q","text":"1. Why did Mr. Cowden most likely send the email?","opts":["To invite Ms. Salinas to an event","To acknowledge Ms. Salinas acceptance of an offer","To ask Ms. Salinas for a recommendation","To propose that a session be rescheduled"]},{"k":"q","text":"2. What is suggested about Ms. Branston?","opts":["She spoke at the conference last year","She wrote a popular book about nutrition","She is a colleague of Ms. Salinas","She is studying to be a dietitian"]},{"k":"p","text":"In which of the positions marked (1), (2), (3) and (4) does the following sentence best belong?"},{"k":"q","text":"“It is no trouble at all to have visual equipment available.”","opts":["(1)","(2)","(3)","(4)"]}]}]},{"id":41,"title":"BẢNG ĐÁNH GIÁ - EVALUATION","vocab":[{"w":"Category","pos":"n","vi":"loại, hạng"},{"w":"Cleanness","pos":"n","vi":"sự sạch sẽ"},{"w":"Comfortable","pos":"adj","vi":"thoải mái"},{"w":"Disappointed","pos":"adj","vi":"thất vọng"},{"w":"Indicate","pos":"v","vi":"chỉ ra, biểu thị"},{"w":"Measure","pos":"n,v","vi":"đo đạc, phương pháp"},{"w":"Minor","pos":"adj","vi":"thiểu số, nhỏ"},{"w":"Overall","pos":"adj,adv","vi":"tổng thể"},{"w":"Rate","pos":"n","vi":"giá, tỉ lệ"},{"w":"Recommend","pos":"v","vi":"đề xuất"},{"w":"Responsive","pos":"adj","vi":"phản hồi"},{"w":"Satisfied","pos":"adj","vi":"hài lòng"},{"w":"Scale","pos":"n","vi":"quy mô, cơ cấu"},{"w":"Suggestion","pos":"n","vi":"gợi ý, đề xuất"}],"notes":[],"sections":[{"title":"Translate and answer the questions","type":"reading","blocks":[{"k":"p","text":"Nimblearn\nFind the Information Your Company Needs\nNimblearn is a robust, next-generation tool designed to make creating s c trang phục phù hợp khi tham quan nhà máy."],"Assign":["/əˈsaɪn/","Each new employee will be assigned a mentor.","Mỗi nhân viên mới sẽ được phân công một người hướng dẫn."],"Attentive":["/əˈten.t̬ɪv/","The hotel staff were friendly and attentive.","Nhân viên khách sạn thân thiện và chu đáo."],"Attitude":["/ˈæt̬.ə.tuːd/","She has a positive attitude toward her work.","Cô ấy có thái độ tích cực với công việc."],"Certificate":["/sɚˈtɪf.ə.kət/","Participants will receive a certificate after completing the course.","Học viên sẽ nhận giấy chứng nhận sau khi hoàn thành khóa học."],"Considerate":["/kənˈsɪd.ɚ.ət/","It was considerate of him to call ahead.","Anh ấy thật chu đáo khi gọi báo trước."],"Cooperate":["/koʊˈɑː.pə.reɪt/","The two departments cooperated to finish the project on time.","Hai phòng ban đã hợp tác để hoàn thành dự án đúng hạn."],"Demonstrate":["/ˈdem.ən.streɪt/","The sales representative demonstrated how to use the new printer.","Nhân viên kinh doanh đã làm mẫu cách sử dụng máy in mới."],"Endeavor":["/ɪnˈdev.ɚ/","We endeavor to answer all e-mails within 24 hours.","Chúng tôi cố gắng trả lời mọi email trong vòng 24 giờ."],"Exemplary":["/ɪɡˈzem.plɚ.i/","Ms. Tran received an award for her exemplary service.","Cô Trần nhận giải thưởng vì tinh thần phục vụ gương mẫu."],"Potential":["/poʊˈten.ʃəl/","We are meeting with potential clients next week.","Tuần sau chúng tôi gặp các khách hàng tiềm năng."],"Promising":["/ˈprɑː.mɪ.sɪŋ/","He is one of the most promising young engineers in the company.","Anh ấy là một trong những kỹ sư trẻ triển vọng nhất của công ty."],"Qualification":["/ˌkwɑː.lə.fəˈkeɪ.ʃən/","Applicants must have a teaching qualification.","Ứng viên phải có bằng cấp sư phạm."],"Reference":["/ˈref.ɚ.əns/","Please provide two references from previous employers.","Vui lòng cung cấp hai người giới thiệu từ các nơi làm việc trước."],"Referral":["/rɪˈfɝː.əl/","Most of our new customers come from referrals.","Phần lớn khách hàng mới của chúng tôi đến nhờ được giới thiệu."]},"usage":[["Cooperate","Tài liệu ghi “công tác”. Nghĩa đúng là hợp tác. Danh từ: cooperation; tính từ: cooperative."],["Considerate","Tài liệu ghi “cẩn thận, thận trọng”. Nghĩa đúng là chu đáo, biết nghĩ cho người khác. “Cẩn thận” là careful. Đừng nhầm với considerable (đáng kể)."],["Demonstrate","Tài liệu ghi (v) nhưng nghĩa lại là danh từ. Động từ demonstrate: làm mẫu, chứng minh, thể hiện. Danh từ: demonstration."],["Attentive","Ngoài “chăm chú”, trong ngữ cảnh dịch vụ thường hiểu là chu đáo, ân cần: attentive staff."],["Qualification","Trong tuyển dụng thường là bằng cấp, trình độ, điều kiện cần có, không hẳn là “tố chất”: relevant qualifications."],["Reference và referral","Reference là thư hoặc người giới thiệu xác nhận năng lực khi xin việc. Referral là việc giới thiệu khách, bệnh nhân, ứng viên đến một nơi khác."]],"tr":{"0":{"0":["High Tech đang tìm một ứng viên phù hợp cho vị trí Thực tập sinh Marketing. Bất kỳ ai có nền tảng liên quan và bằng cấp phù hợp đều có thể ứng tuyển vào vị trí còn trống này, và chúng tôi sẽ cho bạn cơ hội thể hiện những thế mạnh tiềm năng của mình. Đây là chương trình thực tập kéo dài bốn tháng, trong thời gian đó bạn sẽ được người giám sát giao nhiệm vụ. Chúng tôi tìm một ứng viên nỗ lực làm việc trong môi trường cường độ cao, đòi hỏi sự chú tâm, chu đáo và tinh thần hợp tác. Sau chương trình, mỗi thực tập sinh sẽ nhận giấy chứng nhận và được xem xét mời làm chính thức dựa trên thái độ tốt và thành tích gương mẫu. Nếu bạn quan tâm đến vị trí đầy hứa hẹn này, hãy tham gia cùng chúng tôi. Gửi CV, đơn ứng tuyển và tất cả thư giới thiệu đến Hightech.org.net.",[["candidate","n","ứng viên"],["intern","n","thực tập sinh"],["relevant","adj","liên quan, phù hợp"],["vacancy","n","vị trí còn trống (bài viết dùng sai thành “vacant”)"],["supervisor","n","người giám sát"],["intense","adj","cường độ cao"],["application form","n","đơn ứng tuyển"]]]}},"gap":{"1":{"1":[["Marketing","qualifications / experience","office / branch"],"Chào Charlie. Tôi là Cora từ công ty Thomasville Marketing. Chúng tôi rất ấn tượng với trình độ của anh và muốn mời anh nhận vị trí ở văn phòng Chicago."],"2":[[],"Cảm ơn chị. Tin thật thú vị. Nhưng chuyển đến Chicago là một quyết định lớn với tôi, nên tôi cần suy nghĩ thêm."],"3":[["position"],"Chúng tôi rất muốn tuyển được người cho vị trí này trong tuần này."],"4":[["understand"],"Vâng, tôi hiểu."],"5":[["team","travel / fare"],"Nếu anh nhận lời, chúng tôi muốn anh sớm đến Chicago để gặp nhóm mà anh sẽ làm việc cùng. Và tất nhiên, Thomasville Marketing luôn chi trả vé máy bay và tiền taxi cho các chuyến công tác."],"7":[["selected / chosen","presentations / seminars","products","company","questions","materials","last year","their","products"],"Như các bạn đã biết, Hội nghị Ngành Hóa chất sẽ diễn ra vào tháng Năm, và bốn bạn đã được chọn đi dự. Các bạn sẽ tham gia các buổi thuyết trình và hội thảo nhằm quảng bá nhiều sản phẩm hóa chất của công ty. Tôi biết đây là lần đầu các bạn đại diện cho công ty, và có lẽ các bạn sẽ có nhiều câu hỏi trong lúc chuẩn bị. Nhưng hãy nhớ, chúng tôi có sẵn đầy đủ tài liệu hội nghị cho các bạn, và tôi đã dự hội nghị này năm ngoái. Ngoài ra, khi đi về, chúng tôi sẽ nhờ các bạn thuyết trình cho đồng nghiệp về những gì đã tìm hiểu được về đối thủ cạnh tranh và sản phẩm của họ."]}}},"4":{"vocab":{"Apologize":["/əˈpɑː.lə.dʒaɪz/","We apologize for the delay in processing your order.","Chúng tôi xin lỗi vì sự chậm trễ trong việc xử lý đơn hàng của quý khách."],"As a token of appreciation":["/ˈtoʊ.kən əv əˌpriː.ʃiˈeɪ.ʃən/","As a token of appreciation, we are sending you a 10 percent discount coupon.","Để thể hiện lòng cảm kích, chúng tôi gửi quý khách một phiếu giảm giá 10%."],"Be delighted=happy = glad to":["/dɪˈlaɪ.t̬ɪd/","We are delighted to announce the opening of our new branch.","Chúng tôi vui mừng thông báo khai trương chi nhánh mới."],"Damaged":["/ˈdæm.ɪdʒd/","The package arrived damaged, so I asked for a replacement.","Kiện hàng đế riate / qualified"],"Xin chào, cảm ơn quý khách đã gọi đến văn phòng Pineville Legal Associates. Văn phòng chúng tôi hiện đang đóng cửa để sửa chữa từ ngày 12 đến ngày 19 tháng Sáu. Chúng tôi xin lỗi về mọi bất tiện mà việc đóng cửa này có thể gây ra. Nếu quý khách cần hỗ trợ pháp lý, vui lòng gửi email cho quản trị viên văn phòng, Jordan Smith, theo địa chỉ jsmith@pmevillelegal.com. Anh ấy sẽ chuyển yêu cầu của quý khách đến luật sư phù hợp nhất trong nhóm. Chúc quý khách một ngày tốt lành."]}}},"5":{"vocab":{"Limited":["/ˈlɪm.ɪ.t̬ɪd/","This offer is available for a limited time only.","Ưu đãi này chỉ áp dụng trong thời gian có hạn."],"Markdown":["/ˈmɑːrk.daʊn/","Shoppers can find markdowns of up to 40 percent on summer clothing.","Người mua có thể tìm thấy quần áo mùa hè giảm giá đến 40%."],"Office supplies":["/ˈɑː.fɪs səˌplaɪz/","Please order office supplies through the online system.","Vui lòng đặt văn phòng phẩm qua hệ thống trực tuyến."],"Promotional":["/prəˈmoʊ.ʃən.əl/","Enter the promotional code at checkout to get 15 percent off.","Nhập mã khuyến mãi khi thanh toán để được giảm 15%."],"Redeem":["/rɪˈdiːm/","Coupons can be redeemed at any of our locations.","Phiếu giảm giá có thể được sử dụng tại bất kỳ chi nhánh nào của chúng tôi."],"Reduce rate":["/rɪˈduːst reɪt/","Students can join the gym at a reduced rate.","Sinh viên có thể đăng ký phòng tập với mức giá ưu đãi."],"Renew":["/rɪˈnuː/","Remember to renew your membership before it expires.","Nhớ gia hạn thẻ thành viên trước khi hết hạn."],"Retailer":["/ˈriː.teɪ.lɚ/","The product is sold through online retailers.","Sản phẩm được bán qua các nhà bán lẻ trực tuyến."],"Souvenir":["/ˌsuː.vəˈnɪr/","The museum shop sells postcards and other souvenirs.","Cửa hàng của bảo tàng bán bưu thiếp và các món quà lưu niệm khác."],"Special offer":["/ˈspeʃ.əl ˈɑː.fɚ/","This week's special offer: buy one pizza, get one free.","Ưu đãi đặc biệt tuần này: mua một bánh pizza, tặng một bánh."],"Store credit":["/stɔːr ˈkred.ɪt/","I let currentUid = 'guest';

function migrateLegacyStorage() {
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('toeic45:') && !k.startsWith('toeic45:guest:') && !k.match(/^toeic45:[a-zA-Z0-9_-]+:/)) {
        const subKey = k.slice(8);
        const val = localStorage.getItem(k);
        if (localStorage.getItem('toeic45:guest:' + subKey) == null) {
          localStorage.setItem('toeic45:guest:' + subKey, val);
        }
      }
    }
  } catch (e) {}
}
migrateLegacyStorage();

const store = {
  get(k, d) {
    try {
      const v = localStorage.getItem(`toeic45:${currentUid}:${k}`);
      return v == null ? d : JSON.parse(v);
    } catch (e) {
      return d;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(`toeic45:${currentUid}:${k}`, JSON.stringify(v));
      markDirty(k);
    } catch (e) {}
  },
  remove(k) {
    try {
      localStorage.removeItem(`toeic45:${currentUid}:${k}`);
      markDirty(k);
    } catch (e) {}
  },
  setUid(uid) {
    currentUid = uid || 'guest';
    updateReviewBadge();
  },
  getReviewList() {
    const rev = this.get('review', { items: [] });
    return (rev && Array.isArray(rev.items)) ? rev.items.filter(x => !x.deleted) : [];
  },
  getAllReviewItems() {
    const rev = this.get('review', { items: [] });
    return (rev && Array.isArray(rev.items)) ? rev.items : [];
  },
  isStarred(w) {
    const target = norm(cleanWord(w));
    const list = this.getReviewList();
    return list.some(x => norm(cleanWord(x.w)) === target);
  },
  addReviewWord(v, topicId, source = 'manual') {
    const rev = this.get('review', { items: [] });
    const items = rev.items || [];
    const target = norm(cleanWord(v.w));
    const existing = items.find(x => norm(cleanWord(x.w)) === target);
    if (existing) {
      existing.deleted = false;
      existing.updatedAt = Date.now();
      if (!existing.vi && v.vi) existing.vi = v.vi;
      if (!existing.pos && v.pos) existing.pos = v.pos;
      if (topicId) existing.topicId = topicId;
    } else {
      items.push({
        w: v.w,
        pos: v.pos || '',
        vi: v.vi || '',
        topicId: topicId || S.t,
        addedAt: Date.now(),
        updatedAt: Date.now(),
        source,
        deleted: false
      });
    }
    this.set('review', { items, updatedAt: Date.now() });
    updateReviewBadge();
  },
  removeReviewWord(w) {
    const rev = this.get('review', { items: [] });
    const items = rev.items || [];
    const target = norm(cleanWord(w));
    const existing = items.find(x => norm(cleanWord(x.w)) === target);
    if (existing) {
      existing.deleted = true;
      existing.updatedAt = Date.now();
      this.set('review', { items, updatedAt: Date.now() });
      updateReviewBadge();
    }
  },
  toggleReviewWord(v, topicId) {
    if (this.isStarred(v.w)) {
      this.removeReviewWord(v.w);
    } else {
      this.addReviewWord(v, topicId, 'star');
    }
  }
};

function cleanWord(w){ return w.replace(/\(.*?\)/g,'').replace(/\+.*$/,'').replace(/\s+/g,' ').trim(); }
function answers(w){
  const out = new Set();
  const base = cleanWord(w);
  base.split(/\s*[\/=]\s*/).forEach(x => x && out.add(norm(x)));
  const par = w.match(/\(([^)]*)\)/); if (par && /^[A-Za-z ]+$/.test(par[1])) out.add(norm(par[1]));
  return [...out].filter(Boolean);
}
function shortVi(v){ return v.split('->')[0].replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim().replace(/[,.;:]$/,''); }
function splitTitle(t){
  const parts = t.title.split(/\s*[-–]\s+|\s+[-–]\s*|(?<=\S)-\s/).map(s=>s.trim()).filter(Boolean);
  const cap = s => { const l = s.toLocaleLowerCase('vi'); return l.charAt(0).toLocaleUpperCase('vi') + l.slice(1); };
  const vn = parts.filter(p => VN.test(p)), en = parts.filter(p => !VN.test(p));
  if (!vn.length) return { main: cap(parts[0]), sub: parts.slice(1).map(cap).join(' – ') };
  return { main: vn.map(cap).join(' – '), sub: en.map(cap).join(' – ') };
}
const enr = id => ENR[id] || null;
function vocabPool(){ return TOPICS.flatMap(t => t.vocab.filter(v => v.vi)); }
function highlighter(t){
  const words = t.vocab.map(v => cleanWord(v.w)).filter(w => w.length > 2).sort((a,b)=>b.length-a.length);
  if (!words.length) return s => esc(s);
  const parts = words.map(w => {
    const ws = w.toLowerCase().split(' ');
    if (ws.length > 1) return ws.map(x => x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+');
    const stem = ws[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/e$/,'');
    return stem + '(?:e|es|s|ed|d|ing|ion|ation|ations|ions|ment|ments|led|ling|lation|ies|ied|y)?';
  });
  const re = new RegExp('\\b(' + parts.join('|') + ')\\b', 'gi');
  return s => esc(s).replace(re, m => '<mark>' + m + '</mark>');
}
let ttsAudioPlayer = null;
window._curUtterance = null;

function speak(text, onDone){
  if (!text || !String(text).trim()) { if (onDone) onDone(); return; }
  const clean = cleanWord(text);

  // 1. Ưu tiên phát bằng Audio MP3 chuẩn US bản ngữ (Youdao Voice - không bị chặn Referer, không cần cài giọng máy tính)
  try {
    if (!ttsAudioPlayer) {
      ttsAudioPlayer = new Audio();
    }
    ttsAudioPlayer.pause();
    ttsAudioPlayer.src = 'https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(clean) + '&type=2';

    ttsAudioPlayer.onended = () => { if (onDone) onDone(); };
    ttsAudioPlayer.onerror = (e) => {
      console.warn('Audio MP3 error, fallback to SpeechSynthesis:', e);
      fallbackBrowserSpeech(clean, onDone);
    };

    const p = ttsAudioPlayer.play();
    if (p !== undefined) {
      p.catch(() => {
        fallbackBrowserSpeech(clean, onDone);
      });
      return;
    }
  } catch(e) {
    fallbackBrowserSpeech(clean, onDone);
  }
}

function fallbackBrowserSpeech(clean, onDone) {
  try {
    const s = window.speechSynthesis;
    if (!s) { if (onDone) onDone(); return; }
    s.cancel();
    if (s.paused) s.resume();
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = 'en-US';
    u.rate = 0.95;
    window._curUtterance = u;
    u.onend = () => { window._curUtterance = null; if (onDone) onDone(); };
    u.onerror = () => { window._curUtterance = null; if (onDone) onDone(); };
    s.speak(u);
  } catch(err) {
    if (onDone) onDone();
  }
}

function srcLabel(src){
  const m = String(src).match(/(\d+)\s*-\s*(\d+)\s*ETS\s*(\d{4})\.(\d+)/i);
  return m ? `ETS ${m[3]} · Test ${m[4]} · câu ${m[1]}–${m[2]}` : esc(src);
}

// ---------- State & Routing ----------
const PARTS = [
  { k:0, name:'Tổng hợp từ', short:'Tổng hợp' },
  { k:1, name:'Từ vựng', short:'Từ vựng' },
  { k:2, name:'Họ từ & đồng nghĩa', short:'Họ từ' },
  { k:3, name:'Dịch câu', short:'Dịch' },
  { k:4, name:'Nghe & điền từ', short:'Nghe' }
];
let S = { t:1, p:1, sub:'list' };
let currentRoute = 'topic'; // 'topic' | 'review' | 'leaderboard' | 'profile' | 'admin'

function readHash(){
  const h = location.hash || '';
  if (h === '#topic-0' || h === '#t0' || h === '#t0-p1' || h === '#hub') { currentRoute = 'topic0'; return true; }
  if (h === '#pronun' || h === '#pronunciation' || h === '#phat-am' || h === '#speaking') { currentRoute = 'pronun'; return true; }
  if (h === '#review') { currentRoute = 'review'; return true; }
  if (h === '#leaderboard') { currentRoute = 'leaderboard'; return true; }
  if (h === '#profile') { currentRoute = 'profile'; return true; }
  if (h === '#admin') { currentRoute = 'admin'; return true; }
  const m = h.match(/^#t(\d+)-p([0-4])$/);
  if (m && TOPICS[+m[1]-1]) {
    currentRoute = 'topic';
    S.t = +m[1]; S.p = +m[2];
    return true;
  }
  return false;
}

function go(t, p){
  currentRoute = 'topic';
  const moved = t !== S.t || p !== S.p;
  S.t = t; S.p = p; if (p === 1) S.sub = 'list';
  const h = `#t${t}-p${p}`;
  if (location.hash !== h) { try { history.replaceState(null,'',h); } catch(e){ location.hash = h; } }
  render();
  if (moved) { try { window.scrollTo({ top: 0 }); } catch(e){ window.scrollTo(0,0); } }
}

function goTo(route){
  currentRoute = route;
  const h = '#' + route;
  if (location.hash !== h) { try { history.replaceState(null,'',h); } catch(e){ location.hash = h; } }
  render();
  try { window.scrollTo({ top: 0 }); } catch(e){ window.scrollTo(0,0); }
}

let debounceTimer = null;

function markDirty(k) {
  if (!currentUser || currentUid === 'guest') return;
  if (LOCAL_ONLY_KEYS.test(k)) return;
  dirtyKeys.add(k);
  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(flushDirtyKeys, 1500);
}

async function flushDirtyKeys() {
  if (!currentUser || currentUid === 'guest' || !fbDb || dirtyKeys.size === 0) return;
  const keys = Array.from(dirtyKeys);
  dirtyKeys.clear();
  try {
    const answerUpdates = {};
    const progressUpdates = {};
    let reviewUpdate = null;

    for (const k of keys) {
      const val = store.get(k);
      if (k.startsWith('tr:') || k.startsWith('g-') || k.startsWith('gt-')) {
        const parts = k.startsWith('tr:') ? k.split(':') : k.split('-');
        const tId = parts[1];
        answerUpdates[tId] = answerUpdates[tId] || {};
        answerUpdates[tId][k] = val;
      } else if (k.startsWith('completedManual:')) {
        const tId = k.split(':')[1];
        progressUpdates[tId] = progressUpdates[tId] || {};
        progressUpdates[tId].completedManual = Boolean(val);
      } else if (k.startsWith('best:')) {
        const tId = k.split(':')[1];
        progressUpdates[tId] = progressUpdates[tId] || {};
        progressUpdates[tId].best = Number(val) || 0;
        progressUpdates[tId].completed = (Number(val) || 0) >= 80;
      } else if (k.startsWith('p0_best:')) {
        const tId = k.split(':')[1];
        progressUpdates[tId] = progressUpdates[tId] || {};
        const curBest = Number(progressUpdates[tId].best) || Number(store.get('best:' + tId, 0)) || 0;
        progressUpdates[tId].best = Math.max(Number(val) || 0, curBest);
        progressUpdates[tId].completed = progressUpdates[tId].best >= 80;
      } else if (k.startsWith('wf-')) {
        const parts = k.split('-');
        const tId = parts[1];
        answerUpdates[tId] = answerUpdates[tId] || {};
        answerUpdates[tId][k] = val;
      } else if (k === 'review') {
        reviewUpdate = val;
      }
    }

    const batch = firestoreModules.writeBatch(fbDb);
    let count = 0;

    for (const [tId, data] of Object.entries(answerUpdates)) {
      const ref = firestoreModules.doc(fbDb, 'users', currentUid, 'answers', tId);
      batch.set(ref, { data, updatedAt: firestoreModules.serverTimestamp() }, { merge: true });
      count++;
    }

    for (const [tId, prog] of Object.entries(progressUpdates)) {
      const ref = firestoreModules.doc(fbDb, 'users', currentUid, 'progress', tId);
      batch.set(ref, { ...prog, updatedAt: firestoreModules.serverTimestamp() }, { merge: true });
      count++;
    }

    if (reviewUpdate) {
      const ref = firestoreModules.doc(fbDb, 'users', currentUid, 'meta', 'review');
      batch.set(ref, { items: reviewUpdate.items || [], updatedAt: firestoreModules.serverTimestamp() }, { merge: true });
      count++;
    }

    if (count > 0) {
      await batch.commit();
      if (Object.keys(progressUpdates).length > 0) {
        syncLeaderboardFromClient(currentUid);
      }
    }
  } catch (err) {
    console.error('Lỗi khi đồng bộ dữ liệu lên Firestore:', err);
    keys.forEach(k => dirtyKeys.add(k));
  }
}

async function syncLeaderboardFromClient(uid) {
  if (!fbDb || !uid || !currentUser || currentUser.uid !== uid || !firestoreModules) return;
  try {
    const userDoc = await firestoreModules.getDoc(firestoreModules.doc(fbDb, 'users', uid));
    const userData = userDoc.data() || {};
    if (userData.hidden === true) {
      await firestoreModules.deleteDoc(firestoreModules.doc(fbDb, 'leaderboard', uid));
      return;
    }
    let totalBest = 0;
    let completedCount = 0;
    TOPICS.forEach(t => {
      const best = store.get('best:' + t.id, null);
      const completedManual = store.get('completedManual:' + t.id, false);
      if (best != null && typeof best === 'number') totalBest += best;
      if (completedManual || (best != null && best >= 80)) completedCount++;
    });

    await firestoreModules.setDoc(firestoreModules.doc(fbDb, 'leaderboard', uid), {
      uid,
      displayName: userData.displayName || currentUser.displayName || 'Người học',
      photoURL: userData.photoURL || currentUser.photoURL || '',
      totalBest,
      completedCount,
      updatedAt: firestoreModules.serverTimestamp()
    });
  } catch(e) {
    console.warn('Lỗi đồng bộ leaderboard:', e);
  }
}

async function initFirebase() {
  if (!isConfigured) return;
  try {
    const [appMod, authMod, fsMod] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js')
    ]);

    authModules = authMod;
    firestoreModules = fsMod;

    fbApp = appMod.initializeApp(firebaseConfig);
    fbAuth = authMod.getAuth(fbApp);
    fbDb = fsMod.getFirestore(fbApp);

    const authBox = $('#auth-box');
    if (authBox) authBox.hidden = false;

    try {
      await authMod.getRedirectResult(fbAuth);
    } catch (e) {}

    authMod.onAuthStateChanged(fbAuth, async (user) => {
      currentUser = user;
      if (user) {
        store.setUid(user.uid);
        await ensureUserProfile(user);
        await checkAdminStatus(user.uid);
        renderAuthBox();
        await checkFirstLoginMerge(user.uid);
        // Luôn kéo dữ liệu mới nhất từ đám mây về máy tính/thiết bị này
        await downloadCloudData(user.uid);
      } else {
        store.setUid('guest');
        isAdminUser = false;
        renderAuthBox();
        const sAdmin = $('#snav-admin');
        if (sAdmin) sAdmin.hidden = true;
      }
      renderSide();
      if (currentRoute === 'topic') render();
      if (currentRoute === 'leaderboard') renderLeaderboard($('#panel'));
      if (currentRoute === 'profile') renderProfile($('#panel'));
      if (currentRoute === 'admin') renderAdmin($('#panel'));
    });
  } catch (err) {
    console.warn('Không thể khởi tạo Firebase (có thể do offline hoặc lỗi mạng):', err);
  }
}

async function ensureUserProfile(user) {
  if (!fbDb || !user) return;
  try {
    const userRef = firestoreModules.doc(fbDb, 'users', user.uid);
    const snap = await firestoreModules.getDoc(userRef);
    if (!snap.exists()) {
      await firestoreModules.setDoc(userRef, {
        displayName: user.displayName || 'Người học',
        email: user.email || '',
        photoURL: user.photoURL || '',
        hidden: false,
        createdAt: firestoreModules.serverTimestamp(),
        updatedAt: firestoreModules.serverTimestamp()
      });
    } else {
      const d = snap.data();
      const updates = {};
      if (user.displayName && d.displayName !== user.displayName) updates.displayName = user.displayName;
      if (user.photoURL && d.photoURL !== user.photoURL) updates.photoURL = user.photoURL;
      if (user.email && d.email !== user.email) updates.email = user.email;
      if (Object.keys(updates).length > 0) {
        updates.updatedAt = firestoreModules.serverTimestamp();
        await firestoreModules.setDoc(userRef, updates, { merge: true });
      }
    }
  } catch (e) {}
}

async function downloadCloudData(uid) {
  if (!fbDb || !uid || !firestoreModules) return;
  try {
    // 1. Đồng bộ điểm trắc nghiệm & trạng thái hoàn thành
    const progSnap = await firestoreModules.getDocs(firestoreModules.collection(fbDb, 'users', uid, 'progress'));
    progSnap.forEach(d => {
      const data = d.data();
      const tId = d.id;
      if (typeof data.best === 'number') {
        const localBest = Number(store.get('best:' + tId, 0)) || 0;
        const higherBest = Math.max(data.best, localBest);
        localStorage.setItem(`toeic45:${uid}:best:${tId}`, JSON.stringify(higherBest));
      }
      if (data.completed || data.completedManual) {
        localStorage.setItem(`toeic45:${uid}:completedManual:${tId}`, JSON.stringify(true));
      }
    });

    // 2. Đồng bộ các bài làm (dịch câu, điền từ, dạng từ)
    const ansSnap = await firestoreModules.getDocs(firestoreModules.collection(fbDb, 'users', uid, 'answers'));
    ansSnap.forEach(d => {
      const answers = d.data().data || {};
      Object.entries(answers).forEach(([k, val]) => {
        const localVal = store.get(k, null);
        if (localVal == null || localVal === '') {
          localStorage.setItem(`toeic45:${uid}:${k}`, JSON.stringify(val));
        } else if (val && typeof val === 'object' && typeof localVal === 'object') {
          localStorage.setItem(`toeic45:${uid}:${k}`, JSON.stringify({ ...localVal, ...val }));
        } else if (val != null && val !== '') {
          localStorage.setItem(`toeic45:${uid}:${k}`, JSON.stringify(val));
        }
      });
    });

    // 3. Đồng bộ danh sách từ khó (gộp chung cả 2 thiết bị)
    const revDoc = await firestoreModules.getDoc(firestoreModules.doc(fbDb, 'users', uid, 'meta', 'review'));
    if (revDoc.exists() && revDoc.data().items) {
      const cloudItems = revDoc.data().items || [];
      const localRev = store.get('review', { items: [] });
      const localItems = (localRev && Array.isArray(localRev.items)) ? localRev.items : [];
      const itemMap = new Map();
      localItems.forEach(it => { if (it && it.w) itemMap.set(norm(cleanWord(it.w)), it); });
      cloudItems.forEach(it => {
        if (it && it.w) {
          const key = norm(cleanWord(it.w));
          if (!itemMap.has(key)) {
            itemMap.set(key, it);
          } else {
            const existing = itemMap.get(key);
            if (existing.deleted && !it.deleted) itemMap.set(key, it);
          }
        }
      });
      localStorage.setItem(`toeic45:${uid}:review`, JSON.stringify({ items: Array.from(itemMap.values()) }));
      updateReviewBadge();
    }

    // Làm mới giao diện để hiển thị ngay lập tức
    renderSide();
    if (currentRoute === 'topic') {
      render();
    } else if (currentRoute === 'topic0') {
      const p = $('#panel');
      if (p) renderTopic0(p);
    }
  } catch (e) {
    console.error('Lỗi downloadCloudData:', e);
  }
}

async function executeMerge(mode, uid) {
  const guestData = {};
  const guestPrefix = 'toeic45:guest:';
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(guestPrefix)) {
        const sub = k.slice(guestPrefix.length);
        guestData[sub] = JSON.parse(localStorage.getItem(k));
      }
    }
  } catch (e) {}

  if (mode === 'cloud') {
    await downloadCloudData(uid);
  } else if (mode === 'local') {
    Object.entries(guestData).forEach(([k, val]) => {
      store.set(k, val);
    });
    await flushDirtyKeys();
  } else if (mode === 'merge') {
    await downloadCloudData(uid);
    Object.entries(guestData).forEach(([k, val]) => {
      if (k.startsWith('best:')) {
        const currentBest = store.get(k, 0);
        store.set(k, Math.max(Number(val) || 0, currentBest));
      } else if (k.startsWith('completedManual:')) {
        if (val) store.set(k, true);
      } else if (k === 'review') {
        const currentRev = store.get('review', { items: [] });
        const guestItems = (val && val.items) || [];
        const mergedMap = new Map();
        (currentRev.items || []).forEach(it => mergedMap.set(norm(cleanWord(it.w)), it));
        guestItems.forEach(it => {
          const key = norm(cleanWord(it.w));
          if (!mergedMap.has(key)) {
            mergedMap.set(key, it);
          } else {
            const cur = mergedMap.get(key);
            if ((it.updatedAt || 0) > (cur.updatedAt || 0)) {
              mergedMap.set(key, it);
            }
          }
        });
        store.set('review', { items: Array.from(mergedMap.values()), updatedAt: Date.now() });
      } else {
        const cur = store.get(k, null);
        if (cur == null || (typeof val === 'string' && val.trim().length > (cur ? String(cur).trim().length : 0))) {
          store.set(k, val);
        }
      }
    });
    await flushDirtyKeys();
  }

  try {
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(guestPrefix)) toRemove.push(k);
    }
    toRemove.forEach(k => localStorage.removeItem(k));
  } catch (e) {}

  store.set('synced_choice', true);
  render();
}

          if (err.code === 'auth/popup-blocked' || err.code === 'auth/cancelled-popup-request') {
            await authModules.signInWithRedirect(fbAuth, provider);

          } catch (err) {
            alert('Lỗi: ' + err.message);
          }
        }
      };
    }
  }

  function renderTab() {
    openModal(getHtml());
    bindEvents();
  }

  renderTab();
}

function renderSide(){
  const q = norm($('#search').value || '');
  const list = $('#tlist'); list.innerHTML = '';

  

  TOPICS.forEach(t => {
    const st = splitTitle(t);
    let hits = 0;
    if (q){
      const inTitle = norm(t.title).includes(q) || st.main.toLowerCase().includes(q);
      hits = t.vocab.filter(v => norm(v.w).includes(q) || v.vi.toLowerCase().includes(q)).length;
      if (!inTitle && !hits) return;
    }
    const best = store.get('best:' + t.id, null);
    const completedManual = store.get('completedManual:' + t.id, false);
    const isCompleted = completedManual || (best != null && best >= 80);
    const isCurrent = currentRoute === 'topic' && t.id === S.t;

    const li = document.createElement('li');
    li.innerHTML = `<a href="#t${t.id}-p1" ${isCurrent ? 'aria-current="true"' : ''} class="${isCompleted ? 'is-done' : ''}"><span class="n">${String(t.id).padStart(2,'0')}</span><span class="nm">${isCompleted ? '<span class="done-check" title="Đã hoàn thành">✓</span> ' : ''}${esc(st.main)}</span>${hits ? `<span class="hit">${hits} từ</span>` : (best != null ? `<span class="sc" title="Điểm trắc nghiệm cao nhất">${best}%</span>` : '<span></span>')}</a>`;
    li.querySelector('a').addEventListener('click', e => { e.preventDefault(); go(t.id, 1); window.scrollTo({top:0}); });
    list.appendChild(li);
  });
  const sel = $('#tselect');
  if (!sel.options.length) TOPICS.forEach(t => { const o = document.createElement('option'); o.value = t.id; o.textContent = String(t.id).padStart(2,'0') + '. ' + splitTitle(t).main; sel.appendChild(o); });
  sel.value = S.t;

  const rItem = $('#snav-review');
  const prItem = $('#snav-pronun');
  if (prItem) prItem.setAttribute('aria-current', String(currentRoute === 'pronun'));
  if (rItem) rItem.setAttribute('aria-current', String(currentRoute === 'review'));
  const lItem = $('#snav-lb');
  if (lItem) lItem.setAttribute('aria-current', String(currentRoute === 'leaderboard'));
  const aItem = $('#snav-admin');
  if (aItem) aItem.setAttribute('aria-current', String(currentRoute === 'admin'));

  updateReviewBadge();
}

$('#search').addEventListener('input', renderSide);
$('#tselect').addEventListener('change', e => go(+e.target.value, 1));
$('#tprev').addEventListener('click', () => { if (S.t > 1) go(S.t - 1, S.p); });
$('#tnext').addEventListener('click', () => { if (S.t < TOPICS.length) go(S.t + 1, S.p); });

// ---------- Header & Tabs ----------
function renderHead(t){
  const st = splitTitle(t), e = enr(t.id);
  const nTr = t.sections.filter(s=>s.type!=='gaps').reduce((a,s)=>a+s.blocks.filter(b=>b.k!=='audio').length,0);
  const nAu = t.sections.filter(s=>s.type==='gaps').reduce((a,s)=>a+s.blocks.filter(b=>b.k==='audio').length,0);
  const best = store.get('best:' + t.id, null);
  const completedManual = store.get('completedManual:' + t.id, false);
  const isCompleted = completedManual || (best != null && best >= 80);

  $('#thead').innerHTML = `
    <div class="row between">
      <div class="eyebrow">Chủ đề ${String(t.id).padStart(2,'0')} / ${TOPICS.length}</div>
      <button class="btn ${isCompleted ? 'completed-btn' : ''}" id="btn-toggle-comp" title="Bấm để đánh dấu hoàn thành">
        ${isCompleted ? '✓ Đã hoàn thành' : 'Đánh dấu hoàn thành'}
      </button>
    </div>
    <h1>${esc(st.main)}${st.sub?` <span class="en">${esc(st.sub)}</span>`:''}</h1>
    <div class="meta">
      <span>${t.vocab.length} từ vựng</span>
      <span>${t.notes.length} ghi chú họ từ</span>
      ${nTr?`<span>${nTr} đoạn dịch</span>`:''}
      ${nAu?`<span>${nAu} audio điền từ</span>`:''}
      ${best != null ? `<span style="color:var(--good);font-weight:700">Điểm cao nhất: ${best}%</span>` : ''}
      ${e?'<span class="tag">Có câu ví dụ, bản dịch mẫu</span>':''}
    </div>`;

  $('#btn-toggle-comp').onclick = () => {
    const nextVal = !completedManual;
    store.set('completedManual:' + t.id, nextVal);
    flushDirtyKeys();
    renderHead(t);
    renderSide();
  };

  const tabs = $('#tabs'); tabs.innerHTML = '';
  PARTS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'tab'; b.setAttribute('role','tab'); b.setAttribute('aria-selected', String(p.k===S.p));
    b.innerHTML = `<span class="k">${p.k}</span><span class="full">${p.name}</span><span class="short">${p.short}</span>`;
    b.addEventListener('click', () => go(S.t, p.k));
    tabs.appendChild(b);
  });
}

function getChapterAllWords(t) {
  const e = enr(t.id);
  const wordMap = new Map();

  // 1. Phần 1: Từ vựng chính
  (t.vocab || []).forEach(v => {
    if (!v.w || !v.vi) return;
    const clean = cleanWord(v.w);
    if (!clean) return;
    const k = clean.toLowerCase();
    wordMap.set(k, {
      ...v,
      w: clean,
      topicId: t.id,
      topicTitle: splitTitle(t).main,
      source: 'Phần 1',
      sourceFull: 'Phần 1: Từ vựng chính',
      part: 1
    });
  });

  // 2. Phần 2: Ghi chú họ từ, đồng nghĩa
  (t.notes || []).forEach(line => {
    let lineVi = '';
    const colonIdx = line.indexOf(':');
    if (colonIdx !== -1) {
      lineVi = line.slice(colonIdx + 1).trim();
    }
    const leftPart = line.split(/[:;]/)[0];
    const toks = leftPart.split(/\s*(?:->|→|=|~|><|,)\s*/);
    toks.forEach(tk => {
      let raw = cleanWord(tk);
      raw = raw.replace(/^\d+[\.\)]\s*/, '').trim();
      if (!raw || raw.length < 2 || raw.split(/\s+/).length > 4) return;
      const k = raw.toLowerCase();
      if (wordMap.has(k)) return;

      let pos = 'họ từ', vi = lineVi;
      if (CHAPTER_VOCAB_DICT[k]) {
        pos = CHAPTER_VOCAB_DICT[k].pos || pos;
        vi = CHAPTER_VOCAB_DICT[k].vi || vi;
      } else {
        const hit = vocabPool().find(x => norm(cleanWord(x.w)) === norm(k));
        if (hit) {
          pos = hit.pos || pos;
          vi = hit.vi || vi;
        }
      }
      if (vi) {
        wordMap.set(k, {
          w: raw,
          pos,
          vi,
          topicId: t.id,
          topicTitle: splitTitle(t).main,
          source: 'Phần 2',
          sourceFull: 'Phần 2: Họ từ & đồng nghĩa',
          part: 2
        });
      }
    });
  });

  // 2b. Phần 2: Dạng đúng của từ (forms)
  if (e && e.forms) {
    e.forms.forEach(f => {
      const base = f[1];
      (f[2] || []).forEach(ans => {
        ans.split(/\s*\/\s*/).forEach(p => {
          const raw = cleanWord(p);
          const k = raw.toLowerCase();
          if (raw && !wordMap.has(k)) {
            let vi = '';
            if (CHAPTER_VOCAB_DICT[k]) vi = CHAPTER_VOCAB_DICT[k].vi;
            else {
              const hit = vocabPool().find(x => norm(cleanWord(x.w)) === norm(k));
              if (hit) vi = hit.vi;
              else if (wordMap.has(base.toLowerCase())) vi = wordMap.get(base.toLowerCase()).vi;
            }
            if (vi) {
              wordMap.set(k, {
                w: raw,
                pos: 'dạng từ',
                vi,
                topicId: t.id,
                topicTitle: splitTitle(t).main,
                source: 'Phần 2',
                sourceFull: 'Phần 2: Chia dạng từ',
                part: 2
              });
            }
          }
        });
      });
    });
  }

  // 3. Phần 3: Từ vựng đề xuất trong bài đọc & dịch
  if (e && e.tr) {
    Object.values(e.tr).forEach(sec => {
      Object.values(sec).forEach(it => {
        (it[1] || []).forEach(w => {
          const raw = cleanWord(w[0]);
          const k = raw.toLowerCase();
          if (raw && !wordMap.has(k) && w[2]) {
            wordMap.set(k, {
              w: w[0],
              pos: w[1] || '',
              vi: w[2],
              topicId: t.id,
              topicTitle: splitTitle(t).main,
              source: 'Phần 3',
              sourceFull: 'Phần 3: Bài đọc & dịch',
              part: 3
            });
          }
        });
      });
    });
  }

  // 4. Phần 4: Từ khóa trong bài nghe điền từ
  if (e && e.gap) {
    Object.values(e.gap).forEach(sec => {
      Object.values(sec).forEach(it => {
        (it[0] || []).forEach(ans => {
          ans.split(/\s*\/\s*/).forEach(a => {
            const raw = cleanWord(a);
            const k = raw.toLowerCase();
            if (raw && raw.length > 2 && raw.split(/\s+/).length <= 3 && !wordMap.has(k)) {
              let vi = '';
              if (CHAPTER_VOCAB_DICT[k]) vi = CHAPTER_VOCAB_DICT[k].vi;
              else {
                const hit = vocabPool().find(x => norm(cleanWord(x.w)) === norm(k));
                if (hit) vi = hit.vi;
              }
              if (vi) {
                wordMap.set(k, {
                  w: raw,
                  pos: 'bài nghe',
                  vi,
                  topicId: t.id,
                  topicTitle: splitTitle(t).main,
                  source: 'Phần 4',
                  sourceFull: 'Phần 4: Nghe điền từ',
                  part: 4
                });
              }
            }
          });
        });
      });
    });
  }

  return [...wordMap.values()];
}

function part0(t, el){
  let sub = store.get('p0_sub_' + t.id, 'quiz'); // 'quiz' | 'flashcard' | 'write'
  let partFilter = store.get('p0_filter_' + t.id, 'all'); // 'all' | '1' | '2' | '3' | '4'

  const allWords = getChapterAllWords(t);
  
  const countAll = allWords.length;
  const countP1 = allWords.filter(x => x.part === 1).length;
  const countP2 = allWords.filter(x => x.part === 2).length;
  const countP3 = allWords.filter(x => x.part === 3).length;
  const countP4 = allWords.filter(x => x.part === 4).length;

  let pool = allWords;
  if (partFilter === '1') pool = allWords.filter(x => x.part === 1);
  else if (partFilter === '2') pool = allWords.filter(x => x.part === 2);
  else if (partFilter === '3') pool = allWords.filter(x => x.part === 3);
  else if (partFilter === '4') pool = allWords.filter(x => x.part === 4);

  if (!pool.length) {
    pool = allWords;
    partFilter = 'all';
  }

  el.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
      <div class="row between" style="flex-wrap:wrap;gap:10px;align-items:center">
        <div class="seg" id="p0-sub">
          <button data-s="quiz" ${sub === 'quiz' ? 'aria-pressed="true"' : ''}>🎯 Trắc nghiệm</button>
          <button data-s="flashcard" ${sub === 'flashcard' ? 'aria-pressed="true"' : ''}>🃏 Lật hình (Flashcards)</button>
          <button data-s="write" ${sub === 'write' ? 'aria-pressed="true"' : ''}>✍️ Viết từ (Việt → Anh)</button>
        </div>
        <span class="hint" style="font-weight:700;font-size:13.5px;color:var(--accent)">
          📚 Đang luyện: ${pool.length} / ${countAll} từ tổng hợp (Chương ${t.id})
        </span>
      </div>

      <div class="row" style="flex-wrap:wrap;gap:6px;align-items:center">
        <span style="font-size:12px;font-weight:700;color:var(--muted);margin-right:2px;text-transform:uppercase;letter-spacing:0.4px">Nguồn từ:</span>
        <div class="seg seg-sm" id="p0-filter">
          <button data-f="all" ${partFilter === 'all' ? 'aria-pressed="true"' : ''}>Tất cả phần (${countAll})</button>
          ${countP1 ? `<button data-f="1" ${partFilter === '1' ? 'aria-pressed="true"' : ''}>Phần 1: Từ vựng (${countP1})</button>` : ''}
          ${countP2 ? `<button data-f="2" ${partFilter === '2' ? 'aria-pressed="true"' : ''}>Phần 2: Họ từ (${countP2})</button>` : ''}
          ${countP3 ? `<button data-f="3" ${partFilter === '3' ? 'aria-pressed="true"' : ''}>Phần 3: Bài dịch (${countP3})</button>` : ''}
          ${countP4 ? `<button data-f="4" ${partFilter === '4' ? 'aria-pressed="true"' : ''}>Phần 4: Nghe điền (${countP4})</button>` : ''}
        </div>
      </div>
    </div>
    <div id="p0-box" class="panel"></div>
  `;

  el.querySelectorAll('#p0-sub button').forEach(b => {
    b.onclick = () => {
      sub = b.dataset.s;
      store.set('p0_sub_' + t.id, sub);
      part0(t, el);
    };
  });

  el.querySelectorAll('#p0-filter button').forEach(b => {
    b.onclick = () => {
      partFilter = b.dataset.f;
      store.set('p0_filter_' + t.id, partFilter);
      part0(t, el);
    };
  });

  const box = el.querySelector('#p0-box');
  if (sub === 'flashcard') {
    renderT0Flashcards(box, pool);
  } else if (sub === 'write') {
    renderT0WriteDrill(box, pool);
  } else {
    renderT0Quiz(box, pool);
  }
}

        <button class="icon-btn" data-say="${esc(cleanWord(v.w))}" aria-label="Nghe phát âm ${esc(v.w)}" title="Nghe phát âm mẫu">${SPEAK}</button>
        <button class="icon-btn rec-btn" data-rec-text="${esc(cleanWord(v.w))}" data-rec-id="v-${t.id}-${i}" aria-label="Ghi âm giọng nói ${esc(v.w)}" title="Ghi âm giọng nói phát âm từ này">${MIC_ICON}</button>
      </div>
    </div>
      <div class="vvi">${esc(v.vi) || '<span class="hint">Tài liệu không ghi nghĩa</span>'}</div>
      ${x?`<div class="ex">${highlightOne(x[1], v.w)}<span class="vi">${esc(x[2])}</span></div>`:''}
      <div class="rec-slot" id="slot-v-${t.id}-${i}"></div></article>`;
  }).join('')}</div>`;
  box.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => speak(b.dataset.say)));
  box.querySelectorAll('[data-star]').forEach(b => b.addEventListener('click', () => {
    const w = b.dataset.star;
    const item = t.vocab.find(v => v.w === w);
    if (item) store.toggleReviewWord(item, t.id);
    part1(t, el);
    updateReviewBadge();
  }));
}

function highlightOne(s, w){
  const stem = cleanWord(w).toLowerCase().split(' ')[0].replace(/e$/,'').replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const multi = cleanWord(w).split(' ').length > 1;
  const re = multi ? new RegExp('(' + cleanWord(w).split(' ').map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('\\s+') + ')','i')
                   : new RegExp('\\b(' + stem + '\\w*)','i');
  return esc(s).replace(re, '<mark>$1</mark>');
}

// ---------- Quiz: Trắc nghiệm ----------

function getWordDescVi(t, v) {
  if (!t || !v) return '';
  const e = enr(t.id);
  if (e && e.vocab && e.vocab[v.w] && e.vocab[v.w][2]) {
    return e.vocab[v.w][2];
  }
  return 'Từ vựng chủ đề "' + t.title.split(' - ')[0] + '" - dùng với nghĩa: ' + v.vi + '.';
}

function quiz(t, box){
  const pool = t.vocab.filter(v => v.vi);
  if (pool.length < 2) { box.innerHTML = '<div class="empty">Chủ đề này chưa đủ từ có nghĩa để làm trắc nghiệm.</div>'; return; }
  let dir = store.get('qdir','en');
  const all = vocabPool();
  const qs = shuffle(pool).slice(0, Math.min(10, pool.length)).map(v => {
    const same = shuffle(pool.filter(x => x !== v && shortVi(x.vi) !== shortVi(v.vi)));
    const extra = shuffle(all.filter(x => !pool.includes(x)));
    const ds = same.concat(extra).slice(0,3);
    return { v, opts: shuffle([v, ...ds]) };
  });
  let i = 0, score = 0, wrong = [];
  function draw(){
    if (i >= qs.length){
      const pct = Math.round(score / qs.length * 100);
      const best = store.get('best:' + t.id, 0);
      const newBest = Math.max(pct, best);
      store.set('best:' + t.id, newBest);

      if (wrong.length) {
        wrong.forEach(w => store.addReviewWord(w, t.id, 'quiz'));
      }

      // Tự động lưu tiến độ lên Firebase nếu đã đăng nhập
      if (currentUser && fbDb && firestoreModules && currentUid !== 'guest') {
        const isCompleted = newBest >= 80 || store.get('completedManual:' + t.id, false);
        const progRef = firestoreModules.doc(fbDb, 'users', currentUid, 'progress', String(t.id));
        firestoreModules.setDoc(progRef, {
          best: newBest,
          completed: newBest >= 80,
          updatedAt: firestoreModules.serverTimestamp()
        }, { merge: true }).then(() => {
          syncLeaderboardFromClient(currentUid);
        }).catch(err => console.warn('Lỗi lưu tiến độ:', err));
      }

      box.innerHTML = `<div class="card"><div class="eyebrow">Kết quả trắc nghiệm</div><div class="big">${score}/${qs.length}</div>
        <div class="hint">Điểm bài thi này: <b>${pct}%</b> · Điểm cao nhất của chủ đề: <b>${newBest}%</b></div>
        ${newBest >= 80 ? '<div class="fb ok" style="margin-top:10px">✓ Xuất sắc! Chủ đề này đã hoàn thành (≥ 80%).</div>' : '<div class="hint" style="margin-top:8px">Đạt từ 80% trở lên để hoàn thành chủ đề.</div>'}
        ${currentUser && currentUid !== 'guest' ? '<div class="hint" style="margin-top:4px;font-size:12.5px;color:var(--good)">✓ Tiến độ đã được tự động lưu lên tài khoản & Bảng xếp hạng.</div>' : '<div class="hint" style="margin-top:4px;font-size:12px;color:var(--muted)">Đăng nhập để tự động lưu điểm và xuất hiện trên Bảng xếp hạng.</div>'}
        ${wrong.length?`<div style="margin-top:12px"><b>Cần ôn lại (${wrong.length} từ đã tự động lưu vào Từ khó ⭐):</b><ul class="wrong-list">${wrong.map(v=>`<li><b>${esc(v.w)}</b>${v.pos?` (${esc(v.pos)})`:''}: ${esc(v.vi)}</li>`).join('')}</ul></div>`:'<div class="fb ok" style="margin-top:10px">Đúng hết tất cả các câu! Tuyệt vời.</div>'}
        <div class="row" style="margin-top:14px"><button class="btn primary" id="again">Làm lại với câu mới</button></div></div>`;
      box.querySelector('#again').onclick = () => quiz(t, box);
      renderSide(); return;
    }
    const q = qs[i];
    const viDesc = getWordDescVi(t, q.v);
    const prompt = dir === 'en' ? `${esc(q.v.w)}<small>${q.v.pos?esc(q.v.pos)+' · ':''}chọn nghĩa tiếng Việt đúng</small>` : `${esc(shortVi(q.v.vi))}<small>${q.v.pos?esc(q.v.pos)+' · ':''}chọn từ tiếng Anh đúng</small>`;
    box.innerHTML = `<div class="row between"><div class="seg" id="dir"><button data-d="en">Anh → Việt</button><button data-d="vi">Việt → Anh</button></div><span class="hint">Câu ${i+1}/${qs.length} · đúng ${score}</span></div>
      <div class="card"><div class="qprog"><i style="width:${i/qs.length*100}%"></i></div>
      <div class="qprompt">${prompt}${viDesc ? `<div class="qdesc-vi">💡 <i>${esc(viDesc)}</i></div>` : ''}</div>
      <div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="l">${'ABCD'[k]}</span><span>${esc(dir==='en'?shortVi(o.vi):cleanWord(o.w))}</span></button>`).join('')}</div>
      <div class="row between"><span class="fb" id="fb"></span><button class="btn primary" id="next" hidden>Câu tiếp</button></div></div>`;
    box.querySelectorAll('#dir button').forEach(b => { b.setAttribute('aria-pressed', String(b.dataset.d===dir)); b.onclick = () => { if (b.dataset.d!==dir){ store.set('qdir', b.dataset.d); quiz(t, box);} }; });
    let answered = false;
    box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (answered) return;
      answered = true;
      const pick = q.opts[+b.dataset.k], ok = pick === q.v;
      box.querySelectorAll('.opt').forEach(x => { x.disabled = true; if (q.opts[+x.dataset.k] === q.v) x.classList.add('ok'); });
      if (!ok) {
        b.classList.add('no');
        wrong.push(q.v);
        store.addReviewWord(q.v, t.id, 'quiz');
      } else score++;
      const fb = box.querySelector('#fb'); fb.className = 'fb ' + (ok?'ok':'no');
      fb.textContent = ok ? 'Chính xác.' : `Chưa đúng. ${cleanWord(q.v.w)} = ${shortVi(q.v.vi)}`;
      if (dir==='en' || ok) speak(cleanWord(q.v.w));
      const n = box.querySelector('#next'); n.hidden = false; n.focus();
      n.onclick = () => { i++; draw(); };
    });
  }
  draw();
}

function writeDrill(t, box){
  const e = enr(t.id), ev = e ? e.vocab : {};
  const pool = shuffle(t.vocab.filter(v => v.vi));
  if (!pool.length) { box.innerHTML = '<div class="empty">Chủ đề này chưa có từ để luyện viết.</div>'; return; }
  let i = 0, score = 0, wrong = [];
  function draw(){
    if (i >= pool.length){
      box.innerHTML = `<div class="card"><div class="eyebrow">Hoàn thành</div><div class="big">${score}/${pool.length}</div>
        ${wrong.length?`<div><b>Viết sai hoặc bỏ qua (đã lưu vào mục Từ khó):</b><ul class="wrong-list">${wrong.map(v=>`<li><b>${esc(cleanWord(v.w))}</b>: ${esc(v.vi)}</li>`).join('')}</ul></div>`:''}
        <div class="row"><button class="btn primary" id="again">Luyện lại</button></div></div>`;
      box.querySelector('#again').onclick = () => writeDrill(t, box); return;
    }
    const v = pool[i], ans = answers(v.w), x = ev[v.w];
    let hintLvl = 0, done = false;
    const gap = x ? esc(x[1]).replace(new RegExp('\\b' + cleanWord(v.w).toLowerCase().split(' ')[0].replace(/e$/,'') + '[a-z]*(?:\\s+[a-z]+){' + (cleanWord(v.w).split(' ').length-1) + '}','i'), '_____') : '';
    box.innerHTML = `<div class="card"><div class="qprog"><i style="width:${i/pool.length*100}%"></i></div>
      <div class="row between"><span class="eyebrow">Từ ${i+1}/${pool.length} · đúng ${score}</span>${v.pos?`<span class="pos">${esc(v.pos)}</span>`:''}</div>
      <div class="qprompt">${esc(v.vi)}</div>
      ${x?`<div class="ex">${gap}<span class="vi">${esc(x[2])}</span></div>`:''}
      <form id="wf" class="row" autocomplete="off"><input class="field" id="win" style="flex:1 1 220px" placeholder="Gõ từ tiếng Anh" autocapitalize="off" spellcheck="false"><button class="btn primary" type="submit" id="wchk">Kiểm tra</button></form>
      <div class="row between"><div class="row"><button class="btn ghost" id="whint" type="button">Gợi ý chữ cái</button><button class="btn ghost" id="wskip" type="button">Xem đáp án</button></div><span class="fb" id="wfb"></span></div></div>`;
    const inp = box.querySelector('#win'); inp.focus();
    const fb = box.querySelector('#wfb');
    const finish = (ok) => {
      done = true; inp.classList.add(ok?'ok':'no'); fb.className = 'fb ' + (ok?'ok':'no');
      fb.textContent = ok ? 'Chính xác.' : 'Đáp án: ' + cleanWord(v.w);
      if (ok) score++; else {
        wrong.push(v);
        store.addReviewWord(v, t.id, 'write');
      }
      speak(cleanWord(v.w));
      const b = box.querySelector('#wchk'); b.textContent = 'Từ tiếp'; b.focus();
      box.querySelector('#whint').disabled = true; box.querySelector('#wskip').disabled = true;
    };
    box.querySelector('#wf').onsubmit = ev2 => {
      ev2.preventDefault();
      if (done) { i++; draw(); return; }
      const val = norm(inp.value); if (!val) return;
      if (ans.includes(val)) finish(true);
      else { inp.classList.add('no'); fb.className = 'fb no'; fb.textContent = 'Chưa đúng, thử lại hoặc xem gợi ý.'; setTimeout(()=>inp.classList.remove('no'), 700); }
    };
    box.querySelector('#whint').onclick = () => {
      const w = cleanWord(v.w); hintLvl = Math.min(hintLvl+1, Math.max(1, w.length-1));
      fb.className = 'fb'; fb.textContent = w.split('').map((c,k)=> c===' ' ? '  ' : (k<hintLvl ? c : '_')).join(' ');
    };
    box.querySelector('#wskip').onclick = () => finish(false);
  }
  draw();
}

// ---------- PART 2 ----------
const OPS = { '=':['eq','='], '->':['to','→'], '→':['to','→'], '~':['sim','≈'], '><':['vs','≠'] };
function relLine(line, lIdx = 0){
  const toks = line.split(/\s*(=|->|→|~|><)\s*/).filter(s => s !== '');
  let wIdx = 0;
  return '<div class="rel">' + toks.map(tk => {
    if (OPS[tk]) return `<span class="op ${OPS[tk][0]}">${OPS[tk][1]}</span>`;
    const clean = cleanWord(tk);
    const rid = `p2-${lIdx}-${wIdx++}`;
    return `<span class="chip-item">
      <span class="chip" data-say="${esc(clean)}" title="Bấm để nghe phát âm mẫu">${esc(tk)}</span>
      <button class="mini-rec-btn rec-btn" data-rec-text="${esc(clean)}" data-rec-id="${rid}" title="Ghi âm giọng nói đọc từ '${esc(clean)}'">${MIC_ICON}</button>
    </span>`;
  }).join('') + `<div class="rec-slot-row" id="slot-p2-row-${lIdx}"></div></div>`;
}
function synPairs(t){
  const pairs = [], seen = new Set();
  t.notes.forEach(line => {
    line.split(/\s*(?:->|→|><)\s*/).forEach(seg => {
      const terms = seg.split(/\s*[=~]\s*/).map(x => x.replace(/\(.*?\)/g,'').replace(/\+.*$/,'').trim()).filter(x => x && x.length < 32 && !VN.test(x));
      if (terms.length >= 2 && norm(terms[0]) !== norm(terms[1])) {
        const k = norm(terms[0]); if (!seen.has(k)) { seen.add(k); pairs.push([terms[0], terms[1]]); }
      }
    });
  });
  return pairs;
}
function part2(t, el){
  const e = enr(t.id);
  let h = '';
  if (t.notes.length){
    h += `<h2 class="sec">Ghi chú trong tài liệu</h2>
      <div class="legend"><span class="op eq">=</span>đồng nghĩa <span class="op sim">≈</span>gần nghĩa <span class="op to">→</span>chuyển loại từ, cụm hay dùng <span class="op vs">≠</span>dễ nhầm</div>
      <div class="panel" style="gap:8px">${t.notes.map((l, li) => relLine(l, li)).join('')}</div>`;
  } else h += '<div class="empty">Tài liệu không có ghi chú họ từ, đồng nghĩa cho chủ đề này.</div>';
  const pairs = synPairs(t);
  if (pairs.length >= 2) h += `<h2 class="sec">Ghép cặp đồng nghĩa</h2><p class="hint" style="margin:0">Chọn một từ bên trái rồi chọn từ cùng nghĩa bên phải.</p><div class="card" id="mg"></div>`;
  if (e && e.usage.length) h += `<h2 class="sec">Lưu ý khi dùng</h2><div class="usage">${e.usage.map(u=>`<div><b>${esc(u[0])}</b>${esc(u[1])}</div>`).join('')}</div>`;
  if (e && e.forms.length){
    h += `<h2 class="sec">Chia đúng dạng từ</h2><p class="hint" style="margin:0">Điền dạng đúng của từ trong ngoặc. Bấm Enter hoặc nút Kiểm tra.</p>
      <div class="forms">${e.forms.map((f,k)=>`<form class="fitem" data-k="${k}" autocomplete="off"><div><div>${esc(f[0]).replace('____','<b>_____</b>')}</div><div class="base">(${esc(f[1])})</div></div><div class="row" style="flex-wrap:nowrap"><input class="field" id="wf-${t.id}-${k}" style="padding:7px 10px;font-size:15px" autocapitalize="off" spellcheck="false"><button class="btn" type="submit">Kiểm tra</button></div><div class="ans" hidden></div></form>`).join('')}</div>`;
  }
  el.innerHTML = h;
  if (pairs.length >= 2) matchGame(shuffle(pairs).slice(0,6), el.querySelector('#mg'));
  if (e && e.forms.length) el.querySelectorAll('.fitem').forEach(f => f.onsubmit = ev => {
    ev.preventDefault();
    const it = e.forms[+f.dataset.k], inp = f.querySelector('input'), a = f.querySelector('.ans');
    const ok = it[2].map(norm).includes(norm(inp.value));
    inp.classList.remove('ok','no'); inp.classList.add(ok?'ok':'no');
    a.hidden = false; a.style.color = ok ? 'var(--good)' : 'var(--bad)';
    a.textContent = ok ? 'Đúng.' : 'Đáp án: ' + it[2].join(' / ');
  });
}
function matchGame(pairs, box){
  const L = pairs.map((p,i)=>({i, s:p[0]})), R = shuffle(pairs.map((p,i)=>({i, s:p[1]})));
  let sel = null, done = 0;
  box.innerHTML = `<div class="match"><div class="col" id="ml">${L.map(x=>`<button class="mbtn" data-i="${x.i}">${esc(x.s)}</button>`).join('')}</div><div class="col" id="mr">${R.map(x=>`<button class="mbtn" data-i="${x.i}">${esc(x.s)}</button>`).join('')}</div></div><div class="row between"><span class="hint" id="mst">0/${pairs.length} cặp</span><button class="btn ghost" id="mre">Xáo lại</button></div>`;
  box.querySelectorAll('#ml .mbtn').forEach(b => b.onclick = () => { if (b.classList.contains('done')) return; box.querySelectorAll('#ml .mbtn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel = b; });
  box.querySelectorAll('#mr .mbtn').forEach(b => b.onclick = () => {
    if (!sel || b.classList.contains('done')) return;
    if (sel.dataset.i === b.dataset.i){ sel.classList.remove('sel'); sel.classList.add('done'); b.classList.add('done'); sel.disabled = b.disabled = true; sel = null; done++; box.querySelector('#mst').textContent = `${done}/${pairs.length} cặp` + (done===pairs.length?' · xong':''); }
    else { b.classList.add('err'); sel.classList.add('err'); const s2 = sel; setTimeout(()=>{ b.classList.remove('err'); s2.classList.remove('err'); }, 500); }
  });
  box.querySelector('#mre').onclick = () => matchGame(shuffle(pairs), box);
}

// ---------- PART 3 ----------

  if (allNw.length){

      <div class="tscroll"><table class="nwtable"><thead><tr><th>Từ, cụm từ</th><th>Loại</th><th>Nghĩa</th><th></th></tr></thead><tbody>${allNw.map(w=>`<tr><td><b>${esc(w[0])}</b></td><td>${esc(w[1])}</td><td>${esc(w[2])}</td><td><button class="icon-btn" data-say="${esc(w[0].replace(/\bsth\b/g,'something'))}" aria-label="Nghe">${SPEAK}</button></td></tr>`).join('')}</tbody></table></div>`;

  el.querySelectorAll('textarea[data-key]').forEach(ta => ta.addEventListener('input', () => store.set(ta.dataset.key, ta.value)));
  el.querySelectorAll('[data-ref]').forEach(b => b.onclick = () => {
    const r = el.querySelector('#ref-' + b.dataset.ref), nw = el.querySelector('#nw-' + b.dataset.ref);
    const show = r.hidden; r.hidden = !show; if (nw) nw.hidden = !show;
    b.textContent = show ? 'Ẩn bản dịch mẫu' : 'Xem bản dịch mẫu';
  });
  el.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
    store.set(b.dataset.q, +b.dataset.k);
    el.querySelectorAll(`[data-q="${b.dataset.q}"]`).forEach(x => x.classList.toggle('pick', x === b));
  });
  el.querySelectorAll('[data-say]').forEach(b => b.addEventListener('click', () => speak(b.dataset.say)));
}

// ---------- PART 4 ----------
const BLANK = /[…\.]*…{2,}[…\.]*/g;
function part4(t, el){
  const e = enr(t.id), secs = t.sections.map((s,si)=>({s,si})).filter(x => x.s.type === 'gaps');
  if (!secs.length){ el.innerHTML = '<div class="empty">Tài liệu không có bài nghe điền từ cho chủ đề này.</div>'; return; }
  const hasAud = !!AUD[t.id];
  let h = `<div class="note"><b>Cách làm:</b> ${hasAud?'bấm phát audio ở mỗi bài, nghe rồi điền vào chỗ trống. Có thể giảm tốc độ hoặc tua lại 3 giây.':'nghe audio ETS theo mã câu ghi ở mỗi bài rồi điền.'} Tài liệu không kèm đáp án. ${e?'Gợi ý đáp án ở chủ đề này do AI suy ra từ ngữ cảnh, chưa đối chiếu với audio, nên hãy tin vào điều bạn nghe được.':'Ô bạn điền được tự lưu trên trình duyệt và tự đồng bộ.'}</div>`;
  secs.forEach(({s,si}) => {
    const groups = []; let cur = null;
    s.blocks.forEach((b,bi) => {
      if (b.k === 'audio' || !cur){ cur = { head: b.k==='audio' ? b : null, lines: [] }; groups.push(cur); if (b.k==='audio') return; }
      cur.lines.push({ b, bi });
    });
    groups.forEach((g,gi) => {
      const has = e && e.gap && e.gap[si] && g.lines.some(l => e.gap[si][l.bi]);
      h += `<section class="agroup"><div class="audio-h"><h3>${g.head?esc(g.head.label):'Bài nghe'} <span>${g.head?srcLabel(g.head.src):''}</span></h3>
        <div class="row">${has?`<button class="btn" data-chk="${si}-${gi}">Đối chiếu gợi ý</button><button class="btn" data-vi="${si}-${gi}">Hiện bản dịch</button>`:''}<button class="btn" data-trt="${si}-${gi}">${store.get('trhide:'+t.id+'-'+si+'-'+gi,false)?'Hiện ô tự dịch':'Ẩn ô tự dịch'}</button><button class="btn ghost" data-clr="${si}-${gi}">Xóa bài điền</button></div></div>`;
      const an = g.head ? (g.head.label.match(/\d+/)||[])[0] : null, file = an && AUD[t.id] && AUD[t.id][an];
      if (file){ const aid = `au-${t.id}-${si}-${gi}`, rate = store.get('rate', 1);
        h += `<div class="player"><audio id="${aid}" src="${file}" preload="metadata" controls></audio><div class="row between"><div class="seg" data-speed="${aid}">${[0.75,0.9,1,1.25].map(r=>`<button data-r="${r}" aria-pressed="${r===rate}">${r}×</button>`).join('')}</div><button class="btn" data-back="${aid}" aria-label="Tua lại 3 giây">↺ 3 giây</button></div></div>`; }
      g.lines.forEach(({b,bi}) => {
        let gIdx = 0;
        const html = esc(b.text).replace(BLANK, () => { const id = `g-${t.id}-${si}-${bi}-${gIdx++}`; return `<input class="gin" id="${id}" data-key="${id}" data-grp="${si}-${gi}" data-bi="${bi}" data-gi="${gIdx-1}" value="${esc(store.get(id,''))}" aria-label="Chỗ trống ${gIdx}" autocapitalize="off" spellcheck="false">`; });
        const ref = e && e.gap && e.gap[si] && e.gap[si][bi];
        const tk = `gt-${t.id}-${si}-${bi}`;
        h += `<div class="gline" data-grp="${si}-${gi}"><div>${html}</div><div class="sug" data-sug="${si}-${bi}" hidden></div>
          <div class="gtr-wrap" data-trgrp="${si}-${gi}"${store.get('trhide:'+t.id+'-'+si+'-'+gi,false)?' hidden':''}><textarea class="gtr" id="${tk}" data-key="${tk}" rows="1" placeholder="Bạn tự dịch câu này…">${esc(store.get(tk,''))}</textarea></div>
          ${ref?`<div class="gvi" data-vigrp="${si}-${gi}" hidden><small>Bản dịch mẫu</small>${esc(ref[1])}</div>`:''}</div>`;
      });
      const allGroupText = g.lines.map(l => l.b.text.replace(BLANK, ' ')).join(' ');
      h += `<div class="agroup-rec-bar">
        <div class="agroup-rec-info">
          <b>🎙️ Luyện đọc đoạn hội thoại này (Shadowing)</b>
          <span class="hint" style="font-size:12.5px">Nghe đoạn audio phía trên, bấm nút dưới để ghi âm đọc theo và nghe lại giọng mình để so sánh ngữ điệu.</span>
        </div>
        <div class="row" style="margin-top:4px">
          <button class="btn rec-btn" data-rec-text="${esc(allGroupText)}" data-rec-id="gap-${t.id}-${si}-${gi}">
            ${MIC_ICON}
            <span>Ghi âm đọc cả đoạn</span>
          </button>
        </div>
        <div class="rec-slot" id="slot-gap-${t.id}-${si}-${gi}"></div>
      </div>`;
      h += `</section>`;
    });
  });
  el.innerHTML = h;
  el.querySelectorAll('audio').forEach(a => {
    a.playbackRate = store.get('rate', 1);
    a.addEventListener('play', () => el.querySelectorAll('audio').forEach(o => { if (o !== a) o.pause(); }));
    a.addEventListener('loadedmetadata', () => { a.playbackRate = store.get('rate', 1); });
  });
  el.querySelectorAll('[data-speed]').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => {
    const r = +b.dataset.r; store.set('rate', r);
    el.querySelectorAll('audio').forEach(a => a.playbackRate = r);
    el.querySelectorAll('[data-speed] button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.r === r)));
  }));
  el.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { const a = el.querySelector('#' + b.dataset.back); if (a){ a.currentTime = Math.max(0, a.currentTime - 3); a.play().catch(()=>{}); } });
  const grow = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; };
  el.querySelectorAll('.gtr').forEach(ta => { grow(ta); ta.addEventListener('input', () => { store.set(ta.dataset.key, ta.value); grow(ta); }); });
  el.querySelectorAll('[data-trt]').forEach(b => b.onclick = () => {
    const k = 'trhide:' + t.id + '-' + b.dataset.trt, hide = !store.get(k, false); store.set(k, hide);
    el.querySelectorAll(`[data-trgrp="${b.dataset.trt}"]`).forEach(w => { w.hidden = hide; if (!hide) w.querySelectorAll('.gtr').forEach(grow); });
    b.textContent = hide ? 'Hiện ô tự dịch' : 'Ẩn ô tự dịch';
  });
  el.querySelectorAll('.gin').forEach(inp => inp.addEventListener('input', () => { store.set(inp.dataset.key, inp.value); inp.classList.remove('ok','diff'); }));
  el.querySelectorAll('[data-vi]').forEach(b => b.onclick = () => {
    const vs = el.querySelectorAll(`[data-vigrp="${b.dataset.vi}"]`); const show = vs[0] && vs[0].hidden;
    vs.forEach(v => v.hidden = !show); b.textContent = show ? 'Ẩn bản dịch' : 'Hiện bản dịch';
  });
  el.querySelectorAll('[data-chk]').forEach(b => b.onclick = () => {
    const [si] = b.dataset.chk.split('-');
    const inputs = el.querySelectorAll(`.gin[data-grp="${b.dataset.chk}"]`);
    const sugs = {};
    inputs.forEach(inp => {
      const ref = e.gap[si] && e.gap[si][inp.dataset.bi]; if (!ref) return;
      const sug = ref[0][+inp.dataset.gi] || '';
      const okList = sug.split('/').map(norm);
      const ok = inp.value.trim() && okList.includes(norm(inp.value));
      inp.classList.remove('ok','diff'); inp.classList.add(ok ? 'ok' : 'diff');
      (sugs[inp.dataset.bi] = sugs[inp.dataset.bi] || []).push(`(${+inp.dataset.gi+1}) ${sug}`);
    });
    Object.entries(sugs).forEach(([bi, arr]) => { const s = el.querySelector(`[data-sug="${si}-${bi}"]`); if (s){ s.hidden = false; s.textContent = 'Gợi ý: ' + arr.join(' · '); } });
  });
  el.querySelectorAll('[data-clr]').forEach(b => b.onclick = () => {
    el.querySelectorAll(`.gin[data-grp="${b.dataset.clr}"]`).forEach(inp => { inp.value=''; store.set(inp.dataset.key,''); inp.classList.remove('ok','diff'); });
    el.querySelectorAll(`.gline[data-grp="${b.dataset.clr}"] .sug`).forEach(s => s.hidden = true);
  });
}
