async function renderProfile(box) {
  if (!currentUser) {
    box.innerHTML = `
      <div class="card" style="text-align:center;padding:40px">
        <h2 style="margin:0 0 10px">Hồ sơ cá nhân</h2>
        <p class="hint" style="margin-bottom:16px">Bạn chưa đăng nhập. Hãy đăng nhập để lưu trữ tiến độ, thi trắc nghiệm có xác thực và xếp hạng cùng bạn bè.</p>
        <button class="btn primary" id="btn-login-profile">Đăng nhập ngay</button>
      </div>`;
    box.querySelector('#btn-login-profile').onclick = () => openAuthModal('login');
    return;
  }

  let profileData = {};
  try {
    const userDoc = await firestoreModules.getDoc(firestoreModules.doc(fbDb, 'users', currentUser.uid));
    if (userDoc.exists()) profileData = userDoc.data();
  } catch (e) {}

  let completedCount = 0;
  let attemptedCount = 0;
  let totalScore = 0;
  let scoreCount = 0;

  TOPICS.forEach(t => {
    const best = store.get('best:' + t.id, null);
    const completedManual = store.get('completedManual:' + t.id, false);
    const isCompleted = completedManual || (best != null && best >= 80);
    if (isCompleted) completedCount++;
    if (best != null) {
      attemptedCount++;
      totalScore += best;
      scoreCount++;
    } else {
      let hasAns = false;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && (k.startsWith(`toeic45:${currentUser.uid}:tr:${t.id}:`) || k.startsWith(`toeic45:${currentUser.uid}:g-${t.id}-`))) {
          hasAns = true;
          break;
        }
      }
      if (hasAns) attemptedCount++;
    }
  });

  const avgScore = scoreCount > 0 ? Math.round(totalScore / scoreCount) : 0;
  const isHidden = Boolean(profileData.hidden);

  const avatar = currentUser.photoURL
    ? `<img style="width:68px;height:68px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)" src="${esc(currentUser.photoURL)}" alt="Avatar">`
    : `<div style="width:68px;height:68px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;border:2px solid var(--line)">${esc((currentUser.displayName || currentUser.email || 'U')[0].toUpperCase())}</div>`;

  box.innerHTML = `
    <div class="thead" style="margin-bottom:18px">
      <div class="eyebrow">Tài khoản</div>
      <h1 style="font-size:28px">Hồ sơ cá nhân</h1>
    </div>

    
    <!-- Thẻ trạng thái đồng bộ đa thiết bị -->
    <div class="card" style="margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;background:var(--sunk);border:1.5px solid var(--line)">
      <div style="display:flex;align-items:center;gap:12px">
        <div style="width:40px;height:40px;border-radius:10px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:20px">☁️</div>
        <div>
          <div style="font-weight:700;font-size:15px">Đồng bộ đa thiết bị (Điện thoại ↔ Máy tính)</div>
          <div style="font-size:13px;color:var(--muted)">Tiến độ học tập và điểm số được đồng bộ theo thời gian thực qua tài khoản đám mây.</div>
        </div>
      </div>
      <button class="btn primary" id="btn-profile-sync" style="display:inline-flex;align-items:center;gap:8px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        <span>Đồng bộ ngay với đám mây</span>
      </button>
    </div>

    <div class="card" style="display:flex;gap:18px;align-items:center;margin-bottom:18px">
      ${avatar}
      <div style="flex:1;min-width:0">
        <h2 style="margin:0 0 4px;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(currentUser.displayName || 'Người học')}</h2>
        <div style="color:var(--muted);font-size:13.5px;margin-bottom:6px">${esc(currentUser.email || '')}</div>
        <div>
          ${currentUser.emailVerified
            ? '<span style="font-size:12px;color:var(--good);background:var(--good-soft);padding:3px 8px;border-radius:6px;font-weight:600">✓ Đã xác minh email</span>'
            : '<span style="font-size:12px;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:6px;font-weight:600">Chưa xác minh email</span> <button class="btn ghost" id="btn-resend-verify" style="font-size:12px;padding:2px 6px">Gửi lại email</button>'}
        </div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="val">${completedCount} <span style="font-size:16px;font-weight:500;color:var(--muted)">/ ${TOPICS.length}</span></div>
        <div class="lbl">Chủ đề hoàn thành</div>
      </div>
      <div class="stat-card">
        <div class="val">${attemptedCount} <span style="font-size:16px;font-weight:500;color:var(--muted)">/ ${TOPICS.length}</span></div>
        <div class="lbl">Chủ đề đã học</div>
      </div>
      <div class="stat-card">
        <div class="val">${avgScore}%</div>
        <div class="lbl">Điểm trắc nghiệm TB</div>
      </div>
      <div class="stat-card">
        <div class="val">${totalScore}</div>
        <div class="lbl">Tổng điểm trắc nghiệm</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:18px">
      <h3 style="margin:0 0 10px;font-size:17px">Quyền riêng tư & Bảng xếp hạng</h3>

          <div class="hint">Cho phép hiển thị tên và điểm số của bạn trên Bảng xếp hạng công khai.</div>

        <label style="position:relative;display:inline-block;width:48px;height:26px">
          <input type="checkbox" id="toggle-lb-vis" ${!isHidden ? 'checked' : ''} style="opacity:0;width:0;height:0">

      <h3 style="margin:0 0 10px;font-size:17px">Quản lý phiên làm việc</h3>

// ---------- Voice Recording & Speech Recognition Manager ----------
const RecorderManager = (function() {
  let mediaRecorder = null;
  let audioChunks = [];
  let currentRecId = null;
  let currentTargetText = '';
  let currentTriggerBtn = null;
  let currentSlotEl = null;
  let currentStream = null;
  let timerInterval = null;
  let startTime = 0;
  let recognitionInstance = null;
  let recognizedTranscript = '';
  let recognizedAlternatives = [];
  let currentPlayingAudio = null;
  let audioCtx = null;
  let analyserNode = null;
  let animFrameId = null;

  const cache = new Map();

  // Từ đồng âm phổ biến trong tiếng Anh & TOEIC
  const HOMOPHONES = {
    "no": ["know"], "know": ["no"],
    "than": ["then"], "then": ["than"],
    "buy": ["by", "bye"], "by": ["buy", "bye"],
    "for": ["four", "fore"], "four": ["for"],
    "to": ["too", "two"], "too": ["to", "two"], "two": ["to", "too"],
    "their": ["there", "they're"], "there": ["their", "they're"],
    "here": ["hear"], "hear": ["here"],
    "hour": ["our"], "our": ["hour"],
    "write": ["right", "rite"], "right": ["write"],
    "check": ["cheque"], "cheque": ["check"],
    "mail": ["male"], "male": ["mail"],
    "break": ["brake"], "brake": ["break"],
    "peace": ["piece"], "piece": ["peace"],
    "site": ["sight", "cite"], "sight": ["site", "cite"], "cite": ["site", "sight"],
    "ware": ["wear", "where"], "wear": ["ware", "where"],
    "weather": ["whether"], "whether": ["weather"],
    "plain": ["plane"], "plane": ["plain"],
    "meet": ["meat"], "meat": ["meet"],
    "board": ["bored"], "bored": ["board"],
    "accept": ["except"], "affect": ["effect"]
  };

  // Rút gọn từ gốc (stemming) để nhận diện biến thể số nhiều, quá khứ, v.v.
  function stemWord(w) {
    if (!w || w.length <= 3) return w;
    return w.toLowerCase()
      .replace(/(?:ingly|edly|able|ible|tion|sion|ment|ness|less)$/i, '')
      .replace(/(?:ing|ly|ed|es|al|ive|er|or|est)$/i, '')
      .replace(/s$/i, '')
      .replace(/(.)\1$/i, '$1');
  }

  function isRecording() {
    return mediaRecorder && mediaRecorder.state === 'recording';
  }

  function wordSimilarity(s1, s2) {
    if (s1 === s2) return 1.0;
    if (!s1 || !s2) return 0;
    
    // Kiểm tra đồng âm (Homophones)
    if (HOMOPHONES[s1] && HOMOPHONES[s1].includes(s2)) return 0.98;
    if (HOMOPHONES[s2] && HOMOPHONES[s2].includes(s1)) return 0.98;

    // Kiểm tra từ gốc (Stemming)
    const st1 = stemWord(s1);
    const st2 = stemWord(s2);
    if (st1 === st2 && st1.length >= 3) return 0.95;
    if (st1.length >= 4 && st2.length >= 4 && (st1.startsWith(st2) || st2.startsWith(st1))) return 0.90;

    const len1 = s1.length, len2 = s2.length;
    const maxLen = Math.max(len1, len2);
    if (!maxLen) return 1.0;

    const track = Array(len2 + 1).fill(null).map(() => Array(len1 + 1).fill(null));
    for (let i = 0; i <= len1; i += 1) track[0][i] = i;
    for (let j = 0; j <= len2; j += 1) track[j][0] = j;
    for (let j = 1; j <= len2; j += 1) {
      for (let i = 1; i <= len1; i += 1) {
        const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
        track[j][i] = Math.min(
          track[j][i - 1] + 1,
          track[j - 1][i] + 1,
          track[j - 1][i - 1] + indicator
        );
      }
    }
    const dist = track[len2][len1];
    return Math.max(0, 1 - dist / maxLen);
  }

  // Thuật toán chấm điểm và phân tích phát âm siêu nhạy (Super High Sensitivity)
  function assessPronunciation(spokenText, targetText, alternatives = []) {
    if (!targetText) return { score: 0, message: '', words: [] };

    const rawTargetWords = targetText.trim().split(/\s+/).filter(Boolean);
    const cleanTargetWords = rawTargetWords.map(w => w.toLowerCase().replace(/^[^\w]+|[^\w]+$/g, '')).filter(Boolean);
    
    if (!cleanTargetWords.length) return { score: 100, grade: 'excellent', message: 'Hoàn thành!', words: [] };

    const allCandidateTexts = [spokenText, ...alternatives].filter(Boolean);
    if (!allCandidateTexts.length || !spokenText.trim()) {
      return {
        score: 0,
        grade: 'needs_work',
        message: 'Chưa phát hiện rõ giọng nói. Bạn hãy đưa micro lại gần hơn, nói to rõ và bấm [Thu lại] nhé!',
        spoken: '',
        words: cleanTargetWords.map((w, idx) => ({
          word: rawTargetWords[idx] || w,
          status: 'wrong',
          match: false
        }))
      };
    }

    // Gom tất cả các từ trong toàn bộ các phương án nhận diện (top 5 alternatives)
    const allCandidateWords = allCandidateTexts
      .flatMap(t => t.trim().split(/\s+/))
      .map(w => w.toLowerCase().replace(/^[^\w]+|[^\w]+$/g, ''))
      .filter(Boolean);

    const wordsResult = [];
    let totalScorePoints = 0;
    const usedWordIndices = new Set();

    cleanTargetWords.forEach((tw, idx) => {
      let bestSim = 0;
      let bestWord = null;
      let bestIdx = -1;

      allCandidateWords.forEach((cw, cIdx) => {
        if (usedWordIndices.has(cIdx)) return;
        const sim = wordSimilarity(tw, cw);
        if (sim > bestSim) {
          bestSim = sim;
          bestWord = cw;
          bestIdx = cIdx;
        }
      });

      // Ngưỡng siêu nhạy: >= 0.70 tính là Chuẩn (1.0), >= 0.45 tính là Gần đúng (0.7)
      if (bestSim >= 0.70) {
        if (bestIdx !== -1) usedWordIndices.add(bestIdx);
        wordsResult.push({
          word: rawTargetWords[idx] || tw,
          status: 'correct',
          sim: bestSim,
          heard: bestWord
        });
        totalScorePoints += 1.0;
      } else if (bestSim >= 0.45) {
        if (bestIdx !== -1) usedWordIndices.add(bestIdx);
        wordsResult.push({
          word: rawTargetWords[idx] || tw,
          status: 'partial',
          sim: bestSim,
          heard: bestWord
        });
        totalScorePoints += 0.7;
      } else {
        wordsResult.push({
          word: rawTargetWords[idx] || tw,
          status: 'wrong',
          sim: 0,
          heard: null
        });
        totalScorePoints += 0;
      }
    });

    const finalScore = Math.min(100, Math.round((totalScorePoints / cleanTargetWords.length) * 100));

    let grade = 'needs_work';
    let message = '';
    if (finalScore >= 80) {
      grade = 'excellent';
      message = '🌟 Xuất sắc! Bạn phát âm rất chuẩn xác và rõ ràng.';
    } else if (finalScore >= 65) {
      grade = 'good';
      message = '✅ Rất tốt! Đọc rõ chữ, ngữ điệu tự nhiên.';
    } else if (finalScore >= 45) {
      grade = 'fair';
      message = '👍 Tương đối tốt. Hãy chú ý các từ màu vàng/đỏ để phát âm tròn vành hơn.';
    } else {
      grade = 'needs_work';
      message = '⚠️ Cần cải thiện. Hãy bấm [Nghe mẫu chuẩn] và thử đọc lại lần nữa nhé!';
    }

    return {
      score: finalScore,
      grade,
      message,
      spoken: spokenText.trim(),
      words: wordsResult
    };
  }

  async function start(recId, targetText, btn, slot) {
    if (isRecording()) {
      await stop();
    }

    try {
      // Cấu hình âm thanh siêu nhạy: Tự động khuếch đại (autoGainControl), tắt lọc ồn thô (noiseSuppression: false) để không bị nuốt âm đuôi
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: false,
          autoGainControl: true,
          channelCount: 1
        }
      });

      currentStream = stream;
      audioChunks = [];
      currentRecId = recId;
      currentTargetText = targetText || '';
      currentTriggerBtn = btn;
      currentSlotEl = slot;
      recognizedTranscript = '';
      recognizedAlternatives = [];

      // Khởi tạo visualizer theo dõi cường độ âm thanh thời gian thực
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          const source = audioCtx.createMediaStreamSource(stream);
          analyserNode = audioCtx.createAnalyser();
          analyserNode.fftSize = 64;
          source.connect(analyserNode);

          const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
          function trackVolume() {
            if (!isRecording()) return;
            analyserNode.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            const avg = sum / dataArray.length;
            if (btn) {
              const scale = Math.min(1.22, 1.0 + (avg / 255) * 0.35);
              btn.style.setProperty('--rec-scale', scale.toFixed(2));
            }
            animFrameId = requestAnimationFrame(trackVolume);
          }
          animFrameId = requestAnimationFrame(trackVolume);
        }
      } catch(e) {}

      let options = {};
      if (typeof MediaRecorder.isTypeSupported === 'function') {
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) options = { mimeType: 'audio/webm;codecs=opus' };
        else if (MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType: 'audio/webm' };
        else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };
      }

      mediaRecorder = new MediaRecorder(stream, options);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        // Chờ SpeechRecognition nhận diện trọn vẹn âm tiết cuối
        await new Promise(r => setTimeout(r, 380));

        const mimeType = mediaRecorder.mimeType || 'audio/webm';
        const blob = new Blob(audioChunks, { type: mimeType });
        const audioUrl = URL.createObjectURL(blob);
        const durationSec = Math.max(1, Math.round((Date.now() - startTime) / 1000));

        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
          currentStream = null;
        }

        const assessment = assessPronunciation(recognizedTranscript, currentTargetText, recognizedAlternatives);
        const rawName = currentTargetText ? cleanWord(currentTargetText).slice(0, 20).replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '_') : 'Record';
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        const fileName = `TOEIC_${rawName}_${Date.now()}.${ext}`;

        const recordItem = {
          recId: currentRecId,
          audioUrl,
          duration: durationSec,
          assessment,
          fileName,
          targetText: currentTargetText,
          blob,
          createdAt: Date.now()
        };

        cache.set(currentRecId, recordItem);
        saveToIndexedDB(recordItem);

        renderPlayer(currentRecId, currentTriggerBtn, currentSlotEl);
        resetTriggerUI(currentTriggerBtn);
      };

      // Nhận diện giọng nói đa phương án (Top 5 Alternatives) với Web Speech API
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        try {
          recognitionInstance = new SpeechRecognition();
          recognitionInstance.lang = 'en-US';
          recognitionInstance.continuous = true;
          recognitionInstance.interimResults = true;
          recognitionInstance.maxAlternatives = 5;

          recognitionInstance.onstart = () => {
            if (btn && isRecording()) {
              setBtnLabel(btn, '00:00 ⏹');
            }
          };

          recognitionInstance.onresult = (ev) => {
            let allAlts = [];
            let finalStr = '', interimStr = '';
            for (let i = 0; i < ev.results.length; ++i) {
              const res = ev.results[i];
              if (res.isFinal) {
                finalStr += res[0].transcript + ' ';
              } else {
                interimStr += res[0].transcript;
              }
              for (let k = 0; k < res.length; ++k) {
                if (res[k] && res[k].transcript) {
                  allAlts.push(res[k].transcript);
                }
              }
            }
            const full = (finalStr + ' ' + interimStr).trim();
            if (full) recognizedTranscript = full;
            if (allAlts.length) recognizedAlternatives = allAlts;
          };

          recognitionInstance.onerror = (ev) => {
            console.warn('SpeechRecognition notice:', ev.error);
          };

          recognitionInstance.start();
        } catch(e) {
          console.warn('SpeechRecognition init notice:', e);
        }
      }

      mediaRecorder.start();
      startTime = Date.now();

      btn.classList.add('recording');
      setBtnLabel(btn, '00:00 ⏹');

      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        setBtnLabel(btn, `${m}:${s} ⏹`);
        if (elapsed >= 90) stop();
      }, 1000);

    } catch(err) {
      console.error('Lỗi truy cập Microphone:', err);
      alert('Không thể truy cập Microphone! Vui lòng kiểm tra quyền cho phép Micro của trình duyệt để sử dụng tính năng ghi âm.');
      resetTriggerUI(btn);
    }
  }

  function stop() {
    if (!isRecording()) return;
    clearInterval(timerInterval);
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
    if (audioCtx) {
      try { audioCtx.close(); } catch(e) {}
      audioCtx = null;
    }
    if (recognitionInstance) {
      try { recognitionInstance.stop(); } catch(e) {}
    }
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
  }

  function setBtnLabel(btn, text) {
    const span = btn.querySelector('span');
    if (span) span.textContent = text;
    else btn.setAttribute('title', text);
  }

  function resetTriggerUI(btn) {
    if (!btn) return;
    btn.classList.remove('recording');
    btn.style.removeProperty('--rec-scale');
    const span = btn.querySelector('span');
    if (span) {
      if (btn.id === 'sel-rec') span.textContent = 'Nói';
      else if (btn.dataset.recId && btn.dataset.recId.startsWith('gap-')) span.textContent = 'Ghi âm đọc cả đoạn';
      else if (btn.dataset.recId && btn.dataset.recId.startsWith('tr-')) span.textContent = 'Luyện đọc câu này';
      else span.textContent = '';
    }
  }

  function renderPlayer(recId, btn, slot) {
    if (!slot) return;
    const data = cache.get(recId);
    if (!data) return;

    slot.style.display = 'block';
    const assessment = data.assessment || {};
    const gradeClass = assessment.grade || 'fair';
    const scorePillTxt = assessment.score >= 80 ? '✓ Đạt chuẩn' : (assessment.score >= 50 ? '👍 Khá tốt' : '⚠️ Cần luyện thêm');

    slot.innerHTML = `
      <div class="rec-result-card">
        <div class="rec-player-bar">
          <button class="rec-play-btn" data-play-id="${recId}" title="Bấm để nghe lại giọng đọc của chính bạn">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            <span>Nghe lại giọng bạn (${data.duration}s)</span>
          </button>
          ${data.targetText ? `
            <button class="rec-sample-btn" data-say="${esc(cleanWord(data.targetText))}" title="Nghe phát âm chuẩn của người bản xứ để đối chiếu">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>
              <span>Nghe mẫu chuẩn</span>
            </button>
          ` : ''}
          <a class="rec-download-btn" href="${data.audioUrl}" download="${data.fileName || 'TOEIC_VoiceRecord.webm'}" title="Tải file ghi âm này về máy">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>Tải về</span>
          </a>
          <button class="rec-retry-btn" data-retry-id="${recId}" title="Thu âm lại">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
            <span>Thu lại</span>
          </button>
        </div>

        <!-- Khung đánh giá phát âm siêu nhạy -->
        <div class="rec-assessment-box ${gradeClass}">
          <div class="rec-assess-header">
            <div class="rec-score-pill ${gradeClass}">
              <span>${assessment.score}%</span>
              <span>·</span>
              <span>${scorePillTxt}</span>
            </div>
            <div class="rec-assess-msg">${esc(assessment.message || '')}</div>
            <span style="margin-left:auto;font-size:11px;color:var(--good);font-weight:700;background:rgba(34,197,94,0.12);padding:2px 7px;border-radius:10px">⚡ Siêu nhạy</span>
          </div>

          ${assessment.words && assessment.words.length ? `
            <div class="rec-words-breakdown">
              <span class="rec-words-label">Độ chuẩn từng từ:</span>
              <div class="rec-words-list">
                ${assessment.words.map(w => `
                  <span class="rec-word-tag ${w.status}" title="${w.status === 'correct' ? 'Phát âm chuẩn xác' : (w.status === 'partial' ? 'Gần đúng (máy nghe thành: ' + (w.heard || '') + ')' : 'Chưa nhận diện được từ này')}">
                    ${esc(w.word)} ${w.status === 'correct' ? '✓' : (w.status === 'partial' ? '~' : '✕')}
                  </span>
                `).join('')}
              </div>
            </div>
          ` : ''}

          ${assessment.spoken ? `
            <div class="rec-spoken-text">
              <span>Máy nghe được:</span> <b class="user-spoken">"${esc(assessment.spoken)}"</b>
            </div>
          ` : `
            <div class="rec-spoken-text" style="color:var(--warn)">
              <span>⚠️ Chưa nhận diện rõ âm thanh. Bạn hãy đưa micro lại gần hơn, nói to rõ và bấm [Thu lại] nhé!</span>
            </div>
          `}
        </div>
      </div>
    `;
  }

  // ---------- IndexedDB Persistence & Export for Voice Recordings ----------
  function openDB() {
    return new Promise((resolve) => {
      if (!window.indexedDB) return resolve(null);
      const req = indexedDB.open('toeic_voice_db', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('recordings')) {
          db.createObjectStore('recordings', { keyPath: 'recId' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  }

  async function saveToIndexedDB(item) {
    try {
      const db = await openDB();
      if (!db) return;
      const tx = db.transaction('recordings', 'readwrite');
      tx.objectStore('recordings').put({
        recId: item.recId,
        fileName: item.fileName,
        targetText: item.targetText,
        duration: item.duration,
        blob: item.blob,
        assessment: item.assessment,
        createdAt: item.createdAt
      });
    } catch(e) { console.warn('Lỗi lưu IndexedDB:', e); }
  }

  async function getAllRecordings() {
    try {
      const db = await openDB();
      if (!db) return [];
      return new Promise((resolve) => {
        const tx = db.transaction('recordings', 'readonly');
        const req = tx.objectStore('recordings').getAll();
        req.onsuccess = () => {
          const list = req.result || [];
          list.sort((a, b) => b.createdAt - a.createdAt);
          resolve(list);
        };
        req.onerror = () => resolve([]);
      });
    } catch(e) { return []; }
  }

  async function deleteRecording(recId) {
    try {
      const db = await openDB();
      if (!db) return;
      const tx = db.transaction('recordings', 'readwrite');
      tx.objectStore('recordings').delete(recId);
      cache.delete(recId);
    } catch(e) {}
  }

  async function downloadAllRecordings() {
    const list = await getAllRecordings();
    if (!list.length) {
      alert('Bạn chưa có bản ghi âm nào để tải về!');
      return;
    }
    let count = 0;
    for (const item of list) {
      if (item.blob) {
        const url = URL.createObjectURL(item.blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = item.fileName || ('TOEIC_' + item.recId + '.webm');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        count++;
        await new Promise(r => setTimeout(r, 250));
      }
    }
    alert(`Đã kích hoạt tải về ${count} file ghi âm vào thư mục Downloads của bạn!`);
  }

  (async function restoreCachedRecordings() {
    const list = await getAllRecordings();
    list.forEach(item => {
      if (item.blob && !cache.has(item.recId)) {
        cache.set(item.recId, {
          recId: item.recId,
          audioUrl: URL.createObjectURL(item.blob),
          duration: item.duration,
          assessment: item.assessment,
          fileName: item.fileName,
          targetText: item.targetText,
          blob: item.blob,
          createdAt: item.createdAt
        });
      }
    });
  })();

  function playAudio(recId, playBtn) {
    const data = cache.get(recId);
    if (!data || !data.audioUrl) return;

    if (currentPlayingAudio) {
      currentPlayingAudio.pause();
      currentPlayingAudio = null;
      document.querySelectorAll('.rec-play-btn').forEach(b => {
        b.classList.remove('playing');
        const s = b.querySelector('span');
        if (s) s.textContent = s.textContent.replace('Đang phát...', 'Nghe lại giọng bạn');
      });
    }

    const audio = new Audio(data.audioUrl);
    currentPlayingAudio = audio;
    playBtn.classList.add('playing');
    const span = playBtn.querySelector('span');
    const oldText = span ? span.textContent : '';
    if (span) span.textContent = 'Đang phát...';

    audio.onended = () => {
      playBtn.classList.remove('playing');
      if (span) span.textContent = oldText.replace('Đang phát...', 'Nghe lại giọng bạn');
      currentPlayingAudio = null;
    };
    audio.onerror = () => {
      playBtn.classList.remove('playing');
      if (span) span.textContent = oldText.replace('Đang phát...', 'Nghe lại giọng bạn');
      currentPlayingAudio = null;
    };
    audio.play().catch(e => console.warn('Play error:', e));
  }

  function toggleRecord(recId, targetText, btn, slot) {
    if (isRecording() && currentRecId === recId) {
      stop();
    } else {
      start(recId, targetText, btn, slot);
    }
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.rec-btn');
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      const recId = btn.dataset.recId || (btn.id === 'sel-rec' ? 'sel-target' : null);
      const recText = btn.dataset.recText || '';
      let slotEl = null;
      if (btn.id === 'sel-rec') {
        slotEl = document.querySelector('#sel-rec-slot');
      } else if (recId) {
        if (recId.startsWith('p2-')) {
          const lIdx = recId.split('-')[1];
          slotEl = document.querySelector('#slot-p2-row-' + lIdx);
        } else if (recId.startsWith('fc-')) {
          slotEl = document.querySelector('#slot-' + recId) || (btn.closest('.fc-face') && btn.closest('.fc-face').querySelector('.rec-slot'));
        } else {
          slotEl = document.querySelector('#slot-' + recId);
        }
      }
      toggleRecord(recId, recText, btn, slotEl);
      return;
    }

    const sampleBtn = e.target.closest('.rec-sample-btn');
    if (sampleBtn) {
      e.preventDefault();
      e.stopPropagation();
      const sayTxt = sampleBtn.dataset.say;
      if (sayTxt) speak(sayTxt);
      return;
    }

    const playBtn = e.target.closest('.rec-play-btn');
    if (playBtn) {
      e.preventDefault();
      e.stopPropagation();
      playAudio(playBtn.dataset.playId, playBtn);
      return;
    }

    const retryBtn = e.target.closest('.rec-retry-btn');
    if (retryBtn) {
      e.preventDefault();
      e.stopPropagation();
      const recId = retryBtn.dataset.retryId;
      const targetBtn = document.querySelector(`.rec-btn[data-rec-id="${recId}"]`) || (recId === 'sel-target' ? document.querySelector('#sel-rec') : null);
      if (targetBtn) targetBtn.click();
      return;
    }
  });

  return {
    toggleRecord,
    playAudio,
    cache,
    getAllRecordings,
    deleteRecording,
    downloadAllRecordings
  };
})();

// ---------- Quick Selection Tooltip (Speak & Translate) ----------
(function initSelectionTooltip() {
  let popover = null;
  let activeTarget = '';

  function removePopover() {
    if (popover && popover.parentNode) {
      popover.parentNode.removeChild(popover);
    }
    popover = null;
    activeTarget = '';
  }

  function handleSelection() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;

    const rawText = sel.toString().trim();
    if (!rawText || rawText.length > 150) {
      removePopover();
      return;
    }

    if (popover && popover.contains(sel.anchorNode)) return;

    let range;
    try {
      range = sel.getRangeAt(0);
    } catch(e) { return; }

    const rect = range.getBoundingClientRect();
    if (!rect || (rect.width === 0 && rect.height === 0)) return;

    const targetWord = cleanWord(rawText);
    if (!targetWord) return;

    // Đóng popover cũ
    removePopover();
    activeTarget = targetWord;

    popover = document.createElement('div');
    popover.className = 'sel-popover';
    popover.dataset.word = targetWord;

    popover.innerHTML = `
      <div class="sel-btn-bar">
        <button class="sel-btn btn-speak" id="sel-speak" title="Nghe phát âm">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
          <span>Nghe</span>
        </button>
        <button class="sel-btn btn-rec rec-btn" id="sel-rec" data-rec-text="${esc(targetWord)}" data-rec-id="sel-target" title="Ghi âm đọc thử từ này">
          ${MIC_ICON}
          <span>Nói</span>
        </button>
        <button class="sel-btn btn-trans" id="sel-trans" title="Dịch nghĩa tiếng Việt">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>Dịch</span>
        </button>
        <button class="sel-btn btn-close" id="sel-close" title="Đóng">✕</button>
      </div>
      <div id="sel-rec-slot" class="rec-slot" style="display:none"></div>
      <div id="sel-res" class="sel-result" style="display:none"></div>
    `;

    document.body.appendChild(popover);

    const scrollX = window.pageXOffset || document.documentElement.scrollLeft || 0;
    const scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;

    let posX = rect.left + rect.width / 2 + scrollX;
    let posY = rect.top + scrollY;

    const popWidth = 240;
    if (posX - popWidth / 2 < 12) posX = popWidth / 2 + 12;
    if (posX + popWidth / 2 > window.innerWidth - 12) posX = window.innerWidth - popWidth / 2 - 12;

    if (rect.top < 85) {
      popover.classList.add('below');
      posY = rect.bottom + scrollY;
    }

    popover.style.left = posX + 'px';
    popover.style.top = posY + 'px';

    const speakBtn = popover.querySelector('#sel-speak');
    speakBtn.onclick = (e) => {
      e.stopPropagation();
      const txtSpan = speakBtn.querySelector('span');
      if (txtSpan) txtSpan.textContent = 'Đang đọc...';
      speak(targetWord, () => {
        if (txtSpan) txtSpan.textContent = 'Nghe';
      });
      setTimeout(() => {
        if (txtSpan) txtSpan.textContent = 'Nghe';
      }, 1500);
    };

    popover.querySelector('#sel-trans').onclick = async (e) => {
      e.stopPropagation();
      const resEl = popover.querySelector('#sel-res');
      resEl.style.display = 'block';
      resEl.innerHTML = '<span style="color:#94A3B8">Đang dịch...</span>';

      const normT = norm(targetWord);
      const allVocab = vocabPool();

      // 1. Khớp từ điển bài học nếu đúng chính xác từ đó
      const exactHit = allVocab.find(v => norm(cleanWord(v.w)) === normT);
      if (exactHit) {
        resEl.innerHTML = `<div><b style="color:#38BDF8">${esc(exactHit.w)}</b> ${exactHit.pos ? `<span style="color:#94A3B8">(${esc(exactHit.pos)})</span>` : ''}: <b style="color:#4ADE80">${esc(exactHit.vi)}</b></div>`;
        return;
      }

      // 2. Tra qua Google Translate public API (nhanh <100ms, rất chính xác cho từ & cụm từ)
      try {
        const gUrl = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=' + encodeURIComponent(targetWord);
        const gr = await fetch(gUrl);
        if (gr.ok) {
          const gd = await gr.json();
          if (gd && gd[0] && gd[0][0] && gd[0][0][0]) {
            const trans = gd[0].map(x => x[0]).join('').trim();
            if (trans) {
              resEl.innerHTML = `<div><b style="color:#38BDF8">${esc(targetWord)}</b>: <b style="color:#4ADE80">${esc(trans)}</b></div>`;
              return;
            }
          }
        }
      } catch(e) {}

      // 3. Fallback: Tra qua MyMemory Translation API
      try {
        const mUrl = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(targetWord) + '&langpair=en|vi';
        const mr = await fetch(mUrl);
        if (mr.ok) {
          const md = await mr.json();
          if (md && md.responseData && md.responseData.translatedText) {
            const translated = md.responseData.translatedText.trim();
            if (translated && !translated.includes('NO QUERY SPECIFIED')) {
              resEl.innerHTML = `<div><b style="color:#38BDF8">${esc(targetWord)}</b>: <b style="color:#4ADE80">${esc(translated)}</b></div>`;
              return;
            }
          }
        }
      } catch (err) {}

      // 4. Fallback: Tra từ gốc trong bài học
      if (normT.length >= 4) {
        const prefixHit = allVocab.find(v => {
          const cw = norm(cleanWord(v.w));
          return cw.length >= 4 && (normT.startsWith(cw) || cw.startsWith(normT));
        });
        if (prefixHit) {
          resEl.innerHTML = `<div><b style="color:#38BDF8">${esc(targetWord)}</b> (gốc <i>${esc(prefixHit.w)}</i>): <b style="color:#4ADE80">${esc(prefixHit.vi)}</b></div>`;
          return;
        }
      }

      resEl.innerHTML = `<div>Không tìm thấy bản dịch cho "${esc(targetWord)}".</div>`;
    };

    popover.querySelector('#sel-close').onclick = (e) => {
      e.stopPropagation();
      removePopover();
    };
  }

  document.addEventListener('mouseup', (e) => {
    if (popover && popover.contains(e.target)) return;
    setTimeout(handleSelection, 20);
  });

  document.addEventListener('touchend', (e) => {
    if (popover && popover.contains(e.target)) return;
    setTimeout(handleSelection, 250);
  });

  document.addEventListener('mousedown', (e) => {
    if (popover && !popover.contains(e.target)) {
      removePopover();
    }
  });
})();

</script>


<script>
// ---------- Theme Toggle (Light / Dark Mode) ----------
(function initThemeToggle() {
  const savedTheme = localStorage.getItem('toeic45_theme');
  const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  let currentTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');

  function updateThemeUI(theme) {
    currentTheme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('toeic45_theme', theme);

    document.querySelectorAll('.theme-btn').forEach(btn => {
      const isMob = btn.id === 'theme-btn-mob';
      if (theme === 'dark') {
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg><span>' + (isMob ? 'Sáng' : 'Chế độ sáng') + '</span>';
        btn.setAttribute('title', 'Bấm để chuyển sang chế độ sáng');
      } else {
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><span>' + (isMob ? 'Tối' : 'Chế độ tối') + '</span>';
        btn.setAttribute('title', 'Bấm để chuyển sang chế độ tối');
      }
    });

    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) {
      metaTheme.content = theme === 'dark' ? '#0E141E' : '#1D5BBF';
    }
  }

  updateThemeUI(currentTheme);

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.theme-btn');
    if (btn) {
      e.preventDefault();
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
      updateThemeUI(nextTheme);
    }
  });
})();
</script>
