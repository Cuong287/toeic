// Helper: Render Single Exercise Card
// --------------------------------------------------------------------------
function renderSingleExercise(u, ex, exIdx, uState) {
  const st = uState[ex.id] || { answers: {}, checked: false };

  const exAudioBar = ex.audio ? `
    <div class="cambridge-player-bar" id="cambridge-player-ex-${ex.id}" style="margin-top:10px;margin-bottom:12px">
      <div class="cambridge-tag">
        <span class="cambridge-tag-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;vertical-align:-1.5px;margin-right:3px"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>${esc(ex.audio.code)}</span>
        <span style="font-size:13px">${esc(ex.audio.label || `CD${ex.audio.cd} ${ex.audio.track}`)}</span>
      </div>
      <div class="cambridge-audio-ctrls">
        <button class="btn primary cambridge-play-btn"
          onclick="playCambridgeTrack(${ex.audio.cd}, '${esc(ex.audio.track)}', '${esc(ex.audio.code)}', this, 'cambridge-player-ex-${ex.id}')"
          style="font-size:12px;padding:4px 10px;font-weight:700">
          Original Audio (${esc(ex.audio.code)})
        </button>
        <button class="btn ghost" onclick="skipCambridgeTrack(-5)" title="Rewind 5s" style="padding:4px 6px;font-size:11.5px">⏪ 5s</button>
        <button class="btn ghost" onclick="skipCambridgeTrack(5)" title="Forward 5s" style="padding:4px 6px;font-size:11.5px">⏩ 5s</button>
        <span class="cambridge-time-text">0:00 / 0:00</span>
        <input type="range" class="cambridge-seek-bar" min="0" max="100" value="0" oninput="seekCambridgeTrack(this.value)" />
      </div>
    </div>
  ` : '';

  if (ex.type === 'fill_dialogue') {
    return `
      <div class="unit-ex-card" id="ex-card-${ex.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--ink)">${esc(ex.title)}</div>
            <div style="font-size:13.5px;color:var(--muted);margin-top:2px">${esc(ex.instruction)}</div>
          </div>
          ${st.checked ? `<span class="badge" style="background:#10b981;color:#fff;padding:4px 10px;font-weight:700">Completed</span>` : ''}
        </div>

        ${exAudioBar}

        <!-- Word Bank Chips -->
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px">
          <div style="font-size:12.5px;font-weight:700;color:var(--muted)">Word Bank (Click word to insert):</div>
          <label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none" title="Audio is muted on click during dialogues by default.">
            <input type="checkbox" class="chk-speak-on-fill" data-ex-id="${ex.id}" style="cursor:pointer" />
            <span>Pronounce on select</span>
          </label>
        </div>
        <div class="unit-word-bank">
          ${ex.wordBank.map(w => {
            const isUsed = Object.values(st.answers || {}).some(val => String(val).trim().toLowerCase() === w.trim().toLowerCase());
            return `<button type="button" class="unit-word-chip ${isUsed ? 'used' : ''}" data-word="${esc(w)}" title="Click to insert into blank">${esc(w)}</button>`;
          }).join('')}
        </div>

        <!-- Dialogues List with Book Illustration -->
        <div class="${ex.image ? 'unit-ex-with-img-grid' : ''}">
          <div style="display:flex;flex-direction:column;gap:12px">
            ${ex.dialogues.map((diag, dIdx) => `
              <div style="background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px">
                <div style="font-weight:800;font-size:13px;color:var(--muted);margin-bottom:6px">Dialogue ${dIdx + 1}:</div>
                ${diag.lines.map((line, lIdx) => `
                  <div style="font-size:14.5px;line-height:2;margin-bottom:4px">
                    <strong style="color:var(--accent)">${esc(line.speaker)}:</strong>
                    ${line.parts.map((p, pIdx) => {
                      if (typeof p === 'string') return esc(p);
                      const blankKey = `d_${diag.id}_l_${lIdx}_b_${pIdx}`;
                      const val = st.answers[blankKey] || '';
                      const isRight = st.checked && (val.trim().toLowerCase() === p.blank.toLowerCase());
                      const isWrong = st.checked && !isRight;
                      return `
                        <input type="text" class="unit-blank-input ${isRight ? 'correct' : (isWrong ? 'wrong' : '')}"
                          data-blank-key="${blankKey}"
                          data-expected="${esc(p.blank)}"
                          value="${esc(val)}"
                          placeholder="..."
                          autocomplete="off"
                          autocapitalize="none"
                          style="width:${Math.max(90, p.blank.length * 12)}px" />
                        ${isWrong ? `<span style="font-size:12px;font-weight:700;color:#dc2626">(${esc(p.blank)})</span>` : ''}
                      `;
                    }).join('')}
                  </div>
                `).join('')}
              </div>
            `).join('')}
          </div>
          ${ex.image ? `
            <div class="unit-ex-illustration-box">
              <img src="${esc(ex.image)}" alt="${esc(ex.imageAlt || '')}" />
              <div class="unit-ex-illustration-caption">Exercise 2.1 illustration</div>
            </div>
          ` : ''}
        </div>

        <!-- Check Button & Speech Tools -->
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
          <button class="btn primary btn-check-ex" data-ex-id="${ex.id}" style="padding:8px 18px;font-weight:700">
            ${st.checked ? 'Re-check' : 'Check Answers'}
          </button>
          <div style="display:flex;gap:6px">
            <button class="btn ghost" onclick="speak('What shall we do this evening? Let\\'s stay at home and watch TV.')" style="font-size:12.5px">
              Listen Dialogue 1
            </button>
            <button class="btn ghost" onclick="speak('Let me read that email! No, it is a secret!')" style="font-size:12.5px">
              Listen Dialogue 2
            </button>
            <button class="btn ghost" onclick="speak('You know my friend Steve? Yes. Well, he has got a new job. He has joined the police!')" style="font-size:12.5px">
              Listen Dialogue 3
            </button>
          </div>
        </div>
      </div>
    `;
  }

  if (ex.type === 'clues') {
    return `
      <div class="unit-ex-card" id="ex-card-${ex.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--ink)">${esc(ex.title)}</div>
            <div style="font-size:13.5px;color:var(--muted);margin-top:2px">${esc(ex.instruction)}</div>
          </div>
          ${st.checked ? `<span class="badge" style="background:#10b981;color:#fff;padding:4px 10px;font-weight:700">Checked</span>` : ''}
        </div>

        ${exAudioBar}

        <!-- Clues List with Book Illustration Collage -->
        <div class="${ex.image ? 'unit-ex-with-img-grid' : ''}">
          <div style="display:flex;flex-direction:column;gap:10px">
            ${ex.items.map((it, idx) => {
              const val = st.answers[`clue_${it.id}`] || '';
              const isRight = st.checked && (val.trim().toLowerCase() === it.answer.toLowerCase());
              const isWrong = st.checked && !isRight;
              return `
                <div style="background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
                  <div style="flex:1;min-width:260px;font-size:14.5px">
                    <span style="font-weight:800;color:var(--accent)">${it.id}.</span> ${esc(it.clue)}
                    <div id="hint-box-${ex.id}-${it.id}" style="font-size:12px;color:var(--muted);margin-top:2px;display:none">
                      Hint: <strong>${esc(it.hint)}</strong>
                    </div>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px">
                    <button type="button" class="btn ghost btn-show-hint" data-hint-id="hint-box-${ex.id}-${it.id}" style="padding:4px 8px;font-size:12px" title="View hint">
                      💡
                    </button>
                    <input type="text" class="unit-blank-input ${isRight ? 'correct' : (isWrong ? 'wrong' : '')}"
                      data-clue-id="${it.id}"
                      data-expected="${esc(it.answer)}"
                      value="${esc(val)}"
                      placeholder="Type word..."
                      style="width:110px" />
                    <button class="icon-btn" onclick="speak('${esc(it.answer)}')" title="Listen to word" style="width:30px;height:30px">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                    </button>
                    ${isWrong ? `<span style="font-size:12px;font-weight:700;color:#dc2626">(${esc(it.answer)})</span>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
          ${ex.image ? `
            <div class="unit-ex-illustration-box">
              <img src="${esc(ex.image)}" alt="${esc(ex.imageAlt || '')}" />
              <div class="unit-ex-illustration-caption">Cambridge illustration hint</div>

        </div>

  if (ex.type === 'sort_sounds') {

        <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(180px, 1fr));gap:8px;margin-bottom:16px">
          ${words.map((w, idx) => {
            const userChoice = st.answers[w.w] || '';
            const isChecked = st.checked;
            let statusClass = '';
            if (isChecked) {
              if (w.target === 'both') {
                statusClass = (userChoice === 'i_long' || userChoice === 'i_short') ? 'correct' : 'wrong';

              <div style="background:var(--sunk);border:1px solid ${statusClass === 'correct' ? '#10b981' : (statusClass === 'wrong' ? '#ef4444' : 'var(--line)')};border-radius:8px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between">

                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:12px;height:12px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>

                </div>
                <div style="display:flex;gap:4px">

          }).join('')}
        </div>

        ${st.checked ? `
          <div class="unit-note-box" style="margin-bottom:14px">
            <strong>Cambridge Detailed Explanation:</strong><br/>
            - <strong>/iː/ sound (8 words):</strong> green, meet, people, pizza, please, repeat (syllable 2), tea, three.<br/>
            - <strong>/ɪ/ sound (9 words):</strong> big, busy, dinner, give, in, listen, office, repeat (syllable 1), six.<br/>
            <em>Note: <strong>repeat /rɪˈpiːt/</strong> contains both sounds (/ɪ/ initial and /iː/ final)!</em>
          </div>
        ` : ''}

        <div>
          <button class="btn primary btn-check-sort" data-ex-id="${ex.id}" style="padding:8px 18px;font-weight:700">
            ${st.checked ? 'Re-check' : 'Check Classification'}
          </button>
        </div>
      </div>
    `;
  }

  if (ex.type === 'match_sentences') {
    const pairs = ex.pairs;
    return `
      <div class="unit-ex-card" id="ex-card-${ex.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--ink)">${esc(ex.title)}</div>
            <div style="font-size:13.5px;color:var(--muted);margin-top:2px">${esc(ex.instruction)}</div>
          </div>
          ${st.checked ? `<span class="badge" style="background:#10b981;color:#fff;padding:4px 10px;font-weight:700">Checked</span>` : ''}
        </div>

        ${exAudioBar}

        <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px">
          ${pairs.map((p, idx) => {
            const userChoice = st.answers[`match_${p.id}`] || '';
            const isRight = st.checked && (userChoice === p.end);
            const isWrong = st.checked && !isRight;
            return `
              <div style="background:var(--sunk);border:1px solid ${isRight ? '#10b981' : (isWrong ? '#ef4444' : 'var(--line)')};border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">
                <div style="font-size:14.5px;font-weight:700;color:var(--ink);flex:1;min-width:200px">
                  ${idx + 1}. ${esc(p.start)} ...
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  <select class="match-select" data-pair-id="${p.id}" style="padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13.5px;font-weight:600">
                    <option value="">-- Select ending --</option>
                    ${pairs.map(opt => `
                      <option value="${esc(opt.end)}" ${userChoice === opt.end ? 'selected' : ''}>${esc(opt.end)}</option>
                    `).join('')}
                  </select>
                  ${isRight ? `
                    <button class="btn" onclick="speak('${esc(p.full)}')" style="display:inline-flex;align-items:center;gap:4px;padding:5px 8px;font-size:12px" title="Listen to complete sentence">
                      Listen

                    <button class="btn rec-btn" data-rec-text="${esc(p.full)}" data-rec-id="match-${p.id}" style="padding:5px 8px;font-size:12px" title="Practice speaking this sentence">

                  ` : ''}
                  ${isWrong ? `<span style="font-size:12px;font-weight:700;color:#dc2626">Correct: "${esc(p.end)}"</span>` : ''}
                </div>
                ${isRight ? `<div id="slot-match-${p.id}" class="rec-slot" style="width:100%"></div>` : ''}
              </div>
            `;
          }).join('')}
        </div>

        <div>
          <button class="btn primary btn-check-match" data-ex-id="${ex.id}" style="padding:8px 18px;font-weight:700">
            ${st.checked ? 'Re-check' : 'Check Matching'}

        </div>
      </div>
    `;
  }

  if (ex.type === 'listen_pairs') {
    const drills = ex.drills;
    return `
      <div class="unit-ex-card" id="ex-card-${ex.id}">
        <div style="display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:12px;border-bottom:1px solid var(--line);padding-bottom:10px">
          <div>
            <div style="font-size:17px;font-weight:800;color:var(--ink)">${esc(ex.title)}</div>
            <div style="font-size:13.5px;color:var(--muted);margin-top:2px">${esc(ex.instruction)}</div>
          </div>
          ${st.checked ? `<span class="badge" style="background:#10b981;color:#fff;padding:4px 10px;font-weight:700">Completed</span>` : ''}
        </div>

        ${exAudioBar}

        <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:16px">
          ${drills.map((drill, idx) => {
            const playedWord = listenPairsPlayed[`${u.id}_${ex.id}_${drill.id}`] || drill.correct;
            const userChoice = st.answers[`drill_${drill.id}`] || '';
            const isRight = st.checked && (userChoice === playedWord);
            const isWrong = st.checked && !isRight;
            return `
              <div style="background:var(--sunk);border:1px solid ${isRight ? '#10b981' : (isWrong ? '#ef4444' : 'var(--line)')};border-radius:8px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">

                    data-word-a="${esc(drill.pair[0])}"
                    data-word-b="${esc(drill.pair[1])}"
                    style="display:inline-flex;align-items:center;gap:6px;padding:6px 14px;font-size:13px;font-weight:700">
                    Listen to word

                  <span style="font-size:12px;color:var(--muted)">(${esc(drill.pairName)})</span>
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  ${drill.pair.map(word => `
                    <button type="button" class="btn ${userChoice === word ? 'primary' : 'ghost'} btn-choose-pair-word"
                      data-drill-id="${drill.id}"
                      data-word="${esc(word)}"
                      style="font-size:14px;font-weight:800;padding:6px 14px;min-width:70px">
                      ${esc(word)}
                    </button>
                  `).join('')}
                  ${isRight ? `<span style="color:#059669;font-weight:800;font-size:13px">✓ Correct</span>` : ''}
                  ${isWrong ? `<span style="color:#dc2626;font-weight:700;font-size:12.5px">✗ Audio said: "${esc(playedWord)}"</span>` : ''}
                </div>
              </div>
            `;
          }).join('')}
        </div>

        <div>
          <button class="btn primary btn-check-pairs" data-ex-id="${ex.id}" style="padding:8px 18px;font-weight:700">
            ${st.checked ? 'Re-check' : 'Check Answers'}
          </button>
        </div>
      </div>
    `;
  }

  return `
    <div class="unit-ex-card">
      <div style="font-size:16px;font-weight:800;margin-bottom:4px">${esc(ex.title)}</div>
      <div style="font-size:13.5px;color:var(--muted);margin-bottom:12px">${esc(ex.instruction)}</div>
      ${exAudioBar}
      <div style="background:var(--sunk);padding:12px;border-radius:8px;font-size:13.5px">
        Interactive practice exercise being loaded for ${esc(ex.type)}.
      </div>
    </div>
  `;
}

// Helper: Bind Event Listeners for All Exercises
// --------------------------------------------------------------------------
function bindAllExerciseEvents(u, box, container) {
  const uState = getUnitExState(u.id);

  // Helper to sync used chips state in word bank
  function syncWordBankUsed(cardEl, exId) {
    if (!cardEl) return;
    const answers = uState[exId] ? uState[exId].answers || {} : {};
    const usedWords = Object.values(answers).map(v => String(v).trim().toLowerCase()).filter(Boolean);
    cardEl.querySelectorAll('.unit-word-chip').forEach(c => {
      const cw = (c.dataset.word || '').trim().toLowerCase();
      if (usedWords.includes(cw)) {
        c.classList.add('used');
      } else {
        c.classList.remove('used');
      }
    });
  }

  // 1. Fill Dialogue Events (Ex 2.1)
  box.querySelectorAll('.unit-word-chip').forEach(chip => {
    chip.onclick = () => {
      const w = chip.dataset.word;
      const exCard = chip.closest('.unit-ex-card');
      const exId = exCard ? exCard.id.replace('ex-card-', '') : '2.1';
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };

      const inputs = exCard ? exCard.querySelectorAll('.unit-blank-input') : box.querySelectorAll('.unit-blank-input');
      let targetInput = Array.from(inputs).find(inp => document.activeElement === inp);
      if (!targetInput) {
        targetInput = Array.from(inputs).find(inp => !inp.value);
      }
      if (targetInput) {
        targetInput.value = w;
        const key = targetInput.dataset.blankKey;
        if (key) {
          uState[exId].answers[key] = w;
          saveUnitExState(u.id, exId);
        }

        // Tự động chuyển con trỏ sang ô trống kế tiếp để người dùng điền liền mạch khi nghe
        const inpsArr = Array.from(inputs);
        const nextBlank = inpsArr.find(inp => !inp.value && inp !== targetInput);
        if (nextBlank) {
          nextBlank.focus();
        }

        // Cập nhật trạng thái 'used' (gạch ngang mờ) cho các từ đã điền trong Word bank
        syncWordBankUsed(exCard, exId);

        // Mặc định KHÔNG phát âm từ khi chọn để không chèn lên đoạn hội thoại khi đang nghe.
        // Chỉ phát âm từ nếu người dùng chủ động tích chọn checkbox VÀ không có audio hội thoại nào đang phát.
        const chk = exCard ? exCard.querySelector('.chk-speak-on-fill') : null;
        const isAudioBusy = (currentCambridgeAudio && !currentCambridgeAudio.paused) ||
                            (ttsAudioPlayer && !ttsAudioPlayer.paused) ||
                            (window.speechSynthesis && window.speechSynthesis.speaking);
        if (chk && chk.checked && !isAudioBusy) {
          speak(w);
        }
      }
    };
  });

  box.querySelectorAll('.unit-blank-input').forEach(inp => {
    inp.oninput = () => {
      const key = inp.dataset.blankKey || (inp.dataset.clueId ? `clue_${inp.dataset.clueId}` : null);
      if (key) {
        const exCard = inp.closest('.unit-ex-card');
        const exId = exCard.id.replace('ex-card-', '');
        if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
        uState[exId].answers[key] = inp.value;
        saveUnitExState(u.id, exId);
        syncWordBankUsed(exCard, exId);
      }
    };
  });

  box.querySelectorAll('.btn-check-ex').forEach(b => {
    b.onclick = () => {
      const exId = b.dataset.exId;
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].checked = true;
      saveUnitExState(u.id, exId);
      renderUnitsTab(container);
    };
  });

  // 2. Clues Events (Ex 2.2)
  box.querySelectorAll('.btn-show-hint').forEach(b => {
    b.onclick = () => {
      const hintBox = document.getElementById(b.dataset.hintId);
      if (hintBox) {
        hintBox.style.display = (hintBox.style.display === 'none' || !hintBox.style.display) ? 'block' : 'none';
      }
    };
  });

  box.querySelectorAll('.btn-check-clues').forEach(b => {
    b.onclick = () => {
      const exId = b.dataset.exId;
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].checked = true;
      saveUnitExState(u.id, exId);
      renderUnitsTab(container);
    };
  });

  // 3. Sort Sounds Events (Ex 2.3)
  box.querySelectorAll('.btn-sort-choice').forEach(b => {
    b.onclick = () => {
      const word = b.dataset.word;
      const choice = b.dataset.choice;
      const exCard = b.closest('.unit-ex-card');
      const exId = exCard.id.replace('ex-card-', '');
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].answers[word] = choice;
      saveUnitExState(u.id, exId);
      const isAudioBusy = (currentCambridgeAudio && !currentCambridgeAudio.paused) ||
                          (ttsAudioPlayer && !ttsAudioPlayer.paused) ||
                          (window.speechSynthesis && window.speechSynthesis.speaking);
      if (!isAudioBusy) {
        speak(word);
      }
      renderUnitsTab(container);
    };
  });

  box.querySelectorAll('.btn-check-sort').forEach(b => {
    b.onclick = () => {
      const exId = b.dataset.exId;
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].checked = true;
      saveUnitExState(u.id, exId);
      renderUnitsTab(container);
    };
  });

  // 4. Match Sentences Events (Ex 2.4)
  box.querySelectorAll('.match-select').forEach(sel => {
    sel.onchange = () => {
      const pairId = sel.dataset.pairId;
      const exCard = sel.closest('.unit-ex-card');
      const exId = exCard.id.replace('ex-card-', '');
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].answers[`match_${pairId}`] = sel.value;
      saveUnitExState(u.id, exId);
    };
  });

  box.querySelectorAll('.btn-check-match').forEach(b => {
    b.onclick = () => {
      const exId = b.dataset.exId;
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].checked = true;
      saveUnitExState(u.id, exId);
      renderUnitsTab(container);
    };
  });

  // 5. Listen Pairs Events (Ex 2.5)
  box.querySelectorAll('.btn-play-pair').forEach(b => {
    b.onclick = () => {
      const key = b.dataset.drillKey;
      const wordA = b.dataset.wordA;
      const wordB = b.dataset.wordB;
      const chosenWord = Math.random() < 0.5 ? wordA : wordB;
      listenPairsPlayed[key] = chosenWord;
      speak(chosenWord);
    };
  });

  box.querySelectorAll('.btn-choose-pair-word').forEach(b => {
    b.onclick = () => {
      const drillId = b.dataset.drillId;
      const word = b.dataset.word;
      const exCard = b.closest('.unit-ex-card');
      const exId = exCard.id.replace('ex-card-', '');
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].answers[`drill_${drillId}`] = word;
      saveUnitExState(u.id, exId);
      renderUnitsTab(container);
    };
  });

  box.querySelectorAll('.btn-check-pairs').forEach(b => {
    b.onclick = () => {
      const exId = b.dataset.exId;
      if (!uState[exId]) uState[exId] = { answers: {}, checked: false };
      uState[exId].checked = true;
      saveUnitExState(u.id, exId);
      renderUnitsTab(container);
    };
  });
}

function renderUnitAiSpeaking(u, box) {
  const allSentences = [];

    u.sections.forEach(sec => {
      if (sec.sentences) {
        sec.sentences.forEach(s => allSentences.push(s));
      }
    });
  }
  if (allSentences.length === 0 && u.sentences) {
    u.sentences.forEach(s => allSentences.push(s));

    <div style="background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px">

      <div style="font-size:13.5px;color:var(--muted)">
        Multi-alternative speech recognition with live audio visualizer analyzes word-level pronunciation in real time.
      </div>

    <div style="display:flex;flex-direction:column;gap:12px">

        const vi = typeof sent === 'object' ? sent.vi : '';
        return `
          <div class="sentence-drill-item" style="padding:14px 16px">
            <div class="sentence-top-bar">
              <div style="flex:1;min-width:220px">
                <div style="font-size:16px;font-weight:800;color:var(--ink)">${idx + 1}. "${esc(en)}"</div>
                ${vi ? `<div style="font-size:13px;color:var(--muted);margin-top:2px">${esc(vi)}</div>` : ''}
              </div>
              <div style="display:flex;gap:6px">
                <button class="btn" onclick="speak('${esc(en)}')" style="display:inline-flex;align-items:center;gap:4px;padding:6px 12px;font-size:13px">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
                  <span>Native Audio</span>
                </button>
                <button class="btn rec-btn primary" data-rec-text="${esc(en)}" data-rec-id="ai-spk-${u.id}-${idx}" style="padding:6px 14px;font-size:13px;font-weight:700">
                  ${MIC_ICON}
                  <span>Record & Assess</span>
                </button>
              </div>
            </div>
            <div id="slot-ai-spk-${u.id}-${idx}" class="rec-slot" style="margin-top:8px"></div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function renderRulesTab(container) {
  const sWords = [
    { w: "boxes", ipa: "/ˈbɒksɪz/", group: "iz", note: "sau x (/ks/) -> /ɪz/" },
    { w: "watches", ipa: "/ˈwɒtʃɪz/", group: "iz", note: "sau ch (/tʃ/) -> /ɪz/" },
    { w: "finishes", ipa: "/ˈfɪnɪʃɪz/", group: "iz", note: "sau sh (/ʃ/) -> /ɪz/" },
    { w: "buses", ipa: "/ˈbʌsɪz/", group: "iz", note: "sau s (/s/) -> /ɪz/" },
    { w: "stops", ipa: "/stɒps/", group: "s", note: "after voiceless /p/ -> /s/" },
    { w: "cats", ipa: "/kæts/", group: "s", note: "after voiceless /t/ -> /s/" },
    { w: "books", ipa: "/bʊks/", group: "s", note: "after voiceless /k/ -> /s/" },
    { w: "laughs", ipa: "/lɑːfs/", group: "s", note: "sau gh (/f/) -> /s/" },
    { w: "days", ipa: "/deɪz/", group: "z", note: "after vowel -> /z/" },
    { w: "dogs", ipa: "/dɒɡz/", group: "z", note: "after voiced /g/ -> /z/" },
    { w: "friends", ipa: "/frendz/", group: "z", note: "after voiced /d/ -> /z/" },
    { w: "calls", ipa: "/kɔːlz/", group: "z", note: "after voiced /l/ -> /z/" }
  ];

  const edWords = [
    { w: "waited", ipa: "/ˈweɪtɪd/", group: "id", note: "after /t/ -> /ɪd/ (adds 1 syllable)" },
    { w: "needed", ipa: "/ˈniːdɪd/", group: "id", note: "after /d/ -> /ɪd/ (adds 1 syllable)" },

      <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(240px, 1fr));gap:12px;margin-bottom:16px">

// ---------- NEW PAGE: LEADERBOARD ----------
async function renderLeaderboard(box) {
  box.innerHTML = `
    <div class="thead" style="margin-bottom:18px">
      <div class="eyebrow">ACADEMIC RANKINGS</div>
      <h1 style="font-size:26px;font-weight:800">Learner Leaderboard</h1>
      <div class="meta">
        <span>Top 50 learners with verified assessment scores</span>
        <span class="hint">Assessment scores verified through online active-recall testing</span>
      </div>
    </div>
    <div id="lb-content">
      <div class="card" style="text-align:center;padding:32px">
        <div class="hint">Loading leaderboard...</div>
      </div>
    </div>`;

  const cBox = box.querySelector('#lb-content');
  if (!isConfigured || !fbDb || !firestoreModules) {
    cBox.innerHTML = `
      <div class="card" style="text-align:center;padding:32px">
        <div style="font-weight:600;margin-bottom:6px">Leaderboard Not Configured</div>
        <p class="hint">Leaderboard requires Firebase cloud configuration. See FIREBASE_SETUP.md for details.</p>
      </div>`;
    return;
  }

  try {
    const lbRef = firestoreModules.collection(fbDb, 'leaderboard');
    // Truy vấn trực tiếp leaderboard, không cần Firestore Index
    const snap = await firestoreModules.getDocs(lbRef);

    if (snap.empty) {
      cBox.innerHTML = `
        <div class="card" style="text-align:center;padding:32px">
          
          <div style="font-weight:600;margin-bottom:6px">No learners on the leaderboard yet</div>
          <p class="hint">Sign in and complete quizzes to be the first learner on the board!</p>
        </div>`;
      return;
    }

    const items = snap.docs.map(doc => doc.data());
    items.sort((a, b) => (b.totalBest - a.totalBest) || ((b.completedCount || 0) - (a.completedCount || 0)));

    const rows = [];
    let rank = 1;
    items.forEach(d => {
      const isMe = currentUser && currentUser.uid === d.uid;
      let rankHtml = String(rank);
      if (rank === 1) rankHtml = '<span class="lb-rank lb-gold">1</span>';
      else if (rank === 2) rankHtml = '<span class="lb-rank lb-silver">2</span>';
      else if (rank === 3) rankHtml = '<span class="lb-rank lb-bronze">3</span>';
      else rankHtml = `<span class="lb-rank">${rank}</span>`;

      const avatar = d.photoURL
        ? `<img class="lb-avatar" src="${esc(d.photoURL)}" alt="Avatar">`
        : `<div class="lb-avatar">${esc((d.displayName || 'U')[0].toUpperCase())}</div>`;

      rows.push(`
        <tr class="lb-row ${isMe ? 'me' : ''}">
          <td style="width:48px;text-align:center">${rankHtml}</td>
          <td>
            <div class="lb-user-cell">
              ${avatar}
              <div>
                <div style="font-weight:700">${esc(d.displayName || 'Learner')}${isMe ? ' <span style="font-size:11px;background:var(--accent);color:var(--accent-ink);padding:2px 6px;border-radius:4px">You</span>' : ''}</div>
                <div style="font-size:12px;color:var(--muted)">Completed ${d.completedCount || 0}/45 topics</div>
              </div>
            </div>
          </td>
          <td style="text-align:right">
            <div class="lb-score">${d.totalBest || 0}</div>
            <div style="font-size:11px;color:var(--muted)">points</div>
          </td>
        </tr>
      `);
      rank++;
    });

    cBox.innerHTML = `
      <table class="lb-table">
        <thead>
          <tr>
            <th style="text-align:center;width:48px">Rank</th>
            <th>Learner</th>
            <th style="text-align:right">Verified Score</th>
          </tr>
        </thead>
        <tbody>
          ${rows.join('')}
        </tbody>
      </table>`;
  } catch (err) {
    console.error('Lỗi tải leaderboard:', err);
    cBox.innerHTML = `<div class="card"><div class="fb no">Unable to load leaderboard: ${esc(err.message)}</div></div>`;
  }
}

async function renderProfile(box) {
  if (!currentUser) {

      </div>`;
    box.querySelector('#btn-login-profile').onclick = () => openAuthModal('login');
    return;
  }

  let profileData = {};
  let teacherNoteData = null;
  try {
    const [userDoc, noteDoc] = await Promise.all([
      firestoreModules.getDoc(firestoreModules.doc(fbDb, 'users', currentUser.uid)).catch(() => null),
      firestoreModules.getDoc(firestoreModules.doc(fbDb, 'users', currentUser.uid, 'meta', 'teacher_note')).catch(() => null)
    ]);
    if (userDoc && userDoc.exists()) profileData = userDoc.data();
    if (noteDoc && noteDoc.exists()) teacherNoteData = noteDoc.data();
  } catch (e) {}

  let completedCount = 0;
  let attemptedCount = 0;
  let totalScore = 0;
  let scoreCount = 0;

  TOPICS.forEach(t => {
    const best = store.get('best:' + t.id, null);
    const completedManual = store.get('completedManual:' + t.id, false);
    const isCompleted = completedManual || (best != null && best >= 80);
    if (isCompleted) completedCount++;
    if (best != null) {
      attemptedCount++;
      totalScore += best;
      scoreCount++;
    } else {
      let hasAns = false;
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && (k.startsWith(`toeic45:${currentUser.uid}:tr:${t.id}:`) || k.startsWith(`toeic45:${currentUser.uid}:g-${t.id}-`))) {

function fmtRelativeTime(ms) {
  if (!ms) return 'Never';
  const diff = Date.now() - ms;
  if (diff < 60000) return 'Just now';
  if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
  if (diff < 7 * 86400000) return Math.floor(diff / 86400000) + 'd ago';
  return new Date(ms).toLocaleDateString('vi-VN');
}

function exportStudentsCSV(users) {
  const headers = ['Full Name', 'Email', 'Role', 'Joined Date', 'Last Active', 'TOEIC Attempted', 'TOEIC Completed', 'Total TOEIC Points', 'Pronunciation Units', 'Pronunciation Exercises Completed', 'Pronunciation Graded', 'UID'];
  const escCsv = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const rows = users.map(u => [
    u.displayName,
    u.email,
    u.isAdmin ? 'Admin' : (u.isTeacher ? 'Instructor' : 'Student'),
    u.createdAt ? new Date(u.createdAt).toLocaleDateString('vi-VN') : '',
    u.lastActiveAt ? new Date(u.lastActiveAt).toLocaleString('vi-VN') : '',
    u.topicsAttempted || 0,
    u.completedCount || 0,
    u.totalBest || 0,
    u.pronunUnitsDone || 0,
    u.pronunExFilled || 0,
    u.pronunExChecked || 0,
    u.uid
  ].map(escCsv).join(','));
  const csvContent = '\uFEFF' + headers.map(escCsv).join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `BaoCao_LopHoc_TOEIC_${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✓ Exported CSV report (Excel compatible)!');
}

async function openAdminUserInspector(targetUid, userName) {
  openModal(`
    <div class="modal-backdrop">
      <div class="modal-box wide" style="max-height:88vh;overflow-y:auto">
        <button class="modal-close" aria-label="Close">✕</button>

        <div id="inspector-body">
          <div class="hint" style="text-align:center;padding:24px">Loading student submissions…</div>
        </div>
      </div>
    </div>
  `);

  try {
    const progress = {};
    const answers = {};
    const pronunAnswers = {};
    const practiceAnswers = {};
    const grammarAnswers = {};
    let review = null;
    let teacherNote = null;

    const [progSnap, ansSnap, revDoc, noteDoc] = await Promise.all([
      firestoreModules.getDocs(firestoreModules.collection(fbDb, 'users', targetUid, 'progress')).catch(() => null),
      firestoreModules.getDocs(firestoreModules.collection(fbDb, 'users', targetUid, 'answers')).catch(() => null),
      firestoreModules.getDoc(firestoreModules.doc(fbDb, 'users', targetUid, 'meta', 'review')).catch(() => null),
      firestoreModules.getDoc(firestoreModules.doc(fbDb, 'users', targetUid, 'meta', 'teacher_note')).catch(() => null)
    ]);

    if (progSnap) progSnap.forEach(d => { progress[Number(d.id)] = d.data(); });
    if (ansSnap) {
      ansSnap.forEach(d => {
        if (d.id.startsWith('pronun_')) {
          const uId = Number(d.id.slice('pronun_'.length));
          pronunAnswers[uId] = d.data();
        } else if (d.id.startsWith('practice_')) {
          const exId = d.id.slice('practice_'.length);
          practiceAnswers[exId] = d.data();
        } else if (d.id.startsWith('grammar_')) {
          const topId = d.id.slice('grammar_'.length);
          grammarAnswers[topId] = d.data();
        } else {
          answers[Number(d.id)] = d.data();
        }
      });
    }
    if (revDoc && revDoc.exists()) review = revDoc.data();
    if (noteDoc && noteDoc.exists()) teacherNote = noteDoc.data();

    const inspBody = $('#inspector-body');
    const pronunUnitIds = Object.keys(pronunAnswers).map(Number).sort((a, b) => a - b);
    const practiceExIds = Object.keys(practiceAnswers).sort();
    const grammarTopicIds = Object.keys(grammarAnswers).sort();
    const workedTopicIds = TOPICS.filter(t => progress[t.id] || (answers[t.id] && Object.keys(answers[t.id].data || {}).length > 0)).map(t => t.id);

    let activeTab = workedTopicIds.length === 0 && pronunUnitIds.length > 0 ? 'pronun' : 'toeic';
    let selTopicId = workedTopicIds[0] || 1;
    let selPronunUnitId = pronunUnitIds[0] || 2;
    let selPracticeExId = practiceExIds[0] || 'unit_ex_1';
    let selGrammarTopicId = grammarTopicIds[0] || 'tenses';

    function renderInspector() {

// ---------- Voice Recording & Speech Recognition Manager ----------
const RecorderManager = (function() {
  let mediaRecorder = null;
  let audioChunks = [];
  let currentRecId = null;
  let currentTargetText = '';
  let currentTriggerBtn = null;
  let currentSlotEl = null;
  let currentStream = null;
  let timerInterval = null;
  let startTime = 0;
  let recognitionInstance = null;
  let recognizedTranscript = '';
  let recognizedAlternatives = [];
  let currentPlayingAudio = null;
  let audioCtx = null;
  let analyserNode = null;
  let animFrameId = null;

  const cache = new Map();

  // Từ đồng âm phổ biến trong tiếng Anh & TOEIC
  const HOMOPHONES = {
    "no": ["know"], "know": ["no"],
    "than": ["then"], "then": ["than"],
    "buy": ["by", "bye"], "by": ["buy", "bye"],
    "for": ["four", "fore"], "four": ["for"],
    "to": ["too", "two"], "too": ["to", "two"], "two": ["to", "too"],
    "their": ["there", "they're"], "there": ["their", "they're"],
    "here": ["hear"], "hear": ["here"],
    "hour": ["our"], "our": ["hour"],
    "write": ["right", "rite"], "right": ["write"],
    "check": ["cheque"], "cheque": ["check"],
    "mail": ["male"], "male": ["mail"],
    "break": ["brake"], "brake": ["break"],
    "peace": ["piece"], "piece": ["peace"],
    "site": ["sight", "cite"], "sight": ["site", "cite"], "cite": ["site", "sight"],
    "ware": ["wear", "where"], "wear": ["ware", "where"],
    "weather": ["whether"], "whether": ["weather"],
    "plain": ["plane"], "plane": ["plain"],
    "meet": ["meat"], "meat": ["meet"],
    "board": ["bored"], "bored": ["board"],
    "accept": ["except"], "affect": ["effect"]
  };

  // Rút gọn từ gốc (stemming) để nhận diện biến thể số nhiều, quá khứ, v.v.
  function stemWord(w) {
    if (!w || w.length <= 3) return w;
    return w.toLowerCase()
      .replace(/(?:ingly|edly|able|ible|tion|sion|ment|ness|less)$/i, '')
      .replace(/(?:ing|ly|ed|es|al|ive|er|or|est)$/i, '')
      .replace(/s$/i, '')
      .replace(/(.)\1$/i, '$1');
  }

  function isRecording() {
    return mediaRecorder && mediaRecorder.state === 'recording';
  }

  function wordSimilarity(s1, s2) {
    if (s1 === s2) return 1.0;
    if (!s1 || !s2) return 0;
    
    // Kiểm tra đồng âm (Homophones)
    if (HOMOPHONES[s1] && HOMOPHONES[s1].includes(s2)) return 0.98;
    if (HOMOPHONES[s2] && HOMOPHONES[s2].includes(s1)) return 0.98;

    // Kiểm tra từ gốc (Stemming)
    const st1 = stemWord(s1);
    const st2 = stemWord(s2);
    if (st1 === st2 && st1.length >= 3) return 0.95;
    if (st1.length >= 4 && st2.length >= 4 && (st1.startsWith(st2) || st2.startsWith(st1))) return 0.90;

    const len1 = s1.length, len2 = s2.length;
    const maxLen = Math.max(len1, len2);
    if (!maxLen) return 1.0;

    const track = Array(len2 + 1).fill(null).map(() => Array(len1 + 1).fill(null));
    for (let i = 0; i <= len1; i += 1) track[0][i] = i;
    for (let j = 0; j <= len2; j += 1) track[j][0] = j;
    for (let j = 1; j <= len2; j += 1) {
      for (let i = 1; i <= len1; i += 1) {
        const indicator = s1[i - 1] === s2[j - 1] ? 0 : 1;
        track[j][i] = Math.min(
          track[j][i - 1] + 1,
          track[j - 1][i] + 1,
          track[j - 1][i - 1] + indicator
        );
      }
    }
    const dist = track[len2][len1];
    return Math.max(0, 1 - dist / maxLen);
  }

  // Thuật toán chấm điểm và phân tích phát âm siêu nhạy (Super High Sensitivity)
  function assessPronunciation(spokenText, targetText, alternatives = []) {
    if (!targetText) return { score: 0, message: '', words: [] };

    const rawTargetWords = targetText.trim().split(/\s+/).filter(Boolean);
    const cleanTargetWords = rawTargetWords.map(w => w.toLowerCase().replace(/^[^\w]+|[^\w]+$/g, '')).filter(Boolean);
    
    if (!cleanTargetWords.length) return { score: 100, grade: 'excellent', message: 'Completed!', words: [] };

    const allCandidateTexts = [spokenText, ...alternatives].filter(Boolean);
    if (!allCandidateTexts.length || !spokenText.trim()) {
      return {
        score: 0,
        grade: 'needs_work',
        message: 'No clear speech detected. Please move your microphone closer, speak clearly, and try recording again.',
        spoken: '',
        words: cleanTargetWords.map((w, idx) => ({
          word: rawTargetWords[idx] || w,
          status: 'wrong',
          match: false
        }))
      };
    }

    // Gom tất cả các từ trong toàn bộ các phương án nhận diện (top 5 alternatives)
    const allCandidateWords = allCandidateTexts
      .flatMap(t => t.trim().split(/\s+/))
      .map(w => w.toLowerCase().replace(/^[^\w]+|[^\w]+$/g, ''))
      .filter(Boolean);

    const wordsResult = [];
    let totalScorePoints = 0;
    const usedWordIndices = new Set();

    cleanTargetWords.forEach((tw, idx) => {
      let bestSim = 0;
      let bestWord = null;
      let bestIdx = -1;

      allCandidateWords.forEach((cw, cIdx) => {
        if (usedWordIndices.has(cIdx)) return;
        const sim = wordSimilarity(tw, cw);
        if (sim > bestSim) {
          bestSim = sim;
          bestWord = cw;
          bestIdx = cIdx;
        }
      });

      // Ngưỡng siêu nhạy: >= 0.70 tính là Chuẩn (1.0), >= 0.45 tính là Gần đúng (0.7)
      if (bestSim >= 0.70) {
        if (bestIdx !== -1) usedWordIndices.add(bestIdx);
        wordsResult.push({
          word: rawTargetWords[idx] || tw,
          status: 'correct',
          sim: bestSim,
          heard: bestWord
        });
        totalScorePoints += 1.0;
      } else if (bestSim >= 0.45) {
        if (bestIdx !== -1) usedWordIndices.add(bestIdx);
        wordsResult.push({
          word: rawTargetWords[idx] || tw,
          status: 'partial',
          sim: bestSim,
          heard: bestWord
        });
        totalScorePoints += 0.7;
      } else {
        wordsResult.push({
          word: rawTargetWords[idx] || tw,
          status: 'wrong',
          sim: 0,
          heard: null
        });
        totalScorePoints += 0;
      }
    });

    const finalScore = Math.min(100, Math.round((totalScorePoints / cleanTargetWords.length) * 100));

    let grade = 'needs_work';
    let message = '';
    if (finalScore >= 80) {
      grade = 'excellent';
      message = 'Excellent! Clear and accurate pronunciation.';
    } else if (finalScore >= 65) {
      grade = 'good';
      message = 'Great job! Clear articulation and natural rhythm.';
    } else if (finalScore >= 45) {
      grade = 'fair';
      message = 'Fair attempt. Focus on the highlighted words for clearer articulation.';
    } else {
      grade = 'needs_work';
      message = 'Needs practice. Click [Native Audio] to listen and try again!';
    }

    return {
      score: finalScore,
      grade,
      message,
      spoken: spokenText.trim(),
      words: wordsResult
    };
  }

  async function start(recId, targetText, btn, slot) {
    if (isRecording()) {
      await stop();
    }

    try {
      // Cấu hình âm thanh siêu nhạy: Tự động khuếch đại (autoGainControl), tắt lọc ồn thô (noiseSuppression: false) để không bị nuốt âm đuôi
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: false,
          autoGainControl: true,
          channelCount: 1
        }
      });

      currentStream = stream;
      audioChunks = [];
      currentRecId = recId;
      currentTargetText = targetText || '';
      currentTriggerBtn = btn;
      currentSlotEl = slot;
      recognizedTranscript = '';
      recognizedAlternatives = [];

      // Khởi tạo visualizer theo dõi cường độ âm thanh thời gian thực
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
          const source = audioCtx.createMediaStreamSource(stream);
          analyserNode = audioCtx.createAnalyser();
          analyserNode.fftSize = 64;
          source.connect(analyserNode);

          const dataArray = new Uint8Array(analyserNode.frequencyBinCount);
          function trackVolume() {
            if (!isRecording()) return;
            analyserNode.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
            const avg = sum / dataArray.length;
            if (btn) {
              const scale = Math.min(1.22, 1.0 + (avg / 255) * 0.35);
              btn.style.setProperty('--rec-scale', scale.toFixed(2));
            }
            animFrameId = requestAnimationFrame(trackVolume);
          }
          animFrameId = requestAnimationFrame(trackVolume);
        }
      } catch(e) {}

      let options = {};
      if (typeof MediaRecorder.isTypeSupported === 'function') {
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) options = { mimeType: 'audio/webm;codecs=opus' };
        else if (MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType: 'audio/webm' };
        else if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };
      }

      mediaRecorder = new MediaRecorder(stream, options);

      mediaRecorder.ondataavailable = (e) => {
        if (e.data && e.data.size > 0) audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        // Chờ SpeechRecognition nhận diện trọn vẹn âm tiết cuối
        await new Promise(r => setTimeout(r, 380));

        const mimeType = mediaRecorder.mimeType || 'audio/webm';
        const blob = new Blob(audioChunks, { type: mimeType });
        const audioUrl = URL.createObjectURL(blob);
        const durationSec = Math.max(1, Math.round((Date.now() - startTime) / 1000));

        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
          currentStream = null;
        }

        const isPractice = currentRecId && currentRecId.startsWith('prac-');
        const transcript = (recognizedTranscript || '').trim();

        let assessment;
        if (isPractice) {
          assessment = {
            isPractice: true,
            spoken: transcript,
            score: 100,
            words: []
          };
        } else {
          assessment = assessPronunciation(recognizedTranscript, currentTargetText, recognizedAlternatives);
        }

        const rawName = currentTargetText ? cleanWord(currentTargetText).slice(0, 20).replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '_') : 'Record';
        const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
        const fileName = `TOEIC_${rawName}_${Date.now()}.${ext}`;

        const recordItem = {
          recId: currentRecId,
          audioUrl,
          duration: durationSec,
          assessment,
          transcript,
          alternatives: recognizedAlternatives || [],
          fileName,
          targetText: isPractice ? '' : currentTargetText,
          blob,
          createdAt: Date.now()
        };

        cache.set(currentRecId, recordItem);
        saveToIndexedDB(recordItem);

        renderPlayer(currentRecId, currentTriggerBtn, currentSlotEl);
        resetTriggerUI(currentTriggerBtn);
      };

      // Nhận diện giọng nói đa phương án (Top 5 Alternatives) với Web Speech API
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SpeechRecognition) {
        try {
          recognitionInstance = new SpeechRecognition();
          recognitionInstance.lang = 'en-US';
          recognitionInstance.continuous = true;
          recognitionInstance.interimResults = true;
          recognitionInstance.maxAlternatives = 5;

          recognitionInstance.onstart = () => {
            if (btn && isRecording()) {
              setBtnLabel(btn, '00:00 ⏹');
            }
          };

          recognitionInstance.onresult = (ev) => {
            let allAlts = [];
            let finalStr = '', interimStr = '';
            for (let i = 0; i < ev.results.length; ++i) {
              const res = ev.results[i];
              if (res.isFinal) {
                finalStr += res[0].transcript + ' ';
              } else {
                interimStr += res[0].transcript;
              }
              for (let k = 0; k < res.length; ++k) {
                if (res[k] && res[k].transcript) {
                  allAlts.push(res[k].transcript);
                }
              }
            }
            const full = (finalStr + ' ' + interimStr).trim();
            if (full) recognizedTranscript = full;
            if (allAlts.length) recognizedAlternatives = allAlts;
          };

          recognitionInstance.onerror = (ev) => {
            console.warn('SpeechRecognition notice:', ev.error);
          };

          recognitionInstance.start();
        } catch(e) {
          console.warn('SpeechRecognition init notice:', e);
        }
      }

      mediaRecorder.start();
      startTime = Date.now();

      btn.classList.add('recording');
      setBtnLabel(btn, '00:00 ⏹');

      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const s = String(elapsed % 60).padStart(2, '0');
        setBtnLabel(btn, `${m}:${s} ⏹`);
        if (elapsed >= 90) stop();
      }, 1000);

    } catch(err) {
      console.error('Lỗi truy cập Microphone:', err);
      alert('Cannot access microphone. Please check browser microphone permissions to use voice recording.');
      resetTriggerUI(btn);
    }
  }

  function stop() {
    if (!isRecording()) return;
    clearInterval(timerInterval);
    if (animFrameId) {
      cancelAnimationFrame(animFrameId);
      animFrameId = null;
    }
    if (audioCtx) {
      try { audioCtx.close(); } catch(e) {}
      audioCtx = null;
    }
    if (recognitionInstance) {
      try { recognitionInstance.stop(); } catch(e) {}
    }
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
    }
  }

  function setBtnLabel(btn, text) {
    const span = btn.querySelector('span');
    if (span) span.textContent = text;
    else btn.setAttribute('title', text);
  }

  function resetTriggerUI(btn) {
    if (!btn) return;
    btn.classList.remove('recording');
    btn.style.removeProperty('--rec-scale');
    const span = btn.querySelector('span');
    if (span) {
      if (btn.id === 'sel-rec') span.textContent = 'Speak';
      else if (btn.dataset.recId && btn.dataset.recId.startsWith('gap-')) span.textContent = 'Record Passage';
      else if (btn.dataset.recId && btn.dataset.recId.startsWith('tr-')) span.textContent = 'Practice Sentence';
      else if (btn.dataset.recId && btn.dataset.recId.startsWith('prac-')) span.textContent = 'Record';
      else span.textContent = '';
    }
  }

  function fillRecognizedSpeechIntoInput(recId, text) {
    if (!text) return;
    let targetInput = null;
    if (recId.startsWith('prac-u-')) {
      const parts = recId.split('-');
      const itemId = parts[parts.length - 1];
      targetInput = document.querySelector(`.practice-input[data-item="${itemId}"]`);
    } else if (recId.startsWith('prac-p-')) {
      const parts = recId.split('-');
      const segId = parts[parts.length - 1];
      targetInput = document.querySelector(`.para-input[data-seg="${segId}"]`);
    } else if (recId.startsWith('prac-t-')) {
      const parts = recId.split('-');
      const itemId = parts[parts.length - 1];
      targetInput = document.querySelector(`.tense-input[data-item="${itemId}"]`);
    }

    if (targetInput) {
      targetInput.value = text;
      targetInput.dispatchEvent(new Event('input', { bubbles: true }));
      targetInput.focus();
      showToast('✓ Inserted speech text into exercise input!');
    }
  }

  // ---------- IndexedDB Persistence & Export for Voice Recordings ----------
  function openDB() {
    return new Promise((resolve) => {
      if (!window.indexedDB) return resolve(null);
      const req = indexedDB.open('toeic_voice_db', 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('recordings')) {
          db.createObjectStore('recordings', { keyPath: 'recId' });
        }
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    });
  }

  async function saveToIndexedDB(item) {
    try {
      const db = await openDB();
      if (!db) return;
      const tx = db.transaction('recordings', 'readwrite');
      tx.objectStore('recordings').put({
        recId: item.recId,
        fileName: item.fileName,
        targetText: item.targetText,
        duration: item.duration,
        blob: item.blob,
        assessment: item.assessment,
        createdAt: item.createdAt
      });
    } catch(e) { console.warn('Lỗi lưu IndexedDB:', e); }
  }

  async function getAllRecordings() {
    try {
      const db = await openDB();
      if (!db) return [];
      return new Promise((resolve) => {
        const tx = db.transaction('recordings', 'readonly');
        const req = tx.objectStore('recordings').getAll();
        req.onsuccess = () => {
          const list = req.result || [];
          list.sort((a, b) => b.createdAt - a.createdAt);
          resolve(list);
        };
        req.onerror = () => resolve([]);
      });
    } catch(e) { return []; }
  }

  async function deleteRecording(recId) {
    try {
      const db = await openDB();
      if (!db) return;
      const tx = db.transaction('recordings', 'readwrite');
      tx.objectStore('recordings').delete(recId);
      cache.delete(recId);
    } catch(e) {}
  }

  async function downloadAllRecordings() {
    const list = await getAllRecordings();
    if (!list.length) {
      alert('No recordings available to download!');
      return;
    }
    let count = 0;
    for (const item of list) {
      if (item.blob) {
        const url = URL.createObjectURL(item.blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = item.fileName || ('TOEIC_' + item.recId + '.webm');
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        count++;
        await new Promise(r => setTimeout(r, 250));
      }
    }
    alert(`Downloaded ${count} audio recording(s) to your Downloads folder!`);
  }

  (async function restoreCachedRecordings() {
    const list = await getAllRecordings();
    list.forEach(item => {
      if (item.blob && !cache.has(item.recId)) {
        cache.set(item.recId, {
          recId: item.recId,
          audioUrl: URL.createObjectURL(item.blob),
          duration: item.duration,
          assessment: item.assessment,
          fileName: item.fileName,
          targetText: item.targetText,
          blob: item.blob,
          createdAt: item.createdAt
        });
      }
    });
  })();

  function playAudio(recId, playBtn) {
    const data = cache.get(recId);
    if (!data || !data.audioUrl) return;

    if (currentPlayingAudio) {
      currentPlayingAudio.pause();
      currentPlayingAudio = null;
      document.querySelectorAll('.rec-play-btn').forEach(b => {
        b.classList.remove('playing');
        const s = b.querySelector('span');
        if (s) s.textContent = s.textContent.replace('Playing...', 'Listen to recording');
      });
    }

    const audio = new Audio(data.audioUrl);
    currentPlayingAudio = audio;
    playBtn.classList.add('playing');
    const span = playBtn.querySelector('span');
    const oldText = span ? span.textContent : '';
    if (span) span.textContent = 'Playing...';

    audio.onended = () => {
      playBtn.classList.remove('playing');
      if (span) span.textContent = oldText.replace('Playing...', 'Listen to recording');
      currentPlayingAudio = null;
    };
    audio.onerror = () => {
      playBtn.classList.remove('playing');
      if (span) span.textContent = oldText.replace('Playing...', 'Listen to recording');
      currentPlayingAudio = null;
    };
    audio.play().catch(e => console.warn('Play error:', e));
  }

  function toggleRecord(recId, targetText, btn, slot) {
    if (isRecording() && currentRecId === recId) {
      stop();
    } else {
      start(recId, targetText, btn, slot);
    }
  }

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.rec-btn');
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      const recId = btn.dataset.recId || (btn.id === 'sel-rec' ? 'sel-target' : null);
      const recText = btn.dataset.recText || '';
      let slotEl = null;
      if (btn.id === 'sel-rec') {
        slotEl = document.querySelector('#sel-rec-slot');
      } else if (recId) {
        if (recId.startsWith('p2-')) {
          const lIdx = recId.split('-')[1];
          slotEl = document.querySelector('#slot-p2-row-' + lIdx);
        } else if (recId.startsWith('fc-')) {
          slotEl = document.querySelector('#slot-' + recId) || (btn.closest('.fc-face') && btn.closest('.fc-face').querySelector('.rec-slot'));
        } else {
          slotEl = document.querySelector('#slot-' + recId);
        }
      }
      toggleRecord(recId, recText, btn, slotEl);
      return;
    }

    const sampleBtn = e.target.closest('.rec-sample-btn');
    if (sampleBtn) {
      e.preventDefault();
      e.stopPropagation();
      const sayTxt = sampleBtn.dataset.say;
      if (sayTxt) speak(sayTxt);
      return;
    }

    const playBtn = e.target.closest('.rec-play-btn');
    if (playBtn) {
      e.preventDefault();
      e.stopPropagation();
      playAudio(playBtn.dataset.playId, playBtn);
      return;
    }

    const retryBtn = e.target.closest('.rec-retry-btn');
    if (retryBtn) {
      e.preventDefault();
      e.stopPropagation();
      const recId = retryBtn.dataset.retryId;
      const targetBtn = document.querySelector(`.rec-btn[data-rec-id="${recId}"]`) || (recId === 'sel-target' ? document.querySelector('#sel-rec') : null);
      if (targetBtn) targetBtn.click();
      return;
    }
  });

  return {
    toggleRecord,
    playAudio,
    cache,
    getAllRecordings,
    deleteRecording,
    downloadAllRecordings
  };
})();

// ---------- Quick Selection Tooltip (Speak, Translate & Star Review Word) ----------
(function initSelectionTooltip() {
  let popover = null;
  let activeTarget = '';
  let activeTranslated = '';

  function removePopover() {
    if (popover && popover.parentNode) {
      popover.parentNode.removeChild(popover);
    }
    popover = null;
    activeTarget = '';
    activeTranslated = '';
  }

  function handleSelection() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed) return;

    const rawText = sel.toString().trim();
    if (!rawText || rawText.length > 200) {
      removePopover();
      return;
    }

    if (popover && popover.contains(sel.anchorNode)) return;

    let range;
    try {
      range = sel.getRangeAt(0);
    } catch(e) { return; }

    const rect = range.getBoundingClientRect();
    if (!rect || (rect.width === 0 && rect.height === 0)) return;

    const targetWord = cleanWord(rawText);
    if (!targetWord) return;

    // Đóng popover cũ
    removePopover();
    activeTarget = targetWord;

    const isVietnamese = VN.test(targetWord);
    const isAlreadyStarred = store.isStarred(targetWord);

    popover = document.createElement('div');
    popover.className = 'sel-popover below'; // Mặc định ở dưới để không bị thanh công cụ Edge đè lên
    popover.dataset.word = targetWord;

    popover.innerHTML = `
      <div class="sel-btn-bar">
        <button class="sel-btn btn-speak" id="sel-speak" title="${isVietnamese ? 'Listen to Vietnamese speech' : 'Listen to English pronunciation'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
          <span>Listen</span>
        </button>
        <button class="sel-btn btn-rec rec-btn" id="sel-rec" data-rec-text="${esc(targetWord)}" data-rec-id="sel-target" title="Practice pronunciation">
          ${MIC_ICON}
          <span>Speak</span>
        </button>
        <button class="sel-btn btn-trans" id="sel-trans" title="${isVietnamese ? 'Translate to English' : 'Translate to Vietnamese'}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          <span>${isVietnamese ? 'Translate (EN)' : 'Translate'}</span>
        </button>
        <button class="sel-btn btn-star ${isAlreadyStarred ? 'is-saved' : ''}" id="sel-star" title="${isAlreadyStarred ? 'Saved in Saved Vocabulary' : 'Save to Saved Vocabulary'}">
          <svg viewBox="0 0 24 24" fill="${isAlreadyStarred ? '#FBBF24' : 'none'}" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
          <span id="sel-star-txt">${isAlreadyStarred ? 'Saved' : 'Save'}</span>
        </button>
        <button class="sel-btn btn-close" id="sel-close" title="Close">✕</button>
      </div>
      <div id="sel-rec-slot" class="rec-slot" style="display:none"></div>
      <div id="sel-res" class="sel-result" style="display:none"></div>
    `;

    document.body.appendChild(popover);

    const scrollX = window.pageXOffset || document.documentElement.scrollLeft || 0;
    const scrollY = window.pageYOffset || document.documentElement.scrollTop || 0;

    let posX = rect.left + rect.width / 2 + scrollX;
    // Mặc định hiển thị DƯỚI dòng chữ đã quét để hoàn toàn tránh menu Edge
    let posY = rect.bottom + scrollY + 8;

    const popWidth = Math.max(340, popover.offsetWidth || 340);
    const minLeft = popWidth / 2 + 16;
    const maxLeft = Math.max(minLeft, window.innerWidth - popWidth / 2 - 16);
    if (posX < minLeft) posX = minLeft;
    if (posX > maxLeft) posX = maxLeft;

    // Chỉ đưa lên trên nếu ở sát đáy màn hình VÀ phía trên còn nhiều khoảng trống
    if (rect.bottom + 140 > window.innerHeight && rect.top > 120) {
      popover.classList.remove('below');
      posY = rect.top + scrollY - 8;
    }

    popover.style.left = posX + 'px';
    popover.style.top = posY + 'px';

    const speakBtn = popover.querySelector('#sel-speak');
    speakBtn.onclick = (e) => {
      e.stopPropagation();
      const txtSpan = speakBtn.querySelector('span');
      if (txtSpan) txtSpan.textContent = 'Playing...';

      if (isVietnamese && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(targetWord);
        u.lang = 'vi-VN';
        u.rate = 0.95;
        u.onend = () => { if (txtSpan) txtSpan.textContent = 'Nghe'; };
        u.onerror = () => { if (txtSpan) txtSpan.textContent = 'Nghe'; };
        window.speechSynthesis.speak(u);
        return;
      }

      speak(targetWord, () => {
        if (txtSpan) txtSpan.textContent = 'Nghe';
      });
      setTimeout(() => {
        if (txtSpan) txtSpan.textContent = 'Nghe';
      }, 1500);
    };

    popover.querySelector('#sel-trans').onclick = async (e) => {
      e.stopPropagation();
      const resEl = popover.querySelector('#sel-res');
      resEl.style.display = 'block';
      resEl.innerHTML = '<span style="color:#94A3B8">Translating...</span>';

      const allVocab = vocabPool();
      const normVN = s => String(s || '').toLowerCase().replace(/[.,!?;:()"]/g, '').replace(/\s+/g, ' ').trim();
      const normT = isVietnamese ? normVN(targetWord) : norm(targetWord);

      if (isVietnamese) {
        // --- Quét tiếng Việt -> Dịch sang tiếng Anh ---
        // 1. Tra trong từ điển bài học
        const hitVi = allVocab.find(v => {
          const cv = normVN(cleanWord(v.vi));
          return cv === normT || cv.includes(normT);
        });
        if (hitVi) {
          activeTranslated = hitVi.w;
          resEl.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
              <div>
                <span style="color:#94A3B8;font-size:12px;">Topic Vocabulary:</span><br>
                <b style="color:#38BDF8">${esc(targetWord)}</b> → <b style="color:#4ADE80;font-size:14.5px;">${esc(hitVi.w)}</b> ${hitVi.phonetic ? `<span style="color:#94A3B8">[${esc(hitVi.phonetic)}]</span>` : ''}
              </div>
              <button class="sel-btn btn-speak" style="padding:4px 8px;font-size:12px;" onclick="speak('${esc(hitVi.w)}')">Listen</button>
            </div>
          `;
          return;
        }

        // 2. Tra qua Google Translate (sl=vi&tl=en)
        try {
          const gUrl = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=vi&tl=en&dt=t&q=' + encodeURIComponent(targetWord);
          const gr = await fetch(gUrl);
          if (gr.ok) {
            const gd = await gr.json();
            if (gd && gd[0] && gd[0][0] && gd[0][0][0]) {
              const trans = gd[0].map(x => x[0]).join('').trim();
              if (trans) {
                activeTranslated = trans;
                resEl.innerHTML = `
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                    <div>
                      <span style="color:#94A3B8;font-size:12px;">English Translation:</span><br>
                      <b style="color:#38BDF8">${esc(targetWord)}</b> → <b style="color:#4ADE80;font-size:14.5px;">${esc(trans)}</b>
                    </div>
                    <button class="sel-btn btn-speak" style="padding:4px 8px;font-size:12px;" onclick="speak('${esc(trans)}')">Listen</button>
                  </div>
                `;
                return;
              }
            }
          }
        } catch(e) {}

        // 3. Fallback: MyMemory Translation API
        try {
          const mUrl = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(targetWord) + '&langpair=vi|en';
          const mr = await fetch(mUrl);
          if (mr.ok) {
            const md = await mr.json();
            if (md && md.responseData && md.responseData.translatedText) {
              const trans = md.responseData.translatedText.trim();
              if (trans && !trans.includes('NO QUERY SPECIFIED')) {
                activeTranslated = trans;
                resEl.innerHTML = `
                  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
                    <div>
                      <span style="color:#94A3B8;font-size:12px;">English Translation:</span><br>
                      <b style="color:#38BDF8">${esc(targetWord)}</b> → <b style="color:#4ADE80;font-size:14.5px;">${esc(trans)}</b>
                    </div>
                    <button class="sel-btn btn-speak" style="padding:4px 8px;font-size:12px;" onclick="speak('${esc(trans)}')">Listen</button>
                  </div>
                `;
                return;
              }
            }
          }
        } catch(e) {}

        resEl.innerHTML = `<div>No English translation found for "${esc(targetWord)}".</div>`;

      } else {
        // --- Quét tiếng Anh -> Dịch sang tiếng Việt ---
        // 1. Khớp từ điển bài học nếu đúng chính xác từ đó
        const exactHit = allVocab.find(v => norm(cleanWord(v.w)) === normT);
        if (exactHit) {
          activeTranslated = exactHit.vi;
          resEl.innerHTML = `<div><b style="color:#38BDF8">${esc(exactHit.w)}</b> ${exactHit.pos ? `<span style="color:#94A3B8">(${esc(exactHit.pos)})</span>` : ''}: <b style="color:#4ADE80">${esc(exactHit.vi)}</b></div>`;
          return;
        }

        // 2. Tra qua Google Translate public API
        try {
          const gUrl = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=' + encodeURIComponent(targetWord);
          const gr = await fetch(gUrl);
          if (gr.ok) {
            const gd = await gr.json();
            if (gd && gd[0] && gd[0][0] && gd[0][0][0]) {
              const trans = gd[0].map(x => x[0]).join('').trim();
              if (trans) {
                activeTranslated = trans;
                resEl.innerHTML = `<div><b style="color:#38BDF8">${esc(targetWord)}</b>: <b style="color:#4ADE80">${esc(trans)}</b></div>`;
                return;
              }
            }
          }
        } catch(e) {}

        // 3. Fallback: Tra qua MyMemory Translation API
        try {
          const mUrl = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(targetWord) + '&langpair=en|vi';
          const mr = await fetch(mUrl);
          if (mr.ok) {
            const md = await mr.json();
            if (md && md.responseData && md.responseData.translatedText) {
              const trans = md.responseData.translatedText.trim();
              if (trans && !trans.includes('NO QUERY SPECIFIED')) {
                activeTranslated = trans;
                resEl.innerHTML = `<div><b style="color:#38BDF8">${esc(targetWord)}</b>: <b style="color:#4ADE80">${esc(trans)}</b></div>`;
                return;
              }
            }
          }
        } catch (err) {}

        // 4. Fallback: Tra từ gốc trong bài học
        if (normT.length >= 4) {
          const prefixHit = allVocab.find(v => {
            const cw = norm(cleanWord(v.w));
            return cw.length >= 4 && (normT.startsWith(cw) || cw.startsWith(normT));
          });
          if (prefixHit) {
            activeTranslated = prefixHit.vi;
            resEl.innerHTML = `<div><b style="color:#38BDF8">${esc(targetWord)}</b> (root: <i>${esc(prefixHit.w)}</i>): <b style="color:#4ADE80">${esc(prefixHit.vi)}</b></div>`;
            return;
          }
        }

        resEl.innerHTML = `<div>No Vietnamese translation found for "${esc(targetWord)}".</div>`;
      }
    };

    // Bấm nút "Lưu từ" (Thêm vào Từ khó cần ôn)
    const starBtn = popover.querySelector('#sel-star');
    starBtn.onclick = (e) => {
      e.stopPropagation();
      const starTxt = starBtn.querySelector('#sel-star-txt');
      const starSvg = starBtn.querySelector('svg');
      const currentlySaved = store.isStarred(targetWord) || (activeTranslated && store.isStarred(activeTranslated));

      if (currentlySaved) {
        store.removeReviewWord(targetWord);
        if (activeTranslated) store.removeReviewWord(activeTranslated);
        starBtn.classList.remove('is-saved');
        if (starTxt) starTxt.textContent = 'Save Word';
        if (starSvg) {
          starSvg.setAttribute('fill', 'none');
          starSvg.setAttribute('stroke', 'currentColor');
        }
        showToast(`Removed "${targetWord}" from Saved Vocabulary`);
      } else {
        let saveW = targetWord;
        let saveVi = activeTranslated || '';
        if (isVietnamese) {
          if (activeTranslated) {
            saveW = activeTranslated;
            saveVi = targetWord;
          } else {
            saveW = targetWord;
            saveVi = '';
          }
        }
        const curTopic = (window.S && window.S.t) || 'selection';
        store.addReviewWord({ w: saveW, vi: saveVi }, curTopic, 'selection');
        starBtn.classList.add('is-saved');
        if (starTxt) starTxt.textContent = 'Saved';
        if (starSvg) {
          starSvg.setAttribute('fill', '#FBBF24');
          starSvg.setAttribute('stroke', '#FBBF24');
        }
        showToast(`Saved "${saveW}" to Saved Vocabulary!`);
      }
    };

    popover.querySelector('#sel-close').onclick = (e) => {
      e.stopPropagation();
      removePopover();
    };
  }

  document.addEventListener('mouseup', (e) => {
    if (popover && popover.contains(e.target)) return;
    setTimeout(handleSelection, 20);
  });

  document.addEventListener('touchend', (e) => {
    if (popover && popover.contains(e.target)) return;
    setTimeout(handleSelection, 250);
  });

  document.addEventListener('mousedown', (e) => {
    if (popover && !popover.contains(e.target)) {
      removePopover();
    }
  });

  window.addEventListener('hashchange', removePopover);
})();

</script>


<script>
// ---------- Theme Toggle (Light / Dark Mode) ----------
(function initThemeToggle() {
  const savedTheme = localStorage.getItem('toeic45_theme');
  const systemPrefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  let currentTheme = savedTheme || (systemPrefersDark ? 'dark' : 'light');

  function updateThemeUI(theme) {
    currentTheme = theme;
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('toeic45_theme', theme);

    document.querySelectorAll('.theme-btn').forEach(btn => {
      const isMob = btn.id === 'theme-btn-mob';
      if (theme === 'dark') {
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg><span>' + (isMob ? 'Light' : 'Light Mode') + '</span>';
        btn.setAttribute('title', 'Switch to Light Mode');
      } else {
        btn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><span>' + (isMob ? 'Dark' : 'Dark Mode') + '</span>';
        btn.setAttribute('title', 'Switch to Dark Mode');
      }
    });

    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) {
      metaTheme.content = theme === 'dark' ? '#0E141E' : '#1D5BBF';
    }
  }

  updateThemeUI(currentTheme);

  document.addEventListener('click', (e) => {
    const btn = e.target.closest('.theme-btn');
    if (btn) {
      e.preventDefault();
      const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
      updateThemeUI(nextTheme);
    }
  });
})();
</script>
