<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1D5BBF">
<style>body{margin:0}[hidden]{display:none!important}


.rec-download-btn {
  background: var(--sunk);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.15s;
}
.rec-download-btn:hover {
  background: #1D5BBF;
  color: #FFFFFF;
  border-color: #1D5BBF;
}
.rec-download-btn svg { width: 13px; height: 13px; }
.rec-history-card {
  margin-top: 20px;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
}
.rec-history-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 10px;
  border-radius: 6px;
  background: var(--sunk);
  margin-bottom: 6px;
  gap: 10px;
  flex-wrap: wrap;
}
.rec-history-item .rec-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* Voice Recording & Speaking Practice Styles */
.mini-rec-btn {
  background: transparent;
  border: none;
  cursor: pointer;
  color: var(--muted);
  padding: 3px 5px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  vertical-align: middle;
}
.mini-rec-btn svg { width: 14px; height: 14px; }
.mini-rec-btn:hover {
  color: #DC2626 !important;
  background: var(--surface);
}
.chip-item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--sunk);
  border-radius: 6px;
  padding: 3px 7px;
  font-weight: 600;
  font-size: 14.5px;
}
.chip-item .chip {
  background: none !important;
  padding: 0 !important;
  cursor: pointer;
}
.chip-item .chip:hover {
  color: var(--accent);
  text-decoration: underline;
}
.icon-btn.rec-btn {
  color: var(--muted);
}
.icon-btn.rec-btn:hover {
  color: #DC2626;
  border-color: #DC2626;
}
.btn.rec-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 8px;
  font-size: 13px;
  transition: all 0.15s;
}
.btn.rec-btn svg { width: 15px; height: 15px; }
.btn.rec-btn:hover {
  border-color: #DC2626;
  color: #DC2626;
}
.rec-btn.recording {
  background: #FEE2E2 !important;
  color: #DC2626 !important;
  border-color: #DC2626 !important;
  transform: scale(var(--rec-scale, 1.05)) !important;
  box-shadow: 0 0 0 calc((var(--rec-scale, 1) - 1) * 25px + 4px) rgba(220, 38, 38, 0.4) !important;
  transition: transform 0.06s ease, box-shadow 0.06s ease !important;
}
.sel-btn.btn-rec {
  background: #D97706 !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 8px rgba(217, 119, 6, 0.45) !important;
}
.sel-btn.btn-rec:hover {
  background: #B45309 !important;
  transform: translateY(-1px) !important;
}
.sel-btn.btn-rec.recording {
  background: #DC2626 !important;
  animation: recPulse 1.2s infinite ease-in-out !important;
}
@keyframes recPulse {
  0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.5); }
  70% { box-shadow: 0 0 0 8px rgba(220, 38, 38, 0); }
  100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
}
.rec-slot, .rec-slot-row {
  margin-top: 8px;
  width: 100%;
}
.rec-result-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid #2563EB;
  border-radius: 8px;
  padding: 9px 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
}
.rec-player-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.rec-play-btn {
  background: #2563EB;
  color: #FFFFFF;
  border: none;
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  transition: all 0.15s;
}
.rec-play-btn:hover { background: #1D4ED8; }
.rec-play-btn.playing { background: #059669; }
.rec-retry-btn {
  background: var(--sunk);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}
.rec-retry-btn:hover { background: var(--surface); color: var(--accent); }
.rec-sample-btn {
  background: var(--sunk);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
  transition: all 0.15s;
}
.rec-sample-btn:hover {
  background: #0284C7;
  color: #FFFFFF;
  border-color: #0284C7;
}
.rec-sample-btn svg { width: 13px; height: 13px; }

/* Chi tiết đánh giá chấm điểm phát âm */
.rec-assessment-box {
  margin-top: 4px;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--sunk);
  border: 1.5px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 13px;
}
.rec-assessment-box.excellent { border-color: #22C55E; background: rgba(34, 197, 94, 0.08); }
.rec-assessment-box.good { border-color: #38BDF8; background: rgba(56, 189, 248, 0.08); }
.rec-assessment-box.fair { border-color: #F59E0B; background: rgba(245, 158, 11, 0.08); }
.rec-assessment-box.needs_work { border-color: #EF4444; background: rgba(239, 68, 68, 0.08); }

.rec-assess-header {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.rec-score-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 20px;
  font-weight: 800;
  font-size: 13px;
}
.rec-score-pill.excellent { background: #DCFCE7; color: #15803D; }
.rec-score-pill.good { background: #E0F2FE; color: #0369A1; }
.rec-score-pill.fair { background: #FEF3C7; color: #B45309; }
.rec-score-pill.needs_work { background: #FEE2E2; color: #B91C1C; }

.rec-assess-msg {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
}
.rec-words-breakdown {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 12.5px;
  padding-top: 4px;
  border-top: 1px dashed var(--line);
}
.rec-words-label {
  color: var(--muted);
  font-weight: 600;
}
.rec-words-list {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
}
.rec-word-tag {
  font-size: 12px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.rec-word-tag.correct { background: rgba(34, 197, 94, 0.2); color: #16A34A; border: 1px solid rgba(34, 197, 94, 0.4); }
.rec-word-tag.partial { background: rgba(245, 158, 11, 0.2); color: #D97706; border: 1px solid rgba(245, 158, 11, 0.4); }
.rec-word-tag.wrong { background: rgba(239, 68, 68, 0.2); color: #DC2626; border: 1px solid rgba(239, 68, 68, 0.4); text-decoration: line-through; }

.rec-spoken-text {
  font-size: 12.5px;
  color: var(--muted);
}
.rec-spoken-text .user-spoken {
  color: var(--ink);
  font-style: italic;
}
.agroup-rec-bar {
  margin-top: 14px;
  padding: 12px 14px;
  background: var(--sunk);
  border: 1px dashed var(--line);
  border-radius: var(--r);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.agroup-rec-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* Quick selection popover for Speak & Translate - Siêu nét, nổi bật trên mọi nền */
.sel-popover {
  position: absolute;
  z-index: 999999;
  background: #1E293B !important;
  color: #F8FAFC !important;
  border: 1.5px solid #38BDF8 !important;
  border-radius: 12px !important;
  padding: 8px 10px !important;
  box-shadow: 0 14px 35px rgba(0, 0, 0, 0.55), 0 3px 10px rgba(0, 0, 0, 0.3) !important;
  display: flex !important;
  flex-direction: column !important;
  gap: 8px !important;
  font-family: var(--f-ui), -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
  font-size: 13.5px !important;
  line-height: 1.4 !important;
  animation: popIn 0.15s cubic-bezier(0.16, 1, 0.3, 1) !important;
  transform: translate(-50%, -100%) !important;
  margin-top: -10px !important;
  max-width: 320px !important;
  min-width: 190px !important;
  pointer-events: auto !important;
}
.sel-popover::after {
  content: '';
  position: absolute;
  bottom: -7px;
  left: 50%;
  transform: translateX(-50%);
  border-width: 7px 7px 0;
  border-style: solid;
  border-color: #38BDF8 transparent transparent;
  display: block;
  width: 0;
}
.sel-popover.below {
  transform: translate(-50%, 0) !important;
  margin-top: 10px !important;
}
.sel-popover.below::after {
  bottom: auto;
  top: -7px;
  border-width: 0 7px 7px;
  border-color: transparent transparent #38BDF8;
}
.sel-btn-bar {
  display: flex !important;
  align-items: center !important;
  gap: 8px !important;
}
.sel-btn {
  border: none !important;
  border-radius: 8px !important;
  padding: 7px 14px !important;
  cursor: pointer !important;
  display: inline-flex !important;
  align-items: center !important;
  gap: 6px !important;
  font-size: 13.5px !important;
  font-weight: 700 !important;
  transition: all 0.15s !important;
  white-space: nowrap !important;
}
.sel-btn.btn-speak {
  background: #2563EB !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.45) !important;
}
.sel-btn.btn-speak:hover {
  background: #1D4ED8 !important;
  transform: translateY(-1px) !important;
}
.sel-btn.btn-trans {
  background: #16A34A !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 8px rgba(22, 163, 74, 0.45) !important;
}
.sel-btn.btn-trans:hover {
  background: #15803D !important;
  transform: translateY(-1px) !important;
}
.sel-btn.btn-close {
  background: rgba(255, 255, 255, 0.14) !important;
  color: #CBD5E1 !important;
  width: 28px !important;
  height: 28px !important;
  padding: 0 !important;
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  font-size: 14px !important;
  font-weight: 800 !important;
  border-radius: 50% !important;
  margin-left: auto !important;
}
.sel-btn.btn-close:hover {
  background: rgba(239, 68, 68, 0.35) !important;
  color: #F87171 !important;
}
.sel-btn:active {
  transform: scale(0.96) !important;
}
.sel-btn svg {
  width: 15px !important;
  height: 15px !important;
  flex-shrink: 0 !important;
}
.sel-result {
  margin-top: 2px !important;
  padding: 8px 12px !important;
  background: #0F172A !important;
  border-radius: 8px !important;
  border: 1px solid #334155 !important;
  font-size: 13.5px !important;
  color: #F1F5F9 !important;
  word-break: break-word !important;
  max-height: 150px !important;
  overflow-y: auto !important;
  line-height: 1.5 !important;
}
@keyframes popIn {
  from { opacity: 0; transform: translate(-50%, -90%) scale(0.92); }
  to { opacity: 1; transform: translate(-50%, -100%) scale(1); }
}

@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.syncing svg { animation: spin 0.8s linear infinite !important; color: #38BDF8 !important; }
.btn-sync-icon {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
  width: 32px;
  height: 32px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
}
.btn-sync-icon:hover {
  background: var(--surface);
  color: var(--accent);
  border-color: var(--accent);
}

</style>

<body>
<title>Sổ từ TOEIC 45 chủ đề</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Lora:ital,wght@1,400;1,500&display=swap">
<style>
/* Layout: sổ tay học từ — cột mục lục 45 chủ đề bên trái, trang học bên phải chia 4 phần theo bài */

:root[data-theme="light"] {
  --bg:#F3F5F8 !important;
  --surface:#FFFFFF !important;
  --sunk:#E9EDF3 !important;
  --ink:#15213A !important;
  --muted:#5B677A !important;
  --line:#D8DFE8 !important;
  --accent:#1D5BBF !important;
  --accent-ink:#FFFFFF !important;
  --accent-soft:#E2EBFA !important;
  --mark:#FFEE9E !important;
  --mark-ink:#4A3B00 !important;
  --margin:#E46C6C !important;
  --good:#1C7A4D !important;
  --good-soft:#DFF2E8 !important;
  --bad:#B23A30 !important;
  --bad-soft:#FAE3E0 !important;
  --warn:#946000 !important;
  --warn-soft:#FBF0D6 !important;
  color-scheme: light !important;
}

.theme-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--sunk);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 11px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}
.theme-btn:hover {
  background: var(--surface);
  border-color: var(--accent);
  color: var(--accent);
  transform: translateY(-1px);
}
.theme-btn svg {
  flex-shrink: 0;
}


/* ---------- MỤC 0: TỔNG HỢP TỪ VỰNG ---------- */
.t0-header {
  margin-bottom: 20px;
}
.t0-nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 16px;
  margin-bottom: 18px;
}
.t0-scope-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.t0-scope-wrap label {
  font-weight: 700;
  font-size: 13.5px;
  color: var(--ink);
}
.t0-scope-select {
  padding: 7px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  font-weight: 600;
  font-size: 13.5px;
  cursor: pointer;
  max-width: 320px;
}
.t0-scope-select:focus {
  outline: 2px solid var(--accent);
}

/* Flashcard 3D Flip */
.fc-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  max-width: 600px;
  margin: 0 auto;
}
.fc-scene {
  perspective: 1200px;
  width: 100%;
  min-height: 320px;
}
.fc-card {
  width: 100%;
  min-height: 320px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  cursor: pointer;
}
.fc-card.flipped {
  transform: rotateY(180deg);
}
.fc-face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 16px;
  padding: 28px 24px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  border: 2px solid var(--line);
  background: var(--surface);
  box-shadow: 0 10px 30px rgba(0,0,0,0.06);
  user-select: none;
}
.fc-face.front {
  border-color: var(--line);
}
.fc-face.back {
  transform: rotateY(180deg);
  border-color: var(--accent);
  background: var(--surface);
}
.fc-badge {
  position: absolute;
  top: 14px;
  left: 16px;
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  background: var(--sunk);
  padding: 3px 8px;
  border-radius: 6px;
}
.fc-hint-flip {
  position: absolute;
  bottom: 12px;
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.fc-word {
  font-size: 32px;
  font-weight: 800;
  color: var(--accent);
  margin: 10px 0 6px;
  line-height: 1.2;
}
.fc-ipa {
  font-family: var(--f-ipa);
  font-size: 16px;
  color: var(--muted);
  margin-bottom: 12px;
}
.fc-vi {
  font-size: 24px;
  font-weight: 800;
  color: var(--good);
  margin: 10px 0;
}
.fc-ex-box {
  margin-top: 12px;
  padding: 10px 14px;
  background: var(--sunk);
  border-left: 3px solid var(--accent);
  border-radius: 8px;
  text-align: left;
  width: 100%;
  font-size: 14px;
  line-height: 1.5;
}
.fc-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  width: 100%;
}

/* Write Drill (Việt sang Anh) */
.write-drill-box {
  max-width: 640px;
  margin: 0 auto;
}
.wd-prompt {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.wd-vi {
  font-size: 22px;
  font-weight: 800;
  color: var(--good);
}
.wd-input-row {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}
.wd-input {
  flex: 1;
  padding: 11px 14px;
  font-size: 16px;
  font-weight: 600;
  border: 2px solid var(--line);
  border-radius: 8px;
  background: var(--bg);
  color: var(--ink);
}
.wd-input:focus {
  outline: none;
  border-color: var(--accent);
}
.wd-input.ok {
  border-color: var(--good);
  background: var(--good-soft);
}
.wd-input.no {
  border-color: var(--bad);
  background: var(--bad-soft);
}

:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#E9EDF3; --ink:#15213A; --muted:#5B677A; --line:#D8DFE8;
  --accent:#1D5BBF; --accent-ink:#FFFFFF; --accent-soft:#E2EBFA;
  --mark:#FFEE9E; --mark-ink:#4A3B00; --margin:#E46C6C;
  --good:#1C7A4D; --good-soft:#DFF2E8; --bad:#B23A30; --bad-soft:#FAE3E0; --warn:#946000; --warn-soft:#FBF0D6;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-ex:"Lora",Georgia,"Times New Roman",serif;
  --f-ipa:"Segoe UI","Noto Sans","DejaVu Sans","Lucida Grande",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141E; --surface:#161F2D; --sunk:#1C2737; --ink:#E5EBF3; --muted:#97A3B4; --line:#2A3648;
  --accent:#7DAEFF; --accent-ink:#0B1424; --accent-soft:#1B2B45;
  --mark:#4D4314; --mark-ink:#FFE680; --margin:#C25757;
  --good:#63D39C; --good-soft:#143127; --bad:#FF8F84; --bad-soft:#3A1F1E; --warn:#F2C25B; --warn-soft:#3A2F14;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141E; --surface:#161F2D; --sunk:#1C2737; --ink:#E5EBF3; --muted:#97A3B4; --line:#2A3648;
  --accent:#7DAEFF; --accent-ink:#0B1424; --accent-soft:#1B2B45;
  --mark:#4D4314; --mark-ink:#FFE680; --margin:#C25757;
  --good:#63D39C; --good-soft:#143127; --bad:#FF8F84; --bad-soft:#3A1F1E; --warn:#F2C25B; --warn-soft:#3A2F14;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
/* Mobile drawer & user bar elements */
.side-mobile-header{display:none}
.side-backdrop{display:none}
.mobile-user-slot{display:inline-flex;align-items:center;justify-content:center}
.mobile-user-btn{position:relative}
.mobile-user-btn.logged-in{border-color:var(--good)!important}

/* sidebar */
.side{border-right:1px solid var(--line);background:var(--surface);padding:20px 14px 24px max(14px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 6px 14px}
.brand b{font-size:18px;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.search{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);margin-bottom:10px}
.tlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.tlist a{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:7px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:13.5px}
.tlist a:hover{background:var(--sunk)}
.tlist a[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tlist .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.tlist .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist .sc{font-size:11px;color:var(--good);font-variant-numeric:tabular-nums}
.tlist .hit{font-size:11px;color:var(--muted)}
.mobile-pick{display:none}
/* main */
.main{padding-block:28px 64px;padding-left:max(16px,min(5vw,48px));padding-right:max(16px,env(safe-area-inset-right,0px),min(5vw,48px));min-width:0}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.thead{display:flex;flex-direction:column;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.thead h1{margin:0;font-size:clamp(26px,4vw,36px);line-height:1.15;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.thead .en{font-size:16px;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta .tag{color:var(--good);font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-top:6px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 14px 11px;border-bottom:2.5px solid transparent;margin-bottom:-1px;color:var(--muted);font-weight:600;white-space:nowrap;display:flex;gap:8px;align-items:center}
.tab .k{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sunk);font-size:11.5px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .k{background:var(--accent);color:var(--accent-ink)}
.panel{display:flex;flex-direction:column;gap:18px}
.seg-sm button{padding:4px 10px!important;font-size:12.5px!important}
.seg{display:inline-flex;background:var(--sunk);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.hint{font-size:13px;color:var(--muted)}
.note{border-radius:var(--r);background:var(--warn-soft);color:var(--ink);padding:11px 14px;font-size:13.5px}
.note b{color:var(--warn)}
h2.sec{margin:6px 0 0;font-size:17px;font-weight:700;letter-spacing:-.005em}
.btn{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:13.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent);padding-inline:6px}
.btn[disabled]{opacity:.45;cursor:default}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:var(--accent);flex:none}
.icon-btn svg{width:16px;height:16px}
/* vocab cards — index card with red margin rule */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 14px 22px;position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.vcard::before{content:"";position:absolute;left:11px;top:12px;bottom:12px;width:1.5px;background:var(--margin);opacity:.55}
.vtop{display:flex;gap:10px;align-items:center}
.vnum{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:20px}
.vw{font-size:18px;font-weight:700;letter-spacing:-.01em}
.pos{font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 7px;border-radius:5px}
.ipa{font-family:var(--f-ipa);color:var(--muted);font-size:13.5px}
.vtop .icon-btn{margin-left:auto}
.vvi{font-size:15px}
.ex{font-family:var(--f-ex);font-style:italic;font-size:15px;border-top:1px dashed var(--line);padding-top:8px;margin-top:2px}
.ex .vi{display:block;font-family:var(--f-ui);font-style:normal;font-size:13.5px;color:var(--muted);margin-top:2px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
/* quiz */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.qprog{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .25s}

.qdesc-vi {
  margin-top: 10px;
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.5;
  padding: 8px 12px;
  background: var(--sunk);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  display: block;
}
.qdesc-vi i {
  font-style: italic;
}

.qprompt{font-size:24px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.qprompt small{display:block;font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:11px 14px;font-size:15px;display:flex;gap:10px;align-items:baseline}
.opt .l{font-weight:700;color:var(--muted);font-size:13px}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{font-size:14px;font-weight:600}
.fb.ok{color:var(--good)} .fb.no{color:var(--bad)}
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.field{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
.field.ok{border-color:var(--good);background:var(--good-soft)} .field.no{border-color:var(--bad);background:var(--bad-soft)}
.wrong-list{margin:0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:3px}
/* notes / relations */
.rel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.chip{background:var(--sunk);border-radius:6px;padding:3px 9px;font-weight:600;font-size:14.5px}
.op{font-size:12px;font-weight:700;padding:2px 7px;border-radius:5px}
.op.eq{color:var(--good);background:var(--good-soft)}
.op.to{color:var(--accent);background:var(--accent-soft)}
.op.sim{color:var(--warn);background:var(--warn-soft)}
.op.vs{color:var(--bad);background:var(--bad-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.mbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:10px 12px;text-align:left;font-weight:600;min-height:44px}
.mbtn.sel{border-color:var(--accent);background:var(--accent-soft)}
.mbtn.done{border-color:var(--good);background:var(--good-soft);color:var(--good);cursor:default}
.mbtn.err{border-color:var(--bad);background:var(--bad-soft)}
.usage{display:flex;flex-direction:column;gap:10px}
.usage div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.usage b{display:block;margin-bottom:2px}
.forms{display:flex;flex-direction:column;gap:10px}
.fitem{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fitem .base{font-size:12.5px;color:var(--muted)}
.fitem .ans{font-size:12.5px;color:var(--good);grid-column:1/-1}
/* translate */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tcard .en{font-size:16px;line-height:1.6;display:flex;gap:10px}
.tcard .en>span:last-child{white-space:pre-line;min-width:0}
.tcard .en .no{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;padding-top:3px;flex:none;width:20px}
.tcard textarea{width:100%;min-height:62px;resize:vertical;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:15px;line-height:1.5}
.ref{white-space:pre-line;border-left:3px solid var(--good);background:var(--good-soft);padding:9px 13px;border-radius:0 8px 8px 0;font-size:15px}
.ref small{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--good);font-weight:700;margin-bottom:2px}
.nw{display:flex;flex-wrap:wrap;gap:6px}
.nw span{font-size:13px;background:var(--accent-soft);border-radius:6px;padding:3px 9px}
.nw span b{font-weight:700}
.qcard .opts{grid-template-columns:1fr}
.qcard .opt{padding:8px 12px;font-size:14.5px}
.opt.pick{border-color:var(--accent);background:var(--accent-soft)}
.nwtable{width:100%;border-collapse:collapse;font-size:14px}
.nwtable td,.nwtable th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.nwtable th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* gaps */
.audio-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-top:6px}
.audio-h h3{margin:0;font-size:16px;display:flex;gap:10px;align-items:baseline}
.audio-h h3 span{font-size:12.5px;font-weight:500;color:var(--muted)}
.gline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;font-size:16px;line-height:2.1;display:flex;flex-direction:column;gap:2px;min-width:0}
.gin{display:inline-block;width:9.5em;max-width:100%;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:4px 4px 0 0;padding:0 6px;font-size:15px;line-height:1.7}
.gin.ok{border-bottom-color:var(--good);background:var(--good-soft)}
.gin.diff{border-bottom-color:var(--warn);background:var(--warn-soft)}
.sug{font-size:13px;color:var(--warn);line-height:1.5}
.gtr{width:100%;resize:none;overflow:hidden;padding:7px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:14.5px;line-height:1.5;display:block;margin-top:6px}
.gtr:focus{border-color:var(--accent)}
.gvi{font-size:14px;line-height:1.5;border-left:3px solid var(--good);background:var(--good-soft);padding:6px 11px;border-radius:0 8px 8px 0;margin-top:6px}
.gvi small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--good);font-weight:700}
.player .seg{display:inline-flex;width:auto}
.player .seg button{padding:5px 11px;font-size:13px}
.player{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.player audio{width:100%;height:40px;display:block}
.player .seg button{padding:5px 11px;font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab .short,.seg .short{display:none}
.agroup{display:flex;flex-direction:column;gap:12px}
.agroup .player{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:4;box-shadow:0 6px 16px -10px rgb(0 0 0 / .35)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;color:var(--muted);text-align:center}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: 320px;
    max-width: 86vw;
    z-index: 1050;
    box-shadow: 4px 0 28px rgba(0,0,0,0.45);
    background: var(--surface);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    transform: translateX(-100%);
    transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .side.mobile-open{
    display: flex !important;
    flex-direction: column;
    transform: translateX(0);
  }
  .side-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    z-index: 1040;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .side-backdrop[hidden]{
    display: none !important;
  }
  .side-mobile-header{
    display: flex !important;
    justify-content: space-between;
    align-items: center;
    padding: 2px 4px 12px;
    margin-bottom: 8px;
    border-bottom: 1px solid var(--line);
  }
  .mobile-pick{display:flex;flex-direction:row;align-items:center;gap:6px;width:100%}
  .mobile-pick select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
  .main{padding-top:18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .fitem{grid-template-columns:minmax(0,1fr)}
  #sub.seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
  #sub.seg button,#dir.seg button{padding:7px 6px;font-size:13px;line-height:1.3}
  #dir.seg{display:grid;grid-template-columns:repeat(2,1fr);width:100%}
  /* điện thoại: thanh 4 phần ở đáy màn hình */
  .main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .wrap{gap:16px}
  .mobile-pick{flex-direction:row;align-items:center;gap:8px}
  .mobile-pick select{flex:1;min-width:0;font-size:16px;font-weight:600;height:44px}
  .nav-btn{width:44px;height:44px}
  .nav-btn svg{width:20px;height:20px}
  .thead h1{font-size:26px}
  .thead .en{display:block;font-size:14px;margin-top:2px}
  .meta{font-size:12.5px;gap:4px 10px}
  .tabs{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;margin:0;gap:0;justify-content:space-around;border-bottom:0;border-top:1px solid var(--line);background:var(--surface);padding:0 max(6px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(6px,env(safe-area-inset-left,0px));overflow:visible;box-shadow:0 -6px 18px -12px rgb(0 0 0 / .3)}
  .tab{flex:1 1 0;flex-direction:column;gap:3px;padding:8px 2px 9px;margin:0;border-bottom:0;border-top:2.5px solid transparent;font-size:12px;min-height:58px;justify-content:center}
  .tab[aria-selected="true"]{border-top-color:var(--accent)}
  .tab .k{width:24px;height:24px;font-size:12.5px}
  .tab .full{display:none}
  .tab .short,.seg .short{display:inline}
  .seg .full{display:none}
  .agroup .player{top:calc(env(safe-area-inset-top,0px) + 6px);padding:8px 10px;gap:6px}
  .player audio{height:36px}
  .player .seg button{padding:6px 9px}
  .btn{min-height:40px;padding:8px 12px}
  .icon-btn{width:40px;height:40px}
  .audio-h{align-items:flex-start;flex-direction:column;gap:6px}
  .audio-h .row{gap:6px}
  .gline{padding:12px 14px;font-size:16px}
  .gin,.gtr,.tcard textarea,.search,.field{font-size:16px}
  .gin{width:8.5em}
  .tcard{padding:14px}
  .vcard{padding:12px 14px 12px 22px}
  .qprompt{font-size:22px}
  .opt{padding:12px 14px;min-height:48px}
  .card{padding:16px}
  .vgrid{gap:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Auth box in sidebar */
.auth-box{padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);display:flex;align-items:center;gap:10px;margin-bottom:12px;cursor:pointer;transition:border-color .15s}
.auth-box:hover{border-color:var(--accent)}
.auth-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;overflow:hidden;border:1px solid var(--line)}
.auth-avatar img{width:100%;height:100%;object-fit:cover}
.auth-info{min-width:0;flex:1;display:flex;flex-direction:column}
.auth-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auth-status{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Side navigation for Review, Leaderboard, Admin */
.side-nav{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.snav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:13.5px;font-weight:600;transition:background .15s}
.snav-item:hover{background:var(--sunk)}
.snav-item[aria-current="true"]{background:var(--accent-soft);color:var(--accent)}
.snav-item .icon{font-size:16px;line-height:1}
.snav-item .nm{flex:1}
.snav-item .badge{background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
.side-sep{height:1px;background:var(--line);margin:6px 0 12px}

/* Star button on vocab cards */
.star-btn{color:var(--muted);transition:all .15s}
.star-btn:hover{color:var(--warn);border-color:var(--warn)}
.star-btn.starred{color:#E59000;border-color:#F59E0B;background:var(--warn-soft)}
.star-btn svg{width:16px;height:16px}

/* Completed badge in topic list and header */
.tlist .done-check{color:var(--good);margin-right:2px;font-weight:bold}
.tlist a.is-done{border-left:3px solid var(--good);padding-left:5px}
.completed-btn{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.completed-btn:hover{background:var(--good);color:#FFF}

/* Modals */

e'll ask you to give a presentation to your colleagues on what you learned about our competitors and ……………… …………………..."}]}]},{"id":4,"title":"SỰ CẢM ƠN- XIN LỖI","vocab":[{"w":"Apologize","pos":"v","vi":"xin lỗi"},{"w":"As a token of appreciation","pos":"","vi":"như 1 món quà thể hiện sự cảm kích"},{"w":"Be delighted=happy = glad to","pos":"","vi":"vui mừng để …"},{"w":"Damaged","pos":"adj","vi":"hư hỏng"},{"w":"Defective","pos":"a","vi":"có lỗi. bị lỗi"},{"w":"Delay","pos":"n,v","vi":"hoãn lại"},{"w":"Enclosed","pos":"a","vi":"được đính kèm"},{"w":"Grateful","pos":"a","vi":"biết ơn (+for)"},{"w":"In recognition of","pos":"","vi":"như thể hiện sự công nhận"},{"w":"In/valuable","pos":"a","vi":"vô giá (rất đắt)"},{"w":"On behalf of","pos":"","vi":"thay mặt cho"},{"w":"Patron","pos":"n","vi":"bạn hàng, khách hàng thân thiết"},{"w":"Regretfully","pos":"adv","vi":"đáng tiếc"},{"w":"Voucher","pos":"n","vi":"phiếu quà tặng"}],"notes":["Enclosed = Attached","Invaluable = Priceless >< Worthless (vô giá trị, bỏ đi)","Regretfully = Unfortunately","Delighted = Happy","Delay = Postpone"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"Dear Mr. Josh,\nOn behalf of Samsung Vietnam, I am writing this email to apologize for the lateness in delivery the order K2908. To explain about the delay in shipment, there were regretfully some technical issues during the manufacturing process that led to some damaged products. We know that you are one of our biggest partners in Korea, and we will reduce 15 percent value of this order in recognition of your generosity. We are also delighted to tell you that we have been working with your company for 10 years; we would like to give you a voucher to buy any product for free in any stores under our chain as a token of appreciation. Your trust in our products is invaluable, and we are grateful for your cooperation during the past decade. After this inconvenience, if there are any defective products, we will replace them and will not include them in the bill. You can print the enclosed form, fill it and bring it to any Samsung Store to get your free product."},{"k":"p","text":"Regards,\nJacob Dean"}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"53-55 ETS 2020.3"},{"k":"p","text":"I’d like to ………….. this phone charging cable, but I can’t find my ………….."},{"k":"p","text":"May I ask why you're returning it?"},{"k":"p","text":"It doesn’t work—it won't charge my ………………..."},{"k":"p","text":"I'm a new salesperson, and I haven't learned yet how to ……………. an item without a receipt... Oh, but here comes my ………………— she'll be able to do it."},{"k":"p","text":"Hi, Tina, Is there something you need help with?"},{"k":"p","text":"Yes, this customer wants to return a ……………….. product, but he doesn't have his receipt."},{"k":"p","text":"OK, I can ……………… the return, sir. I just need to see the original ……………….. you used to purchase the item."},{"k":"p","text":"Thanks. Here it is"},{"k":"audio","label":"Audio 2","src":"80-82 ETS 2020.6"},{"k":"p","text":"Hello, and thank you for calling the ………… of Pineville Legal Associates. Our office is currently closed. We are undergoing renovations from June twelfth to June nineteenth. We ……………… for any possible ……………………. this closure may cause. If you require legal assistance, please send an …………… to our office administrator, Jordan Smith, at jsmith@pmevillelegal.com. He will redirect your inquiry to the most ………………... lawyer on our team. Have a nice day."}]}]},{"id":5,"title":"MUA HÀNG – GIẢM GIÁ","vocab":[{"w":"Limited","pos":"adj","vi":"có giới hạn"},{"w":"Markdown","pos":"n","vi":"giảm giá"},{"w":"Office supplies","pos":"","vi":"văn phòng phẩm"},{"w":"Promotional","pos":"a","vi":"khuyến mãi"},{"w":"Redeem","pos":"v","vi":"mua lại, chuộc lại (đổi lại hàng lấy tiền)"},{"w":"Reduce rate","pos":"","vi":"tỉ lệ giảm giá"},{"w":"Renew","pos":"v","vi":"gia hạn, làm mới"},{"w":"Retailer","pos":"n","vi":"người bán lẻ"},{"w" o become the biggest market shareholder in Alabama Finance Community. Bombard made a bid of 1.5 million dollars for a warehouse in Vanesa and after the approval of the local authorities, they intended to turn it into a huge motorbikes storage to make the distribution process feasible among the area. To achieve this target, they will have many steps to do:"},{"k":"p","text":"Estimate the expenses, incomes, and profits in 3 years by analyzing the figures in the previous decade."},{"k":"p","text":"Gain a license from the local committee to allow Bompard's construction and production."},{"k":"p","text":"Gain the endorsement of local users, it is not easy to get them accustomed to new brands."},{"k":"p","text":"Boost productivity by applying new techniques."},{"k":"p","text":"Facilitate the supply chain, make sure that products are distributed to end-users at the lowest cost and fastest time."},{"k":"p","text":"Mr. Kennett, chairman of Bombard, claimed that this expansion was potentially profitable but risky. Nevertheless, he assured that they had a perfect preparation for the biggest campaign of Bompard."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"59-61 ETS2020.9"},{"k":"p","text":"Do you know Bob, the new hire? Well, he ………………. his first quarterly sales report yesterday. I just finished analyzing it, and it looks like the ……………. items, especially laptops, are under performing in our Region 1 stores."},{"k":"p","text":"That doesn’t sound good."},{"k":"p","text":"No, but the report concluded that the ……………. should still focus on selling electronics, because the …………… margin on these items is a lot higher."},{"k":"p","text":"That makes sense. I think Bob should do a presentation for the sales …………………….. about his report."},{"k":"p","text":"He‘s never done that before. Uh... I could present the report."},{"k":"p","text":"No, it’s a good ………………. for a new employee. I'll organize a ………………. with the sales department next week."}, e them in a circular motion, like the …………… indicates? If you don't, it could just spread the dirt around."},{"k":"p","text":"Oh, you know I think I might have done that the wrong way. Sorry about that."},{"k":"p","text":"It's OK, other people have made that same ………………. I‘d better copy that page in the manual and post it in the lab for all ……………….."},{"k":"audio","label":"Audio 2","src":"86-88 ETS2020.3"},{"k":"p","text":"Hi, Sung-Wook. Sorry to call so late in the day, but I need ……………….. Mohammad just called to tell me that a big agricultural ……………… in Brazil is interested in learning more about our ……………………………. They're looking to buy some of our tractors and harvesting machines. Anyway, they're sending a …………………….. here next Friday, And I’ll be leading that meeting. But the thing is, they told US the rep doesn’t speak much ………………., and I don’t speak any Portuguese. So We'll need someone who can interpret. Can you look into ………………………… who can help US with that for the day?"}]}]},{"id":23,"title":"DU LỊCH - TRAVEL","vocab":[{"w":"Botanic garden","pos":"","vi":"vườn bách thảo"},{"w":"Charter bus","pos":"","vi":"xe buýt thuê nguyên xe"},{"w":"Conduct a tour","pos":"","vi":"đi tham quan"},{"w":"Courtesy bus","pos":"","vi":"xe buýt miễn phí (xe của khách sạn, nhà nghỉ)"},{"w":"Dining establishment","pos":"","vi":"nhà ăn"},{"w":"Expedition","pos":"n","vi":"hành trình, cuộc viễn chinh"},{"w":"Exotic","pos":"adj","vi":"đẹp lạ, kỳ lạ, ngoại lai"},{"w":"Group rate","pos":"","vi":"giá theo nhóm"},{"w":"Immigration","pos":"n","vi":"sự nhập cư, phòng xuất nhập cảnh"},{"w":"Native","pos":"adj","vi":"bản xứ"},{"w":"Observatory","pos":"n","vi":"đài quan sát"},{"w":"Restriction","pos":"n","vi":"sự hạn chế"},{"w":"Stopover","pos":"n","vi":"nơi dừng chân"}],"notes":["Conduct a tour ~ Visit","Courtesy = provided at no cost = Free","Expedition = Adventure = Journey","Group rate = Ticket price for group","Observatory (n) -> Observe (v) -> Observation (n)","Restricted area : khu vực hạ receive a free padded carrying case for your laptop. But hurry—the promotion expires ……………….!"}]}]},{"id":25,"title":"GIAO HÀNG/ XỬ LÍ ĐƠN HÀNG","vocab":[{"w":"Track","pos":"v","vi":"theo dõi (n) con đường đất, đường ray"},{"w":"Shipment","pos":"n","vi":"lô hàng"},{"w":"A large volume of","pos":"","vi":"1 lượng lớn"},{"w":"Overnight delivery","pos":"","vi":"vận chuyển xuyên đêm"},{"w":"Express","pos":"adj","vi":"tốc hành"},{"w":"Expedite","pos":"v","vi":"thúc đẩy"},{"w":"Back order","pos":"","vi":"đã hết hàng (sẽ có tiếp)"},{"w":"Courier","pos":"n","vi":"người chuyển phát, công ty chuyển phát nhanh"},{"w":"Process","pos":"v","vi":"xử lí"},{"w":"Stock","pos":"n","vi":"hàng tồn kho, cổ phiếu"},{"w":"Take long","pos":"","vi":"lâu"},{"w":"Custom order","pos":"","vi":"đặt hàng theo yêu cầu"},{"w":"Customer inquiry","pos":"","vi":"yêu cầu khách hàng"},{"w":"Business day","pos":"","vi":"ngày làm việc"},{"w":"Distance","pos":"n","vi":"khoảng cách"}],"notes":[],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"From: Sunrise Deliver\nTo: Hannah Oliver\nWe received your inquiry about delivery options and we recommend you to use our fastest choice, Sunrise Express. Because your shipment is light and the distance you will receive the product is not very far, the process will not take long. Besides, we are in a peak season with a large volume of orders so this option will take advantage of the overnight delivery that can be completed within one or two business days. You can download our app, Sunrise Tracking, to easily track your order. We appreciate that after using it, you can give us your feedbacks."},{"k":"p","text":"Thank you again for choosing us,\nSarah Lane,\nCustomer Service Manager\nSunrise Deliver"}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"41-43 ETS2020.8"},{"k":"p","text":"Thanks for calling Ewing Books, How may I help you?"},{"k":"p","text":"Hello Do you have organization for Allin stock? It’s a ………. by James Dobbey."},{"k":"p","text":"Let me see... Hmm—it looks like that particular item is currently ……………... But we’re scheduled to get another …………. early next week."},{"k":"p","text":"Oh, in that case, would you mind holding a copy for me when the books arrive?"},{"k":"p","text":"I'm awfully sorry, but we can’t hold copies for customers. But If you give me …………………….., I’ll make a note to call you as soon as the shipment is here."},{"k":"audio","label":"Audio 2","src":"95-97 ETS2020.9"},{"k":"p","text":"I have some important announcements before we ………………………..tonight. First, the shipment we were expecting from our seafood distributor won't arrive until next week, so that means no mixed …………………... Instead we'll make a double batch of ………………..’s soup and serve that on Friday as well. Please make sure to let our regular customers know. Next, I'd like to introduce our newest server, Deena Sanchez. Deena will do some ……………….. this week and start serving customers next week. I posted her training ……………….. in the staff lounge."},{"k":"p","text":"Please …………………. at it while you’re on break today, and let me know if you can help out with any of the trainings."}]}]},{"id":26,"title":"SỰ XUẤT BẢN - PUBLICATION","vocab":[{"w":"Autograph","pos":"v,n","vi":"ký tên, chữ ký"},{"w":"Biography","pos":"n","vi":"tiểu sử"},{"w":"Circulation","pos":"n","vi":"số lượng bán ra"},{"w":"Edit","pos":"v","vi":"chỉnh sửa"},{"w":"Edition","pos":"n","vi":"ấn phẩm"},{"w":"Format","pos":"v,n","vi":"định dạng"},{"w":"Freelancer","pos":"n","vi":"người làm nghề tự do"},{"w":"Hardcover","pos":"n","vi":"bìa cứng"},{"w":"Informative","pos":"adj","vi":"hữu ích (về thông tin)"},{"w":"Issue","pos":"n","vi":"số phát hành, ấn phẩm"},{"w":"Periodical","pos":"adj","vi":"định kỳ (n) ấn phẩm định kỳ"},{"w":"Publication","pos":"n","vi":"sự xuất bản"},{"w":"Submission","pos":"n","vi":"nộp"},{"w":"Subscription","pos":"n","vi":"sự đăng ký, sự mua báo"},{"w":"Volume","pos":"n","vi":"quyển, tập, số (báo)"}],"notes":["Edition = Release = Issue","Periodically = Regularly","Hardcover >< Softcover","Submission (n) -> Submit (v)","Subscription (n) -> Subscribe (v)"],"sections":[{"title":"Translate and answer the questions","type":"reading","blocks":[{"k":"p","text":"From: Jameson’s TV and Appliances\nTo: Subscriptions Department\nContemporary Electronics Design\nDear Subscription Editor,\nI would like to sign up for a one-year corporate subscription to CED in the name of Jameson’s TV and Appliances. I would like this subscription to begin with the March Annual Product Review Issue. We are particularly eager that our subscription begin with the March issue because of the product review in that issue of the Zenon 1001 circuit board. I am enclosing a check for $27, made payable to CED Subscriptions. Thank you for your assistance."},{"k":"p","text":"Sincerely,\nDelia Walters\nSupplies Manager\nQuestion 1. Which of the following is CED most likely to be?"},{"k":"p","text":"(A). A technical periodical of the electronics trade\n(B). A catalog of electronics equipment and supplies\n(C). A series of pamphlets about circuit boards\n(D). A television magazine\nQuestion 2. How long would Delia Walters like to receive CED?"},{"k":"p","text":"(A) $27\n(B) 12 months\n(C) Just during March\n(D) Indefinitely"}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"44-46 ETS2020.9"},{"k":"p","text":"Mr. Stem, I have an idea for our newspaper's ………………………. A lot of farmers markets in this region open during the ………………………, so I'd like to write a short piece about them."},{"k":"p","text":"That would work well. Are you planning to interview the …………….. who are selling produce? We've received a lot of …………………………. from our readers when we print stories about local business owners."},{"k":"p","text":"That's a good idea, but I need to find a ………………..…. to accompany me this weekend."},{"k":"p","text":"I don’t think Elena has any assignments."},{"k":"p","text":"Great! ased during this summer. Many critics had a chance to preview the soon-to-release film and gave a lot of praises. The debut event is about to witness the gathering of all the stars who will appear in astronaut costumes - the formal outfit in the movie. The show will last about 2 hours and include two intermissions. During the break, audiences can enjoy refreshments while they can not get out of the theater. Guests are also refrained from bringing other foods and drinks. The chief director announced that the conclusion of this series would release next year."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"38-40 ETS2020.3"},{"k":"p","text":"Hi, I’m calling from Brookshire …………. for Ms. Ito."},{"k":"p","text":"This is she."},{"k":"p","text":"I understand you have tickets to tonight's ……………………………. I’m sorry, but we've had to cancel tonight’s show."},{"k":"p","text":"That's too bad. Tonight was the only night I could make it."},{"k":"p","text":"I'm sorry about that. I can offer you a …………… for the ticket."},{"k":"p","text":"Oh, I'll take the refund, Thanks."},{"k":"p","text":"Sure. And I'll also e-mail you a ……………………………… that’ll give you a discount on your next ticket purchase."},{"k":"audio","label":"Audio 2","src":"89-91 ETS2020.10"},{"k":"p","text":"For all of you turning into our radio station today, the annual Springfield ……………………….. is just around the comer! From June twelfth to fourteenth, the Springfield Park will host a variety of live performances, from drumming circles to alternative rock bands... all free and open to the public. And don't forget about WKBC's annual raffle. This year, you can enter to win a brand new, one-of-a-kind ……………………….. Raffle tickets are only available at our ticket booth. And last year, all the tickets were gone in …………………... Look for us by the water fountain on June twelfth. Hope to see you there!"}]}]},{"id":28,"title":"KINH TẾ - ECONOMICS","vocab":[{"w":"Analysis","pos":"n","vi":"sự phân tích"},{"w":"Commerce","pos":"n","vi":"thương mại"},{"w":"Debt","pos":"n","vi":"nợ"},{"w":"Expenditure","pos":"n","vi":"chi tiêu, sự tiêu xài"},{"w":"Fluctuate","pos":"v","vi":"biến động"},{"w":"Generate","pos":"v","vi":"tạo ra"},{"w":"Investment","pos":"n","vi":"sự đầu tư"},{"w":"Loan","pos":"v,n","vi":"vay, số tiền cho vay"},{"w":"Offset","pos":"v","vi":"bù đắp"},{"w":"Plummet","pos":"v","vi":"giảm mạnh, tụt dốc"},{"w":"Recession","pos":"n","vi":"sự suy thoái"},{"w":"Sector","pos":"n","vi":"lĩnh vực, ngành"},{"w":"Significant","pos":"adj","vi":"đáng kể"},{"w":"Statistics","pos":"n","vi":"sự thống kê"}],"notes":["Commerce -> Commercial","Expenditure -> Expenses","Plummet = Fall = Decrease","Sector = Field","Significant = Considerable = Substantial"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"According to the latest news from analysts, the commercial market has experienced a severe recession during the last quarter. The value generated by export activities significantly plummeted, which led to a change in many domestic sectors inside agriculture, technology, and real estate. To deal with this fluctuated situation, most investors decided to reduce their expenditure while the residents started to get loans from banks to ease the problem. If their businesses continue to fall, their incomes will not be adequate to offset the outstanding debts. Statistics show that there will be only thirty percent of enterprises that can recover after this downturn."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"68-70 ETS2020.6"},{"k":"p","text":"OK. I reviewed your …………………………… and I think you're off to a great start. You have an interesting concept for your new …………………... I especially like how much thought you put into the customers you expect to dine there."},{"k":"p","text":"Yeah. that's something I learned from my last business venture. I tried to appeal to everyone, which I now know was a ………………... This time I have a much better idea of who I want to attract."},{"k":"p","text":"Perfect. Now ... since you're hoping to use this plan to apply for ……………, I suggest revisiting your projected budget. In particular, you should allocate more of the …………………. to staffing. About ………… percent is standard in the restaurant industry."},{"k":"audio","label":"Audio 2","src":"83-85 ETS2020.6"},{"k":"p","text":"And now for our local business news. On Thursday, Broadchurch Fashions announced that its flagship ………….. will move from Cummings Street to a larger location on River Street. The relocation has become necessary because of the store's increasing ……………… since Sharon Rockford took over as ………………... Under Ms. Rockford's business leadership, Broadchurch Fashions, which is known for its simple designs and basic colors for men, will be launching a ……………… line of ……………………….. next spring. And the new, larger store will have plenty of space for the expanded ………………!"}]}]},{"id":29,"title":"QUẢN LÝ - MANAGEMENT","vocab":[{"w":"Flexible working hours","pos":"","vi":"giờ làm việc linh hoạt"},{"w":"Merger and Acquisition","pos":"n","vi":"sự sáp nhập và mua lại"},{"w":"Morale","pos":"n","vi":"sự tự tin, tinh thần"},{"w":"Motivate","pos":"v","vi":"thúc đẩy, động viên"},{"w":"Obstacle","pos":"n","vi":"trở ngại"},{"w":"Pioneer","pos":"n","vi":"người tiên phong"},{"w":"Primary","pos":"adj","vi":"chính, chủ yếu"},{"w":"Prosperous","pos":"adj","vi":"thịnh vượng"},{"w":"Rapport","pos":"n","vi":"mối quan hệ (liên quan đến communication)"},{"w":"Reward","pos":"n","vi":"phần thưởng, tiền thưởng"},{"w":"Step down","pos":"","vi":"từ bỏ (a job/position)"},{"w":"Strategy","pos":"n","vi":"chiến lược"},{"w":"Workforce","pos":"n","vi":"lực lượng lao động"}],"notes":["Morale = Confidence","Primary = Main = Core","Workforce = Labor"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"This is not something that we have done before, but this year we have compiled a chart of all the health problems for which we have treated workers over the past 12 months. We have decided that by sharing this information, we might be able to motivate some of you to take more care in the workplace. A lot of these problems could be avoided with just a little bit of common sense. While we are glad not to have to treat most of you for anything serious, and although we do enjoy the pleasure of your company, we would rather not have to treat any of you for accidents and incidents which are entirely avoidable by following safety regulations; wearing reinforced boots to protect your toes, wearing safety goggles, keeping ear plugs with you at all times so you have them when you need them, and above all, we urge you to wash your hands before eating. Take a look at the chart and you’ll see what we mean. We’ve also divided the data by sex, so men – don’t let the ladies beat you next year! We are plaining on compiling a table next year, too, to let’s see if we can really cut down those numbers."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"59-61 ETS2020.7"},{"k":"p","text":"Jackie, have you seen the newspaper? The article about our new ……………………… for city residents is on the front page!"},{"k":"p","text":"That's great! You know, Alex, working on this project has been the most …………………….. thing I've done since I started working for the city …………………….."},{"k":"p","text":"I agree. And the article explains the program well-it says that the bicycles are ………… for residents to use as long as they are returned within two hours. There's even a map of pickup and drop-off ………………."},{"k":"p","text":"I'm so proud of our team. We should celebrate after the city council meeting later today. I’ll ……………… during my lunch break."},{"k":"audio","label":"Audio 2","src":"77-79 ETS2020.1"},{"k":"p","text":"OK everyone, before you head out to the …………………. this morning to start your shifts, I have a brief announcement. As most of you know, the new conveyor belt is now installed and up and running. This new conveyer belt is very similar to the …………………, except it's twice as fast as the old one. This means that our factory can now move ……………. the number of units per hour. Clearly, this is a big improvement in production speed. However, it could also be a challenge for us to watch out for …………………. errors. So, you're all required to watch a short ………………….. this morning before starting work."}]}]},{"id":30,"title":"COMMUNITY – CỘNG ĐỒNG","vocab":[{"w":"Authority","pos":"n","vi":"chính quyền, nhà chức trách"},{"w":"Ballot","pos":"v,n","vi":"bỏ phiếu kín"},{"w":"City hall","pos":"n","vi":"hội trường thành phố"},{"w":"City official","pos":"n","vi":"viên chức thành phố"},{"w":"Debate","pos":"v,n","vi":"tranh luận, cuộc tranh luận"},{"w":"Environment-friendly","pos":"","vi":"thân thiện với môi trường"},{"w":"Gathering","pos":"n","vi":"cuộc gặp mặt"},{"w":"Improvement","pos":"n","vi":"sự cải thiện"},{"w":"Measure","pos":"n","vi":"phương pháp, cách thức"},{"w":"Recycle","pos":"v","vi":"tái chế"},{"w":"Region","pos":"n","vi":"khu vực"},{"w":"The majority of","pos":"","vi":"phần lớn"}],"notes":["Debate = Discuss, Discussion","Measure = Method = Approach = Way = Technique","Region = Area","The majority of = Most of"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"The Greenville Transportation Commission (GTC) will hold a public meeting at City Hall on Thursday, May 15, at 7 p.m, to discuss its proposal to extend light rail service to Greenville Industrial Park. The rail line will run through a residential area. Residents of the neighborhood have complained that the extension will generate too much noise during peak commuting hours. In response, the GTC has been studying the feasibility of installing noise barriers along the tracks. At the meeting, Leora Kelman, CEO of Acoustic Engineering, will explain how much noise reduction the GTC can expect to achieve with the barriers. A presentation by Mayor Joe Rowan will follow"}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"62-64 ETS2020.10"},{"k":"p","text":"Hi, Elise. Good news-the last of the parts for the wind turbine have arrived."},{"k":"p","text":"Great! Now we can start ………………………. them to the designated site in"},{"k":"p","text":"Bloomington on Tuesday."},{"k":"p","text":"Well, I'm meeting tomorrow with ………………………. to discuss temporarily closing down part of the road while we transport everything."},{"k":"p","text":"OK. The foundation is already installed at the site, right? So let's send the …………………………. next."},{"k":"p","text":"Exactly. That way we'll only need the road closed for ……………. I'll let you know when we get approval so you can schedule the drivers."},{"k":"audio","label":"Audio 2","src":"86-88 ETS2020.7"},{"k":"p","text":"Thanks for joining us at the City of Belmont ……………………………… dinner. Tonight, community members have ………………. here to honor a group of artists who were asked to beautify the sheets of Belmont. Back in June, after a long selection process, ………… talented artists were chosen to paint the walls of several buildings around the city. We hoped that this project would draw attention to one of the …………………….. in the city. Well, the murals were completed a month ago and tourism in the area has ……………….. Please welcome our talented artists."}]}]},{"id":31,"title":"KINH TẾ - ECONOMICS","vocab":[{"w":"Account for","pos":"","vi":"chiếm, giải thích cho"},{"w":"Audit","pos":"v,n","vi":"kiểm toán"},{"w":"Fine","pos":"v,n","vi":"phạt, tiền phạt"},{"w":"Lack","pos":"v,n","vi":"thiếu"},{"w":"Noticeable","pos":"adj","vi":"đáng chú ý"},{"w":"Quarter","pos":"n","vi":"quý"},{"w":"Revenue","pos":"n","vi":"doanh thu"},{"w":"Risk","pos":"n","vi":"rủi ro"},{"w":"Sluggish","pos":"adj","vi":"chậm chạp"},{"w":"Soar","pos":"v","vi":"tăng vọt"},{"w":"Spokesperson","pos":"n","vi":"phát ngôn viên"},{"w":"Stable","pos":"adj","vi":"ổn định"},{"w":"Struggle","pos":"v","vi":"xoay xở"}],"notes":["Lack + of + N (you lack knowledge – you fail because of a lack of knowledge)","Noticeable = Remarkable = Outstanding","Sluggish = Slow","Soar >< Plummet"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"B-B Chang International (BBCI) announced Wednesday that it would buy Sieng Technology in a deal valued at $450 million."},{"k":"p","text":"A spokesperson for BBCI said the company expects to double its profits by the end of next year. It will accomplish this by making full use of Sieng’s recently updated production facilities. All four are operating at maximum capacity."},{"k":"p","text":"Financial experts believe the Sieng acquisition will make BBCI the world’s leading producer of circuits. “They will be well ahead of their competitors”, said top analyst Rhoda Sutton."},{"k":"p","text":"B-B Chang plans to maintain Sieng’s current workforce, with each of Sieng’s factories continuing normal operations for the next five years. After that time, BBCI will evaluate whether additional staff are needed."}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"65-67 ETS2020.2"},{"k":"p","text":"Michelle, thanks for agreeing to lead this afternoon's meeting with me. One topic I think we should discuss with the staff is …………………………... We haven't met our quotas for lightbulbs for a ……………………."},{"k":"p","text":"I know. Productivity hasn't been ………………. recently. We had a month of strong production, but the next month was the ……………….. we've had in a year!"},{"k":"p","text":"Right... So at today's meeting, let's focus on the month when productivity was very low."},{"k":"p","text":"I know that our bulb manufacturing machines ……………………… several times that month. We should probably have all of them inspected."},{"k":"p","text":"I agree. What else should we discuss at the ………………………..?"},{"k":"audio","label":"Audio 2","src":"83-85 ETS2020.10"},{"k":"p","text":"Thank you for attending today's ……………………... Our guest speaker today is Min-Ah Choi. Min-Ah is the company president of Choi Incorporated. Her company specializes in ………………………….. It offers a wide range of financial services to both small businesses and individuals. So ... this is a great opportunity to learn from a leader in the industry. We'll be getting started in just a few minutes. As you get settled into your seats, please make sure you've signed in for the ………………. To do so, you'll need to find your …………………………………. on your mobile phone or laptop and click the \"sign in\" button there. That way, you'll all get …………….. for attending this seminar."}]}]},{"id":32,"title":"GIAO THÔNG - TRAFFIC","vocab":[{"w":"Alternative","pos":"adj,n","vi":"thay thế"},{"w":"Divert","pos":"v","vi":"chuyển hướng"},{"w":"Infrastructure","pos":"n","vi":"cơ sở hạ tầng"},{"w":"Lane","pos":"n","vi":"làn đường"},{"w":"Parking garage","pos":"","vi":"bãi đỗ xe"},{"w":"Permit","pos":"v,n","vi":"cho phép, giấy phép"},{"w":"Public transportation","pos":"","vi":"giao thông công cộng"},{"w":"Ramp","pos":"n","vi":"đoạn đường dốc"},{"w":"Route","pos":"n","vi":"tuyến đường"},{"w":"Suburban","pos":"adj","vi":"ngoại thành"},{"w":"Toll","pos":"n","vi":"phí cầu đường"},{"w":"Traffic congestion","pos":"","vi":"tắc đường"},{"w":"Undergo","pos":"v","vi":"trải qua"}],"notes":["Alternative ~ Substitute ~ Instead","Infrastructure ~ Facility","Permit = License","Traffic congestion = Traffic jam","Parking garage ~ Parking area ~ Parking lot"],"sections":[{"title":"Translate and answer the question","type":"reading","blocks":[{"k":"p","text":"Tri-County Real Estate\nMemo\nTo: Sales staff\nFrom: Russell Miller\nRe: Parking of personal vehicles\nAs you know, construction of the new office extension is scheduled to begin this spring, Unfortunately, during the period of construction, we will not be able to use our west parking lot. As an alternative, we have arranged to lease parking space for company vehicles from the Rio Grande Company. However, we are unable to provide parking spaces for private cars. Beginning March 15^(th), those of you who drive to work will have to make other arrangements for parking your own vehicles. There is on-street parking available on Garfield Street and you may park at the warehouse lot at Tri-County Builders. We have arranged for a company discounts, so you will be able to park at a reduced daily rate, equal to what you currently pay for parking. Please be assured that there will be adequate parking for all employees. I’d like to convince you that the four-block walk would be healthy, but for those of you determined to be lazy, and because I know there are bound to be plenty of rainy days, we will arrange a convenient morning and evening shuttle from offices to the warehouse lot. A list of shuttle bus times will be posted on the bulletin board in each office as soon as it is finalized."},{"k":"p","text":"I am sorry for the inconvenience. Remember that it is all for a good cause. We really need the new office space and when construction is completed, we’ll have a nicely landscaped parking lot with bright lighting and a personal parking space for each of you."},{"k":"q","text":"1. Who are the recipients of this memo?","opts":["Construction workers","Real estate agents","Bus driver","Janitors"]},{"k":"q","text":"2. What did the company focus on in making these arrangements?","opts":["Convenience and expense","Employee health concerns","Local weather and traffic","Lighting and landscaping"]},{"k":"q","text":"3. How long will the parking changes be in effect?","opts":["Until spring","Through the summer","Until construction is complete","Until everyone is willing to walk four blocks"]},{"k":"q","text":"4. Where should workers look to find the shuttle bus schedule?","opts":["At the bus stop","On an attached sheet of paper","On the company website","On the office notice boards"]}]},{"title":"Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"89-91 ETS2020.2"},{"k":"p","text":"Hello, this is Tom Pollard from Human Resources calling for Wilma. We're so happy you'll be joining our team at Moorestown …………………. Could you come in next Monday morning for your …………………….? After, you'll be able to meet some coworkers and have a tour of the facility. Just to warn you, getting to our office is a little tricky right now. The street we're on is closed to traffic because of …………………... I recommend parking a couple of blocks away and walking. Also, I'd like to invite you to join me for lunch the day you come. That way, you can ……………………….. you might have. Anyway, ……………………. back to confirm."},{"k":"audio","label":"Audio 2","src":"77-79ETS2020.3"},{"k":"p","text":"And now for the hourly …………………….. Highway 95 is currently experiencing heavy traffic because of the ………………… that’s taking place at the convention center this evening. To find alternate routes, we recommend taking a look at the interactive ………… on our Website. Also remember that construction will begin in the downtown area early next week, and sections of Market Sheet will likely be closed. We'll be sure to let you know as soon as the ………………………. is complete. Thanks for listening, and enjoy your drive."}]}]},{"id":33,"title":"VĂN HỌC - LITERATURE","vocab":[{"w":"Author","pos":"n","vi":"tác giả"},{"w":"Award-winning","pos":"adj","vi":"đạt giải"},{"w":"Composer","pos":"n","vi":"nhà soạn nhạc, người sáng tác"},{"w":"Contemporary","pos":"adj","vi":"đương đại, đương thời"},{"w":"Contributing writer","pos":"","vi":"nhà văn cộng tác"},{"w":"Depict","pos":"v","vi":"mô tả, trình bày"},{"w":"Draft","pos":"n","vi":"bản thảo"},{"w":"Honored","pos":"adj","vi":"được vinh danh"},{"w":"Innovative","pos":"adj","vi":"cải tiến, sáng tạo"},{"w":"Literature","pos":"n","vi":"văn học"},{"w":"Manuscript","pos":"n","vi":"bản thảo"},{"w":"Fiction","pos":"n","vi":"tiểu thuyết viễn tưởng"},{"w":"Play","pos":"n","vi":"vở kịch"},{"w":"Poetry","pos":"n","vi":"thơ ca"},{"w":"Sculpture","pos":"n","vi":"tác phẩm điêu khắc"}],"notes":["Author ~ Writer","Written draft = Manuscript"],"sections":[{"title":"Translate and answer the questions","type":"reading","blocks":[{"k":"p","text":"MATT ALCHERI’S ADVENTUROUS LEAP\nBy Erika Quake, Badger Dispatch\nMILWAUKEE (12 January) – Matt Alcheri has created music for dozens of films, including Seeking Eleanor, which earned him the Cinearts Award for Best Original Music. Recently, he has lent his considerable composing skills to Final Chance, a video game produced by Silhouette Gaming Systems (SGS), which has been creating interactive entertainment for 10 years now."},{"k":"p","text":"Mr. Achieri was introduced to the managing director of SGS, Harry Jansson, at a social event hosted by Ms. Chandra Bixby, who, on occasion, has collaborated with Mr. Acheri in composing film scores. Mr. Jansson proceeded to invite Mr. Acheri to write the music for Final Chance."},{"k":"p","text":"In a phone interview, Mr. Alcheri said that he was “quite impressed” with the graphics and animation of Final Chance. “It left me with the sense that I was watching a movie, and so I did not hesitate to collaborate on the project”, said the renowned composer. He further remarked that writing the score for the video game was virtually identical to composing the music for a movie."},{"k":"p","text":"“All I had to do was write music that matches the atmosphere of the various scenes depicted in the game,”, he added."},{"k":"p","text":"As for Mr. Jansson, he said I the same interview that with pre-orders for Final Chance standing currently at 200,000 copies, he has no doubt that the latest SGS product, scheduled to be released on March 20, will be a success."},{"k":"q","text":"1. Who is Ms. Bixby?","opts":["A film company executive","A video game developer","A movie director","A music composer"]},{"k":"q","text":"2. What most likely is true about Mr. Jansson?","opts":["He became SGS’s managing director ten years ago","He helped plan Ms. Bixby’s social event","He has worked with Mr. Alcheri before","He spoke to Ms. Quade recently"]},{"k":"q","text":"3. What is indicated about Final Chance?","opts":["It took a year to develop","It will be available in March","It will be limited to 200,000 copies","It is based on the film Seeking Eleanor."]}]}]},{"id":34,"title":"KINH DOANH - BUSINESS","vocab":[{"w":"Aid","pos":"n","vi":"sự giúp đỡ, gói hỗ trợ"},{"w":"Associate","pos":"v","vi":"kết hợp"},{"w":"Commission","pos":"n","vi":"hội đồng, tiền hoa hồng"},{"w":"Competitor","pos":"n","vi":"đối thủ"},{"w":"Core","pos":"n,adj","vi":"cốt lõi"},{"w":"Corporation","pos":"n","vi":"tập đoàn"},{"w":"Domestic","pos":"adj","vi":"trong nước"},{"w":"Enormous","pos":"adj","vi":"to lớn"},{"w":"Entrepreneur","pos":"n","vi":"doanh nhân"},{"w":"Executive","pos":"n","vi":"người điều hành"},{"w":"Initiative","pos":"n","vi":"sáng kiến"},{"w":"Output","pos":"n","vi":"sản lượng"},{"w":"Bring about","pos":"","vi":"gây ra"}],"notes":["Associate = Collaborate","Competitor = Rival","Bring about = Cause"],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"TRUBRIDGE CONTRACTING\nTo: All Trubridge Contracting Employees\nFrom: Trubridge Contracting Acquisitions Commission\nRe: Trubridge Estefen\nDate: October 12\nAs you know, Trubridge Contracting will officially merge with Estefen Builders on November 21. We feel that this merger will benefit both companies. Like us, Estefen specializes in commercial construction, and this merger will solidify our position at the forefront of the ever-growing Lexington City building trade. In addition, the creation of Trubridge Estefen will enable us to take on more complex development projects such as the Faust Center and the Hull Street Mall expansion."},{"k":"p","text":"Members of each department will meet during the week of October 20 to discuss some of the logistical details of the merger, as well as the planned expansion and renovation of the Trubridge offices so they can effectively accommodate Estefen‘s 113 employees. If you have questions you would like to see addressed during the meetings, please feel free to e-mail the meeting chairperson in advance."},{"k":"p","text":"Note that both Stan Trubridge and Zach Estefen will attend each meeting,"},{"k":"p","text":"Trubridge Contracting Acquisitions Commission."}]},{"title":", Fill the gaps","type":"gaps","blocks":[{"k":"audio","label":"Audio 1","src":"41-43 ETS2020.4"},{"k":"p","text":"Hello, I'm interested in the ………………… your firm offers. I own some cafés, and one of my ………………… just put his coffee shop up for sale. I'm planning to buy it, but I want to avoid any …………….. in the contract."},{"k":"p","text":"Of course. We have several qualified contract attorneys on staff. Let me set up a time for you to come into the office this week to talk with one of our ………………..."},{"k":"p","text":"Great. But would it be possible to have the ……………..? I'll be away in San Diego the next few days for a relative's ……………."},{"k":"audio","label":"Audio 2","src":"89-91 ETS2020.5"},{"k":"p","text":"OK, everyone. Thank you for coming to today's …………….. It's eight o'clock and we have a lot of material to cover today. I'm Sanjay, the ………………………… of Human Resources, and today we'll be talking about selecting job applicants. As managers, it can be quite overwhelming for US to go through a large number of job applications to figure out who to interview. So to start off, I'd like you to turn to the person sitting ………………….. and take about five minutes to ……… both positive and negative aspects of a resume and cover letter-what stands out to you as a …………………………. to contact."}]}]},{"id":35,"title":"SỰ XÂY DỰNG - CONSTRUCTION","vocab":[{"w":"Adjacent","pos":"adj","vi":"liền kề"},{"w":"Archeologist","pos":"n","vi":"nhà khảo cổ học"},{"w":"Architect","pos":"n","vi":"kiến trúc sư"},{"w":"Be torn down","pos":"","vi":"bị phá hủy"},{"w":"Capacity","pos":"n","vi":"sức chứa"},{"w":"Extensive","pos":"adj","vi":"quy mô lớn"},{"w":"Insulation","pos":"n","vi":"sự cách nhiệt"},{"w":"In the vicinity of","pos":"","vi":"lân cận"},{"w":"Plant","pos":"n","vi":"nhà máy"},{"w":"Proximity","pos":"n","vi":"sự gần, liền kề"},{"w":"Refurbish","pos":"v","vi":"tân trang lại"},{"w":"Restoration","pos":"n","vi":"sự khôi phục"},{"w":"Transform","pos":"v","vi":"biến đổi"},{"w":"Underway","pos":"adj","vi":"đang diễn ra"}],"notes":[],"sections":[{"title":"Translate","type":"translate","blocks":[{"k":"p","text":"CORDOVA (May 6) – Cordova city officials have begun preliminary discussion about what to do with Lowell Street Bridge, a historic city landmark that is in dire need of an upgrade. While costly restoration options are being considered, several factors make demolition a more likely outcome."},{"k":"p","text":"“It’s a tough decision and one we don’t intend to make hastily,” said city planner Colin Barnwell. “So far, it seems that replacing the bridge makes the most financial sense.”"},{"k":"p","text":"Price isn’t the only consideration, however. According to structural engineer Steve Pachenco, traffic flow is another important factor. “Highway 49 will soon be broadened from two lanes to four. Then, Lowell Street Bridge will no longer be able to accommodate the increase in vehicles”, he said. “The way I see it, a wider, more modern bridge is inevitable.”"},{"k":"p","text":"For residents who want to share their opinions and ideas, the city council will be holding a public input session at Helman Square next Thursday at 11 A.M."},{"k":"q","text":"1. What is this article about?","opts":["A plan for a construction","A new technology","A broaden road","A city conference"]},{"k":"q","text":"2. What is the most possible result when the city officials consider the factors?","opts":["A bridge will be destroyed","They will spend money","A upgraded bridge","A renewed road"]},{"k":"q","text":"3. How inhabitants can express the thoughts?","opts":["By attending a gathering","By calling the main office","By sending an e-mail","By voting on a website"]}]}]},{"id":36,"title":"VĂN HÓA
